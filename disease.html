<div class="nav"></div>
<div class="db">
  <div class="sb">
    <div class="sb-view-mode" id="view-mode">
      <label class="active"><input type="radio" name="view-mode" value="disease" checked> 疾病</label>
      <label><input type="radio" name="view-mode" value="category"> 疾病大类</label>
    </div>
    <div class="sb-search"><input type="text" id="search" placeholder="搜索疾病名称..."></div>
    <div class="sb-tree" id="tree"></div>
  </div>
  <div class="mn" id="main"><div class="emp"><div class="big">🫀</div><div>从左侧选择一种疾病查看详情</div></div></div>
</div>

<script src="./_shared/js/echarts.min.js"></script>
<script src="./_shared/js/app.js?v=20260914"></script>
<script>
var _cc=null,_gc=null;

loadData(function(){
  renderNav('disease');
  initViewMode();
  buildTree();
});

document.getElementById('view-mode').addEventListener('change', function(e){
  if(e.target.name === 'view-mode'){
    setViewMode(e.target.value);
  }
});

var CURRENT_VIEW_MODE = 'disease';
function initViewMode(){
  var saved = localStorage.getItem('kg_view_mode');
  if(saved === 'disease' || saved === 'category'){
    CURRENT_VIEW_MODE = saved;
  }
  document.querySelectorAll('#view-mode input[name="view-mode"]').forEach(function(input){
    input.checked = (input.value === CURRENT_VIEW_MODE);
    input.parentElement.classList.toggle('active', input.checked);
  });
}
function setViewMode(mode){
  if(mode !== 'disease' && mode !== 'category') return;
  CURRENT_VIEW_MODE = mode;
  localStorage.setItem('kg_view_mode', mode);
  document.querySelectorAll('#view-mode input[name="view-mode"]').forEach(function(input){
    input.parentElement.classList.toggle('active', input.value === mode);
  });
  if(DISEASE_TREE) renderDiseaseTree(DISEASE_TREE);
}

function buildTree(){
  var treeContainer=document.getElementById('tree');
  treeContainer.innerHTML='<div class="emp">加载疾病层级树...</div>';
  fetch('/api/kg/disease-tree?v='+Date.now()).then(function(r){return r.json()}).then(function(tree){
    DISEASE_TREE = tree;
    renderDiseaseTree(tree);
    // 若 URL 携带 code，自动选中
    var urlCode = new URLSearchParams(window.location.search).get('code');
    if(urlCode){ selectDisease(urlCode); }
  }).catch(function(e){
    console.error('Load disease tree failed', e);
    treeContainer.innerHTML='<div class="emp">层级树加载失败</div>';
  });
}
function renderDiseaseTree(tree){
  var treeContainer=document.getElementById('tree');
  if(CURRENT_VIEW_MODE === 'disease'){
    var diseases = collectTopDiseases(tree);
    diseases.sort(function(a,b){return getCoverage(b.code) - getCoverage(a.code)});
    treeContainer.innerHTML = renderDiseaseFlat(diseases, 1);
  } else {
    treeContainer.innerHTML = renderTreeNodes(tree, 1);
    document.querySelectorAll('#tree .grp').forEach(function(g){g.classList.add('open');g.querySelector('.grp-hd').classList.add('open')});
  }
}
function collectTopDiseases(nodes){
  // 只收集诊断层级中的顶层可点击疾病（宽口径/独立疾病），不直接平铺具体分型
  var result=[];
  function walk(nlist){
    nlist.forEach(function(n){
      if(n.type==='Disease' && (n.diagnostic_role==='broad_diagnosis' || n.diagnostic_role==='independent_disease')){
        result.push(n);
      } else if(n.children){
        walk(n.children);
      }
    });
  }
  walk(nodes);
  return result;
}
function dxRoleBadge(role){
  if(role==='broad_diagnosis') return '<span class="dx-role-badge broad">疑似诊断</span>';
  if(role==='clinical_subtype') return '<span class="dx-role-badge subtype">具体分型</span>';
  if(role==='independent_disease') return '<span class="dx-role-badge independent">独立诊断</span>';
  return '';
}
function diseaseNodeHTML(node, level, includeCov){
  var v=getCoverage(node.code);
  var hasChildren=node.children && node.children.length;
  var role=node.diagnostic_role || '';
  var icd=node.icd_code || '';
  var metaItems=[];
  if(icd) metaItems.push('<span class="icd-code">'+(node.coding_system?node.coding_system.split('（')[0]+' ':'')+icd+'</span>');
  if(role==='broad_diagnosis' && node.subtype_count>0) metaItems.push('<span class="subtype-count">分型 '+node.subtype_count+'</span>');
  var html='<div class="di level-'+level+(hasChildren?' has-children':'')+'" data-code="'+node.code+'">';
  html+='<span class="nm"><span class="nm-row"><span class="name-text" title="'+(node.icd_name||node.name)+'">'+node.name+'</span>'+dxRoleBadge(role)+'</span>';
  if(metaItems.length){
    html+='<span class="meta">'+metaItems.join('')+'</span>';
  }
  html+='</span>';
  if(includeCov!==false){
    html+='<span class="cv '+covClass(v)+'">'+Math.round(v)+'%</span>';
  }
  if(hasChildren){
    html+='<span class="child-toggle" onclick="toggleChildren(this,event)">▼</span>';
  }
  html+='</div>';
  return html;
}
function renderDiseaseFlat(nodes, level){
  if(!nodes || nodes.length===0) return '';
  var html='';
  nodes.forEach(function(node){
    html+=diseaseNodeHTML(node, level, true);
    if(node.children && node.children.length){
      var sortedChildren = node.children.slice().sort(function(a,b){return getCoverage(b.code) - getCoverage(a.code)});
      html+='<div class="di-children open">'+renderDiseaseFlat(sortedChildren, level+1)+'</div>';
    }
  });
  return html;
}
function renderTreeNodes(nodes, level){
  if(!nodes || nodes.length===0) return '';
  var html='';
  nodes.forEach(function(node){
    if(node.type==='DiseaseCategory'){
      var childCount=node.children?node.children.length:0;
      html+='<div class="grp level-'+level+'">';
      html+='<div class="grp-hd" onclick="toggleGrp(this)">';
      html+='<span class="arr">▶</span><span class="tr-dot cat-dot"></span><span>'+node.name+'</span>';
      html+='<span class="ct">'+childCount+'</span></div><div class="grp-items">';
      html+=renderTreeNodes(node.children, level+1);
      html+='</div></div>';
    } else if(node.type==='Disease'){
      html+=diseaseNodeHTML(node, level, true);
      if(node.children && node.children.length){
        html+='<div class="di-children open">'+renderTreeNodes(node.children, level+1)+'</div>';
      }
    }
  });
  return html;
}

function toggleChildren(el,ev){
  if(ev) ev.stopPropagation();
  var children=el.parentElement.nextElementSibling;
  if(!children) return;
  var isOpen=children.classList.toggle('open');
  el.textContent=isOpen?'▼':'▶';
}

function toggleGrp(el){el.parentElement.classList.toggle('open');el.classList.toggle('open')}

document.getElementById('tree').addEventListener('click',function(e){
  var di=e.target.closest('.di');
  if(!di) return;
  var code = di.dataset.maps || di.dataset.code;
  if(code) selectDisease(code);
});

document.getElementById('search').addEventListener('input',function(e){
  var kw=e.target.value.toLowerCase();
  var leaves=document.querySelectorAll('#tree .di');
  var groups=document.querySelectorAll('#tree .grp');
  if(!kw){
    leaves.forEach(function(d){d.style.display='flex';d.classList.remove('visible')});
    groups.forEach(function(g){g.style.display='block';g.classList.add('open');g.querySelector('.grp-hd').classList.add('open')});
    document.querySelectorAll('#tree .di-children').forEach(function(c){c.classList.add('open');});
    document.querySelectorAll('#tree .child-toggle').forEach(function(t){t.textContent='▼';});
    return;
  }
  leaves.forEach(function(d){d.style.display='none';d.classList.remove('visible')});
  groups.forEach(function(g){g.classList.remove('open');g.querySelector('.grp-hd').classList.remove('open')});
  leaves.forEach(function(d){
    var text=(d.textContent+' '+(d.dataset.code||'')+' '+(d.dataset.maps||'')).toLowerCase();
    if(text.indexOf(kw)!==-1){
      d.style.display='flex';d.classList.add('visible');
      // 展开其下的子疾病容器
      var childContainer=d.nextElementSibling;
      if(childContainer && childContainer.classList.contains('di-children')){
        childContainer.classList.add('open');
        var toggle=d.querySelector('.child-toggle');
        if(toggle) toggle.textContent='▼';
      }
      var g=d.closest('.grp');
      while(g){
        g.classList.add('open');g.querySelector('.grp-hd').classList.add('open');
        g=g.parentElement?g.parentElement.closest('.grp'):null;
      }
      var p=d.parentElement;
      while(p && p.id !== 'tree'){
        if(p.classList.contains('di-children')){p.classList.add('open');}
        p=p.parentElement;
      }
    }
  });
  // 疾病模式下：若子疾病匹配，其父疾病行也显示
  if(CURRENT_VIEW_MODE === 'disease'){
    leaves.forEach(function(d){
      if(d.classList.contains('visible') && d.parentElement.classList.contains('di-children')){
        var parentRow=d.parentElement.previousElementSibling;
        if(parentRow && parentRow.classList.contains('di')){
          parentRow.style.display='flex';
          parentRow.classList.add('visible');
        }
      }
    });
  }
  groups.forEach(function(g){
    g.style.display=g.querySelectorAll('.di.visible').length>0?'block':'none';
  });
});

function selectDisease(code){
  _cc=code;
  loadDiseaseData(code, function(d){
    if(!d) return;
    document.querySelectorAll('.di').forEach(function(el){el.classList.toggle('active',el.dataset.code===code || el.dataset.maps===code)});
    var di=document.querySelector('.di[data-code="'+code+'"]');
    if(di){
      var grp=di.closest('.grp');
      while(grp){
        grp.classList.add('open');grp.querySelector('.grp-hd').classList.add('open');
        grp=grp.parentElement?grp.parentElement.closest('.grp'):null;
      }
    }
    renderDetail(code);
  });
}

function escH(s){
  return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function findTreeNode(code,nodes){
  if(!nodes) return null;
  for(var i=0;i<nodes.length;i++){
    var n=nodes[i];
    if(n.code===code) return n;
    if(n.children){
      var c=findTreeNode(code,n.children);
      if(c) return c;
    }
  }
  return null;
}
function chainStepHead(num,icon,title,count,note){
  var h='<div class="chain-step-head">';
  h+='<span class="chain-step-num">'+num+'</span>';
  h+='<span class="chain-step-icon">'+icon+'</span>';
  h+='<span class="chain-step-title">'+title+'</span>';
  if(count!==null&&count!==undefined&&count!=='') h+='<span class="chain-step-count">'+count+'</span>';
  if(note) h+='<span class="chain-step-note">'+note+'</span>';
  h+='</div>';
  return h;
}
function chainPrioClass(v){
  var s=(v||'').toLowerCase();
  if(!s) return '';
  if(s.indexOf('高')>=0||s.indexOf('必须')>=0||s==='high'||s==='p0'||s==='p1') return 'high';
  if(s.indexOf('中')>=0||s.indexOf('建议')>=0||s==='medium'||s==='moderate'||s==='p2') return 'medium';
  if(s.indexOf('低')>=0||s.indexOf('可选')>=0||s==='low'||s==='optional'||s==='p3') return 'low';
  return '';
}
/* 链路已覆盖的维度，不再在"其他知识维度"平铺 */
var CHAIN_DIMS={StandardDiagnosis:1,ExamItem:1,ExamObservation:1,LabItem:1,LabSubitem:1,DifferentialDiagnosis:1,TreatmentPlan:1,Drug:1,Procedure:1,Evidence:1,Guideline:1,ClinicalRule:1};

function renderDetail(code){
  var d=KG_DATA.diseases[code];if(!d)return;
  var info=d.info,dims=d.dimensions,cv=getCoverage(code),h='';
  var roleTag='';
  if(info.diagnostic_role==='broad_diagnosis') roleTag='<span class="dx-role-badge broad">疑似诊断</span>';
  else if(info.diagnostic_role==='clinical_subtype') roleTag='<span class="dx-role-badge subtype">具体分型</span>';
  else if(info.diagnostic_role==='independent_disease') roleTag='<span class="dx-role-badge independent">独立诊断</span>';

  h+='<div class="dh"><h2>'+escH(info.name)+' '+roleTag+'</h2>';
  h+='<div class="mt">';
  if(info.icd_code) h+='<span class="icd-code" style="font-size:11px;padding:2px 6px;margin-right:8px">'+escH(info.coding_system||'ICD-10')+' '+escH(info.icd_code)+'</span>';
  h+='<span class="cd">'+escH(info.code)+'</span>';
  if(info.name_en)h+=' · '+escH(info.name_en);
  h+=' · 覆盖率 <b style="color:var(--accent)">'+Math.round(cv)+'%</b>';
  h+=' · 证据 <b style="color:var(--accent)">'+(d.evidence_count||0)+'</b> 条';
  h+=' · 关系 <b style="color:var(--accent)">'+(d.relations_summary?d.relations_summary.length:0)+'</b> 条</div>';
  if(info.desc)h+='<div class="mt" style="margin-top:8px">'+escH(info.desc)+'</div>';
  h+='</div>';

  /* ===== 专科CDSS诊疗链路（6段式） ===== */
  h+='<div class="chain-wrap">';

  /* 段1：疑似疾病/具体分型 */
  h+='<div class="chain-step">';
  h+=chainStepHead(1,'🩺','疑似疾病 / 具体分型','','Disease · StandardDiagnosis · 分型入口');
  h+='<div class="chain-step-body">';
  var stdDx=dims.StandardDiagnosis||[];
  h+='<div style="font-size:12px;color:var(--muted);margin-bottom:6px">标准诊断（CDSS字典，'+stdDx.length+'）</div>';
  if(stdDx.length){
    h+='<div class="chain-tags">';
    stdDx.forEach(function(e){
      var icd=e.standard_code?' <span class="icd-code">'+escH(e.standard_code)+'</span>':'';
      var cs=e.coding_system?' <span style="color:var(--muted);font-size:10px">'+escH(e.coding_system)+'</span>':'';
      h+='<span class="et" data-d="'+code+'" data-dk="StandardDiagnosis" data-ec="'+(e.code||'')+'">'+escH(e.name)+icd+cs+'</span>';
    });
    h+='</div>';
  }else{
    h+='<div class="chain-empty">图谱未挂接 StandardDiagnosis 标准诊断</div>';
  }
  if(info.subtypes&&info.subtypes.length){
    h+='<div style="font-size:12px;color:var(--muted);margin:12px 0 6px">具体分型入口（'+info.subtypes.length+'）</div>';
    h+='<div class="chain-tags">';
    info.subtypes.forEach(function(subCode){
      var sub=KG_DATA.diseases[subCode],treeNode=findTreeNode(subCode,DISEASE_TREE);
      var subName=(sub&&sub.info)?sub.info.name:(treeNode?treeNode.name:subCode);
      var subIcd=(sub&&sub.info)?sub.info.icd_code:(treeNode?treeNode.icd_code:'');
      h+='<span class="et" onclick="selectDisease(\''+subCode+'\')">'+escH(subName)+(subIcd?' <span class="icd-code">'+escH(subIcd)+'</span>':'')+'</span>';
    });
    h+='</div>';
  }
  if(info.diagnostic_role==='clinical_subtype'&&info.parent){
    var parentD=KG_DATA.diseases[info.parent],parentNode=findTreeNode(info.parent,DISEASE_TREE);
    var parentName=(parentD&&parentD.info)?parentD.info.name:(parentNode?parentNode.name:info.parent);
    h+='<div style="margin-top:12px;font-size:11px;color:var(--muted)">所属疑似诊断：<span class="et" onclick="selectDisease(\''+info.parent+'\')">'+escH(parentName)+'</span></div>';
  }
  h+='</div></div>';

  /* 段2：首诊辅助检查/检验 */
  var examPlans=d.exam_plans||[];
  var examTotal=0,labTotal=0;
  examPlans.forEach(function(p){examTotal+=(p.exam_items||[]).length;labTotal+=(p.lab_items||[]).length});
  h+='<div class="chain-step">';
  h+=chainStepHead(2,'🔬','首诊辅助检查 / 检验',examPlans.length?'检查 '+examTotal+' · 检验 '+labTotal:'','仅表示疾病首诊或确诊辅助，不等于鉴别排除，也不等于治疗前置');
  h+='<div class="chain-step-body">';
  if(examPlans.length){
    examPlans.forEach(function(plan){
      h+='<div class="chain-plan-card">';
      h+='<div class="chain-plan-name">📋 '+escH(plan.name)+' <span style="font-weight:400;color:var(--muted);font-size:11px;margin-left:6px">检查 '+(plan.exam_items||[]).length+' · 检验 '+(plan.lab_items||[]).length+'</span></div>';
      function itemRow(e){
        var r='<div class="chain-item-row">';
        r+='<span class="chain-item-name">'+escH(e.name)+'</span>';
        if(e.priority_level) r+='<span class="chain-prio '+chainPrioClass(e.priority_level)+'">'+escH(e.priority_level)+'</span>';
        var metas=[];
        if(e.clinical_stage) metas.push('阶段：'+e.clinical_stage);
        if(e.service_target_name) metas.push('服务对象：'+e.service_target_name);
        if(e.purpose) metas.push('目的：'+e.purpose);
        if(e.source_name) metas.push('来源：'+e.source_name+(e.source_page?' p.'+e.source_page:''));
        if(metas.length) r+='<span class="chain-item-meta">'+escH(metas.join(' · '))+'</span>';
        r+='</div>';
        return r;
      }
      (plan.exam_items||[]).forEach(function(e){h+=itemRow(e)});
      (plan.lab_items||[]).forEach(function(e){h+=itemRow(e)});
      h+='</div>';
    });
  }else{
    h+='<div class="chain-empty">图谱未建立 Disease→has_exam_plan→ExamPlan 链路（无首诊辅助检查/检验数据）</div>';
  }
  h+='</div></div>';

  /* 段3：鉴别诊断 */
  var differentials=d.differentials||[];
  var anomalyCount=differentials.filter(function(dd){return dd.anomaly}).length;
  h+='<div class="chain-step">';
  h+=chainStepHead(3,'⚖️','鉴别诊断',differentials.length?differentials.length+' 个鉴别对象':'','每个鉴别对象单独卡片：鉴别规则 + 排除检查/检验'+(anomalyCount?' · ⚠️ '+anomalyCount+' 个图谱异常':''));
  h+='<div class="chain-step-body">';
  if(differentials.length){
    h+='<div class="chain-dd-grid">';
    differentials.forEach(function(dd){
      h+='<div class="chain-dd-card">';
      h+='<div class="chain-dd-name">'+escH(dd.name);
      if(dd.anomaly) h+='<span class="chain-dd-anomaly">图谱异常：'+(dd.rules&&dd.rules.length?'泛化空壳标题':'无鉴别规则')+'</span>';
      h+='</div>';
      if(dd.description) h+='<div class="chain-rule-line" style="padding:8px 14px 0">'+escH(dd.description)+'</div>';
      if(dd.rules&&dd.rules.length){
        dd.rules.forEach(function(rule){
          h+='<div class="chain-rule">';
          h+='<div class="chain-rule-name">⚙️ '+escH(rule.name)+'</div>';
          if(rule.rule_logic) h+='<div class="chain-rule-line"><b>鉴别逻辑</b> '+escH(rule.rule_logic)+'</div>';
          if(rule.output_content) h+='<div class="chain-rule-line"><b>输出</b> '+escH(rule.output_content)+'</div>';
          if(rule.usage_boundary) h+='<div class="chain-rule-line"><b>用途边界</b> '+escH(rule.usage_boundary)+'</div>';
          if(rule.exclusion_exams&&rule.exclusion_exams.length) h+='<div class="chain-rule-line"><b>排除检查</b> '+rule.exclusion_exams.map(escH).join('、')+'</div>';
          if(rule.exclusion_labs&&rule.exclusion_labs.length) h+='<div class="chain-rule-line"><b>排除检验</b> '+rule.exclusion_labs.map(escH).join('、')+'</div>';
          h+='</div>';
        });
      }
      h+='</div>';
    });
    h+='</div>';
  }else{
    h+='<div class="chain-empty">图谱未建立 Disease→has_differential_diagnosis 链路（无鉴别诊断数据）</div>';
  }
  h+='</div></div>';

  /* 段4：治疗方案 */
  var tps=dims.TreatmentPlan||[];
  h+='<div class="chain-step">';
  h+=chainStepHead(4,'💊','治疗方案',tps.length?tps.length+' 个策略':'','TreatmentPlan 是治疗策略标题，非正式医嘱推荐；下游药品/手术/治疗项目才是可执行动作');
  h+='<div class="chain-step-body">';
  if(tps.length){
    tps.forEach(function(tp){
      var meds=tp.sub_drug||[],procs=tp.sub_procedure||[],tis=tp.sub_treatment_item||[];
      h+='<div class="chain-plan-card">';
      h+='<div class="chain-plan-name">💊 '+escH(tp.name||tp.code)+' <span style="font-weight:400;color:var(--muted);font-size:11px;margin-left:6px">药品 '+meds.length+' · 手术 '+procs.length+' · 治疗项目 '+tis.length+'</span></div>';
      if(tis.length){
        h+='<div class="chain-item-row"><span class="chain-item-meta" style="font-weight:700;color:var(--ink)">🩹 治疗项目（可执行）</span></div>';
        tis.forEach(function(t){h+='<div class="chain-item-row"><span class="chain-item-name">'+escH(t.name||t.code)+'</span></div>'});
      }
      if(meds.length){
        h+='<div class="chain-item-row"><span class="chain-item-meta" style="font-weight:700;color:var(--ink)">💉 药品（可执行）</span></div>';
        meds.forEach(function(m){h+='<div class="chain-item-row"><span class="chain-item-name">'+escH(m.name||m.code)+'</span></div>'});
      }
      if(procs.length){
        h+='<div class="chain-item-row"><span class="chain-item-meta" style="font-weight:700;color:var(--ink)">🔪 手术操作（可执行）</span></div>';
        procs.forEach(function(p){
          var stdTags=(p.std_procedures||[]).map(function(sp){return sp.standard_code?'<span class="icd-code">'+escH(sp.standard_code)+'</span>':''}).join(' ');
          h+='<div class="chain-item-row"><span class="chain-item-name">'+escH(p.name||p.code)+'</span>'+stdTags+'</div>';
        });
      }
      h+='</div>';
    });
  }else{
    h+='<div class="chain-empty">图谱未建立 Disease→has_treatment_plan 链路（无治疗方案数据）</div>';
  }
  h+='</div></div>';

  /* 段5：正式CDSS推荐（异步加载） */
  h+='<div class="chain-step">';
  h+=chainStepHead(5,'✅','正式CDSS推荐','<span id="chain-rec-count"></span>','仅读取 RecommendationStatement→recommends_action（按 disease_code='+escH(code)+' 过滤）');
  h+='<div class="chain-step-body" id="chain-recs"><div class="chain-empty">正在加载正式推荐...</div></div>';
  h+='</div>';

  /* 段6：证据展示（异步加载，仅RS直连证据） */
  h+='<div class="chain-step">';
  h+=chainStepHead(6,'📚','证据展示','<span id="chain-ev-count"></span>','只展示 RecommendationStatement 直接关联的主证据/主指南，不展示疾病全部 Evidence 池');
  h+='<div class="chain-step-body" id="chain-evs"><div class="chain-empty">正在加载直连证据...</div></div>';
  h+='</div>';

  h+='</div>';

  /* ===== 其他医学知识维度（链路未覆盖部分） ===== */
  var knowKeys=['Definition'].concat(DIM_KEYS.filter(function(k){return k!=='Definition'&&!CHAIN_DIMS[k]}));
  var hasKnow=knowKeys.some(function(k){return (dims[k]||[]).length>0});
  if(hasKnow){
    h+='<div class="know-title">📖 其他医学知识维度（非诊疗链路）</div>';

          var defText=e.definition_text||e.description||e.original_text||'';
          h+='<div class="et" data-d="'+code+'" data-dk="'+k+'" data-ec="'+(e.code||'')+'" style="display:block;padding:10px;margin-bottom:6px;background:rgba(116,143,252,.06);border:1px solid rgba(116,143,252,.15);border-radius:6px">';

          h+='</div>';
        });
      }else{
        it.forEach(function(e){
          h+='<span class="et" data-d="'+code+'" data-dk="'+k+'" data-ec="'+(e.code||'')+'">'+escH(e.name)+'</span>';
        });
      }
      h+='</div></div>';
    });
    h+='</div>';
  }

  if(d.relations_summary&&d.relations_summary.length>0){
    var rg={};d.relations_summary.forEach(function(r){if(!rg[r.rel])rg[r.rel]=0;rg[r.rel]++});
    h+='<div class="rb"><h3>📊 关系统计 ('+d.relations_summary.length+' 条)</h3><div class="rl">';
    Object.keys(rg).sort(function(a,b){return rg[b]-rg[a]}).forEach(function(r){h+='<span class="rlt">'+r+' <b>'+rg[r]+'</b></span>'});
    h+='</div></div>';
  }
  h+='<div style="margin-top:20px"><div id="mg" style="width:100%;height:450px;background:var(--bg2);border:1px solid var(--rule);border-radius:10px"></div></div>';
  document.getElementById('main').innerHTML=h;
  document.getElementById('main').scrollTop=0;
  document.querySelectorAll('.et[data-d]').forEach(function(el){
    el.addEventListener('click',function(){showEp(el.dataset.d,el.dataset.dk,el.dataset.ec)});
  });
  setTimeout(function(){renderGraph(code)},150);
  fetch('/api/kg/disease/'+encodeURIComponent(code)+'/recommendations?v='+Date.now())
    .then(function(r){return r.json()})
    .then(function(recs){fillChainRecs(recs||[])})
    .catch(function(){fillChainRecs([])});
}

function fillChainRecs(recs){
  var recBox=document.getElementById('chain-recs');
  var evBox=document.getElementById('chain-evs');
  if(!recBox) return;
  if(recs.length){
    var h='<div class="chain-rec-grid">';
    recs.forEach(function(rec){
      var isBlock=rec.recommendation_type==='block';
      h+='<div class="chain-rec-card">';
      h+='<div class="chain-rec-head">';
      h+='<span class="chain-rec-badge '+(isBlock?'block':'recommend')+'">'+(isBlock?'阻断':'推荐')+'</span>';
      if(rec.recommendation_class&&rec.recommendation_class!=='未结构化') h+='<span class="chain-rec-class">'+escH(rec.recommendation_class)+'</span>';
      if(rec.evidence_level&&rec.evidence_level!=='未结构化') h+='<span class="chain-rec-ev">'+escH(rec.evidence_level)+'</span>';
      h+='</div>';
      var meta=[];
      if(rec.pathway_name) meta.push(rec.pathway_name);
      if(rec.stage_name) meta.push(rec.stage_name);
      if(rec.rule_name) meta.push(rec.rule_name);
      if(meta.length) h+='<div class="chain-rec-source" style="margin:0 0 4px">⚙️ '+escH(meta.join(' · '))+'</div>';
      if(rec.statement_text||rec.statement_summary) h+='<div class="chain-rec-text">'+escH(rec.statement_text||rec.statement_summary)+'</div>';
      var actions=rec.actions||[];
      if(actions.length){
        h+='<div class="chain-rec-actions">';
        actions.slice(0,4).forEach(function(a){h+='<span class="chain-rec-action">'+escH(a.name||a.code)+'</span>'});
        if(actions.length>4) h+='<span class="chain-rec-action">+'+(actions.length-4)+'</span>';
        h+='</div>';
      }
      var srcName=rec.primary_source_name||rec.primary_guideline_name||(rec.guidelines&&rec.guidelines[0]);
      if(srcName){
        h+='<div class="chain-rec-source">📖 '+escH(srcName);
        if(rec.primary_source_page) h+='<span class="page">p.'+escH(rec.primary_source_page)+'</span>';
        h+='</div>';
      }
      if(rec.evidences&&rec.evidences.length) h+='<div class="chain-rec-source">📄 直连主证据 '+rec.evidences.length+' 条</div>';
      h+='</div>';
    });
    h+='</div>';
    recBox.innerHTML=h;
  }else{
    recBox.innerHTML='<div class="chain-empty">该疾病暂无 RecommendationStatement 正式推荐（不用疾病直连治疗方案冒充推荐）</div>';
  }
  var rc=document.getElementById('chain-rec-count');
  if(rc) rc.textContent=recs.length+' 条';
  if(evBox){
    var evMap={},evOrder=[];
    recs.forEach(function(rec){
      (rec.evidences||[]).forEach(function(ev){
        if(!ev.code) return;
        if(!evMap[ev.code]){evMap[ev.code]={ev:ev,rsNames:[]};evOrder.push(ev.code)}
        if(rec.name&&evMap[ev.code].rsNames.indexOf(rec.name)<0) evMap[ev.code].rsNames.push(rec.name);
      });
    });
    if(evOrder.length){
      var e='';
      evOrder.forEach(function(ec){
        var item=evMap[ec],ev=item.ev;
        e+='<div class="chain-ev-card">';
        e+='<div class="chain-ev-head"><span class="chain-ev-name">📄 '+escH(ev.name||ec)+'</span>';
        if(ev.recommendation_class) e+='<span class="chain-ev-badge">推荐 '+escH(ev.recommendation_class)+'</span>';
        if(ev.evidence_level) e+='<span class="chain-ev-badge">证据 '+escH(ev.evidence_level)+'</span>';
        e+='</div>';
        var src=[];
        if(ev.source_name) src.push(ev.source_name+(ev.source_page?' p.'+ev.source_page:''));
        if(item.rsNames.length) src.push('支撑推荐：'+item.rsNames.slice(0,3).join('；')+(item.rsNames.length>3?' 等'+item.rsNames.length+' 条':''));
        if(src.length) e+='<div class="chain-ev-src">'+escH(src.join(' · '))+'</div>';
        if(ev.excerpt) e+='<div class="chain-ev-excerpt">'+escH(ev.excerpt)+'</div>';
        e+='</div>';
      });
      evBox.innerHTML=e;
    }else{
      evBox.innerHTML='<div class="chain-empty">暂无正式推荐直连证据（不展示疾病全部 Evidence 池）</div>';
    }
    var ec2=document.getElementById('chain-ev-count');
    if(ec2) ec2.textContent=evOrder.length+' 条直连证据';
  }
}

function showEp(dc,dk,ec){
  var d=KG_DATA.diseases[dc],it=d.dimensions[dk]||[],en=null;
  for(var i=0;i<it.length;i++){if(it[i].code===ec){en=it[i];break}}
  if(!en)return;
  var h='<h3>'+en.name+'</h3><div class="ep-cd">'+(en.code||'N/A')+' · '+DIM_NAMES[dk]+' · '+d.info.name+'</div>';
  [['疾病',d.info.name+' ('+d.info.code+')'],['维度',DIM_NAMES[dk]+' ('+dk+')'],['实体名称',en.name],['实体编码',en.code||'无'],['同维度总数',it.length+' 个'+DIM_NAMES[dk]],['疾病证据数',(d.evidence_count||0)+' 条'],['疾病关系数',(d.relations_summary?d.relations_summary.length:0)+' 条']].forEach(function(r){h+='<div class="er"><div class="el">'+r[0]+'</div><div class="ev">'+r[1]+'</div></div>'});
  if(dk==='Definition'){
    var defText=en.definition_text||en.description||en.original_text||'';
    if(defText){
      h+='<div class="es"><h4>📖 定义内容</h4>';
      h+='<div style="font-size:13px;line-height:1.7;color:var(--fg2);padding:10px;background:rgba(116,143,252,.06);border-radius:6px">'+defText+'</div>';
      h+='</div>';
    }
    if(en.source_section_path){
      h+='<div class="es"><h4>来源</h4>';
      h+='<div class="ei">'+en.source_section_path+'</div>';
      h+='</div>';
    }
  }
  if(dk==='StandardDiagnosis'){
    h+='<div class="es"><h4>🏷️ CDSS标准诊断属性</h4>';
    [['ICD-10编码',en.standard_code],['编码体系',en.coding_system],['编码版本',en.coding_system_version],['CDSS字典UUID',en.cdss_dict_id],['有效标志',(en.valid_flag==1||en.valid_flag==='1')?'✓ 有效':''],['来源表',en.source_table],['来源版本',en.source_version]].forEach(function(r){if(r[1])h+='<div class="er"><div class="el">'+r[0]+'</div><div class="ev">'+r[1]+'</div></div>'});
    h+='</div>';
  }
  h+='<div class="es"><h4>📋 同维度其他'+DIM_NAMES[dk]+'</h4>';
  it.forEach(function(e){if(e.code!==ec)h+='<div class="ei">'+e.name+(e.code?' <span style="color:var(--muted);font-size:10px">('+e.code+')</span>':'')+'</div>'});
  h+='</div>';
  if(d.relations_summary){
    var rs=d.relations_summary.filter(function(r){return r.name===en.name});
    if(rs.length>0){h+='<div class="es"><h4>🔗 关联关系 ('+rs.length+')</h4>';rs.forEach(function(r){h+='<div class="ei">→ <b>'+r.rel+'</b> → '+r.name+' <span style="color:var(--muted);font-size:10px">['+r.labels.join(', ')+']</span></div>'});h+='</div>'}
  }
  document.getElementById('epc').innerHTML=h;document.getElementById('ep').classList.add('show');
}
function closeEp(){document.getElementById('ep').classList.remove('show')}
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeEp()});

function renderGraph(code){
  var c=document.getElementById('mg');if(!c)return;
  if(_gc)_gc.dispose();
  _gc=echarts.init(c,null,{renderer:'svg'});
  var d=KG_DATA.diseases[code],info=d.info,ns=[],ls=[];
  ns.push({name:info.name,symbolSize:60,category:0,itemStyle:{color:'#4f8cff',shadowBlur:25,shadowColor:'rgba(79,140,255,0.7)'},label:{fontSize:14,fontWeight:'bold',color:'#fff'}});
  var cs = DIM_COLORS_ARR;
  DIM_KEYS.forEach(function(k,idx){
    var it=d.dimensions[k]||[];
    if(it.length>0){
      var dn=DIM_NAMES[k];
      ns.push({name:dn+' ('+it.length+')',symbolSize:Math.min(16+it.length*2,45),category:idx+1,itemStyle:{color:cs[idx],shadowBlur:10,shadowColor:cs[idx]+'66'},label:{fontSize:11,fontWeight:'bold',color:'#fff'}});
      ls.push({source:info.name,target:dn+' ('+it.length+')',lineStyle:{width:3,color:cs[idx],opacity:0.7}});
      it.slice(0,10).forEach(function(e){
        ns.push({name:e.name,symbolSize:12,category:idx+1,itemStyle:{color:cs[idx]+'bb'}});
        ls.push({source:dn+' ('+it.length+')',target:e.name,lineStyle:{width:1.5,color:cs[idx]+'66',opacity:0.5}});
      });
    }
  });
  _gc.setOption({tooltip:{formatter:function(p){return p.dataType==='node'?p.name:p.data.source+' → '+p.data.target}},animationDuration:600,series:[{type:'graph',layout:'force',data:ns,links:ls,roam:true,label:{show:true,fontSize:9,color:'#e8eaf0'},lineStyle:{curveness:0.15,opacity:0.6},emphasis:{focus:'adjacency',lineStyle:{width:5}},force:{repulsion:160,gravity:0.06,edgeLength:[50,200],friction:0.6}}]});
  window.addEventListener('resize',function(){if(_gc)_gc.resize()});
}
</script>
