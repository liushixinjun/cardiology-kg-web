<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Engine v1.5.0 交互完整性测试</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; background:#0d1117; color:#c9d1d9; padding:20px; }
.test-container { max-width:1100px; margin:0 auto; }
h1 { font-size:22px; color:#58a6ff; margin-bottom:6px; }
.subtitle { color:#8b949e; font-size:13px; margin-bottom:20px; }
.summary-bar { display:flex; gap:12px; margin-bottom:20px; }
.summary-card { flex:1; background:#161b22; border:1px solid #30363d; border-radius:8px; padding:14px; text-align:center; }
.summary-card .num { font-size:28px; font-weight:700; }
.summary-card .label { font-size:11px; color:#8b949e; margin-top:4px; }
.summary-card.pass { border-color:#238636; }
.summary-card.pass .num { color:#3fb950; }
.summary-card.fail { border-color:#da3633; }
.summary-card.fail .num { color:#f85149; }
.summary-card.total { border-color:#58a6ff; }
.summary-card.total .num { color:#58a6ff; }
.test-section { background:#161b22; border:1px solid #30363d; border-radius:8px; margin-bottom:16px; overflow:hidden; }
.test-section-header { padding:12px 16px; background:#21262d; border-bottom:1px solid #30363d; display:flex; align-items:center; gap:8px; cursor:pointer; }
.test-section-header h2 { font-size:14px; font-weight:600; }
.test-section-header .badge { font-size:10px; padding:2px 8px; border-radius:999px; font-weight:600; }
.badge.pass { background:rgba(35,134,54,.2); color:#3fb950; }
.badge.fail { background:rgba(218,54,51,.2); color:#f85149; }
.test-section-header .arrow { margin-left:auto; color:#8b949e; transition:transform .2s; }
.test-section.collapsed .arrow { transform:rotate(-90deg); }
.test-section.collapsed .test-section-body { display:none; }
.test-section-body { padding:8px 0; }
.test-row { display:flex; align-items:center; gap:10px; padding:6px 16px; font-size:12px; border-bottom:1px solid #21262d; }
.test-row:last-child { border-bottom:none; }
.test-row .icon { font-size:14px; width:20px; text-align:center; }
.test-row .name { flex:1; color:#c9d1d9; }
.test-row .detail { color:#8b949e; font-family:'SF Mono',Monaco,monospace; font-size:11px; }
.test-row .status { font-size:10px; padding:2px 8px; border-radius:4px; font-weight:600; }
.status.pass { background:rgba(35,134,54,.15); color:#3fb950; }
.status.fail { background:rgba(218,54,51,.15); color:#f85149; }
#screenshot-info { margin-top:20px; padding:14px; background:#161b22; border:1px solid #30363d; border-radius:8px; font-size:12px; color:#8b949e; }
.progress-bar { height:4px; background:#21262d; border-radius:2px; margin-bottom:20px; overflow:hidden; }
.progress-fill { height:100%; background:linear-gradient(90deg,#238636,#3fb950); transition:width .3s; }
</style>
</head>
<body>
<div class="test-container">
  <h1>Engine v1.5.0 交互完整性测试</h1>
  <div class="subtitle">自动验证路径编辑器核心功能：函数链路 / 数据结构 / 模板格式 / 交互逻辑</div>
  <div class="progress-bar"><div class="progress-fill" id="progress" style="width:0%"></div></div>
  <div class="summary-bar" id="summary">
    <div class="summary-card total"><div class="num" id="total-num">0</div><div class="label">总测试数</div></div>
    <div class="summary-card pass"><div class="num" id="pass-num">0</div><div class="label">通过</div></div>
    <div class="summary-card fail"><div class="num" id="fail-num">0</div><div class="label">失败</div></div>
  </div>
  <div id="test-results"></div>
  <div id="screenshot-info">正在加载 engine.html 并执行自动化测试...</div>
</div>

<script>
var testResults = [];
var passCount = 0;
var failCount = 0;

function addTest(section, name, passed, detail) {
  testResults.push({ section: section, name: name, passed: passed, detail: detail || '' });
  if (passed) passCount++; else failCount++;
}

function renderResults() {
  var sections = {};
  testResults.forEach(function(r) {
    if (!sections[r.section]) sections[r.section] = [];
    sections[r.section].push(r);
  });

  var html = '';
  for (var sec in sections) {
    var secTests = sections[sec];
    var secPass = secTests.filter(function(t) { return t.passed; }).length;
    var secAllPass = secPass === secTests.length;
    html += '<div class="test-section">';
    html += '<div class="test-section-header">';
    html += '<h2>' + sec + '</h2>';
    html += '<span class="badge ' + (secAllPass ? 'pass' : 'fail') + '">' + secPass + '/' + secTests.length + '</span>';
    html += '<span class="arrow">▼</span>';
    html += '</div>';
    html += '<div class="test-section-body">';
    secTests.forEach(function(t) {
      html += '<div class="test-row">';
      html += '<span class="icon">' + (t.passed ? '✅' : '❌') + '</span>';
      html += '<span class="name">' + t.name + '</span>';
      if (t.detail) html += '<span class="detail">' + t.detail + '</span>';
      html += '<span class="status ' + (t.passed ? 'pass' : 'fail') + '">' + (t.passed ? 'PASS' : 'FAIL') + '</span>';
      html += '</div>';
    });
    html += '</div></div>';
  }
  document.getElementById('test-results').innerHTML = html;
  document.getElementById('total-num').textContent = testResults.length;
  document.getElementById('pass-num').textContent = passCount;
  document.getElementById('fail-num').textContent = failCount;
  document.getElementById('progress').style.width = '100%';
  document.getElementById('screenshot-info').textContent =
    '测试完成: ' + passCount + ' 通过, ' + failCount + ' 失败, 共 ' + testResults.length + ' 项 — ' + new Date().toLocaleString();
}

// Fetch engine.html and run tests
fetch('/engine.html?v=1.5.0')
  .then(function(r) { return r.text(); })
  .then(function(html) {
    var engineCode = html;

    // ===== 1. 函数定义验证 =====
    var funcChecks = [
      'toggleOrderCategory', 'toggleRecSource', 'onRecSourceChange',
      'addConnRule', 'removeConnRule', 'addEntryRule', 'removeEntryRule',
      'loadAMIExample', 'loadHTNTemplate', 'loadHFTemplate', 'loadAFTemplate', 'loadGenericTrunk',
      'runSimulation', 'validateFlow', 'compilePathway', 'generateDroolsDRL',
      'showPathStats', 'buildFlowData', 'loadFlowData', 'interpretPathway',
      'renderPalette', 'renderNodeProperties', 'renderConnectionProperties',
      'selectNode', 'selectConnection', 'addNode', 'addConnection',
      'onPaletteMouseDown', 'startConnectionDraw',
      'newFlow', 'saveFlow', 'loadFlow', 'exportJSON', 'importJSON',
      'doAutoLayout', 'deleteSelected', 'doUndo', 'doRedo',
      'showPathwaySettings', 'doPublish', 'showTest', 'exportDrools',
      'exportImage', 'exportNarrative', 'switchRightTab',
      'zoomIn', 'zoomOut', 'fitToScreen', 'resetZoom',
      'searchNodes', 'duplicateSelected', 'copySelected', 'pasteClipboard',
      'updateChannelConfig', 'showBottomBar', 'toggleAutoAction', 'toggleNodeConfig',
      'onNodeConfigChange', 'onNodeEventSelect', 'removeNodeEvent', 'removeNodeRule',
      'openRulePicker', 'filterRulePicker', 'pickRule', 'onConnPropChange',
      'saveConnConfig', 'toggleLayer', 'toggleMinimap', 'toggleEventLegend',
      'toggleLeftPanel', 'toggleRightPanel', 'togglePinPanel',
      'filterPalette', 'togglePaletteCategory', 'toggleOverflowMenu',
      'showSimulation', 'showShortcuts', 'showHistory', 'closeSimulation',
      'hideTest', 'hidePathwaySettings', 'savePathwaySettings',
      'restoreVersion', 'loadPathwayTemplate', 'loadSavedPath', 'deleteSavedPath',
      'toggleInterpretDetail', 'focusNode', 'centerOnNode', 'selectConnectedNodes',
      'selectAllNodes', 'fitToView', 'toggleValidationPanel',
      'findNode', 'findConnection', 'escapeHtml', 'escapeAttr',
      'topologicalSort'
    ];

    funcChecks.forEach(function(fn) {
      var defined = engineCode.indexOf('function ' + fn + '(') !== -1 || engineCode.indexOf('function ' + fn + ' (') !== -1;
      addTest('1. 函数定义验证', fn + '()', defined, defined ? '已定义' : '未定义');
    });

    // ===== 2. 事件类型验证 =====
    var eventChecks = [
      'EVT_ADMISSION', 'EVT_TRANSFER', 'EVT_CONDITION_CHANGE',
      'EVT_VITAL_SIGN_ALERT', 'EVT_FOLLOWUP_VISIT', 'EVT_READMISSION'
    ];
    eventChecks.forEach(function(evt) {
      var found = engineCode.indexOf("'" + evt + "'") !== -1;
      addTest('2. 事件类型', evt, found, found ? '已定义' : '缺失');
    });

    // ===== 3. 自动动作验证 =====
    var actionChecks = [
      'transfer_icu', 'escalate_care', 'notify_senior',
      'activate_code_blue', 'readmit_patient'
    ];
    actionChecks.forEach(function(act) {
      var found = engineCode.indexOf("'" + act + "'") !== -1;
      addTest('3. 自动动作', act, found, found ? '已定义' : '缺失');
    });

    // ===== 4. 节点类型验证 =====
    var nodeTypeChecks = [
      'pathway_stage', 'disease_entry', 'ability_screening',
      'ability_treatment', 'ability_risk', 'ability_followup',
      'ability_qc', 'decision', 'start', 'end',
      'recommendation', 'auto_action', 'event_trigger', 'state_clinical'
    ];
    nodeTypeChecks.forEach(function(nt) {
      var found = engineCode.indexOf("type: '" + nt + "'") !== -1 || engineCode.indexOf("type:'" + nt + "'") !== -1;
      addTest('4. 节点类型', nt, found, found ? '已定义' : '缺失');
    });

    // ===== 5. AMI案例数据验证 =====
    // Extract AMI nodes
    var amiStart = engineCode.indexOf('function loadAMIExample()');
    var amiEnd = engineCode.indexOf('function loadGenericTrunk()');
    var amiCode = engineCode.substring(amiStart, amiEnd);

    // Count nodes
    var amiNodes = amiCode.match(/\{ id:'[^']+', type:'[^']+'/g) || [];
    addTest('5. AMI案例', 'AMI节点数量', amiNodes.length >= 25, amiNodes.length + ' 个节点');

    // Count connections
    var amiConns = amiCode.match(/\{ id:'c[^']+', sourceId:/g) || [];
    addTest('5. AMI案例', 'AMI连线数量', amiConns.length >= 25, amiConns.length + ' 条连线');

    // Check ICU path
    var hasICU = amiCode.indexOf('n_icu') !== -1 && amiCode.indexOf('n_codeblue') !== -1;
    addTest('5. AMI案例', 'ICU升级路径', hasICU, hasICU ? '转ICU+Code Blue+ICU高级治疗' : '缺失');

    // Check readmission loop
    var hasReadmit = amiCode.indexOf('n_fup_bad') !== -1 && amiCode.indexOf('EVT_READMISSION') !== -1;
    addTest('5. AMI案例', '再入院闭环', hasReadmit, hasReadmit ? '随访恶化→再入院→重新住院' : '缺失');

    // Check pathway_stage
    var hasStages = amiCode.indexOf("pathway_stage") !== -1;
    addTest('5. AMI案例', '路径阶段标记', hasStages, hasStages ? '门急诊/住院/ICU/随访' : '缺失');

    // Check rec_sources
    var hasRecSources = amiCode.indexOf('rec_sources') !== -1;
    addTest('5. AMI案例', '推荐来源配置', hasRecSources, hasRecSources ? '医嘱类别+Dify+图谱' : '缺失');

    // Check entry_rules
    var hasEntryRules = amiCode.indexOf('entry_rules') !== -1;
    addTest('5. AMI案例', '准入规则', hasEntryRules, hasEntryRules ? 'Drools准入规则' : '缺失');

    // Check conn rules
    var hasConnRules = amiCode.indexOf("rules:[{type:'drools'") !== -1;
    addTest('5. AMI案例', '连线Drools规则', hasConnRules, hasConnRules ? '连线绑定Drools规则' : '缺失');

    // ===== 6. 模板格式验证 =====
    var templates = [
      { name: 'HTN', func: 'loadHTNTemplate' },
      { name: 'HF', func: 'loadHFTemplate' },
      { name: 'AF', func: 'loadAFTemplate' }
    ];
    templates.forEach(function(tpl) {
      var tStart = engineCode.indexOf('function ' + tpl.func + '()');
      var tEnd = engineCode.indexOf('function load', tStart + 100);
      if (tEnd === -1) tEnd = engineCode.indexOf('/* ====', tStart + 100);
      var tCode = engineCode.substring(tStart, tEnd !== -1 ? tEnd : tStart + 5000);

      var hasNewRules = tCode.indexOf('rules:[') !== -1;
      var hasNewEvents = tCode.indexOf('events:[') !== -1;
      var hasEntryRules = tCode.indexOf('entry_rules:') !== -1;
      var hasStart = tCode.indexOf("type:'start'") !== -1 || tCode.indexOf("type: 'start'") !== -1;
      var hasStage = tCode.indexOf("pathway_stage") !== -1;
      var hasState = tCode.indexOf("state:'PENDING'") !== -1 || tCode.indexOf("state: 'PENDING'") !== -1;
      var hasOldRule = /config:\{[^}]*rule:'[^']+'[^}]*\}/.test(tCode) && !tCode.includes('rules:[');
      var hasOldEvent = /config:\{[^}]*event:'[^']+'[^}]*\}/.test(tCode) && !tCode.includes('events:[');

      addTest('6. ' + tpl.name + '模板格式', 'rules[]数组', hasNewRules, hasNewRules ? '新格式' : '旧格式');
      addTest('6. ' + tpl.name + '模板格式', 'events[]数组', hasNewEvents, hasNewEvents ? '新格式' : '旧格式');
      addTest('6. ' + tpl.name + '模板格式', 'entry_rules准入规则', hasEntryRules, hasEntryRules ? '已配置' : '缺失');
      addTest('6. ' + tpl.name + '模板格式', 'start节点', hasStart, hasStart ? '有' : '无');
      addTest('6. ' + tpl.name + '模板格式', 'pathway_stage阶段标记', hasStage, hasStage ? '有' : '无');
      addTest('6. ' + tpl.name + '模板格式', 'state:PENDING', hasState, hasState ? '有' : '无');
      addTest('6. ' + tpl.name + '模板格式', '无旧格式rule单值', !hasOldRule, !hasOldRule ? '已清理' : '残留旧格式');
    });

    // ===== 7. 核心功能验证 =====
    addTest('7. 核心功能', 'buildFlowData导出rules', engineCode.indexOf("JSON.parse(JSON.stringify(c.rules") !== -1, '深拷贝连线规则');
    addTest('7. 核心功能', 'buildFlowData导出rule_result', engineCode.indexOf("rule_result: c.rule_result") !== -1, '导出规则结果');
    addTest('7. 核心功能', 'loadFlowData加载rules', engineCode.indexOf("rules: cd.rules || []") !== -1, '加载连线规则');
    addTest('7. 核心功能', 'loadFlowData加载rule_result', engineCode.indexOf("rule_result: cd.rule_result") !== -1, '加载规则结果');
    addTest('7. 核心功能', 'generateDroolsDRL准入规则', engineCode.indexOf('疾病准入规则') !== -1, 'DRL包含准入规则');
    addTest('7. 核心功能', 'generateDroolsDRL连线规则', engineCode.indexOf('连线判断规则') !== -1, 'DRL包含连线规则');
    addTest('7. 核心功能', 'generateDroolsDRL医嘱类别', engineCode.indexOf('推荐来源-医嘱类别') !== -1, 'DRL包含医嘱类别规则');
    addTest('7. 核心功能', 'validateFlow准入规则校验', engineCode.indexOf('未绑定准入规则') !== -1, '校验准入规则');
    addTest('7. 核心功能', 'validateFlow推荐来源校验', engineCode.indexOf('启用了Dify智能体推荐但未配置') !== -1, '校验推荐来源');
    addTest('7. 核心功能', 'validateFlow连线规则校验', engineCode.indexOf('绑定了规则但未设置规则结果') !== -1, '校验连线规则');
    addTest('7. 核心功能', 'compilePathway编译准入', engineCode.indexOf('entryConfig') !== -1, '编译准入规则');
    addTest('7. 核心功能', 'compilePathway编译连线', engineCode.indexOf('connectionRules') !== -1, '编译连线规则');
    addTest('7. 核心功能', 'compilePathway编译推荐', engineCode.indexOf('recommendationSources') !== -1, '编译推荐来源');
    addTest('7. 核心功能', 'runSimulation路径流转', engineCode.indexOf('路径流转模拟') !== -1, '模拟路径流转');
    addTest('7. 核心功能', 'runSimulation准入检查', engineCode.indexOf('疾病准入检查') !== -1, '模拟准入检查');
    addTest('7. 核心功能', 'runSimulation推荐来源', engineCode.indexOf('推荐来源:') !== -1, '模拟推荐来源');
    addTest('7. 核心功能', 'showPathStats连线规则', engineCode.indexOf('connRules') !== -1, '统计连线规则');
    addTest('7. 核心功能', 'showPathStats准入规则', engineCode.indexOf('entryRules') !== -1, '统计准入规则');
    addTest('7. 核心功能', 'showPathStats推荐来源', engineCode.indexOf('recSources') !== -1, '统计推荐来源');
    addTest('7. 核心功能', '废弃函数已清理', engineCode.indexOf('function addDecisionRule') === -1, '已移除addDecisionRule');
    addTest('7. 核心功能', '废弃函数已清理', engineCode.indexOf('function removeDecisionRule') === -1, '已移除removeDecisionRule');

    // ===== 8. 交互链验证 =====
    addTest('8. 交互链', '拖拽添加节点', engineCode.indexOf('onPaletteMouseDown') !== -1 && engineCode.indexOf("dragState = { type: 'new-node'") !== -1, 'mousedown→drag→addNode');
    addTest('8. 交互链', '点击节点选中', engineCode.indexOf('function selectNode(') !== -1, 'click→selectNode→renderNodeProperties');
    addTest('8. 交互链', '点击连线选中', engineCode.indexOf('function selectConnection(') !== -1, 'click→selectConnection→renderConnectionProperties');
    addTest('8. 交互链', '端口拖拽连线', engineCode.indexOf('function startConnectionDraw(') !== -1, 'port mousedown→startConnectionDraw');
    addTest('8. 交互链', '左侧面板渲染', engineCode.indexOf('function renderPalette(') !== -1, 'renderPalette→NODE_TYPES.forEach');
    addTest('8. 交互链', '底部配置栏', engineCode.indexOf('function showBottomBar(') !== -1, 'showBottomBar→syncBottomBarFromMeta');
    addTest('8. 交互链', '撤销/重做', engineCode.indexOf('function doUndo(') !== -1 && engineCode.indexOf('function doRedo(') !== -1, 'undoStack→loadFlowData');
    addTest('8. 交互链', '自动排版', engineCode.indexOf('function doAutoLayout(') !== -1, '拓扑排序布局');
    addTest('8. 交互链', '搜索节点', engineCode.indexOf('function searchNodes(') !== -1, '关键词搜索定位');
    addTest('8. 交互链', '复制粘贴', engineCode.indexOf('function copySelected(') !== -1 && engineCode.indexOf('function pasteClipboard(') !== -1, '复制+粘贴节点');

    renderResults();
  })
  .catch(function(err) {
    document.getElementById('screenshot-info').textContent = '加载失败: ' + err.message;
  });
</script>
</body>
</html>
