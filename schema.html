function siRenderModalListView(data){
  var c = data.center;
  var t = TYPE_MAP[c.entityType] || {cn:c.entityType,icon:'📌'};
  var html = '';
  // 基本属性卡片
  html += '<div style="background:var(--bg3);border:1px solid var(--rule);border-radius:10px;padding:16px;margin-bottom:16px">';
  html += '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">';
  html += '<div><span style="font-size:18px;font-weight:800;color:var(--ink)">'+c.name+'</span>';
  if(c.name_en) html += '<span style="font-size:12px;color:var(--muted);margin-left:8px">'+c.name_en+'</span>';
  html += '</div>';
  html += '<span class="si-entity-type-badge '+t.code+'">'+t.icon+' '+t.cn+'</span>';
  html += '</div>';
  html += '<div class="si-props-grid">';
  if(c.icd_code) html += siPropRow('ICD-10', c.icd_code);
  if(c.description) html += siPropRow('描述', c.description);
  if(c.aliases && c.aliases.length) html += siPropRow('别名', c.aliases.join('、'));
  html += siPropRow('编码', c.code);
  html += '</div></div>';

  // 关联实体（按维度分组）
  var groups = {};
  var ungrouped = [];
  (data.neighbors||[]).forEach(function(n){
    var dim = REL_DIM_MAP[n.rel_type];
    if(dim){
      if(!groups[dim]) groups[dim] = [];
      groups[dim].push(n);
    } else {
      ungrouped.push(n);
    }
  });

  var allDims = Object.keys(groups);
  if(ungrouped.length > 0) allDims.push('其他');
  if(allDims.length > 0){
    html += '<div style="font-size:14px;font-weight:700;color:var(--ink);margin-bottom:10px">关联实体（'+(data.neighbors||[]).length+'）</div>';
    allDims.forEach(function(dim){
      var items = dim === '其他' ? ungrouped : groups[dim];
      html += '<div class="si-dim-group open">';
      html += '<div class="si-dim-head" onclick="this.parentElement.classList.toggle(\'open\')">';
      html += '<span class="si-dim-arrow">▶</span>';
      html += '<span class="si-dim-name">'+dim+'</span>';
      html += '<span class="si-dim-count">'+items.length+'</span>';
      html += '</div>';
      html += '<div class="si-dim-body">';
      items.forEach(function(n){
        var nt = TYPE_MAP[n.entityType] || {cn:n.entityType,icon:'📌'};
        html += '<div class="si-rel-item">';
        html += '<span class="si-rel-name">'+n.name+'</span>';
        html += '<span class="si-rel-type-tag">'+nt.cn+'</span>';
        html += '</div>';
      });
      html += '</div></div>';
    });
  } else {
    html += '<div class="si-empty" style="padding:20px">暂无关联实体</div>';
  }
  document.getElementById('si-xl-list-view').innerHTML = html;
}

/* ========== 弹窗内网络图 (ECharts) ========== */
function siInitModalNetwork(code){
  // 销毁旧实例
  if(SI_MODAL_STATE.echartsChart){
    SI_MODAL_STATE.echartsChart.dispose();
    SI_MODAL_STATE.echartsChart = null;
  }
  SI_MODAL_STATE.echartsNodes = {};
  SI_MODAL_STATE.echartsEdges = {};
  var expandedSet = new Set();

  var container = document.getElementById('si-modal-network');
  SI_MODAL_STATE.echartsChart = echarts.init(container, null, {renderer:'canvas'});

  // 渲染图例
  var legendHtml = '<div class="lg-title">实体类别</div>';
  var mainTypes = ['Disease','Symptom','Drug','ExamItem','LabItem','DiagnosisCriteria','Procedure','RiskFactor'];
  mainTypes.forEach(function(code){
    var t = TYPE_MAP[code];
    if(t) legendHtml += '<div class="lg-row"><span class="lg-dot" style="background:'+t.color+'"></span>'+t.cn+'</div>';
  });
  document.getElementById('si-modal-legend').innerHTML = legendHtml;

  // 点击事件：展开关联
  SI_MODAL_STATE.echartsChart.on('click', function(params){
    if(params.dataType !== 'node') return;
    var nd = SI_MODAL_STATE.echartsNodes[params.data.id];
    if(!nd) return;
    siModalExpandNode(nd.code, expandedSet);
  });

  // 加载中心节点
  siModalExpandNode(code, expandedSet, true);

  // resize监听
  var resizeHandler = function(){
    if(SI_MODAL_STATE.echartsChart) SI_MODAL_STATE.echartsChart.resize();
  };
  window.addEventListener('resize', resizeHandler);
}

function siModalExpandNode(code, expandedSet, isCenter){
  if(expandedSet.has(code)) return;
  expandedSet.add(code);

  fetch('/api/kg/subgraph?code='+encodeURIComponent(code)+'&limit=50').then(function(r){return r.json()}).then(function(data){
    if(data.error) return;
    var c = data.center;
    var t = TYPE_MAP[c.entityType] || {color:'#888'};

    if(!SI_MODAL_STATE.echartsNodes[c.code]){
      SI_MODAL_STATE.echartsNodes[c.code] = {
        id: c.code, name: c.name,
        symbolSize: isCenter ? 56 : 30,
        category: c.entityType, itemType: c.entityType, code: c.code,
        itemStyle: {color: t.color, shadowBlur: isCenter?20:0, shadowColor:'rgba(0,0,0,0.3)'},
        label: {show:true, fontSize:isCenter?14:10, fontWeight:isCenter?'bold':'normal', color:isCenter?'#fff':'#c0c8d8'}
      };
    }

    (data.neighbors||[]).forEach(function(n){
      var nt = TYPE_MAP[n.entityType] || {color:'#888'};
      if(!SI_MODAL_STATE.echartsNodes[n.code]){
        SI_MODAL_STATE.echartsNodes[n.code] = {
          id: n.code, name: n.name,
          symbolSize: 18, category: n.entityType, itemType: n.entityType, code: n.code,
          itemStyle: {color: nt.color, opacity: 0.85},
          label: {show:true, fontSize:9, color:'#c0c8d8'}
        };
      }
      var edgeId = n.rel_dir==='out' ? code+'-'+n.rel_type+'-'+n.code : n.code+'-'+n.rel_type+'-'+code;
      if(!SI_MODAL_STATE.echartsEdges[edgeId]){
        SI_MODAL_STATE.echartsEdges[edgeId] = {
          source: n.rel_dir==='out'?code:n.code,
          target: n.rel_dir==='out'?n.code:code,
          value: REL_DIM_MAP[n.rel_type]||n.rel_type,
          lineStyle: {color:'#555', width:1.2, curveness:0.12, opacity:0.5}
        };
      }
    });

    siRenderModalECharts();
  }).catch(function(){});
}

function siRenderModalECharts(){
  if(!SI_MODAL_STATE.echartsChart) return;
  var nodes = [];
  var categories = [];
  var catSet = {};
  ENTITY_TYPES.forEach(function(t){catSet[t.code]=categories.length; categories.push({name:t.cn})});

  Object.keys(SI_MODAL_STATE.echartsNodes).forEach(function(id){
    var n = SI_MODAL_STATE.echartsNodes[id];
    n.category = catSet[n.itemType] !== undefined ? catSet[n.itemType] : 0;
    nodes.push(n);
  });
  var links = Object.keys(SI_MODAL_STATE.echartsEdges).map(function(id){return SI_MODAL_STATE.echartsEdges[id]});

  SI_MODAL_STATE.echartsChart.setOption({
    tooltip: {
      trigger:'item', backgroundColor:'#1a1d27', borderColor:'#2e3348',
      textStyle:{color:'#e8eaf0',fontSize:12},
      formatter:function(p){
        if(p.dataType==='edge') return p.data.source+' → '+p.data.target+'<br><span style="color:#8b90a0">'+(p.data.value||'')+'</span>';
        var nd = SI_MODAL_STATE.echartsNodes[p.data.id];
        if(!nd) return p.name;
        var t = TYPE_MAP[nd.itemType]||{cn:nd.itemType};
        return '<b>'+p.name+'</b><br><span style="color:#8b90a0">'+t.cn+'</span>';
      }
    },
    animationDuration:800, animationEasingUpdate:'quinticInOut',
    series:[{
      type:'graph', layout:'force', data:nodes, links:links, categories:categories,
      roam:true, draggable:true,
      label:{show:true, position:'right', fontSize:10, color:'#e8eaf0'},
      lineStyle:{curveness:0.12, opacity:0.6},
      emphasis:{focus:'adjacency', lineStyle:{width:4}},
      force:{repulsion:280, gravity:0.06, edgeLength:[70,180], friction:0.6, layoutAnimation:true}
    }]
  }, true);

  document.getElementById('si-modal-net-info').innerHTML = '节点: <b>'+nodes.length+'</b> | 关联: <b>'+links.length+'</b>';
  setTimeout(function(){if(SI_MODAL_STATE.echartsChart) SI_MODAL_STATE.echartsChart.resize()}, 100);
}

/* ==========================================================
   图谱数据审核 — 四大核心视图（主切换/疾病审核/维度视角/字典对比/影响范围）
   纯 ES5：不使用箭头函数/模板字符串/let/const/解构
   ========================================================== */

/* ---------- 通用辅助 ---------- */
function siEsc(s){
  return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function siEscAttr(s){
  return String(s==null?'':s).replace(/\\/g,'\\\\').replace(/'/g,"\\'");
}
/* 稳健加载单个疾病完整数据（优先用 loadDiseaseData，降级直连 API） */
function siFetchDisease(code, cb){
  loadDiseaseData(code, function(d){
    if(d && d.dimensions){ cb(d); return; }
    fetch('/api/kg/disease/'+encodeURIComponent(code)+'?v='+Date.now()).then(function(r){return r.json()}).then(function(dd){
      if(dd && dd.dimensions && typeof filterDeprecatedEntities==='function'){ filterDeprecatedEntities(dd); }
      cb(dd||null);
    }).catch(function(){ cb(null); });
  });
}

/* ========== 1. 主视图切换 ========== */
function siSwitchMainView(view){
  SI_STATE.mainView = view;
  /* 主Tab高亮 */
  document.querySelectorAll('.si-main-tab').forEach(function(t){
    if(t.getAttribute('data-view')===view){ t.classList.add('active'); t.setAttribute('aria-selected','true'); }
    else { t.classList.remove('active'); t.setAttribute('aria-selected','false'); }
  });
  /* 统一工具栏：始终显示 si-topbar-default */
  document.getElementById('si-topbar-default').style.display = (view==='registry') ? 'none' : 'flex';
  /* 搜索栏仅 search 视图显示 */
  var searchBar = document.getElementById('si-search-bar');
  var dimBar = document.getElementById('si-dim-bar');
  searchBar.style.display = (view==='search') ? 'flex' : 'none';
  dimBar.style.display = (view==='dim') ? 'flex' : 'none';
  /* 视图容器显隐 */
  var tableView = document.getElementById('si-table-view');
  var networkView = document.getElementById('si-network-view');
  var searchView = document.getElementById('si-search-view');
  var auditView = document.getElementById('si-audit-view');
  var dimView = document.getElementById('si-dim-view');
  var dictView = document.getElementById('si-dict-view');
  var regView = document.getElementById('si-registry-view');
  tableView.style.display='none'; networkView.style.display='none'; searchView.style.display='none';
  auditView.style.display='none'; dimView.style.display='none'; dictView.style.display='none';
  regView.style.display='none';
  if(view==='registry'){
    /* 4001整改：结构注册表视图（默认） */
    regView.style.display='block';
    if(!SI_REGISTRY_DATA){ siLoadRegistry(); }
    else { siRenderRegistry(); }
    return;
  }
  if(view==='search'){
    if(SI_STATE.view==='table'){ tableView.style.display='block'; }
    else if(SI_STATE.view==='network'){ networkView.style.display='block'; }
    else { searchView.style.display='block'; }
  } else if(view==='audit'){
    auditView.style.display='block';
    /* 已有疾病选中且审核视图为空时自动加载 */
    if(SI_STATE.currentCode && !auditView.innerHTML.trim()){
      siLoadAuditView(SI_STATE.currentCode);
    }
  } else if(view==='dim'){
    dimView.style.display='block';
    if(!SI_DIM_INIT){ siInitDimTypeSelector(); }
    /* 级联：未选维度类型时按已选条件（疾病大类）自动加载全部类型实体，不再强制先选维度 */
    if(!SI_DIM_CUR_TYPE && !dimView.innerHTML.trim()){
      siLoadDimEntities('');
    }
    if(SI_DIM_CHART){
      var nc = document.getElementById('si-dim-network');
      if(nc){ setTimeout(function(){ if(SI_DIM_CHART) SI_DIM_CHART.resize(); }, 120); }
      else { SI_DIM_CHART.dispose(); SI_DIM_CHART = null; }
    }
  } else if(view==='dict'){
    dictView.style.display='block';
    /* 已有疾病选中时自动加载字典对比 */
    if(SI_STATE.currentCode){
      siLoadDictView(SI_STATE.currentCode);
    } else if(!dictView.innerHTML.trim()){
      dictView.innerHTML='<div class="si-empty" style="padding:60px;text-align:center">请先在上方选择疾病，再查看字典对比</div>';
    }
  }
}

/* ========== 1.5 结构注册表视图（4001整改：图谱数据字典核心） ========== */
var SI_REGISTRY_DATA = null;
var SI_REGISTRY_FILTER = { kind:'relation', q:'', status:'', extOnly:false };

function siLoadRegistry(){
  var el = document.getElementById('si-registry-view');
  el.innerHTML = '<div class="si-empty" style="padding:60px;text-align:center;color:var(--muted)">正在加载结构注册表…</div>';
  fetch('/api/kg/schema-registry?v=' + Date.now())
    .then(function(r){ return r.json(); })
    .then(function(data){
      SI_REGISTRY_DATA = data || {};
      siRenderRegistry();
    })
    .catch(function(e){
      el.innerHTML = '<div class="si-empty" style="padding:60px;text-align:center;color:#ff6b6b">注册表加载失败：' + (e.message||e) + '<br>请刷新重试</div>';
    });
}

function siRegBadge(ok, warn, text){
  var cls = ok ? 'match' : (warn ? 'partial' : 'missing');
  return '<span class="si-dict-status ' + cls + '">' + text + '</span>';
}

function siRenderRegistry(){
  var el = document.getElementById('si-registry-view');
  var d = SI_REGISTRY_DATA || {};
  var sum = d.summary || {};
  var f = SI_REGISTRY_FILTER;
  var h = '';

  /* 头部统计 */
  h += '<div class="si-dict-section" style="margin-bottom:14px">';
  h += '<h3>📐 图谱结构注册表 · 基准 ' + (d.schema_standard_version||'-') + '（生成于 ' + (d.generated_at||'-') + '）</h3>';
  h += '<div class="si-dict-summary" style="flex-wrap:wrap;gap:8px 20px">';
  h += '<span>实体类型：已注册 <b>' + (sum.entity_types_registered||0) + '</b> · 扩展槽位 <b>' + (sum.entity_types_extension_slots||0) + '</b> · 未注册 <b>' + (sum.entity_types_unregistered||0) + '</b></span>';
  h += '<span>关系类型：已注册 <b>' + (sum.relation_types_registered||0) + '</b> · 扩展槽位 <b>' + (sum.relation_types_extension_slots||0) + '</b> · 未注册 <b>' + (sum.relation_types_unregistered||0) + '</b></span>';
  h += '</div>';
  h += '<div style="padding:10px 16px;font-size:11px;color:var(--muted);line-height:1.7">' + (d.note||'') + '</div>';
  h += '</div>';

  /* 药品结构提示（4001整改：当前Drug结构，旧Medication仅历史迁移提示） */
  var meds = (d.entity_types||[]).filter(function(e){ return e.type==='Medication'; });
  var drugs = (d.entity_types||[]).filter(function(e){ return e.type==='Drug'; });
  h += '<div class="si-dict-section" style="margin-bottom:14px">';
  h += '<h3>💊 药品结构口径（Schema V4.1）</h3>';
  h += '<div class="si-dict-table"><table>';
  h += '<tr><th>结构</th><th>中文</th><th>实例数</th><th>状态</th><th>说明</th></tr>';
  h += '<tr><td><b>Drug</b></td><td>药品</td><td>' + ((drugs[0]&&drugs[0].instance_count)||0) + '</td><td>' + siRegBadge(true,false,'现行结构') + '</td><td>治疗方案包含药品用 includes_drug；药品类别到具体药品用 has_specific_drug；相互作用用 interacts_with</td></tr>';
  h += '<tr><td style="color:var(--muted)">Medication</td><td style="color:var(--muted)">药品(旧)</td><td>' + ((meds[0]&&meds[0].instance_count)||0) + '</td><td>' + (meds.length && meds[0].instance_count>0 ? siRegBadge(false,false,'残留待清理') : siRegBadge(false,true,'已清除·历史迁移提示')) + '</td><td style="color:var(--muted)">旧结构仅作历史迁移提示，不作为现行结构展示或生成</td></tr>';
  h += '</table></div>';
  h += '</div>';

  /* 筛选工具栏 */
  h += '<div class="si-topbar" style="margin-bottom:12px">';
  h += '<div class="si-view-tabs">';
  h += '<div class="si-view-tab' + (f.kind==='relation'?' active':'') + '" onclick="siRegSetKind(\'relation\')">🔗 关系类型</div>';
  h += '<div class="si-view-tab' + (f.kind==='entity'?' active':'') + '" onclick="siRegSetKind(\'entity\')">📦 实体类型</div>';
  h += '</div>';
  h += '<input type="text" value="' + f.q + '" placeholder="搜索类型/中文语义…" oninput="siRegSetQ(this.value)" style="width:220px">';
  h += '<select onchange="siRegSetStatus(this.value)">';
  h += '<option value="">全部状态</option>';
  h += '<option value="inst"' + (f.status==='inst'?' selected':'') + '>实例已存在</option>';
  h += '<option value="slot"' + (f.status==='slot'?' selected':'') + '>结构已定义·实例未落地</option>';
  h += '</select>';
  h += '<label style="display:flex;align-items:center;gap:5px;font-size:12px;color:var(--muted);cursor:pointer"><input type="checkbox" ' + (f.extOnly?'checked':'') + ' onchange="siRegSetExt(this.checked)"> 仅专科扩展槽位</label>';
  h += '<span id="si-reg-count" style="font-size:12px;color:var(--muted);margin-left:auto"></span>';
  h += '</div>';

  h += '<div id="si-registry-table"></div>';
  el.innerHTML = h;
  siRenderRegistryTable();
}

function siRegSetKind(k){ SI_REGISTRY_FILTER.kind=k; siRenderRegistry(); }
function siRegSetQ(q){ SI_REGISTRY_FILTER.q=q; siRenderRegistryTable(); }
function siRegSetStatus(s){ SI_REGISTRY_FILTER.status=s; siRenderRegistryTable(); }
function siRegSetExt(b){ SI_REGISTRY_FILTER.extOnly=b; siRenderRegistryTable(); }

function siRenderRegistryTable(){
  var el = document.getElementById('si-registry-table');
  if(!el || !SI_REGISTRY_DATA) return;
  var f = SI_REGISTRY_FILTER;
  var q = (f.q||'').toLowerCase();
  var rows = [];
  if(f.kind==='relation'){
    (SI_REGISTRY_DATA.relation_types||[]).forEach(function(r){
      if(q && (r.type||'').toLowerCase().indexOf(q)<0 && (r.name_cn||'').toLowerCase().indexOf(q)<0) return;
      if(f.status==='inst' && r.instance_count<=0) return;
      if(f.status==='slot' && r.instance_count>0) return;
      if(f.extOnly && !r.is_extension_slot) return;
      rows.push(r);
    });
    var h = '<div class="si-dict-section"><h3>🔗 关系类型注册表（' + rows.length + '）</h3><div class="si-dict-table"><table>';
    h += '<tr><th>关系类型</th><th>中文语义</th><th>注册</th><th>实例数</th><th>允许起点实体</th><th>允许终点实体</th><th>状态</th></tr>';
    rows.forEach(function(r){
      h += '<tr>';
      h += '<td style="font-family:monospace;font-size:12px">' + (r.type||'') + '</td>';
      h += '<td>' + (r.name_cn||'<span style="color:var(--muted)">未定义中文</span>') + '</td>';
      h += '<td>' + siRegBadge(r.registered, false, r.registered?'已注册':'未注册') + '</td>';
      h += '<td>' + (r.instance_count||0) + '</td>';
      h += '<td style="font-size:11px;color:var(--muted)">' + (r.start_entity_types||[]).join(', ') + '</td>';
      h += '<td style="font-size:11px;color:var(--muted)">' + (r.end_entity_types||[]).join(', ') + '</td>';
      h += '<td>' + siRegBadge(r.instance_count>0, true, r.instance_count>0?'实例已存在':(r.is_extension_slot?'扩展槽位':'实例未落地')) + '</td>';
      h += '</tr>';
    });
    h += '</table></div></div>';
    el.innerHTML = h;
  } else {
    (SI_REGISTRY_DATA.entity_types||[]).forEach(function(r){
      if(q && (r.type||'').toLowerCase().indexOf(q)<0 && (r.name_cn||'').toLowerCase().indexOf(q)<0) return;
      if(f.status==='inst' && r.instance_count<=0) return;
      if(f.status==='slot' && r.instance_count>0) return;
      if(f.extOnly && !r.is_extension_slot) return;
      rows.push(r);
    });
    var h = '<div class="si-dict-section"><h3>📦 实体类型注册表（' + rows.length + '）</h3><div class="si-dict-table"><table>';
    h += '<tr><th>实体类型</th><th>中文名称</th><th>注册</th><th>实例数</th><th>状态</th></tr>';
    rows.forEach(function(r){
      h += '<tr>';
      h += '<td style="font-family:monospace;font-size:12px">' + (r.type||'') + '</td>';
      h += '<td>' + (r.name_cn||'<span style="color:var(--muted)">未定义中文</span>') + '</td>';
      h += '<td>' + siRegBadge(r.registered, false, r.registered?'已注册':'未注册') + '</td>';
      h += '<td>' + (r.instance_count||0) + '</td>';
      h += '<td>' + siRegBadge(r.instance_count>0, true, r.instance_count>0?'实例已存在':(r.is_extension_slot?'扩展槽位':'实例未落地')) + '</td>';
      h += '</tr>';
    });
    h += '</table></div></div>';
    el.innerHTML = h;
  }
  var cnt = document.getElementById('si-reg-count');
  if(cnt) cnt.textContent = '共 ' + rows.length + ' 条';
}

/* ========== 2. 疾病审核视图 ========== */
/* 9分组定义（与 explore.html 知识总览一致） */
var SI_AUDIT_GROUPS = [
  {name:'定义与基础', icon:'📖', dims:['Definition']},
  {name:'临床表现', icon:'🩺', dims:['Symptom','Sign']},
  {name:'诊断检查', icon:'🔬', dims:['ExamItem','ExamObservation','LabItem','LabSubitem']},
  {name:'诊断与鉴别', icon:'🔍', dims:['DiagnosisCriteria','DifferentialDiagnosis','RiskStratification']},
  {name:'治疗方案', icon:'💊', dims:['Drug','Procedure','TreatmentPlan']},
  {name:'临床规则', icon:'⚙️', dims:['ClinicalRule','ThresholdRule','Contraindication']},
  {name:'预后与预防', icon:'📊', dims:['Prognosis','FollowUp','Prevention','Complication']},
  {name:'病因与机制', icon:'🧬', dims:['Etiology','Pathophysiology','Epidemiology','RiskFactor']},
  {name:'证据链与指南', icon:'📚', dims:['Evidence','Guideline']},
  {name:'护理支持', icon:'🧑‍⚕️', dims:['NursingCarePlan','NursingAssessment','NursingDiagnosis']}
];
/* 审核状态当前上下文 */
var SI_AUDIT_CUR = {code:null, entityCodes:[]};

/* 审核状态存储（localStorage，key: schema_verify_{diseaseCode}） */
function siAuditGetStatus(diseaseCode){
  try{
    var raw = localStorage.getItem('schema_verify_'+diseaseCode);
    return raw ? JSON.parse(raw) : {};
  }catch(e){ return {}; }
}
function siAuditSaveStatus(diseaseCode, entityCode, status){
  var all = siAuditGetStatus(diseaseCode);
  var prev = all[entityCode] || {};
  all[entityCode] = {status:status, note:prev.note||'', timestamp:Date.now()};
  try{ localStorage.setItem('schema_verify_'+diseaseCode, JSON.stringify(all)); }catch(e){}
}
function siAuditSaveNote(diseaseCode, entityCode, note){
  var all = siAuditGetStatus(diseaseCode);
  var prev = all[entityCode] || {};
  all[entityCode] = {status:prev.status||'', note:note, timestamp:Date.now()};
  try{ localStorage.setItem('schema_verify_'+diseaseCode, JSON.stringify(all)); }catch(e){}
}
/* 根据 entityCode 查找审核卡片 DOM（避免 CSS 选择器转义问题） */
function siFindAuditCard(entityCode){
  var cards = document.querySelectorAll('.si-audit-entity');
  for(var i=0;i<cards.length;i++){
    if(cards[i].getAttribute('data-code')===entityCode) return cards[i];
  }
  return null;
}
/* 标记审核状态并刷新UI（按钮高亮 + 进度条） */
function siAuditMark(diseaseCode, entityCode, status){
  siAuditSaveStatus(diseaseCode, entityCode, status);
  var card = siFindAuditCard(entityCode);
  if(card){
    var btns = card.querySelectorAll('.si-audit-vbtn');
    btns.forEach(function(b){
      b.classList.remove('ok','err','doubt');
      if(b.getAttribute('data-status')===status){ b.classList.add(status); }
    });
  }
  siUpdateAuditProgress(diseaseCode);
}
/* 更新审核进度条 */
function siUpdateAuditProgress(diseaseCode){
  if(SI_AUDIT_CUR.code !== diseaseCode) return;
  var all = siAuditGetStatus(diseaseCode);
  var verified = 0;
  SI_AUDIT_CUR.entityCodes.forEach(function(c){ if(all[c] && all[c].status) verified++; });
  var total = SI_AUDIT_CUR.entityCodes.length;
  var pct = total>0 ? Math.round(verified/total*100) : 0;
  var fill = document.getElementById('si-audit-progress-fill');
  var text = document.getElementById('si-audit-progress-text');
  if(fill) fill.style.width = pct+'%';
  if(text) text.textContent = verified+'/'+total+' ('+pct+'%)';
}
/* 展开/折叠分组 */
function siAuditToggleGroup(groupIdx){
  var g = document.getElementById('si-audit-group-'+groupIdx);
  if(g) g.classList.toggle('open');
}
/* 加载疾病审核视图 */
function siLoadAuditView(code){
  if(!code) return;
  SI_STATE.currentCode = code;
  var view = document.getElementById('si-audit-view');
  view.innerHTML = '<div style="text-align:center;padding:60px;color:var(--muted)">加载疾病数据中...</div>';
  siFetchDisease(code, function(d){
    if(!d){ view.innerHTML = '<div class="si-empty">疾病数据加载失败</div>'; return; }
    SI_STATE.currentData = d;
    renderAuditView(d);
  });
}
/* 渲染审核视图 */
function renderAuditView(diseaseData){
  var info = diseaseData.info || {};
  var dims = diseaseData.dimensions || {};
  var diseaseCode = info.code || SI_STATE.currentCode;
  var allStatus = siAuditGetStatus(diseaseCode);
  var view = document.getElementById('si-audit-view');
  var html = '';

  /* 统计实体总数与核心维度覆盖 */
  var totalEntities = 0;
  var entityCodes = [];
  DIM_KEYS.forEach(function(k){
    var list = dims[k] || [];
    list.forEach(function(e){
      totalEntities++;
      var ec = e.code || e.name || '';
      if(ec) entityCodes.push(ec);
    });
  });
  var coveredCore = 0;
  CORE_DIM_KEYS.forEach(function(k){ if(dims[k] && dims[k].length>0) coveredCore++; });
  var coverage = CORE_DIM_KEYS.length>0 ? Math.round(coveredCore/CORE_DIM_KEYS.length*100) : 0;
  var verified = 0;
  entityCodes.forEach(function(c){ if(allStatus[c] && allStatus[c].status) verified++; });
  var auditPct = totalEntities>0 ? Math.round(verified/totalEntities*100) : 0;

  SI_AUDIT_CUR = {code:diseaseCode, entityCodes:entityCodes};

  /* 疾病头部卡片 */
  html += '<div class="si-audit-header">';
  html += '<h2>'+siEsc(info.name||'')+'</h2>';
  if(info.name_en) html += '<div style="font-size:13px;color:var(--muted);margin-top:2px">'+siEsc(info.name_en)+'</div>';
  html += '<div class="si-audit-meta">';
  if(info.icd_code) html += '<span>🏷️ ICD-10: <b>'+siEsc(info.icd_code)+'</b></span>';
  html += '<span>🔢 编码: '+siEsc(diseaseCode)+'</span>';
  html += '<span>📊 核心维度覆盖: <b>'+coveredCore+'/'+CORE_DIM_KEYS.length+' ('+coverage+'%)</b></span>';
  html += '<span>📦 实体总数: <b>'+totalEntities+'</b></span>';
  html += '</div>';
  html += '<div class="si-audit-progress">';
  html += '<span class="si-audit-progress-text" id="si-audit-progress-text">'+verified+'/'+totalEntities+' ('+auditPct+'%)</span>';
  html += '<div class="si-audit-progress-bar"><div class="si-audit-progress-fill" id="si-audit-progress-fill" style="width:'+auditPct+'%"></div></div>';
  html += '<span style="font-size:12px;color:var(--muted)">审核进度</span>';
  html += '</div>';
  html += '</div>';

  /* 9 分组 */
  SI_AUDIT_GROUPS.forEach(function(grp, gIdx){
    var entities = [];
    grp.dims.forEach(function(k){
      var list = dims[k] || [];
      list.forEach(function(e){ entities.push({entity:e, dim:k}); });
    });
    if(entities.length===0) return; /* 空分组不渲染 */
    /* 分组审核状态统计 */
    var gVerified = 0;
    entities.forEach(function(it){
      var ec = it.entity.code || it.entity.name || '';
      if(allStatus[ec] && allStatus[ec].status) gVerified++;
    });
    var badgeCls = 'unverified', badgeTxt = '未审核';
    if(gVerified===entities.length){ badgeCls='verified'; badgeTxt='已审核'; }
    else if(gVerified>0){ badgeCls='partial'; badgeTxt='部分'; }

    html += '<div class="si-audit-group open" id="si-audit-group-'+gIdx+'">';
    html += '<div class="si-audit-group-head" onclick="siAuditToggleGroup('+gIdx+')">';
    html += '<span class="si-audit-group-arrow">▶</span>';
    html += '<span class="si-audit-group-name">'+grp.icon+' '+siEsc(grp.name)+'</span>';
    html += '<span class="si-audit-group-count">'+entities.length+'</span>';
    html += '<span class="si-audit-group-badge '+badgeCls+'">'+badgeTxt+' '+gVerified+'/'+entities.length+'</span>';
    html += '</div>';
    html += '<div class="si-audit-group-body">';
    entities.forEach(function(it){
      html += siRenderAuditEntity(diseaseCode, it.entity, it.dim, allStatus);
    });
    html += '</div></div>';
  });

  /* 第10组：标准主数据 StandardDiagnosis */
  var stdList = dims.StandardDiagnosis || [];
  if(stdList.length>0){
    html += '<div class="si-audit-group open" id="si-audit-group-10">';
    html += '<div class="si-audit-group-head" onclick="siAuditToggleGroup(10)">';
    html += '<span class="si-audit-group-arrow">▶</span>';
    html += '<span class="si-audit-group-name">🏷️ 标准主数据（ICD-10 对比）</span>';
    html += '<span class="si-audit-group-count">'+stdList.length+'</span>';
    html += '</div>';
    html += '<div class="si-audit-group-body">';
    stdList.forEach(function(e){ html += siRenderAuditEntity(diseaseCode, e, 'StandardDiagnosis', allStatus); });
    html += '</div></div>';
  }

  /* 底部影响范围预览入口 */
  html += '<div class="si-audit-group" id="si-audit-group-impact">';
  html += '<div class="si-audit-group-head" onclick="siAuditToggleGroupImpact()">';
  html += '<span class="si-audit-group-arrow">▶</span>';
  html += '<span class="si-audit-group-name">📊 影响范围预览</span>';
  html += '</div>';
  html += '<div class="si-audit-group-body" id="si-audit-impact-body" style="display:none">';
  html += '<div style="font-size:12px;color:var(--muted);margin-bottom:8px">点击任意实体卡片中的「影响」按钮，可查看该实体关联的疾病与维度分布，辅助评估修改影响。</div>';
  html += '</div></div>';

function siRenderAuditEntity(diseaseCode, e, dimKey, allStatus){

  html += '<button class="si-audit-vbtn'+(st==='doubt'?' doubt':'')+'" data-status="doubt" onclick="siAuditMark(\''+siEscAttr(diseaseCode)+'\',\''+siEscAttr(ec)+'\',\'doubt\')">? 存疑</button>';

function siRenderDimNetwork(center, diseases, others){
  if(SI_DIM_CHART){ SI_DIM_CHART.dispose(); SI_DIM_CHART = null; }
  var container = document.getElementById('si-dim-network');
  if(!container) return;
  SI_DIM_CHART = echarts.init(container, null, {renderer:'canvas'});
  var categories = [{name:'当前实体'},{name:'关联疾病'},{name:'其他实体'}];
  var nodes = [];
  var links = [];
  var ct = TYPE_MAP[center.entityType] || {color:'#4f8cff'};
  var centerId = center.code || 'center';
  nodes.push({
    id:centerId, name:cleanName(center), symbolSize:50, category:0,
    itemStyle:{color:ct.color, shadowBlur:20, shadowColor:'rgba(0,0,0,0.4)'},
    label:{show:true, fontSize:13, fontWeight:'bold', color:'#fff'}
  });
  var diseaseIds = {};
  diseases.forEach(function(d){
    var did = d.code || ('d_'+d.name);
    if(diseaseIds[did]) return;
    diseaseIds[did] = true;
    nodes.push({id:did, name:d.name, symbolSize:30, category:1, itemStyle:{color:'#ff6b6b', opacity:0.85}, label:{show:true, fontSize:10, color:'#e8eaf0'}});
    links.push({source:centerId, target:did, lineStyle:{color:'#ff6b6b', width:2, opacity:0.5, curveness:0.1}});
  });
  var seen = {};
  var otherCnt = 0;
  others.forEach(function(o){
    if(otherCnt>=80) return;
    var oid = o.code || ('o_'+o.name);
    if(seen[oid]) return;
    seen[oid] = true; otherCnt++;
    var ot = TYPE_MAP[o.entityType] || {color:'#888'};
    nodes.push({id:oid, name:cleanName(o), symbolSize:16, category:2, itemStyle:{color:ot.color, opacity:0.7}, label:{show:true, fontSize:8, color:'#c0c8d8'}});
    links.push({source:centerId, target:oid, lineStyle:{color:'#555', width:1, opacity:0.4, curveness:0.12}});
  });
  SI_DIM_CHART.setOption({
    tooltip:{trigger:'item', backgroundColor:'#1a1d27', borderColor:'#2e3348', textStyle:{color:'#e8eaf0', fontSize:12},
      formatter:function(p){
        if(p.dataType==='edge') return siEsc(p.data.source)+' → '+siEsc(p.data.target);
        var ci = p.data.category;
        var cn = (categories[ci]||{}).name || '';
        return '<b>'+siEsc(p.name)+'</b><br><span style="color:#8b90a0">'+siEsc(cn)+'</span>';
      }},
    legend:{data:categories.map(function(c){return c.name}), textStyle:{color:'#8b90a0', fontSize:11}, top:0},
    animationDuration:800, animationEasingUpdate:'quinticInOut',
    series:[{
      type:'graph', layout:'force', data:nodes, links:links, categories:categories,
      roam:true, draggable:true,
      label:{show:true, position:'right', fontSize:9, color:'#e8eaf0'},
      lineStyle:{curveness:0.12, opacity:0.5},
      emphasis:{focus:'adjacency', lineStyle:{width:3}},
      force:{repulsion:200, gravity:0.08, edgeLength:[60,160], friction:0.6, layoutAnimation:true}
    }]
  }, true);
  SI_DIM_CHART.off('click');
  SI_DIM_CHART.on('click', function(params){
    if(params.dataType!=='node') return;
    if(params.data.category===1){
      /* 关联疾病节点 → 进入疾病审核 */
      siDimOpenDisease(params.data.id);
    } else if(params.data.category===0){
      siOpenEntityModal(center.code, 'list');
    }
  });
  setTimeout(function(){ if(SI_DIM_CHART) SI_DIM_CHART.resize(); }, 120);
}

function siNameMatch(graphName, stdName){
  if(!stdName) return 'missing';
  var g = String(graphName||'').toLowerCase().replace(/\s+/g,'');
  var s = String(stdName).toLowerCase().replace(/\s+/g,'');
  if(!s) return 'missing';
  if(g===s) return 'match';
  if(g && (g.indexOf(s)!==-1 || s.indexOf(g)!==-1)) return 'partial';
  /* 字符重叠度 */
  var gMap = {}; var common = 0;
  for(var i=0;i<g.length;i++){ gMap[g[i]] = (gMap[g[i]]||0)+1; }
  for(var j=0;j<s.length;j++){ if(gMap[s[j]]>0){ common++; gMap[s[j]]--; } }
  var maxLen = Math.max(g.length, s.length);
  if(maxLen>0 && common/maxLen>=0.6) return 'partial';
  return 'mismatch';
}
function siDictStat(label, cnt, cls){
  return '<div style="background:var(--bg3);border-radius:8px;padding:10px 16px;text-align:center">'+
    '<div class="si-dict-status '+cls+'" style="margin-bottom:4px">'+label+'</div>'+
    '<div style="font-size:20px;font-weight:800;color:var(--ink)">'+cnt+'</div></div>';
}
function renderDictView(diseaseData){
  var info = diseaseData.info || {};
  var dims = diseaseData.dimensions || {};
  var stdList = dims.StandardDiagnosis || [];
  var view = document.getElementById('si-dict-view');
  var html = '';
  /* 头部 */
  html += '<div class="si-dict-section"><h3>🏷️ 字典对比 — '+siEsc(info.name||'')+'</h3>';
  html += '<div style="padding:16px">';
  html += '<div style="font-size:13px;color:var(--muted);margin-bottom:12px">';
  html += '疾病编码: <b>'+siEsc(info.code||'')+'</b> | 图谱ICD-10: <b>'+siEsc(info.icd_code||'无')+'</b>';
  html += '</div>';
  if(stdList.length===0){
    html += '<div class="si-empty" style="padding:24px;text-align:center">该疾病暂无标准诊断（StandardDiagnosis）实体，无法进行字典对比</div>';
    html += '</div></div>';
    view.innerHTML = html;
    return;
  }
  /* 统计 */
  var matchCnt=0, partialCnt=0, mismatchCnt=0, missingCnt=0;
  stdList.forEach(function(s){
    var stdName = s.standard_name || s.name || cleanName(s);
    var st = siNameMatch(info.name, stdName);
    if(st==='match')matchCnt++; else if(st==='partial')partialCnt++; else if(st==='mismatch')mismatchCnt++; else missingCnt++;
  });
  html += '<div style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:8px">';
  html += siDictStat('完全匹配', matchCnt, 'match');
  html += siDictStat('部分匹配', partialCnt, 'partial');
  html += siDictStat('不匹配', mismatchCnt, 'mismatch');
  html += siDictStat('缺失', missingCnt, 'missing');
  html += '</div>';
  html += '</div></div>';
  /* 明细表 */
  html += '<div class="si-dict-section"><h3>对比明细（'+stdList.length+' 条标准诊断）</h3>';
  html += '<table class="si-dict-table"><thead><tr>';
  html += '<th>状态</th><th>图谱疾病名称</th><th>ICD-10 标准名称</th><th>标准编码</th><th>编码体系</th><th>映射类型</th>';
  html += '</tr></thead><tbody>';
  stdList.forEach(function(s){
    var stdName = s.standard_name || s.name || cleanName(s);
    var st = siNameMatch(info.name, stdName);
    var stMap = {match:'✓ 匹配', partial:'◐ 部分', mismatch:'✗ 不匹配', missing:'— 缺失'};
    var stdCode = s.standard_code || s.icd_code || '';
    var codingSys = s.coding_system || 'ICD-10';
    var mtMap = {'broader_fallback':'宽口径回退', 'exact':'精确映射', '语义等价':'语义等价'};
    var mt = s.mapping_type ? (mtMap[s.mapping_type] || s.mapping_type) : '—';
    html += '<tr>';
    html += '<td><span class="si-dict-status '+st+'">'+stMap[st]+'</span></td>';
    html += '<td>'+siEsc(info.name||'')+'</td>';
    html += '<td>'+siEsc(stdName)+'</td>';
    html += '<td>'+siEsc(stdCode)+'</td>';
    html += '<td>'+siEsc(codingSys)+'</td>';
    html += '<td>'+siEsc(mt)+'</td>';
    html += '</tr>';
  });
  html += '</tbody></table></div>';
  view.innerHTML = html;
}

/* ========== 5. 影响范围预览 ========== */
function siShowImpact(code){
  if(!code) return;
  /* 优先在审核卡片下方内联展示 */
  var card = siFindAuditCard(code);
  if(card){
    var exist = card.querySelector('.si-impact-panel');
    if(exist){
      exist.style.display = exist.style.display==='none' ? 'block' : 'none';
      return;
    }
    var panel = document.createElement('div');
    panel.className = 'si-impact-panel';
    panel.innerHTML = '<div style="text-align:center;padding:12px;color:var(--muted)">分析影响范围中...</div>';
    card.appendChild(panel);
    siRenderImpactPanel(code, panel);
    return;
  }
  /* 降级：渲染到审核底部影响范围容器 */
  var box = document.getElementById('si-audit-impact-body');
  if(box){
    box.style.display = 'block';
    var grp = document.getElementById('si-audit-group-impact');
    if(grp) grp.classList.add('open');
    siRenderImpactPanel(code, box);
    return;
  }
  siNotify('未找到影响范围展示容器','err');
}
function siRenderImpactPanel(code, container, data){
  var el = (typeof container==='string') ? document.getElementById(container) : container;
  if(!el) return;
  var render = function(d){
    var center = (d && d.center) || {};
    var neighbors = (d && d.neighbors) || [];
    var diseases = [];
    var dimCount = {};
    neighbors.forEach(function(n){
      if(n.entityType==='Disease'){ diseases.push(n); }
      else { dimCount[n.entityType] = (dimCount[n.entityType]||0)+1; }
    });
    var html = '<h4>⚠️ 影响范围预览</h4>';
    html += '<div class="si-impact-summary">';
    html += '实体 <b>'+siEsc(cleanName(center))+'</b> 关联 <b>'+neighbors.length+'</b> 个节点，其中疾病 <b>'+diseases.length+'</b> 个。';
    html += '</div>';
    if(diseases.length>0){
      html += '<div style="font-size:12px;font-weight:600;color:var(--ink);margin:8px 0 4px">受影响疾病：</div>';
      html += '<div class="si-impact-list">';
      diseases.forEach(function(dd){
        html += '<div class="si-impact-list-item">'+siEsc(dd.name||'')+' <span style="color:var(--accent);cursor:pointer" onclick="siDimOpenDisease(\''+siEscAttr(dd.code||'')+'\')">→ 审核</span></div>';
      });
      html += '</div>';
    }
    var dk = Object.keys(dimCount);
    if(dk.length>0){
      html += '<div style="font-size:12px;font-weight:600;color:var(--ink);margin:8px 0 4px">关联维度分布：</div>';
      html += '<div class="si-impact-list">';
      dk.forEach(function(k){
        var cn = DIM_NAMES[k] || (TYPE_MAP[k]?TYPE_MAP[k].cn:k);
        html += '<div class="si-impact-list-item">'+siEsc(cn)+': '+dimCount[k]+'</div>';
      });
      html += '</div>';
    }
    el.innerHTML = html;
  };
  if(data){ render(data); return; }
  fetch('/api/kg/subgraph?code='+encodeURIComponent(code)+'&limit=200').then(function(r){return r.json()}).then(function(d){
    if(d && d.error){ el.innerHTML = '<div class="si-empty">'+siEsc(d.error)+'</div>'; return; }
    render(d);
  }).catch(function(e){
    el.innerHTML = '<div class="si-empty">影响范围加载失败</div>';
  });
}
</script>
</body>
</html>
