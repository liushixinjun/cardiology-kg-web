<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>专科知识图谱 · 心血管内科 - 图谱实例检索</title>
<link rel="stylesheet" href="./_shared/css/style.css?v=20260729b">
<script src="./_shared/js/echarts.min.js"></script>
<style>
.si-layout{display:grid;grid-template-columns:280px 1fr;height:calc(100vh - 48px);overflow:hidden}
.si-left{background:var(--bg2);border-right:1px solid var(--rule);display:flex;flex-direction:column;overflow:hidden}
.si-main{overflow-y:auto;padding:20px;background:var(--bg)}
.si-search{padding:12px;border-bottom:1px solid var(--rule)}
.si-search input{width:100%;padding:9px 12px;background:var(--bg3);border:1px solid var(--rule);border-radius:8px;color:var(--ink);font-size:12px;outline:none}
.si-search input:focus{border-color:var(--accent)}
.si-left-section{padding:10px 12px;border-bottom:1px solid var(--rule)}
.si-left-title{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:8px}
.si-type-list{flex:1;overflow:auto;padding:4px 0}
.si-type-item{display:flex;align-items:center;justify-content:space-between;padding:6px 12px;cursor:pointer;font-size:12px;color:var(--ink);border-left:3px solid transparent;transition:all .15s}
.si-type-desc{display:none}
.si-type-item:hover{background:var(--bg3)}
.si-type-item.active{background:rgba(79,140,255,.1);border-left-color:var(--accent);color:var(--accent)}
.si-type-item .cnt{font-size:10px;background:var(--bg3);border-radius:999px;padding:1px 7px;color:var(--muted);font-weight:600}
.si-type-item.active .cnt{background:rgba(79,140,255,.15);color:var(--accent)}
.si-dim-list{padding:4px 0}
.si-dim-item{display:flex;align-items:center;gap:7px;padding:5px 14px;font-size:11px;color:var(--muted);cursor:pointer}
.si-dim-item:hover{color:var(--ink)}
.si-dim-item input{accent-color:var(--accent)}

.si-topbar{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.si-view-tabs{display:flex;background:var(--bg2);border:1px solid var(--rule);border-radius:8px;overflow:hidden}
.si-view-tab{padding:8px 16px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;transition:all .15s;border-bottom:2px solid transparent}
.si-view-tab:hover{color:var(--ink);background:var(--bg3)}
.si-view-tab.active{color:var(--accent);border-bottom-color:var(--accent);background:var(--bg3)}
.si-topbar input,.si-topbar select{padding:8px 12px;background:var(--bg2);border:1px solid var(--rule);border-radius:6px;color:var(--ink);font-size:12px;outline:none}
.si-topbar input:focus,.si-topbar select:focus{border-color:var(--accent)}


.si-entity-card{background:var(--bg2);border:1px solid var(--rule);border-radius:12px;padding:18px;margin-bottom:16px}
.si-entity-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px}
.si-entity-name{font-size:20px;font-weight:800;color:var(--ink)}
.si-entity-type-badge{font-size:11px;padding:3px 10px;border-radius:999px;font-weight:600}
.si-entity-type-badge.Disease{background:rgba(255,107,107,.12);color:#ff6b6b}
.si-entity-type-badge.Symptom{background:rgba(81,207,102,.12);color:#51cf66}
.si-entity-type-badge.Medication{background:rgba(255,159,64,.12);color:#ff9f40}
.si-entity-type-badge.ExamItem{background:rgba(79,140,255,.12);color:var(--accent)}
.si-entity-type-badge.LabItem{background:rgba(153,102,255,.12);color:#9966ff}
.si-entity-type-badge.DiagnosisCriteria{background:rgba(255,212,59,.15);color:#bcc02e}
.si-entity-type-badge.StandardDiagnosis{background:rgba(255,146,43,.12);color:#ff922b}
.si-entity-type-badge.SourceAdjudication{background:rgba(204,93,232,.12);color:#cc5de8}
.si-entity-type-badge.Contraindication{background:rgba(255,107,107,.12);color:#ff6b6b}
.si-entity-type-badge.ExamObservation{background:rgba(132,94,247,.12);color:#845ef7}
.si-entity-type-badge.LabSubitem{background:rgba(177,151,252,.12);color:#b197fc}
.si-entity-type-badge.Other{background:var(--bg3);color:var(--muted)}
.si-props-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:8px}
.si-prop-row{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--rule)}
.si-prop-label{font-size:11px;color:var(--muted);font-weight:600;min-width:70px}
.si-prop-value{font-size:13px;color:var(--ink);flex:1}
.si-prop-value.muted{color:var(--muted);font-style:italic}
.si-advanced-toggle{font-size:11px;color:var(--accent);cursor:pointer;padding:6px 0;user-select:none}
.si-advanced-toggle:hover{text-decoration:underline}
.si-advanced-section{display:none;margin-top:8px;padding-top:8px;border-top:1px dashed var(--rule)}
.si-advanced-section.open{display:block}

.si-dim-group{background:var(--bg2);border:1px solid var(--rule);border-radius:10px;margin-bottom:10px;overflow:hidden}
.si-dim-head{display:flex;align-items:center;gap:8px;padding:12px 16px;cursor:pointer;user-select:none}
.si-dim-head:hover{background:var(--bg3)}
.si-dim-arrow{font-size:9px;color:var(--muted);transition:transform .2s}
.si-dim-group.open .si-dim-arrow{transform:rotate(90deg)}
.si-dim-name{font-size:13px;font-weight:700;color:var(--ink);flex:1}
.si-dim-count{font-size:11px;background:var(--bg3);border-radius:999px;padding:2px 8px;color:var(--muted);font-weight:600}
.si-dim-add{font-size:16px;color:var(--accent);cursor:pointer;line-height:1}
.si-dim-body{display:none;padding:0 16px 12px}
.si-dim-group.open .si-dim-body{display:block}
.si-rel-item{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--rule);font-size:12px}
.si-rel-item:last-child{border-bottom:none}
.si-rel-name{font-weight:600;color:var(--ink);flex:1;cursor:pointer}
.si-rel-name:hover{color:var(--accent);text-decoration:underline}
.si-rel-type-tag{font-size:10px;padding:2px 7px;border-radius:4px;background:var(--bg3);color:var(--muted)}
.si-rel-actions{display:flex;gap:4px}
.si-rel-btn{font-size:10px;padding:3px 8px;border-radius:4px;cursor:pointer;border:1px solid var(--rule);background:var(--bg3);color:var(--ink);transition:all .15s}
.si-rel-btn:hover{border-color:var(--accent);color:var(--accent)}
.si-rel-btn.danger:hover{border-color:#ff6b6b;color:#ff6b6b}

.si-search-table-wrap{overflow-x:auto;border:1px solid var(--rule);border-radius:10px;background:var(--bg3)}
.si-search-table{width:100%;border-collapse:collapse;font-size:12px}
.si-search-table th{padding:10px 12px;text-align:left;color:var(--muted);background:var(--bg4);font-size:10px;text-transform:uppercase;letter-spacing:.04em;position:sticky;top:0}
.si-search-table td{padding:10px 12px;border-top:1px solid var(--rule);vertical-align:middle;color:var(--muted)}
.si-search-table tr:hover td{background:rgba(79,140,255,.04)}
.si-search-table .t-name{font-weight:700;color:var(--ink);cursor:pointer;white-space:nowrap}
.si-search-table .t-name:hover{color:var(--accent);text-decoration:underline}
.si-search-table .t-type{font-size:10px;padding:2px 7px;border-radius:4px;background:rgba(79,140,255,.1);color:var(--accent);white-space:nowrap}
.si-search-table .t-code{font-family:'SF Mono','Cascadia Code','Consolas',monospace;font-size:10px;color:var(--muted);white-space:nowrap}
.si-search-table .t-aliases{font-size:11px;color:var(--muted)}
.si-search-table .t-ops{display:flex;gap:4px;white-space:nowrap}
.si-pagination{display:flex;align-items:center;justify-content:space-between;margin-top:12px;font-size:12px;color:var(--muted)}
.si-pagination-btns{display:flex;gap:4px}
.si-page-btn{padding:4px 10px;border:1px solid var(--rule);border-radius:4px;background:var(--bg3);color:var(--muted);cursor:pointer;font-size:11px}
.si-page-btn:hover{border-color:var(--accent);color:var(--accent)}
.si-page-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.si-page-btn:disabled{opacity:.4;cursor:default}
.si-cascade{display:flex;gap:6px;align-items:center}
.si-cascade select{background:var(--bg3);border:1px solid var(--rule);border-radius:6px;padding:6px 10px;color:var(--ink);font-size:13px;outline:none;min-width:120px}
.si-cascade select:focus{border-color:var(--accent)}

.si-network-box{background:#1a1d27;border:1px solid var(--rule);border-radius:12px;overflow:hidden;position:relative}
#si-network{width:100%;height:calc(100vh - 140px);min-height:500px}
.si-network-legend{position:absolute;bottom:12px;left:12px;background:rgba(0,0,0,.75);border:1px solid var(--rule);border-radius:8px;padding:10px 14px;font-size:11px;color:#ccc;z-index:10;max-width:200px}
.si-network-legend .lg-title{font-weight:700;color:#fff;margin-bottom:4px;font-size:10px;text-transform:uppercase}
.si-network-legend .lg-row{display:flex;align-items:center;gap:5px;margin:2px 0}
.si-network-legend .lg-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.si-network-info{position:absolute;top:12px;right:12px;background:rgba(0,0,0,.75);border:1px solid var(--rule);border-radius:8px;padding:8px 14px;font-size:11px;color:#ccc;z-index:10}
.si-network-info b{color:#fff}

.si-modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1000;align-items:center;justify-content:center}
.si-modal-overlay.show{display:flex}
.si-modal{background:var(--bg2);border:1px solid var(--rule);border-radius:12px;padding:24px;max-width:600px;width:90%;max-height:85vh;overflow-y:auto}
.si-modal-title{font-size:18px;font-weight:800;color:var(--ink);margin-bottom:16px;display:flex;justify-content:space-between;align-items:center}
.si-modal-close{cursor:pointer;color:var(--muted);font-size:18px}
.si-modal-close:hover{color:var(--ink)}
.si-form-group{margin-bottom:14px}
.si-form-label{font-size:12px;font-weight:700;color:var(--ink);margin-bottom:4px;display:block}
.si-form-input{width:100%;padding:8px 12px;background:var(--bg3);border:1px solid var(--rule);border-radius:6px;color:var(--ink);font-size:13px;outline:none;box-sizing:border-box}
.si-form-input:focus{border-color:var(--accent)}
.si-form-input:read-only{color:var(--muted);cursor:not-allowed}
.si-form-hint{font-size:10px;color:var(--muted);margin-top:2px}
.si-modal-footer{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}
.si-btn{padding:8px 18px;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer;border:1px solid var(--rule);background:var(--bg3);color:var(--ink);transition:all .15s}
.si-btn:hover{border-color:var(--accent);color:var(--accent)}
.si-btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.si-btn.primary:hover{opacity:.9}
.si-btn.danger{background:rgba(255,107,107,.1);color:#ff6b6b;border-color:rgba(255,107,107,.3)}
.si-btn.danger:hover{background:rgba(255,107,107,.2)}

.si-impact-box{background:rgba(255,212,59,.08);border:1px solid rgba(255,212,59,.2);border-radius:8px;padding:12px;margin:12px 0;font-size:12px;color:#ffd43b;line-height:1.6}
.si-impact-box b{color:#ffe066}
.si-impact-list{margin:6px 0 0 12px;font-size:11px;color:var(--muted)}
.si-impact-list li{padding:2px 0}

.si-type-picker{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px;margin-bottom:14px}
.si-type-card{padding:12px;text-align:center;border:1px solid var(--rule);border-radius:8px;cursor:pointer;transition:all .15s;background:var(--bg3)}
.si-type-card:hover{border-color:var(--accent)}
.si-type-card.selected{border-color:var(--accent);background:rgba(79,140,255,.08)}
.si-type-card .icon{font-size:20px;margin-bottom:4px}
.si-type-card .label{font-size:11px;font-weight:600;color:var(--ink)}

.si-empty{text-align:center;color:var(--muted);padding:60px 20px;font-size:14px}
.si-loading{text-align:center;color:var(--muted);padding:40px;font-size:13px}
.si-notify{position:fixed;top:60px;right:20px;z-index:2000;padding:12px 20px;border-radius:8px;font-size:13px;font-weight:600;opacity:0;transform:translateY(-10px);transition:all .3s;pointer-events:none}
.si-notify.show{opacity:1;transform:translateY(0)}
.si-notify.ok{background:rgba(81,207,102,.15);color:#51cf66;border:1px solid rgba(81,207,102,.3)}
.si-notify.err{background:rgba(255,107,107,.15);color:#ff6b6b;border:1px solid rgba(255,107,107,.3)}
.si-xl-modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:1000;align-items:center;justify-content:center}
.si-xl-modal-overlay.show{display:flex}
.si-xl-modal{background:var(--bg2);border:1px solid var(--rule);border-radius:14px;width:94%;max-width:1400px;height:88vh;display:flex;flex-direction:column;overflow:hidden}
.si-xl-modal-header{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid var(--rule);flex-shrink:0}
.si-xl-modal-header-left{display:flex;align-items:center;gap:14px}
.si-xl-modal-title{font-size:16px;font-weight:800;color:var(--ink)}
.si-xl-modal-tabs{display:flex;background:var(--bg3);border:1px solid var(--rule);border-radius:8px;overflow:hidden}
.si-xl-tab{padding:6px 16px;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;transition:all .15s;border-bottom:2px solid transparent}
.si-xl-tab:hover{color:var(--ink);background:var(--bg4)}
.si-xl-tab.active{color:var(--accent);border-bottom-color:var(--accent);background:var(--bg4)}
.si-xl-modal-close{cursor:pointer;color:var(--muted);font-size:20px;padding:4px 8px;border-radius:6px;transition:all .15s}
.si-xl-modal-close:hover{color:var(--ink);background:var(--bg3)}
.si-xl-modal-btns{display:flex;gap:4px;align-items:center}
.si-xl-modal-btns span{cursor:pointer;color:var(--muted);font-size:16px;padding:4px 8px;border-radius:6px;transition:all .15s}
.si-xl-modal-btns span:hover{color:var(--ink);background:var(--bg3)}
.si-xl-modal.si-fullscreen{width:100%;max-width:none;height:100vh;border-radius:0}
.si-xl-modal-body{flex:1;overflow:hidden;position:relative}
.si-xl-modal-body>div{position:absolute;inset:0;overflow-y:auto;padding:16px 20px}
.si-xl-modal-body .si-xl-network-wrap{padding:0;overflow:hidden}
.si-xl-modal-body .si-xl-network-wrap #si-modal-network{width:100%;height:100%}
.si-xl-modal-legend{position:absolute;bottom:12px;left:12px;background:rgba(0,0,0,.8);border:1px solid var(--rule);border-radius:8px;padding:10px 14px;font-size:11px;color:#ccc;z-index:10;max-width:200px}
.si-xl-modal-legend .lg-title{font-weight:700;color:#fff;margin-bottom:4px;font-size:10px;text-transform:uppercase}
.si-xl-modal-legend .lg-row{display:flex;align-items:center;gap:5px;margin:2px 0}
.si-xl-modal-legend .lg-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.si-xl-modal-info{position:absolute;top:12px;right:12px;background:rgba(0,0,0,.8);border:1px solid var(--rule);border-radius:8px;padding:8px 14px;font-size:11px;color:#ccc;z-index:10}
.si-xl-modal-info b{color:#fff}
@media(max-width:768px){.si-layout{grid-template-columns:1fr;height:auto}.si-left{height:200px}.si-props-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="nav"></div>
<div class="si-layout">
  <!-- 左侧 -->
  <div class="si-left">
    <div class="si-search">
      <input type="text" id="si-search-input" placeholder="搜索实体名称/编码/别名..." oninput="siSearch()">
    </div>
    <div class="si-left-section">
      <div class="si-left-title">实体类别</div>
      <div class="si-type-list" id="si-type-list"></div>
    </div>
    <div class="si-left-section" id="si-dim-section" style="display:none">
      <div class="si-left-title">关联维度筛选</div>
      <div class="si-dim-list" id="si-dim-list"></div>
    </div>
  </div>

  <!-- 主区域 -->
  <div class="si-main" id="si-main">
    <div class="si-topbar">
      <div class="si-cascade">
        <select id="si-sel-specialty" onchange="siCascadeSpecialty()"><option value="">学科...</option></select>
        <select id="si-sel-category" onchange="siCascadeCategory()"><option value="">疾病大类...</option></select>
        <select id="si-sel-disease" onchange="siSelectDisease(this.value)"><option value="">选择疾病...</option></select>
      </div>
      <div class="si-search-bar" style="display:flex;gap:6px;align-items:center;margin-left:12px">
        <input type="text" id="si-filter-input" placeholder="输入名称/编码查询..." style="padding:7px 12px;background:var(--bg3);border:1px solid var(--rule);border-radius:6px;color:var(--ink);font-size:12px;outline:none;width:200px" onkeydown="if(event.key==='Enter')siFilterList()">
        <button class="si-btn" onclick="siFilterList()" style="padding:7px 14px;font-size:12px">查询</button>
      </div>
    </div>

    <div id="si-table-view"></div>
    <div id="si-network-view" style="display:none">
      <div class="si-network-box">
        <div id="si-network"></div>
        <div class="si-network-legend" id="si-legend"></div>
        <div class="si-network-info" id="si-net-info"></div>
      </div>
    </div>
    <div id="si-search-view" style="display:none"></div>
  </div>
</div>

<!-- 编辑Modal -->
<div class="si-modal-overlay" id="si-edit-modal">
  <div class="si-modal">
    <div class="si-modal-title">
      <span id="si-edit-title">编辑实体</span>
      <span class="si-modal-close" onclick="siCloseModal('si-edit-modal')">✕</span>
    </div>
    <div id="si-edit-body"></div>
    <div class="si-modal-footer">
      <button class="si-btn" onclick="siCloseModal('si-edit-modal')">取消</button>
      <button class="si-btn primary" onclick="siSaveEntity()">保存修改</button>
    </div>
  </div>
</div>

<!-- 新建/关联Modal -->
<div class="si-modal-overlay" id="si-add-modal">
  <div class="si-modal">
    <div class="si-modal-title">
      <span id="si-add-title">添加关联实体</span>
      <span class="si-modal-close" onclick="siCloseModal('si-add-modal')">✕</span>
    </div>
    <div id="si-add-body"></div>
    <div class="si-modal-footer" id="si-add-footer">
      <button class="si-btn" onclick="siCloseModal('si-add-modal')">取消</button>
    </div>
  </div>
</div>

<!-- 实体详情大弹窗（列表+网络图切换） -->
<div class="si-xl-modal-overlay" id="si-entity-modal">
  <div class="si-xl-modal">
    <div class="si-xl-modal-header">
      <div class="si-xl-modal-header-left">
        <span class="si-xl-modal-title" id="si-entity-modal-title">实体详情</span>
        <div class="si-xl-modal-tabs">
          <div class="si-xl-tab active" onclick="siXlSwitchTab('list')">📋 列表视图</div>
          <div class="si-xl-tab" onclick="siXlSwitchTab('network')">🕸️ 图谱网络视图</div>
        </div>
      </div>
      <div class="si-xl-modal-btns">
        <span id="si-xl-max-btn" onclick="siXlToggleFullscreen()" title="最大化">⬜</span>
        <span class="si-xl-modal-close" onclick="siCloseXlModal()" title="关闭">✕</span>
      </div>
    </div>
    <div class="si-xl-modal-body">
      <div id="si-xl-list-view"></div>
      <div id="si-xl-network-view" class="si-xl-network-wrap" style="display:none">
        <div id="si-modal-network"></div>
        <div class="si-xl-modal-legend" id="si-modal-legend"></div>
        <div class="si-xl-modal-info" id="si-modal-net-info"></div>
      </div>
    </div>
  </div>
</div>

<div class="si-notify" id="si-notify"></div>

<script src="./_shared/js/app.js?v=20260729"></script>
<script>
/* ========== 状态 ========== */
var SI_STATE = {
  view: 'table',
  currentCode: null,
  currentData: null,
  typeFilter: 'Disease',
  dimFilters: {},
  echartsChart: null,
  echartsNodes: {},
  echartsEdges: {},
  expandedNodes: new Set(),
  typeVisible: {},
  editCode: null,
  addContext: null,
};

var ENTITY_TYPES = [

function initDiseaseSelect(d){
  var diseases = d.diseases || {};
  var diseaseArr = Object.keys(diseases).map(function(k){return diseases[k].info || diseases[k]});
  SI_STATE.diseaseArr = diseaseArr;
  // V2.0：从统一疾病树构建层级分类
  fetch('/api/kg/disease-tree?v='+Date.now()).then(function(r){return r.json()}).then(function(tree){
    var hierarchy = {};
    var codeGroupMap = {};
    tree.forEach(function(cat){
      var groupName = cat.name;
      hierarchy[groupName] = [];
      (cat.children||[]).forEach(function(dis){
        codeGroupMap[dis.code] = groupName;
        var found = diseaseArr.find(function(d){return d.code===dis.code});
        if(found) hierarchy[groupName].push(found);
        (dis.children||[]).forEach(function(sub){
          codeGroupMap[sub.code] = groupName;
          var subFound = diseaseArr.find(function(d){return d.code===sub.code});
          if(subFound) hierarchy[groupName].push(subFound);
        });
      });
    });
    Object.keys(hierarchy).forEach(function(g){
      hierarchy[g].sort(function(a,b){return (a.name||'').localeCompare(b.name||'')});
    });
    SI_STATE.hierarchy = hierarchy;
    SI_STATE.codeGroupMap = codeGroupMap;
    var specSel = document.getElementById('si-sel-specialty');
    specSel.innerHTML = '<option value="心血管内科">心血管内科</option>';
    var catSel = document.getElementById('si-sel-category');
    var groups = Object.keys(hierarchy).sort(function(a,b){return hierarchy[b].length - hierarchy[a].length});
    var catHtml = '<option value="">疾病大类...</option>';
    groups.forEach(function(g){
      catHtml += '<option value="'+g+'">'+g+'（'+hierarchy[g].length+'）</option>';
    });
    catSel.innerHTML = catHtml;
    document.getElementById('si-sel-disease').innerHTML = '<option value="">选择疾病...</option>';
  }).catch(function(e){
    console.error('Load disease tree for schema failed', e);
    // 降级：扁平列表
    SI_STATE.hierarchy = {'全部': diseaseArr};
    SI_STATE.codeGroupMap = {};
    diseaseArr.forEach(function(dis){ SI_STATE.codeGroupMap[dis.code] = '全部'; });
  });
}

function siCascadeCategory(){
  var group = document.getElementById('si-sel-category').value;
  var disSel = document.getElementById('si-sel-disease');
  if(!group){
    disSel.innerHTML = '<option value="">选择疾病...</option>';
    // 清空分类时恢复默认疾病列表
    siLoadSearchResults('Disease');
    return;
  }
  var list = SI_STATE.hierarchy[group] || [];
  var html = '<option value="">选择疾病...（'+list.length+'种）</option>';
  list.forEach(function(dis){
    html += '<option value="'+dis.code+'">'+dis.name+'</option>';
  });
  disSel.innerHTML = html;
  // 选择分类后自动刷新列表（从本地数据过滤）
  siRenderCategoryList(group);
}

/* 按疾病大类从本地数据渲染列表 */
function siRenderCategoryList(group){
  var list = SI_STATE.hierarchy[group] || [];
  SI_SEARCH_STATE.type = 'Disease';
  SI_SEARCH_STATE.q = group;
  SI_SEARCH_STATE.total = list.length;
  SI_SEARCH_STATE.page = 1;
  SI_SEARCH_STATE.pageSize = list.length || 1;
  // 转为与API返回格式一致
  SI_SEARCH_STATE.items = list.map(function(d){
    return {code:d.code, name:d.name, name_en:d.name_en||'', entityType:'Disease', aliases:d.aliases||[], icd_code:d.icd_code||''};
  });
  SI_STATE.view = 'search';
  document.querySelectorAll('.si-view-tab').forEach(function(t){t.classList.remove('active')});
  renderSearchTable();
  document.getElementById('si-search-view').style.display = 'block';
  document.getElementById('si-table-view').style.display = 'none';
  document.getElementById('si-network-view').style.display = 'none';
}

function initTypeList(){
  fetch('/api/kg/type-stats').then(function(r){return r.json()}).then(function(data){
    var html = '<div class="si-type-item'+(SI_STATE.typeFilter===''?' active':'')+'" onclick="siSetTypeFilter(\'\')">全部实体<span class="cnt">—</span></div>';
    ENTITY_TYPES.forEach(function(t){
      var cnt = (data.entity_types||{})[t.code] || 0;
      if(cnt > 0){
        html += '<div class="si-type-item'+(SI_STATE.typeFilter===t.code?' active':'')+'" onclick="siSetTypeFilter(\''+t.code+'\')">'+t.cn+(t.desc?'<span class="si-type-desc">'+t.desc+'</span>':'')+'<span class="cnt">'+cnt+'</span></div>';
      }
    });
    document.getElementById('si-type-list').innerHTML = html;
  }).catch(function(){});
}

function siSetTypeFilter(type){
  SI_STATE.typeFilter = type;
  document.querySelectorAll('.si-type-item').forEach(function(el){
    el.classList.remove('active');
  });
  event.target.classList.add('active');
  if(type){
    siLoadSearchResults(type);
  } else if(SI_STATE.currentCode){
    siLoadEntity(SI_STATE.currentCode);
  }
}

/* ========== 搜索 ========== */
var siSearchTimer = null;
function siSearch(){
  clearTimeout(siSearchTimer);
  var q = document.getElementById('si-search-input').value.trim();
  siSearchTimer = setTimeout(function(){
    if(q.length < 1){
      if(SI_STATE.currentCode){
        siLoadEntity(SI_STATE.currentCode);
      }
      return;
    }
    siLoadSearchResults('', q);
  }, 300);
}

/* ========== 分页搜索状态 ========== */
var SI_SEARCH_STATE = {type:'', q:'', page:1, pageSize:20, total:0, items:[]};

function siLoadSearchResults(type, q, page){
  SI_SEARCH_STATE.type = type || '';
  SI_SEARCH_STATE.q = q || '';
  SI_SEARCH_STATE.page = page || 1;
  var offset = (SI_SEARCH_STATE.page - 1) * SI_SEARCH_STATE.pageSize;
  var url = '/api/kg/entities?limit='+SI_SEARCH_STATE.pageSize+'&offset='+offset;
  if(type) url += '&type='+encodeURIComponent(type);
  if(q) url += '&q='+encodeURIComponent(q);
  fetch(url).then(function(r){return r.json()}).then(function(data){
    SI_SEARCH_STATE.total = data.total;
    SI_SEARCH_STATE.items = data.items;
    SI_STATE.view = 'search';
    document.querySelectorAll('.si-view-tab').forEach(function(t){t.classList.remove('active')});
    renderSearchTable();
    document.getElementById('si-search-view').style.display = 'block';
    document.getElementById('si-table-view').style.display = 'none';
    document.getElementById('si-network-view').style.display = 'none';
  }).catch(function(e){
    siNotify('搜索失败: '+e.message,'err');
  });
}

function renderSearchTable(){
  var data = SI_SEARCH_STATE.items;
  var total = SI_SEARCH_STATE.total;
  var page = SI_SEARCH_STATE.page;
  var pageSize = SI_SEARCH_STATE.pageSize;
  var totalPages = Math.ceil(total / pageSize) || 1;
  var typeName = '';
  if(SI_SEARCH_STATE.type){
    var tm = TYPE_MAP[SI_SEARCH_STATE.type];
    typeName = tm ? tm.cn : SI_SEARCH_STATE.type;
  }
  var html = '<div style="margin-bottom:10px;font-size:13px;color:var(--muted)">';
  html += (typeName ? typeName+' · ' : '')+'共 '+total+' 条结果，第 '+page+'/'+totalPages+' 页</div>';
  if(data.length === 0){
    html += '<div class="si-empty">未找到匹配的实体</div>';
  } else {
    html += '<div class="si-search-table-wrap"><table class="si-search-table"><thead><tr>';
    // 疾病类型额外显示大类列（放在名称前面）
    var showGroup = (SI_SEARCH_STATE.type === 'Disease');
    if(showGroup) html += '<th>疾病大类</th>';
    html += '<th>名称</th>';
    html += '<th>类型</th><th>编码</th><th>别名</th><th>操作</th>';
    html += '</tr></thead><tbody>';
    data.forEach(function(e){
      var t = TYPE_MAP[e.entityType] || {cn:e.entityType,icon:'📌'};
      html += '<tr>';
      if(showGroup){
        var group = (SI_STATE.codeGroupMap || {})[e.code] || '-';
        html += '<td style="font-size:11px;color:var(--muted);white-space:nowrap">'+group+'</td>';
      }
      html += '<td><span class="t-name" onclick="siLoadEntity(\''+e.code+'\')">'+e.name+'</span>';
      if(e.name_en) html += '<br><span style="font-size:10px;color:var(--muted)">'+e.name_en+'</span>';
      html += '</td>';
      html += '<td><span class="t-type">'+t.cn+'</span></td>';
      html += '<td class="t-code">'+e.code+'</td>';
      html += '<td class="t-aliases">'+(e.aliases&&e.aliases.length?e.aliases.join(', '):'-')+'</td>';
      html += '<td class="t-ops">';
      html += '<span class="si-rel-btn" onclick="siOpenEntityModal(\''+e.code+'\',\'list\')">列表视图</span>';
      html += '<span class="si-rel-btn" onclick="siOpenEntityModal(\''+e.code+'\',\'network\')" style="margin-left:4px">图谱网络</span>';
      html += '<span class="si-rel-btn" onclick="event.stopPropagation();siOpenEdit(\''+e.code+'\')" style="margin-left:4px">编辑属性</span>';
      html += '</td>';
      html += '</tr>';
    });
    html += '</tbody></table></div>';
    // 分页控件
    if(totalPages > 1){
      html += '<div class="si-pagination">';
      html += '<span>显示 '+((page-1)*pageSize+1)+'-'+Math.min(page*pageSize,total)+' / '+total+'</span>';
      html += '<div class="si-pagination-btns">';
      html += '<button class="si-page-btn" onclick="siLoadSearchResults(\''+SI_SEARCH_STATE.type+'\',\''+SI_SEARCH_STATE.q+'\','+(page-1)+')"'+(page<=1?' disabled':'')+'>上一页</button>';
      var start = Math.max(1, page-3);
      var end = Math.min(totalPages, start+6);
      if(end-start<6) start = Math.max(1, end-6);
      for(var i=start;i<=end;i++){
        html += '<button class="si-page-btn'+(i===page?' active':'')+'" onclick="siLoadSearchResults(\''+SI_SEARCH_STATE.type+'\',\''+SI_SEARCH_STATE.q+'\','+i+')">'+i+'</button>';
      }
      html += '<button class="si-page-btn" onclick="siLoadSearchResults(\''+SI_SEARCH_STATE.type+'\',\''+SI_SEARCH_STATE.q+'\','+(page+1)+')"'+(page>=totalPages?' disabled':'')+'>下一页</button>';
      html += '</div></div>';
    }
  }
  document.getElementById('si-search-view').innerHTML = html;
}

  SI_STATE.currentCode = code;
  document.getElementById('si-sel-disease').value = code;
  document.getElementById('si-search-input').value = '';
  // 选择具体疾病后弹窗展示，保持列表上下文
  siOpenEntityModal(code, 'list');
}

function siLoadEntity(code){
  SI_STATE.currentCode = code;
  SI_STATE.view = 'table';
  document.querySelectorAll('.si-view-tab').forEach(function(t){t.classList.remove('active')});
  document.querySelector('.si-view-tab').classList.add('active');

  fetch('/api/kg/subgraph?code='+encodeURIComponent(code)+'&limit=100').then(function(r){return r.json()}).then(function(data){
    if(data.error){siNotify(data.error,'err');return;}
    SI_STATE.currentData = data;
    renderTableView(data);
    document.getElementById('si-table-view').style.display = 'block';
    document.getElementById('si-network-view').style.display = 'none';
    document.getElementById('si-search-view').style.display = 'none';
    // 更新疾病下拉（级联：先确保大类选中，再选疾病）
    var sel = document.getElementById('si-sel-disease');
    if(sel.value !== code){
      // 查找疾病所在大类
      var dInfo = SI_STATE.diseaseArr ? SI_STATE.diseaseArr.find(function(d){return d.code===code}) : null;
      if(dInfo && SI_STATE.codeGroupMap){
        var group = SI_STATE.codeGroupMap[code] || '其他';
        var catSel = document.getElementById('si-sel-category');
        if(catSel.value !== group){
          catSel.value = group;
          siCascadeCategory();
        }
      }
      // 确保option存在
      var found = false;
      for(var i=0;i<sel.options.length;i++){if(sel.options[i].value===code){found=true;break;}}
      if(!found){
        var opt = document.createElement('option');
        opt.value = code; opt.textContent = data.center.name;
        sel.appendChild(opt);
      }
      sel.value = code;
    }
  }).catch(function(e){
    siNotify('加载失败: '+e.message,'err');
  });
}

/* ========== 表格视图 ========== */
function renderTableView(data){
  var c = data.center;
  var t = TYPE_MAP[c.entityType] || {cn:c.entityType,icon:'📌'};
  var html = '<div class="si-entity-card">';
  html += '<div class="si-entity-head">';
  html += '<div><div class="si-entity-name">'+c.name+'</div>';
  if(c.name_en) html += '<div style="font-size:12px;color:var(--muted);margin-top:2px">'+c.name_en+'</div>';
  html += '</div>';
  html += '<div style="display:flex;gap:8px;align-items:center">';
  html += '<span class="si-entity-type-badge '+t.code+'">'+t.icon+' '+t.cn+'</span>';
  html += '<button class="si-btn primary" onclick="siOpenEdit(\''+c.code+'\')">编辑属性</button>';
  html += '</div></div>';

  // 基本属性
  html += '<div class="si-props-grid">';
  html += siPropRow('名称', c.name);
  if(c.name_en) html += siPropRow('英文名', c.name_en);
  if(c.icd_code) html += siPropRow('ICD-10', c.icd_code);
  if(c.description) html += siPropRow('描述', c.description);
  if(c.aliases && c.aliases.length) html += siPropRow('别名', c.aliases.join('、'));
  html += '</div>';

  // 高级信息
  html += '<div class="si-advanced-toggle" onclick="this.nextElementSibling.classList.toggle(\'open\')">▼ 高级信息</div>';
  html += '<div class="si-advanced-section">';
  html += siPropRow('编码', c.code);
  html += siPropRow('实体类别', c.entityType);
  if(c.parentCode) html += siPropRow('父级编码', c.parentCode);
  if(c.schema_version) html += siPropRow('Schema版本', c.schema_version);
  html += '</div>';
  html += '</div>'; // entity-card

  // 关联实体
  html += '<div style="margin-bottom:8px;font-size:14px;font-weight:700;color:var(--ink)">关联实体</div>';

  // 按维度分组
  var groups = {};
  var ungrouped = [];
  (data.neighbors||[]).forEach(function(n){
    var dim = REL_DIM_MAP[n.rel_type];
    if(dim){
      if(!groups[dim]) groups[dim] = [];
      groups[dim].push(n);
    } else {
      ungrouped.push(n);
    }
  });

  // 维度筛选
  var dims = Object.keys(groups);
  if(ungrouped.length > 0) dims.push('其他');
  var dimHtml = '';
  dims.forEach(function(dim){
    dimHtml += '<label class="si-dim-item"><input type="checkbox" checked onchange="siToggleDim(\''+dim+'\')">'+dim+' ('+(groups[dim]||ungrouped).length+')</label>';
  });
  document.getElementById('si-dim-list').innerHTML = dimHtml;
  document.getElementById('si-dim-section').style.display = dims.length > 0 ? 'block' : 'none';

  // 初始化筛选状态
  if(Object.keys(SI_STATE.dimFilters).length === 0){
    dims.forEach(function(d){SI_STATE.dimFilters[d] = true});
  }

  // 渲染分组
  Object.keys(groups).forEach(function(dim){
    if(!SI_STATE.dimFilters[dim]) return;
    html += renderDimGroup(dim, groups[dim], c.code);
  });
  if(ungrouped.length > 0 && SI_STATE.dimFilters['其他']){
    html += renderDimGroup('其他', ungrouped, c.code);
  }

  document.getElementById('si-table-view').innerHTML = html;
}

function siPropRow(label, value){
  if(!value) return '';
  return '<div class="si-prop-row"><span class="si-prop-label">'+label+'</span><span class="si-prop-value">'+value+'</span></div>';
}

function renderDimGroup(dimName, items, centerCode){
  var html = '<div class="si-dim-group open">';
  html += '<div class="si-dim-head" onclick="this.parentElement.classList.toggle(\'open\')">';
  html += '<span class="si-dim-arrow">▶</span>';
  html += '<span class="si-dim-name">'+dimName+'</span>';
  html += '<span class="si-dim-count">'+items.length+'</span>';
  // 找到对应的关系类型
  var relType = items[0].rel_type;
  html += '<span class="si-dim-add" onclick="event.stopPropagation();siOpenAdd(\''+centerCode+'\',\''+relType+'\',\''+dimName+'\')">+</span>';
  html += '</div>';
  html += '<div class="si-dim-body">';
  items.forEach(function(n){
    var t = TYPE_MAP[n.entityType] || {cn:n.entityType,icon:'📌'};
    html += '<div class="si-rel-item">';
    html += '<span class="si-rel-name" onclick="siLoadEntity(\''+n.code+'\')">'+n.name+'</span>';
    html += '<span class="si-rel-type-tag">'+t.cn+'</span>';
    html += '<div class="si-rel-actions">';
    html += '<span class="si-rel-btn" onclick="siOpenEdit(\''+n.code+'\')">详情</span>';
    // 断开关系
    var fromCode = n.rel_dir === 'out' ? centerCode : n.code;
    var toCode = n.rel_dir === 'out' ? n.code : centerCode;
    html += '<span class="si-rel-btn danger" onclick="siRemoveRel(\''+fromCode+'\',\''+toCode+'\',\''+n.rel_type+'\')">断开</span>';
    html += '</div>';
    html += '</div>';
  });
  html += '</div></div>';
  return html;
}

function siToggleDim(dim){
  SI_STATE.dimFilters[dim] = !SI_STATE.dimFilters[dim];
  if(SI_STATE.currentData) renderTableView(SI_STATE.currentData);
}

/* ========== 网络图视图 (ECharts) ========== */
function siSwitchView(view){
  SI_STATE.view = view;
  document.querySelectorAll('.si-view-tab').forEach(function(t){t.classList.remove('active')});
  document.querySelectorAll('.si-view-tab')[view==='table'?0:1].classList.add('active');

  if(view === 'table'){
    document.getElementById('si-table-view').style.display = 'block';
    document.getElementById('si-network-view').style.display = 'none';
    document.getElementById('si-search-view').style.display = 'none';
  } else {
    document.getElementById('si-table-view').style.display = 'none';
    document.getElementById('si-network-view').style.display = 'block';
    document.getElementById('si-search-view').style.display = 'none';
    if(SI_STATE.currentCode){
      siInitNetwork(SI_STATE.currentCode);
    }
  }
}

function siInitNetwork(code){
  // 销毁旧实例
  if(SI_STATE.echartsChart){
    SI_STATE.echartsChart.dispose();
    SI_STATE.echartsChart = null;
  }
  SI_STATE.expandedNodes = new Set();
  SI_STATE.echartsNodes = {};
  SI_STATE.echartsEdges = {};

  var container = document.getElementById('si-network');
  SI_STATE.echartsChart = echarts.init(container, null, {renderer:'canvas'});

  // 事件绑定
  SI_STATE.echartsChart.off('click');
  SI_STATE.echartsChart.off('dblclick');

  SI_STATE.echartsChart.on('click', function(params){
    if(params.dataType !== 'node') return;
    var nd = SI_STATE.echartsNodes[params.data.id];
    if(!nd) return;
    // 单击：展开下一层关联
    siExpandNode(nd.code, nd.code === code);
  });

  SI_STATE.echartsChart.on('dblclick', function(params){
    if(params.dataType !== 'node') return;
    var nd = SI_STATE.echartsNodes[params.data.id];
    if(!nd) return;
    // 双击：跳转到详情页
    siLoadEntity(nd.code);
  });

  // 加载中心节点
  siExpandNode(code, true);

  // 窗口resize
  window.addEventListener('resize', function(){
    if(SI_STATE.echartsChart) SI_STATE.echartsChart.resize();
  });
}

function siExpandNode(code, isCenter){
  if(SI_STATE.expandedNodes.has(code)) return;
  SI_STATE.expandedNodes.add(code);

  fetch('/api/kg/subgraph?code='+encodeURIComponent(code)+'&limit=50').then(function(r){return r.json()}).then(function(data){
    if(data.error) return;
    var c = data.center;
    var t = TYPE_MAP[c.entityType] || {color:'#888'};

    // 添加中心节点
    if(!SI_STATE.echartsNodes[c.code]){
      var node = {
        id: c.code,
        name: c.name,
        symbolSize: isCenter ? 60 : 34,
        category: c.entityType,
        itemType: c.entityType,
        code: c.code,
        itemStyle: {
          color: t.color,
          shadowBlur: isCenter ? 20 : 0,
          shadowColor: 'rgba(0,0,0,0.3)'
        },
        label: {show: true, fontSize: isCenter ? 14 : 11, fontWeight: isCenter ? 'bold' : 'normal', color: '#e8eaf0'}
      };
      SI_STATE.echartsNodes[c.code] = node;
    }

    // 添加邻居节点和边
    (data.neighbors||[]).forEach(function(n){
      var nt = TYPE_MAP[n.entityType] || {color:'#888'};
      if(!SI_STATE.echartsNodes[n.code]){
        SI_STATE.echartsNodes[n.code] = {
          id: n.code,
          name: n.name,
          symbolSize: 22,
          category: n.entityType,
          itemType: n.entityType,
          code: n.code,
          itemStyle: {color: nt.color, opacity: 0.85},
          label: {show: true, fontSize: 9, color: '#c0c8d8'}
        };
      }
      // 添加边
      var edgeId = n.rel_dir === 'out' ? code+'-'+n.rel_type+'-'+n.code : n.code+'-'+n.rel_type+'-'+code;
      if(!SI_STATE.echartsEdges[edgeId]){
        var relLabel = REL_DIM_MAP[n.rel_type] || n.rel_type;
        var relColor = '#555';
        // 尝试从关系映射获取颜色
        var dimKey = null;
        for(var k in REL_DIM_MAP){ if(REL_DIM_MAP[k] === relLabel){dimKey = k; break;} }
        SI_STATE.echartsEdges[edgeId] = {
          source: n.rel_dir === 'out' ? code : n.code,
          target: n.rel_dir === 'out' ? n.code : code,
          value: relLabel,
          lineStyle: {
            color: relColor,
            width: 1.5,
            curveness: 0.15,
            opacity: 0.6
          }
        };
      }
    });

    // 渲染图表
    siRenderEChartsGraph();
  }).catch(function(){});
}

function siRenderEChartsGraph(){
  if(!SI_STATE.echartsChart) return;

  var nodes = [];
  var categories = [];
  var catSet = {};

  // 构建categories
  ENTITY_TYPES.forEach(function(t){
    catSet[t.code] = categories.length;
    categories.push({name: t.cn});
  });

  // 转换节点（根据typeVisible过滤）
  Object.keys(SI_STATE.echartsNodes).forEach(function(id){
    var n = SI_STATE.echartsNodes[id];
    n.category = catSet[n.itemType] !== undefined ? catSet[n.itemType] : 0;
    // 判断该节点类型是否可见
    var visible = SI_STATE.typeVisible[n.itemType] !== false;
    // 中心节点始终可见
    if(n.code === SI_STATE.currentCode) visible = true;
    if(!visible){
      n.itemStyle = n.itemStyle || {};
      n.itemStyle.opacity = 0.08;
      n.label = n.label || {};
      n.label.show = false;
    } else {
      // 恢复原始样式
      var t = TYPE_MAP[n.itemType] || {color:'#888'};
      var isCenter = n.code === SI_STATE.currentCode;
      n.itemStyle = {
        color: t.color,
        opacity: isCenter ? 1.0 : 0.85,
        shadowBlur: isCenter ? 20 : 0,
        shadowColor: 'rgba(0,0,0,0.3)'
      };
      n.label = {show: true, fontSize: isCenter ? 14 : (n.symbolSize > 30 ? 11 : 9), fontWeight: isCenter ? 'bold' : 'normal', color: isCenter ? '#fff' : '#c0c8d8'};
    }
    nodes.push(n);
  });

  // 转换边（两端节点都可见才显示边）
  var links = [];
  Object.keys(SI_STATE.echartsEdges).forEach(function(id){
    var e = SI_STATE.echartsEdges[id];
    var srcNode = SI_STATE.echartsNodes[e.source];
    var tgtNode = SI_STATE.echartsNodes[e.target];
    if(!srcNode || !tgtNode) return;
    var srcVisible = SI_STATE.typeVisible[srcNode.itemType] !== false || srcNode.code === SI_STATE.currentCode;
    var tgtVisible = SI_STATE.typeVisible[tgtNode.itemType] !== false || tgtNode.code === SI_STATE.currentCode;
    if(srcVisible && tgtVisible){
      links.push(e);
    }
  });

  var nodeCount = nodes.length;
  var edgeCount = links.length;

  SI_STATE.echartsChart.setOption({
    tooltip: {
      trigger: 'item',
      backgroundColor: '#1a1d27',
      borderColor: '#2e3348',
      textStyle: {color: '#e8eaf0', fontSize: 12},
      formatter: function(p){
        if(p.dataType === 'edge'){
          return p.data.source + ' → ' + p.data.target + '<br><span style="color:#8b90a0">' + (p.data.value || '') + '</span>';
        }
        var nd = SI_STATE.echartsNodes[p.data.id];
        if(!nd) return p.name;
        var t = TYPE_MAP[nd.itemType] || {cn:nd.itemType};
        return '<b>' + p.name + '</b><br><span style="color:#8b90a0">' + t.cn + '</span>';
      }
    },
    animationDuration: 800,
    animationEasingUpdate: 'quinticInOut',
    series: [{
      type: 'graph',
      layout: 'force',
      data: nodes,
      links: links,
      categories: categories,
      roam: true,
      draggable: true,
      label: {
        show: true,
        position: 'right',
        fontSize: 10,
        color: '#e8eaf0'
      },
      lineStyle: {
        curveness: 0.12,
        opacity: 0.6
      },
      emphasis: {
        focus: 'adjacency',
        lineStyle: {width: 4}
      },
      force: {
        repulsion: 300,
        gravity: 0.06,
        edgeLength: [80, 200],
        friction: 0.6,
        layoutAnimation: true
      }
    }]
  }, true);

  // 更新统计信息
  var infoEl = document.getElementById('si-net-info');
  if(infoEl) infoEl.innerHTML = '节点: <b>'+nodeCount+'</b> | 关联: <b>'+edgeCount+'</b>';

  // 延迟resize确保容器尺寸正确
  setTimeout(function(){
    if(SI_STATE.echartsChart) SI_STATE.echartsChart.resize();
  }, 100);
}

function renderLegend(){
  var html = '<div class="lg-title">实体类别（点击切换）</div>';
  var mainTypes = ['Disease','Symptom','Medication','ExamItem','LabItem','DiagnosisCriteria','Procedure','RiskFactor'];
  mainTypes.forEach(function(code){
    var t = TYPE_MAP[code];
    if(t){
      var visible = SI_STATE.typeVisible[code] !== false;
      var opacity = visible ? '1' : '0.3';
      var textDecoration = visible ? 'none' : 'line-through';
      html += '<div class="lg-row" style="cursor:pointer;opacity:'+opacity+'" onclick="siToggleTypeVisible(\''+code+'\')">';
      html += '<span class="lg-dot" style="background:'+t.color+'"></span>';
      html += '<span style="text-decoration:'+textDecoration+'">'+t.cn+'</span>';
      html += '</div>';
    }
  });
  html += '<div class="lg-title" style="margin-top:6px">操作</div>';
  html += '<div style="font-size:10px;color:#999">单击: 展开关联<br>双击: 查看详情</div>';
  document.getElementById('si-legend').innerHTML = html;
}

function siToggleTypeVisible(typeCode){
  SI_STATE.typeVisible[typeCode] = SI_STATE.typeVisible[typeCode] === false ? true : false;
  renderLegend();
  siRenderEChartsGraph();
}

/* ========== 编辑Modal ========== */
function siOpenEdit(code){
  SI_STATE.editCode = code;
  fetch('/api/kg/subgraph?code='+encodeURIComponent(code)+'&limit=50').then(function(r){return r.json()}).then(function(data){
    if(data.error){siNotify(data.error,'err');return;}
    var c = data.center;
    var t = TYPE_MAP[c.entityType] || {cn:c.entityType};
    document.getElementById('si-edit-title').textContent = '编辑：'+c.name;

    var html = '<div style="font-size:11px;color:var(--muted);margin-bottom:12px">实体类别: '+t.cn+' | 编码: '+c.code+'</div>';
    html += '<div class="si-form-group"><label class="si-form-label">名称</label><input class="si-form-input" id="ed-name" value="'+(c.name||'')+'"></div>';
    if(c.name_en !== undefined) html += '<div class="si-form-group"><label class="si-form-label">英文名</label><input class="si-form-input" id="ed-name_en" value="'+(c.name_en||'')+'"></div>';
    if(c.icd_code !== undefined) html += '<div class="si-form-group"><label class="si-form-label">ICD-10编码</label><input class="si-form-input" id="ed-icd_code" value="'+(c.icd_code||'')+'"></div>';
    html += '<div class="si-form-group"><label class="si-form-label">别名（逗号分隔）</label><input class="si-form-input" id="ed-aliases" value="'+((c.aliases||[]).join(', '))+'"><div class="si-form-hint">多个别名用英文逗号分隔</div></div>';
    html += '<div class="si-form-group"><label class="si-form-label">描述</label><textarea class="si-form-input" id="ed-description" rows="3" style="resize:vertical">'+(c.description||'')+'</textarea></div>';

    // 影响提示
    var diseaseCount = (data.neighbors||[]).length;
    if(diseaseCount > 0){
      html += '<div class="si-impact-box">';
      html += '<b>⚠️ 修改影响提示</b><br>';
      html += '此实体关联 '+diseaseCount+' 个节点，修改后所有关联中的此实体名称将同步更新。';
      html += '</div>';
    }

    document.getElementById('si-edit-body').innerHTML = html;
    document.getElementById('si-edit-modal').classList.add('show');
  }).catch(function(e){
    siNotify('加载失败: '+e.message,'err');
  });
}

function siSaveEntity(){
  if(!SI_STATE.editCode) return;
  var fields = {};
  var nameEl = document.getElementById('ed-name');
  if(nameEl) fields.name = nameEl.value.trim();
  var enEl = document.getElementById('ed-name_en');
  if(enEl && enEl.value.trim()) fields.name_en = enEl.value.trim();
  var icdEl = document.getElementById('ed-icd_code');
  if(icdEl && icdEl.value.trim()) fields.icd_code = icdEl.value.trim();
  var aliasEl = document.getElementById('ed-aliases');
  if(aliasEl){
    var aliases = aliasEl.value.split(',').map(function(a){return a.trim()}).filter(function(a){return a});
    fields.aliases = aliases;
  }
  var descEl = document.getElementById('ed-description');
  if(descEl) fields.description = descEl.value.trim();

  // 校验
  if(!fields.name){siNotify('名称不能为空','err');return;}

  fetch('/api/kg/entity/update',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({code:SI_STATE.editCode, fields:fields, operator:'web'})
  }).then(function(r){return r.json()}).then(function(data){
    if(data.error){siNotify(data.error,'err');return;}
    siNotify('修改成功','ok');
    siCloseModal('si-edit-modal');
    siLoadEntity(SI_STATE.currentCode);
  }).catch(function(e){
    siNotify('保存失败: '+e.message,'err');
  });
}

/* ========== 添加关联Modal ========== */
function siOpenAdd(fromCode, relType, dimName){
  SI_STATE.addContext = {fromCode:fromCode, relType:relType, dimName:dimName};
  document.getElementById('si-add-title').textContent = '添加'+dimName;

  var html = '<div style="display:flex;gap:8px;margin-bottom:14px">';
  html += '<button class="si-btn primary" onclick="siAddMode(\'search\')" id="si-tab-search">搜索已有</button>';
  html += '<button class="si-btn" onclick="siAddMode(\'create\')" id="si-tab-create">新建实体</button>';
  html += '</div>';
  html += '<div id="si-add-search">';
  html += '<div class="si-form-group"><label class="si-form-label">搜索名称</label>';
  html += '<input class="si-form-input" id="si-add-q" placeholder="输入名称搜索..." oninput="siSearchExisting()" style="margin-bottom:8px"></div>';
  html += '<div id="si-add-results" style="max-height:300px;overflow-y:auto"></div>';
  html += '</div>';
  html += '<div id="si-add-create" style="display:none">';
  html += '<div class="si-form-group"><label class="si-form-label">实体类别</label>';
  html += '<div class="si-type-picker" id="si-type-picker"></div></div>';
  html += '<div class="si-form-group"><label class="si-form-label">名称</label>';
  html += '<input class="si-form-input" id="si-new-name" placeholder="输入新实体名称"></div>';
  html += '<div class="si-form-group"><label class="si-form-label">英文名（可选）</label>';
  html += '<input class="si-form-input" id="si-new-en" placeholder="英文名称"></div>';
  html += '</div>';

  document.getElementById('si-add-body').innerHTML = html;
  document.getElementById('si-add-footer').innerHTML = '<button class="si-btn" onclick="siCloseModal(\'si-add-modal\')">取消</button>';

  // 渲染类型选择器
  var tpHtml = '';
  ENTITY_TYPES.forEach(function(t){
    tpHtml += '<div class="si-type-card" onclick="siPickType(\''+t.code+'\')" data-type="'+t.code+'"><div class="icon">'+t.icon+'</div><div class="label">'+t.cn+'</div></div>';
  });
  document.getElementById('si-type-picker').innerHTML = tpHtml;

  document.getElementById('si-add-modal').classList.add('show');
  siAddMode('search');
}

var siAddModeVal = 'search';
function siAddMode(mode){
  siAddModeVal = mode;
  document.getElementById('si-tab-search').className = mode==='search'?'si-btn primary':'si-btn';
  document.getElementById('si-tab-create').className = mode==='create'?'si-btn primary':'si-btn';
  document.getElementById('si-add-search').style.display = mode==='search'?'block':'none';
  document.getElementById('si-add-create').style.display = mode==='create'?'block':'none';

  if(mode === 'create'){
    document.getElementById('si-add-footer').innerHTML = '<button class="si-btn" onclick="siCloseModal(\'si-add-modal\')">取消</button><button class="si-btn primary" onclick="siCreateEntity()">创建并关联</button>';
  } else {
    document.getElementById('si-add-footer').innerHTML = '<button class="si-btn" onclick="siCloseModal(\'si-add-modal\')">取消</button>';
  }
}

var siSearchExistingTimer = null;
function siSearchExisting(){
  clearTimeout(siSearchExistingTimer);
  var q = document.getElementById('si-add-q').value.trim();
  siSearchExistingTimer = setTimeout(function(){
    if(q.length < 1){document.getElementById('si-add-results').innerHTML='';return;}
    var relType = SI_STATE.addContext ? SI_STATE.addContext.relType : '';
    var entityType = REL_ENTITY_MAP[relType] || '';
    var url = '/api/kg/entities?q='+encodeURIComponent(q)+'&limit=20';
    if(entityType) url += '&type='+encodeURIComponent(entityType);
    fetch(url).then(function(r){return r.json()}).then(function(data){
      var items = data.items || data;
      var html = '';
      if(items.length === 0){
        html = '<div style="text-align:center;color:var(--muted);padding:20px;font-size:12px">未找到匹配实体</div>';
      } else {
        items.forEach(function(e){
          var t = TYPE_MAP[e.entityType] || {cn:e.entityType,icon:'📌'};
          html += '<div onclick="siLinkExisting(\''+e.code+'\',\''+e.name+'\')" style="display:flex;align-items:center;gap:10px;padding:8px 12px;cursor:pointer;border-bottom:1px solid var(--rule);font-size:12px;transition:background .15s" onmouseover="this.style.background=\'rgba(79,140,255,.06)\'" onmouseout="this.style.background=\'\'">';
          html += '<span style="font-weight:700;color:var(--ink);flex:1">'+e.name+'</span>';
          html += '<span style="font-size:10px;padding:2px 6px;border-radius:4px;background:var(--bg4);color:var(--muted)">'+t.cn+'</span>';
          html += '<span style="font-size:10px;color:var(--muted);font-family:monospace">'+e.code+'</span>';
          html += '</div>';
        });
      }
      document.getElementById('si-add-results').innerHTML = html;
    }).catch(function(){});
  }, 300);
}

function siLinkExisting(toCode, toName){
  var ctx = SI_STATE.addContext;
  if(!ctx) return;
  if(!confirm('确认关联「'+toName+'」到当前实体？')) return;
  fetch('/api/kg/relation/add',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({from_code:ctx.fromCode, to_code:toCode, rel_type:ctx.relType, operator:'web'})
  }).then(function(r){return r.json()}).then(function(data){
    if(data.error){siNotify(data.error,'err');return;}
    siNotify('关联成功','ok');
    siCloseModal('si-add-modal');
    siLoadEntity(SI_STATE.currentCode);
  }).catch(function(e){
    siNotify('关联失败: '+e.message,'err');
  });
}

var siPickedType = null;
function siPickType(code){
  siPickedType = code;
  document.querySelectorAll('.si-type-card').forEach(function(c){c.classList.remove('selected')});
  event.target.closest('.si-type-card').classList.add('selected');
}

function siCreateEntity(){
  var ctx = SI_STATE.addContext;
  if(!ctx) return;
  var name = document.getElementById('si-new-name').value.trim();
  if(!name){siNotify('请输入名称','err');return;}
  if(!siPickedType){siNotify('请选择实体类别','err');return;}
  var enName = (document.getElementById('si-new-en').value||'').trim();

  fetch('/api/kg/entity/create',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({
      name:name, entityType:siPickedType,
      from_code:ctx.fromCode, rel_type:ctx.relType,
      operator:'web',
      extra_fields: enName ? {name_en:enName} : {}
    })
  }).then(function(r){return r.json()}).then(function(data){
    if(data.error){siNotify(data.error,'err');return;}
    siNotify('创建并关联成功','ok');
    siCloseModal('si-add-modal');
    siLoadEntity(SI_STATE.currentCode);
  }).catch(function(e){
    siNotify('创建失败: '+e.message,'err');
  });
}

/* ========== 断开关系 ========== */
function siRemoveRel(fromCode, toCode, relType){
  if(!confirm('确认断开此关联？实体本身不会被删除。')) return;
  fetch('/api/kg/relation/remove',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({from_code:fromCode, to_code:toCode, rel_type:relType, operator:'web'})
  }).then(function(r){return r.json()}).then(function(data){
    if(data.error){siNotify(data.error,'err');return;}
    siNotify('已断开关联','ok');
    siLoadEntity(SI_STATE.currentCode);
  }).catch(function(e){
    siNotify('操作失败: '+e.message,'err');
  });
}

/* ========== 通用 ========== */
function siCloseModal(id){
  document.getElementById(id).classList.remove('show');
}

function siNotify(msg, type){
  var el = document.getElementById('si-notify');
  el.textContent = msg;
  el.className = 'si-notify show '+type;
  setTimeout(function(){el.classList.remove('show')}, 3000);
}

/* ========== 实体详情大弹窗 ========== */
var SI_MODAL_STATE = {code:null, tab:'list', echartsChart:null, echartsNodes:{}, echartsEdges:{}};

function siOpenEntityModal(code, tab){
  SI_MODAL_STATE.code = code;
  SI_MODAL_STATE.tab = tab || 'list';
  // 更新tab高亮
  document.querySelectorAll('.si-xl-tab').forEach(function(t){t.classList.remove('active')});
  document.querySelectorAll('.si-xl-tab')[tab==='list'?0:1].classList.add('active');
  // 加载数据
  fetch('/api/kg/subgraph?code='+encodeURIComponent(code)+'&limit=100').then(function(r){return r.json()}).then(function(data){
    if(data.error){siNotify(data.error,'err');return;}
    var c = data.center;
    var t = TYPE_MAP[c.entityType] || {cn:c.entityType,icon:'📌'};
    document.getElementById('si-entity-modal-title').textContent = c.name+' · '+t.cn;
    // 渲染列表视图
    siRenderModalListView(data);
    // 显示弹窗
    document.getElementById('si-entity-modal').classList.add('show');
    // 根据tab显示对应内容
    siXlSwitchTab(tab);
  }).catch(function(e){
    siNotify('加载失败: '+e.message,'err');
  });
}

function siXlSwitchTab(tab){
  SI_MODAL_STATE.tab = tab;
  document.querySelectorAll('.si-xl-tab').forEach(function(t){t.classList.remove('active')});
  document.querySelectorAll('.si-xl-tab')[tab==='list'?0:1].classList.add('active');
  document.getElementById('si-xl-list-view').style.display = tab==='list'?'block':'none';
  document.getElementById('si-xl-network-view').style.display = tab==='network'?'block':'none';
  if(tab === 'network'){
    siInitModalNetwork(SI_MODAL_STATE.code);
  }
}

function siCloseXlModal(){
  document.getElementById('si-entity-modal').classList.remove('show');
  document.querySelector('.si-xl-modal').classList.remove('si-fullscreen');
  var maxBtn = document.getElementById('si-xl-max-btn');
  if(maxBtn){maxBtn.textContent='⬜'; maxBtn.title='最大化';}
  if(SI_MODAL_STATE.echartsChart){
    SI_MODAL_STATE.echartsChart.dispose();
    SI_MODAL_STATE.echartsChart = null;
  }
}

function siXlToggleFullscreen(){
  var modal = document.querySelector('.si-xl-modal');
  var btn = document.getElementById('si-xl-max-btn');
  modal.classList.toggle('si-fullscreen');
  if(modal.classList.contains('si-fullscreen')){
    btn.textContent = '❐';
    btn.title = '还原';
  } else {
    btn.textContent = '⬜';
    btn.title = '最大化';
  }
  // resize ECharts
  setTimeout(function(){if(SI_MODAL_STATE.echartsChart) SI_MODAL_STATE.echartsChart.resize()}, 200);
}

function siRenderModalListView(data){
  var c = data.center;
  var t = TYPE_MAP[c.entityType] || {cn:c.entityType,icon:'📌'};
  var html = '';
  // 基本属性卡片
  html += '<div style="background:var(--bg3);border:1px solid var(--rule);border-radius:10px;padding:16px;margin-bottom:16px">';
  html += '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">';
  html += '<div><span style="font-size:18px;font-weight:800;color:var(--ink)">'+c.name+'</span>';
  if(c.name_en) html += '<span style="font-size:12px;color:var(--muted);margin-left:8px">'+c.name_en+'</span>';
  html += '</div>';
  html += '<span class="si-entity-type-badge '+t.code+'">'+t.icon+' '+t.cn+'</span>';
  html += '</div>';
  html += '<div class="si-props-grid">';
  if(c.icd_code) html += siPropRow('ICD-10', c.icd_code);
  if(c.description) html += siPropRow('描述', c.description);
  if(c.aliases && c.aliases.length) html += siPropRow('别名', c.aliases.join('、'));
  html += siPropRow('编码', c.code);
  html += '</div></div>';

  // 关联实体（按维度分组）
  var groups = {};
  var ungrouped = [];
  (data.neighbors||[]).forEach(function(n){
    var dim = REL_DIM_MAP[n.rel_type];
    if(dim){
      if(!groups[dim]) groups[dim] = [];
      groups[dim].push(n);
    } else {
      ungrouped.push(n);
    }
  });

  var allDims = Object.keys(groups);
  if(ungrouped.length > 0) allDims.push('其他');
  if(allDims.length > 0){
    html += '<div style="font-size:14px;font-weight:700;color:var(--ink);margin-bottom:10px">关联实体（'+(data.neighbors||[]).length+'）</div>';
    allDims.forEach(function(dim){
      var items = dim === '其他' ? ungrouped : groups[dim];
      html += '<div class="si-dim-group open">';
      html += '<div class="si-dim-head" onclick="this.parentElement.classList.toggle(\'open\')">';
      html += '<span class="si-dim-arrow">▶</span>';
      html += '<span class="si-dim-name">'+dim+'</span>';
      html += '<span class="si-dim-count">'+items.length+'</span>';
      html += '</div>';
      html += '<div class="si-dim-body">';
      items.forEach(function(n){
        var nt = TYPE_MAP[n.entityType] || {cn:n.entityType,icon:'📌'};
        html += '<div class="si-rel-item">';
        html += '<span class="si-rel-name">'+n.name+'</span>';
        html += '<span class="si-rel-type-tag">'+nt.cn+'</span>';
        html += '</div>';
      });
      html += '</div></div>';
    });
  } else {
    html += '<div class="si-empty" style="padding:20px">暂无关联实体</div>';
  }
  document.getElementById('si-xl-list-view').innerHTML = html;
}

/* ========== 弹窗内网络图 (ECharts) ========== */
function siInitModalNetwork(code){
  // 销毁旧实例
  if(SI_MODAL_STATE.echartsChart){
    SI_MODAL_STATE.echartsChart.dispose();
    SI_MODAL_STATE.echartsChart = null;
  }
  SI_MODAL_STATE.echartsNodes = {};
  SI_MODAL_STATE.echartsEdges = {};
  var expandedSet = new Set();

  var container = document.getElementById('si-modal-network');
  SI_MODAL_STATE.echartsChart = echarts.init(container, null, {renderer:'canvas'});

  // 渲染图例
  var legendHtml = '<div class="lg-title">实体类别</div>';
  var mainTypes = ['Disease','Symptom','Medication','ExamItem','LabItem','DiagnosisCriteria','Procedure','RiskFactor'];
  mainTypes.forEach(function(code){
    var t = TYPE_MAP[code];
    if(t) legendHtml += '<div class="lg-row"><span class="lg-dot" style="background:'+t.color+'"></span>'+t.cn+'</div>';
  });
  document.getElementById('si-modal-legend').innerHTML = legendHtml;

  // 点击事件：展开关联
  SI_MODAL_STATE.echartsChart.on('click', function(params){
    if(params.dataType !== 'node') return;
    var nd = SI_MODAL_STATE.echartsNodes[params.data.id];
    if(!nd) return;
    siModalExpandNode(nd.code, expandedSet);
  });

  // 加载中心节点
  siModalExpandNode(code, expandedSet, true);

  // resize监听
  var resizeHandler = function(){
    if(SI_MODAL_STATE.echartsChart) SI_MODAL_STATE.echartsChart.resize();
  };
  window.addEventListener('resize', resizeHandler);
}

function siModalExpandNode(code, expandedSet, isCenter){
  if(expandedSet.has(code)) return;
  expandedSet.add(code);

  fetch('/api/kg/subgraph?code='+encodeURIComponent(code)+'&limit=50').then(function(r){return r.json()}).then(function(data){
    if(data.error) return;
    var c = data.center;
    var t = TYPE_MAP[c.entityType] || {color:'#888'};

    if(!SI_MODAL_STATE.echartsNodes[c.code]){
      SI_MODAL_STATE.echartsNodes[c.code] = {
        id: c.code, name: c.name,
        symbolSize: isCenter ? 56 : 30,
        category: c.entityType, itemType: c.entityType, code: c.code,
        itemStyle: {color: t.color, shadowBlur: isCenter?20:0, shadowColor:'rgba(0,0,0,0.3)'},
        label: {show:true, fontSize:isCenter?14:10, fontWeight:isCenter?'bold':'normal', color:isCenter?'#fff':'#c0c8d8'}
      };
    }

    (data.neighbors||[]).forEach(function(n){
      var nt = TYPE_MAP[n.entityType] || {color:'#888'};
      if(!SI_MODAL_STATE.echartsNodes[n.code]){
        SI_MODAL_STATE.echartsNodes[n.code] = {
          id: n.code, name: n.name,
          symbolSize: 18, category: n.entityType, itemType: n.entityType, code: n.code,
          itemStyle: {color: nt.color, opacity: 0.85},
          label: {show:true, fontSize:9, color:'#c0c8d8'}
        };
      }
      var edgeId = n.rel_dir==='out' ? code+'-'+n.rel_type+'-'+n.code : n.code+'-'+n.rel_type+'-'+code;
      if(!SI_MODAL_STATE.echartsEdges[edgeId]){
        SI_MODAL_STATE.echartsEdges[edgeId] = {
          source: n.rel_dir==='out'?code:n.code,
          target: n.rel_dir==='out'?n.code:code,
          value: REL_DIM_MAP[n.rel_type]||n.rel_type,
          lineStyle: {color:'#555', width:1.2, curveness:0.12, opacity:0.5}
        };
      }
    });

    siRenderModalECharts();
  }).catch(function(){});
}

function siRenderModalECharts(){
  if(!SI_MODAL_STATE.echartsChart) return;
  var nodes = [];
  var categories = [];
  var catSet = {};
  ENTITY_TYPES.forEach(function(t){catSet[t.code]=categories.length; categories.push({name:t.cn})});

  Object.keys(SI_MODAL_STATE.echartsNodes).forEach(function(id){
    var n = SI_MODAL_STATE.echartsNodes[id];
    n.category = catSet[n.itemType] !== undefined ? catSet[n.itemType] : 0;
    nodes.push(n);
  });
  var links = Object.keys(SI_MODAL_STATE.echartsEdges).map(function(id){return SI_MODAL_STATE.echartsEdges[id]});

  SI_MODAL_STATE.echartsChart.setOption({
    tooltip: {
      trigger:'item', backgroundColor:'#1a1d27', borderColor:'#2e3348',
      textStyle:{color:'#e8eaf0',fontSize:12},
      formatter:function(p){
        if(p.dataType==='edge') return p.data.source+' → '+p.data.target+'<br><span style="color:#8b90a0">'+(p.data.value||'')+'</span>';
        var nd = SI_MODAL_STATE.echartsNodes[p.data.id];
        if(!nd) return p.name;
        var t = TYPE_MAP[nd.itemType]||{cn:nd.itemType};
        return '<b>'+p.name+'</b><br><span style="color:#8b90a0">'+t.cn+'</span>';
      }
    },
    animationDuration:800, animationEasingUpdate:'quinticInOut',
    series:[{
      type:'graph', layout:'force', data:nodes, links:links, categories:categories,
      roam:true, draggable:true,
      label:{show:true, position:'right', fontSize:10, color:'#e8eaf0'},
      lineStyle:{curveness:0.12, opacity:0.6},
      emphasis:{focus:'adjacency', lineStyle:{width:4}},
      force:{repulsion:280, gravity:0.06, edgeLength:[70,180], friction:0.6, layoutAnimation:true}
    }]
  }, true);

  document.getElementById('si-modal-net-info').innerHTML = '节点: <b>'+nodes.length+'</b> | 关联: <b>'+links.length+'</b>';
  setTimeout(function(){if(SI_MODAL_STATE.echartsChart) SI_MODAL_STATE.echartsChart.resize()}, 100);
}
</script>
