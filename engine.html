  }
  var overview = document.getElementById('pathOverview');
  if (overview) {
    overview.style.cursor = 'pointer';
    overview.onclick = function() { showPathwaySettings(); };
    overview.title = '点击编辑路径设置';
  }
}

/* ============================
   NODE SEARCH
   ============================ */
function searchNodes(keyword) {
  var resultsEl = document.getElementById('searchResults');
  if (!resultsEl) {
    resultsEl = document.createElement('div');
    resultsEl.id = 'searchResults';
    resultsEl.style.cssText = 'position:absolute;top:100%;left:0;right:0;background:var(--bg1);border:1px solid var(--rule);border-radius:0 0 8px 8px;max-height:200px;overflow-y:auto;z-index:100;font-size:11px;display:none;box-shadow:0 4px 12px rgba(0,0,0,.15)';
    var searchInput = document.getElementById('nodeSearch');
    if (searchInput) searchInput.parentNode.style.position = 'relative';
    if (searchInput) searchInput.parentNode.appendChild(resultsEl);
  }

  if (!keyword) {
    resultsEl.style.display = 'none';
    nodes.forEach(function(n) {
      var el = document.getElementById('node-' + n.id);
      if (el) el.style.opacity = '1';
    });
    return;
  }

  var kw = keyword.toLowerCase();
  var matches = [];
  nodes.forEach(function(n) {
    var info = NODE_TYPE_MAP[n.type];
    var match = n.label.toLowerCase().indexOf(kw) > -1 || n.id.toLowerCase().indexOf(kw) > -1 || (info && info.name.toLowerCase().indexOf(kw) > -1);
    var el = document.getElementById('node-' + n.id);
    if (el) el.style.opacity = match ? '1' : '0.2';
    if (match) matches.push(n);
  });

  if (matches.length > 0) {
    var h = '';
    matches.forEach(function(n) {
      var info = NODE_TYPE_MAP[n.type];
      h += '<div onclick="focusNode(\'' + n.id + '\')" style="padding:4px 8px;cursor:pointer;border-bottom:1px solid var(--rule);display:flex;align-items:center;gap:6px">';
      h += '<span style="font-size:12px">' + (info ? info.icon : '') + '</span>';
      h += '<span style="font-weight:600">' + escapeHtml(n.label) + '</span>';
      h += '<span style="color:var(--muted);margin-left:auto">' + n.id + '</span>';
      h += '</div>';
    });
    resultsEl.innerHTML = h;
    resultsEl.style.display = 'block';
  } else {
    resultsEl.innerHTML = '<div style="padding:8px;color:var(--muted);text-align:center">无匹配结果</div>';
    resultsEl.style.display = 'block';
  }
}

function focusNode(nodeId) {
  var node = findNode(nodeId);
  if (!node) return;
  canvasOffsetX = -node.x * canvasScale + (canvasContainer ? canvasContainer.clientWidth / 2 : 400);
  canvasOffsetY = -node.y * canvasScale + (canvasContainer ? canvasContainer.clientHeight / 2 : 300);
  updateCanvasTransform();
  updateAllConnections();
  selectNode(nodeId);
  var resultsEl = document.getElementById('searchResults');
  if (resultsEl) resultsEl.style.display = 'none';
}

/* ============================
   HARD VALIDATION
   ============================ */
function validateFlow() {
  var errors = [];
  if (nodes.length === 0) {
    errors.push('画布为空，请添加节点');
    return errors;
  }

  // 1. 必须有开始和结束节点
  var starts = nodes.filter(function(n) { return n.type === 'start'; });
  var ends = nodes.filter(function(n) { return n.type === 'end'; });
  if (starts.length === 0) errors.push('缺少开始节点');
  if (starts.length > 1) errors.push('只能有一个开始节点');
  if (ends.length === 0) errors.push('缺少结束节点');

  // 2. 全局变量组件必须在开始节点下游第一个
  var startNode = starts[0];
  if (startNode) {
    var outgoingStart = connections.filter(function(c) { return c.sourceId === startNode.id; });
    outgoingStart.forEach(function(c) {
      var target = findNode(c.targetId);
      if (target && target.type !== 'global_var') {
        errors.push('PRD约束：开始节点下游第一个必须是全局变量组件，当前连接到 "' + target.label + '"');
      }
    });
  }

  // 3. 所有节点必须有出边（除结束节点）
  nodes.forEach(function(n) {
    if (n.type === 'end') return;
    var outs = connections.filter(function(c) { return c.sourceId === n.id; });
    if (outs.length === 0) {
      errors.push('节点 "' + n.label + '" 没有出边，流程将在此中断');
    }
  });

  // 4. 所有节点必须有入边（除开始节点和全局变量组件）
  nodes.forEach(function(n) {
    if (n.type === 'start' || n.type === 'global_var') return;
    var ins = connections.filter(function(c) { return c.targetId === n.id; });
    if (ins.length === 0) {
      errors.push('节点 "' + n.label + '" 没有入边，无法从其他节点到达');
    }
  });

  // 5. 辅助链路连线禁止阻断
  var auxTypes = ['n1_screening', 'n2_assessment', 'n8_record', 'n9_tracking', 'n11_qc', 'n12_followup', 'n13_evaluation'];
  connections.forEach(function(c) {
    var src = findNode(c.sourceId);
    if (!src) return;
    var isAux = auxTypes.indexOf(src.type) >= 0;
    if (isAux && c.blocking === true) {
      errors.push('PRD约束：辅助链路节点 "' + src.label + '" 的连线禁止配置阻断，当前连线 "' + c.label + '" 为阻断模式');
    }
  });

  // 6. 连接线规则配置检查
  connections.forEach(function(c) {
    var rules = c.rules || [];
    var hasBlockAction = c.actionType === 'blocks_action';
    if (hasBlockAction) {
      errors.push('连线 "' + c.label + '" 使用了旧版 blocks_action，请改用阻断控制开关');
    }
  });

  // 7. 菱形分支节点检查
  nodes.forEach(function(n) {
    if (n.type !== 'decision') return;
    var outs = connections.filter(function(c) { return c.sourceId === n.id; });
    if (outs.length < 2) {
      errors.push('菱形分支节点 "' + n.label + '" 至少需要两条出边');
    }
    // 检查是否在菱形节点上配置了规则（应该在连接线上）
    if (n.config && (n.config.condition || n.config.rules)) {
      errors.push('PRD约束：菱形分支节点 "' + n.label + '" 不应配置规则，规则应配置在连接线上');
    }
  });

  // 8. 连接线标签检查
  connections.forEach(function(c) {
    if (!c.label || c.label.trim() === '') {
      errors.push('连线 "' + c.id + '" 缺少显示名称');
    }
  });

  return errors;
}

/* ---- Zoom ---- */
function zoomIn() {
  canvasScale = Math.min(3, canvasScale * 1.2);
  updateCanvasTransform();
}
function zoomOut() {
  canvasScale = Math.max(0.2, canvasScale / 1.2);
  updateCanvasTransform();
}
function resetZoom() {
  canvasScale = 1;
  canvasOffsetX = 0;
  canvasOffsetY = 0;
  updateCanvasTransform();
}
function fitToScreen() {
  if (nodes.length === 0) { resetZoom(); return; }
  var minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  nodes.forEach(function(n) {
    if (n.x < minX) minX = n.x;
    if (n.y < minY) minY = n.y;
    if (n.x + 200 > maxX) maxX = n.x + 200;
    if (n.y + 80 > maxY) maxY = n.y + 80;
  });
  var pad = 60;
  var contentW = maxX - minX + pad * 2;
  var contentH = maxY - minY + pad * 2;
  var viewW = (canvasContainer && canvasContainer.clientWidth > 100) ? canvasContainer.clientWidth : 800;
  var viewH = (canvasContainer && canvasContainer.clientHeight > 100) ? canvasContainer.clientHeight : 600;
  var scaleX = viewW / contentW;
  var scaleY = viewH / contentH;
  canvasScale = Math.min(scaleX, scaleY, 1.2);
  canvasScale = Math.max(canvasScale, 0.35);
  /* Center the content */
  canvasOffsetX = (viewW - (maxX - minX) * canvasScale) / 2 - minX * canvasScale;
  canvasOffsetY = (viewH - (maxY - minY) * canvasScale) / 2 - minY * canvasScale;
  updateCanvasTransform();
  updateAllConnections();
  /* Double-check after transform settles */
  requestAnimationFrame(function() { updateAllConnections(); });
}

    nextConnId: nextConnId,

function doUndo() {

  // 保存当前状态到 redoStack
  redoStack.push(JSON.stringify({
    nodes: nodes.map(function(n) {
      return { id: n.id, type: n.type, label: n.label, x: n.x, y: n.y, description: n.description, config: JSON.parse(JSON.stringify(n.config || {})) };
    }),
    connections: connections.map(function(c) {

    }),
    nextNodeId: nextNodeId,
    nextConnId: nextConnId,
    flowName: flowName,
    pathwayMeta: JSON.parse(JSON.stringify(pathwayMeta))
  }));
  var state = JSON.parse(undoStack.pop());
  loadFlowData(state);
  showToast('已撤销');
}

function doRedo() {

  undoStack.push(JSON.stringify({
    nodes: nodes.map(function(n) {

/* ============================
   PATHWAY INTERPRETER - 路径解释器
   将画布配置翻译为指南格式叙述
   ============================ */
function interpretPathway() {
  if (nodes.length === 0) return '<div style="color:var(--muted);text-align:center;padding:40px">画布为空，请先添加节点</div>';
  
  // 拓扑排序
  var sorted = topologicalSort();
  
  var h = '';
  h += '<div style="font-size:16px;font-weight:700;color:var(--ink);margin-bottom:4px">' + escapeHtml(flowName || '未命名路径') + '</div>';
  h += '<div style="font-size:12px;color:var(--muted);margin-bottom:16px">';
  var metaParts = [];
  if (pathwayMeta.disease_code) metaParts.push('疾病: ' + pathwayMeta.disease_code);
  if (pathwayMeta.schema_version) metaParts.push('Schema: ' + pathwayMeta.schema_version);
  metaParts.push('节点: ' + nodes.length + ' | 连线: ' + connections.length);
  h += metaParts.join(' | ') + '</div>';
  
  // 入径条件
  var startNode = sorted.find(function(n){return n.type==='start' || n.type==='disease_entry'});
  if (startNode) {
    h += '<div style="font-size:13px;color:var(--muted);margin-bottom:12px;padding:8px 12px;background:rgba(82,196,26,.06);border-left:3px solid #52c41a;border-radius:0 6px 6px 0">';
    h += '<strong style="color:#52c41a;">入径条件</strong>：';
    if (startNode.config.entryCondition) h += escapeHtml(startNode.config.entryCondition);
    else if (startNode.config.inclusion_criteria) h += escapeHtml(startNode.config.inclusion_criteria);
    else h += '（未配置入径条件）';
    h += '</div>';
  }

  // 按阶段分组渲染
  var stageNum = 0;
  var abilityNum = 0;
  sorted.forEach(function(node) {
    var info = NODE_TYPE_MAP[node.type];
    if (!info) return;
    
    if (node.type === 'start' || node.type === 'disease_entry') return;
    if (node.type === 'end') {
      h += '<div style="font-size:13px;color:var(--muted);margin-top:16px;padding:8px 12px;background:rgba(255,77,79,.06);border-left:3px solid #ff4d4f;border-radius:0 6px 6px 0">';
      h += '<strong style="color:#ff4d4f;">出径条件</strong>：';
      h += escapeHtml(node.label) + '。路径结束。';
      h += '</div>';
      return;
    }
    
    if (node.type === 'decision') {
      h += '<div style="margin-top:16px">';
      h += '<strong style="color:#cc5de8;">条件判断</strong> <span style="font-size:10px;color:var(--muted)">[判断网关]</span><br>';
      h += '<span style="font-size:13px">若<strong>' + escapeHtml(node.config.condition || node.label) + '</strong>，则：</span>';
      var outConns = connections.filter(function(c){return c.sourceId === node.id});
      outConns.forEach(function(c) {
        var tgt = findNode(c.targetId);
        var label = c.label || c.condition || '继续';
        h += '<div style="font-size:13px;padding-left:16px;color:var(--accent)">→ ' + escapeHtml(label) + '：' + escapeHtml(tgt ? tgt.label : '?') + '</div>';
      });
      h += '</div>';
      return;
    }
    
    if (node.type === 'gateway') {
      h += '<div style="margin-top:12px;font-size:13px;color:#ff922b"><strong>并行执行</strong> [并行网关]</div>';
      return;
    }
    
    // 能力节点
    if (node.type.indexOf('ability_') === 0) {
      abilityNum++;
      var ct = info.componentType || '';
      var ctInfo = COMPONENT_TYPES[ct] || {};

/* 拓扑排序（DAG） */
function topologicalSort() {
  var visited = {};
  var result = [];
  
  function visit(nodeId) {
    if (visited[nodeId]) return;
    visited[nodeId] = true;
    var outConns = connections.filter(function(c){return c.sourceId === nodeId});
    outConns.forEach(function(c) {
      if (!visited[c.targetId]) visit(c.targetId);
    });
    var node = findNode(nodeId);
    if (node) result.push(node);
  }
  
  // 从start节点开始
  var startNodes = nodes.filter(function(n){return n.type==='start' || n.type==='disease_entry'});
  if (startNodes.length > 0) {
    startNodes.forEach(function(n){visit(n.id)});
  } else {
    nodes.forEach(function(n){visit(n.id)});
  }
  
  // 添加未访问到的节点
  nodes.forEach(function(n) {
    if (!visited[n.id]) result.push(n);
  });
  
  return result;
}

/* ============================
   ENGINE L2 - 编译层
   ============================ */
function compilePathway() {
  // L1: 配置校验
  var errors = validateFlow();
  if (errors.length > 0) {
    return { valid: false, errors: errors, plan: null };
  }
  
  // L2: 拓扑排序生成DAG
  var sorted = topologicalSort();
  var dag = {};
  var compiledRules = {};
  var variableBindings = {};
  var eventSubscriptions = {};
  var entryConfig = {};
  var connectionRules = {};
  var recommendationSources = {};
  
  sorted.forEach(function(n) {
    var outConns = connections.filter(function(c){return c.sourceId === n.id});
    dag[n.id] = outConns.map(function(c){return c.targetId});
    
    // 编译规则
    if (n.config.rules && n.config.rules.length > 0) {
      var graphRules = n.config.rules.filter(function(r){return r.type==='graph'});
      var droolsRules = n.config.rules.filter(function(r){return r.type==='drools'});
      compiledRules[n.id] = {
        graphRules: graphRules.map(function(r){return r.ruleCode}),
        droolsRules: droolsRules.map(function(r){return {pkg:r.rulePackage, name:r.ruleName}}),
        logic: n.config.rule_group_logic || 'AND'
      };
    }
    
    // 变量绑定
    if (n.config.input_mapping) {
      variableBindings[n.id + '.input'] = n.config.input_mapping;
    }
    if (n.config.output_type) {
      variableBindings[n.id + '.output'] = n.config.output_type;
    }
    
    // 事件订阅
    var boundEvents = n.config.events || (n.config.event ? [n.config.event] : []);
    boundEvents.forEach(function(evt) {
      if (!eventSubscriptions[evt]) eventSubscriptions[evt] = [];
      eventSubscriptions[evt].push(n.id);
    });

    // 准入规则编译
    if (n.type === 'disease_entry') {
      entryConfig = {
        nodeId: n.id,
        diseaseName: n.label,
        entryRules: (n.config.entry_rules || []).map(function(r) { return r.name; }),
        matchAction: n.config.entry_match_action || 'enter_pathway',
        noMatchAction: n.config.entry_nomatch_action || 'exclude'
      };
    }

    // 推荐来源编译
    if (n.type.indexOf('ability_') === 0 && n.config.rec_sources) {
      var rs = n.config.rec_sources;
      var sources = [];
      if (rs.order_categories && rs.order_categories.length > 0) {
        rs.order_categories.forEach(function(cat) {
          sources.push({ type: 'order_category', category: cat, rule: rs['order_rule_' + cat] || '' });
        });
      }
      if (rs.dify_enabled) {
        sources.push({ type: 'dify_agent', url: rs.dify_agent_url || '', agentId: rs.dify_agent_id || '', desc: rs.dify_agent_desc || '' });
      }
      if (rs.graph_enabled) {
        sources.push({ type: 'graph_rule', ruleCode: rs.graph_rule_code || '', desc: rs.graph_desc || '' });
      }
      if (sources.length > 0) {
        recommendationSources[n.id] = sources;
      }
    }
  });

  // 编译连线规则
  connections.forEach(function(c) {
    if (c.rules && c.rules.length > 0) {
      connectionRules[c.id] = {
        sourceId: c.sourceId,
        targetId: c.targetId,
        rules: c.rules.map(function(r) { return r.name; }),
        ruleResult: c.rule_result || 'true',
        actionType: c.actionType || '',
        sourceFilter: c.sourceFilter || ''
      };
    }
  });
  
  return {
    valid: true,
    errors: [],
    plan: {
      dag: dag,
      compiledRules: compiledRules,
      variableBindings: variableBindings,
      eventSubscriptions: eventSubscriptions,
      entryConfig: entryConfig,
      connectionRules: connectionRules,
      recommendationSources: recommendationSources
    }
  };
}

/* ============================
   FLOW DATA I/O
   ============================ */
function buildFlowData() {
  return {
    name: flowName,
    meta: JSON.parse(JSON.stringify(pathwayMeta)),
    nodes: nodes.map(function(n) {
      return { id: n.id, type: n.type, label: n.label, x: Math.round(n.x), y: Math.round(n.y), description: n.description, config: JSON.parse(JSON.stringify(n.config || {})) };
    }),
    connections: connections.map(function(c) {
      return { id: c.id, sourceId: c.sourceId, targetId: c.targetId, sourcePort: c.sourcePort, targetPort: c.targetPort, label: c.label, eventType: c.eventType, condition: c.condition || '', sourceFilter: c.sourceFilter || '', actionType: c.actionType || '', rules: JSON.parse(JSON.stringify(c.rules || [])), rule_result: c.rule_result || '' };
    })
  };
}

function loadFlowData(data) {
  nodes = [];
  connections = [];
  selectedNodeId = null;
  selectedConnId = null;
  canvasEl.innerHTML = '';

  /* Re-create SVG */
  var svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('class', 'connections-svg');
  svg.setAttribute('id', 'connectionsSvg');
  svg.innerHTML = '<defs>'
    + '<marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M 0 0 L 8 3 L 0 6 L 2 3 Z" fill="rgba(0,0,0,0.25)"/></marker>'
    + '<marker id="arrowhead-active" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M 0 0 L 8 3 L 0 6 L 2 3 Z" fill="#4f8cff"/></marker>'
    + '</defs>';
  canvasEl.appendChild(svg);
  connectionsSvg = svg;

  flowName = data.name || '未命名路径';

  if (data.meta) {
    pathwayMeta = data.meta;
  } else {
    pathwayMeta = { disease_code: '', disease_name: '', schema_version: 'V1.11', review_status: 'draft', description: '' };
  }

  var maxN = 0, maxC = 0;

  /* 渲染节点 */
  var TASK_TO_ABILITY = {
    '入组筛查': 'ability_screening', '疾病推荐': 'ability_screening',
    '首诊评估': 'ability_assessment', '评估': 'ability_assessment',
    '鉴别推荐': 'ability_diagnosis', '辅助诊断': 'ability_diagnosis',
    '分型分层': 'ability_subtype',
    '方案推荐': 'ability_treatment', '治疗方案推荐': 'ability_treatment',
    '医嘱推荐': 'ability_order', '医嘱执行': 'ability_order',
    '病历书写': 'ability_record',
    '路径追踪': 'ability_tracking',
    '风险预警': 'ability_risk', '预警': 'ability_risk',
    '质控反馈': 'ability_qc', '质控': 'ability_qc',
    '随访管理': 'ability_followup', '随访': 'ability_followup',
    '效果评价': 'ability_evaluation'
  };
  (data.nodes || []).forEach(function(nd) {
    var numId = parseInt(nd.id.replace('n', ''));
    if (numId > maxN) maxN = numId;
    var ndType = nd.type;
    /* 将旧的task类型映射为能力节点类型 */
    if (ndType === 'task' || !NODE_TYPE_MAP[ndType]) {
      var taskType = (nd.config && nd.config.taskType) || nd.label || '';
      ndType = TASK_TO_ABILITY[taskType] || 'ability_screening';
    }
    var node = {
      id: nd.id, type: ndType, label: nd.label,
      x: nd.x, y: nd.y,
      description: nd.description || '',
      config: nd.config || {}
    };
    nodes.push(node);
    renderNode(node);
  });
  nextNodeId = maxN + 1;

  /* Render connections after nodes are fully laid out in DOM */
  requestAnimationFrame(function() {
    requestAnimationFrame(function() {
      (data.connections || []).forEach(function(cd) {
        var numId = parseInt(cd.id.replace('c', ''));
        if (numId > maxC) maxC = numId;

        /* Auto-detect ports if not specified */
        var sp = cd.sourcePort, tp = cd.targetPort;
        if (!sp || !tp) {
          var best = getBestPorts(cd.sourceId, cd.targetId);
          sp = best.sourcePort;
          tp = best.targetPort;
        }

        var conn = {
          id: cd.id, sourceId: cd.sourceId, targetId: cd.targetId,
          sourcePort: sp, targetPort: tp,
          label: cd.label || '',
          eventType: cd.eventType || '无条件',
          condition: cd.condition || '',
          sourceFilter: cd.sourceFilter || '',
          actionType: cd.actionType || '',
          rules: cd.rules || [],
          rule_result: cd.rule_result || ''
        };
        connections.push(conn);
        renderConnection(conn);
      });
      nextConnId = maxC + 1;
      /* Force a full connection update after all connections are created */
      updateAllConnections();
    });
  });

  setTimeout(updatePathOverview, 100);
  setTimeout(function() { fitToView(); }, 150);
  /* Final safety: re-update connections after fit, in case dimensions changed */
  setTimeout(function() { updateAllConnections(); }, 300);
}

   ============================ */
function loadPathwayFromAPI(disease) {
  showToast('正在加载路径模板...');
  fetch('/api/kg/pathway/' + disease).then(function(r){return r.json()}).then(function(data) {
    if (data.error) { showToast('加载失败: ' + data.error); return; }
    loadFlowData(data);
    flowName = data.pathway_name || '未命名路径';
    showToast('已加载: ' + flowName);
  }).catch(function(e) {
    console.error('Load pathway error:', e);
    showToast('加载失败，请重试');
  });
}

/* ============================
   UTILITIES
   ============================ */
function findNode(id) {
  for (var i = 0; i < nodes.length; i++) {
    if (nodes[i].id === id) return nodes[i];
  }
  return null;
}

function findConnection(id) {
  for (var i = 0; i < connections.length; i++) {
    if (connections[i].id === id) return connections[i];
  }
  return null;
}

function escapeHtml(str) {
  if (!str) return '';
  return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function escapeAttr(str) {
  if (!str) return '';
  return str.replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function showToast(msg) {
  var toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(toast._timer);
  toast._timer = setTimeout(function() { toast.classList.remove('show'); }, 2500);
}

/* ============================
   MINIMAP
   ============================ */
function updateMinimap() {
  var mm = document.getElementById('minimap');
  if (!mm || nodes.length === 0) { if (mm) mm.innerHTML = ''; return; }
  var minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  nodes.forEach(function(n) {
    if (n.x < minX) minX = n.x;
    if (n.y < minY) minY = n.y;
    if (n.x + 180 > maxX) maxX = n.x + 180;
    if (n.y + 80 > maxY) maxY = n.y + 80;
  });
  var pad = 50;
  minX -= pad; minY -= pad; maxX += pad; maxY += pad;
  var rangeX = maxX - minX || 1;
  var rangeY = maxY - minY || 1;
  var mmW = 180, mmH = 120;
  var scaleX = mmW / rangeX, scaleY = mmH / rangeY;
  var scale = Math.min(scaleX, scaleY);
  var h = '';
  nodes.forEach(function(n) {
    var x = (n.x - minX) * scale;
    var y = (n.y - minY) * scale;
    var info = NODE_TYPE_MAP[n.type];
    var color = info ? info.color : '#999';
    h += '<div class="minimap-node" style="left:' + x + 'px;top:' + y + 'px;width:' + Math.max(180 * scale, 3) + 'px;height:' + Math.max(60 * scale, 2) + 'px;background:' + color + '"></div>';
  });
  // viewport indicator
  var vx = (-canvasOffsetX - minX) * scale;
  var vy = (-canvasOffsetY - minY) * scale;
  var vw = (canvasContainer ? canvasContainer.clientWidth : 800) / canvasScale * scale;
  var vh = (canvasContainer ? canvasContainer.clientHeight : 600) / canvasScale * scale;
  h += '<div class="minimap-viewport" style="left:' + vx + 'px;top:' + vy + 'px;width:' + vw + 'px;height:' + vh + 'px"></div>';
  mm.innerHTML = h;

  // 添加点击导航
  mm.onclick = function(e) {
    var rect = mm.getBoundingClientRect();
    var clickX = e.clientX - rect.left;
    var clickY = e.clientY - rect.top;
    canvasOffsetX = -(clickX / scale + minX) * canvasScale + (canvasContainer ? canvasContainer.clientWidth / 2 : 400);
    canvasOffsetY = -(clickY / scale + minY) * canvasScale + (canvasContainer ? canvasContainer.clientHeight / 2 : 300);
    updateCanvasTransform();
    updateAllConnections();
    updateMinimap();
  };
}

function getPortPosition(nodeId, portName) {
  var el = document.getElementById('node-' + nodeId);
  if (!el) return null;
  var x = parseInt(el.style.left);
  var y = parseInt(el.style.top);
  var w = el.offsetWidth;
  var h = el.offsetHeight;
  switch (portName) {
    case 'top':    return { x: x + w / 2, y: y };
    case 'bottom': return { x: x + w / 2, y: y + h };
    case 'left':   return { x: x, y: y + h / 2 };
    case 'right':  return { x: x + w, y: y + h / 2 };
  }
  return { x: x + w / 2, y: y + h / 2 };
}

function makeConnPath(x1, y1, port1, x2, y2, port2) {
  var dirs = {
    top:    { dx: 0, dy: -1 },
    bottom: { dx: 0, dy: 1 },
    left:   { dx: -1, dy: 0 },
    right:  { dx: 1, dy: 0 }
  };
  var d1 = dirs[port1] || { dx: 0, dy: 1 };
  var d2 = dirs[port2] || { dx: 0, dy: -1 };
  var dist = Math.sqrt(Math.pow(x2 - x1, 2) + Math.pow(y2 - y1, 2));
  var offset = Math.max(50, dist * 0.3);
  var cx1 = x1 + d1.dx * offset;
  var cy1 = y1 + d1.dy * offset;
  var cx2 = x2 + d2.dx * offset;
  var cy2 = y2 + d2.dy * offset;
  return 'M ' + x1 + ' ' + y1 + ' C ' + cx1 + ' ' + cy1 + ', ' + cx2 + ' ' + cy2 + ', ' + x2 + ' ' + y2;
}

function getBestPorts(sourceId, targetId) {
  var sEl = document.getElementById('node-' + sourceId);
  var tEl = document.getElementById('node-' + targetId);
  if (!sEl || !tEl) return { sourcePort: 'right', targetPort: 'left' };

  var sx = parseInt(sEl.style.left), sy = parseInt(sEl.style.top);
  var sw = sEl.offsetWidth, sh = sEl.offsetHeight;
  var tx = parseInt(tEl.style.left), ty = parseInt(tEl.style.top);
  var tw = tEl.offsetWidth, th = tEl.offsetHeight;

  var scx = sx + sw / 2, scy = sy + sh / 2;
  var tcx = tx + tw / 2, tcy = ty + th / 2;
  var dx = tcx - scx, dy = tcy - scy;

  if (Math.abs(dx) > Math.abs(dy)) {
    return dx > 0 ?
      { sourcePort: 'right', targetPort: 'left' } :
      { sourcePort: 'left', targetPort: 'right' };
  } else {
    return dy > 0 ?
      { sourcePort: 'bottom', targetPort: 'top' } :
      { sourcePort: 'top', targetPort: 'bottom' };
  }
}

/* ============================
   EXPORT IMAGE
   ============================ */
function exportImage() {
  showToast('正在生成图片...');
  var canvas2 = document.createElement('canvas');
  var ctx = canvas2.getContext('2d');

  // 计算画布范围
  var minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  nodes.forEach(function(n) {
    if (n.x < minX) minX = n.x;
    if (n.y < minY) minY = n.y;
    if (n.x + 200 > maxX) maxX = n.x + 200;
    if (n.y + 100 > maxY) maxY = n.y + 100;
  });
  if (nodes.length === 0) { showToast('画布为空，无法导出'); return; }
  var pad = 60;
  minX -= pad; minY -= pad; maxX += pad; maxY += pad;
  var w = maxX - minX;
  var h = maxY - minY;

  canvas2.width = w * 2;
  canvas2.height = h * 2;
  ctx.scale(2, 2);

  // 白色背景
  ctx.fillStyle = '#fff';
  ctx.fillRect(0, 0, w, h);

  // 网格点
  ctx.fillStyle = '#e0e0e0';
  for (var gx = 0; gx < w; gx += 20) {
    for (var gy = 0; gy < h; gy += 20) {
      ctx.beginPath();
      ctx.arc(gx, gy, 0.5, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // 绘制连线
  connections.forEach(function(c) {
    var src = findNode(c.sourceId);
    var tgt = findNode(c.targetId);
    if (!src || !tgt) return;
    var sx = src.x - minX + 90, sy = src.y - minY + 40;
    var tx = tgt.x - minX + 90, ty = tgt.y - minY + 40;

    ctx.strokeStyle = 'rgba(0,0,0,0.2)';
    ctx.lineWidth = 1.5;
    var dx = tx - sx, dy = ty - sy;
    var dist = Math.sqrt(dx * dx + dy * dy) * 0.4;
    var cx1 = sx, cy1 = sy, cx2 = tx, cy2 = ty;
    if (c.sourcePort === 'right') { cx1 = sx + dist; }
    else if (c.sourcePort === 'left') { cx1 = sx - dist; }
    else if (c.sourcePort === 'bottom') { cy1 = sy + dist; }
    else if (c.sourcePort === 'top') { cy1 = sy - dist; }
    if (c.targetPort === 'left') { cx2 = tx - dist; }
    else if (c.targetPort === 'right') { cx2 = tx + dist; }
    else if (c.targetPort === 'top') { cy2 = ty - dist; }
    else if (c.targetPort === 'bottom') { cy2 = ty + dist; }
    ctx.beginPath();
    ctx.moveTo(sx, sy);
    ctx.bezierCurveTo(cx1, cy1, cx2, cy2, tx, ty);
    ctx.stroke();

    // 连线标签
    if (c.label) {
      ctx.fillStyle = '#f06595';
      ctx.font = '9px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(c.label, (sx + tx) / 2, (sy + ty) / 2 - 4);
    }
  });

  // 绘制节点
  nodes.forEach(function(n) {
    var info = NODE_TYPE_MAP[n.type];
    var x = n.x - minX;
    var y = n.y - minY;
    var nw = 180, nh = 60;

    // 节点背景
    ctx.fillStyle = '#fff';
    ctx.strokeStyle = info ? info.color : '#999';
    ctx.lineWidth = 2;
    roundRect(ctx, x, y, nw, nh, 8);
    ctx.fill();
    ctx.stroke();

    // 节点头部
    if (info) {
      ctx.fillStyle = info.color;
      roundRect(ctx, x, y, nw, 24, [8, 8, 0, 0]);
      ctx.fill();

      // 头部文字
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 11px sans-serif';
      ctx.textAlign = 'left';
      ctx.fillText(info.icon + ' ' + info.name, x + 8, y + 16);
    }

    // 节点标签
    ctx.fillStyle = '#333';
    ctx.font = 'bold 12px sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText(n.label, x + 8, y + 42);
  });

  // 标题
  ctx.fillStyle = '#333';
  ctx.font = 'bold 16px sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText(flowName, 10, 20);

  // 导出
  var link = document.createElement('a');
  link.download = (flowName || 'pathway') + '.png';
  link.href = canvas2.toDataURL('image/png');
  link.click();
  showToast('已导出PNG图片');
}

function roundRect(ctx, x, y, w, h, r) {
  if (typeof r === 'number') r = [r, r, r, r];
  ctx.beginPath();
  ctx.moveTo(x + r[0], y);
  ctx.lineTo(x + w - r[1], y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r[1]);
  ctx.lineTo(x + w, y + h - r[2]);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r[2], y + h);
  ctx.lineTo(x + r[3], y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r[3]);
  ctx.lineTo(x, y + r[0]);
  ctx.quadraticCurveTo(x, y, x + r[0], y);
  ctx.closePath();
}

/* ============================
   IMPORT JSON
   ============================ */
function importJSON(event) {
  var readFile = function(file) {
    var reader = new FileReader();
    reader.onload = function(ev) {
      try {
        var data = JSON.parse(ev.target.result);
        if (data.nodes && data.connections) {
          loadFlowData(data);
          if (data.meta) {
            pathwayMeta = data.meta;
            if (!pathwayMeta.machineKey) pathwayMeta.machineKey = '';
            if (!pathwayMeta.channels) pathwayMeta.channels = { emergency: true, outpatient: true, inpatient: false };
          }
          syncBottomBarFromMeta();
          updatePathOverview();
          showToast('已导入: ' + (data.name || file.name));
        } else {
          showToast('JSON格式不正确，缺少nodes或connections');
        }
      } catch(err) {
        showToast('JSON解析失败: ' + err.message);
      }
    };
    reader.readAsText(file);
  };

  if (event && event.target && event.target.files && event.target.files[0]) {
    readFile(event.target.files[0]);
    event.target.value = '';
  } else {
    var input = document.createElement('input');
    input.type = 'file';
    input.accept = '.json';
    input.onchange = function(e) {
      var file = e.target.files[0];
      if (!file) return;
      readFile(file);
    };
    input.click();
  }
}

/* ============================
   PATH STATISTICS
   ============================ */
function showPathStats() {
  var stats = {};
  stats.totalNodes = nodes.length;
  stats.totalConns = connections.length;

  // 按类型统计节点
  var typeCount = {};
  nodes.forEach(function(n) {
    var info = NODE_TYPE_MAP[n.type];
    var name = info ? info.name : n.type;
    typeCount[name] = (typeCount[name] || 0) + 1;
  });
  stats.nodeTypes = typeCount;

  // 按事件类型统计连线
  var eventCount = {};
  connections.forEach(function(c) {
    eventCount[c.eventType] = (eventCount[c.eventType] || 0) + 1;
  });
  stats.eventTypes = eventCount;

  // CDSS统计
  stats.recommendations = nodes.filter(function(n) { return n.type === 'recommendation'; }).length;
  stats.contraindications = nodes.filter(function(n) { return n.type === 'contraindication'; }).length;
  stats.diseaseEntries = nodes.filter(function(n) { return n.type === 'disease_entry'; }).length;
  stats.rulesWithBinding = nodes.filter(function(n) { return n.config && (n.config.rules && n.config.rules.length > 0); }).length;
  stats.connRules = connections.filter(function(c) { return c.rules && c.rules.length > 0; }).length;
  stats.entryRules = nodes.filter(function(n) { return n.type === 'disease_entry' && n.config && n.config.entry_rules && n.config.entry_rules.length > 0; }).length;
  stats.recSources = nodes.filter(function(n) { return n.config && n.config.rec_sources && (n.config.rec_sources.order_categories && n.config.rec_sources.order_categories.length > 0 || n.config.rec_sources.dify_enabled || n.config.rec_sources.graph_enabled); }).length;

  // 弹窗显示
  var html = '<div style="position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:var(--bg1);border:1px solid var(--rule);border-radius:12px;padding:20px;z-index:9999;box-shadow:0 8px 32px rgba(0,0,0,.2);min-width:400px;max-height:80vh;overflow-y:auto">';
  html += '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">';
  html += '<span style="font-size:16px;font-weight:700">📊 路径统计</span>';
  html += '<button onclick="this.closest(\'div[style]\').remove()" style="background:none;border:none;cursor:pointer;font-size:18px;color:var(--muted)">&times;</button></div>';

  html += '<table style="width:100%;font-size:12px;border-collapse:collapse">';
  html += '<tr><td style="padding:4px 8px;font-weight:700">总节点数</td><td>' + stats.totalNodes + '</td></tr>';
  html += '<tr><td style="padding:4px 8px;font-weight:700">总连线数</td><td>' + stats.totalConns + '</td></tr>';
  html += '<tr><td style="padding:4px 8px;font-weight:700">推荐陈述</td><td>' + stats.recommendations + '</td></tr>';
  html += '<tr><td style="padding:4px 8px;font-weight:700">禁忌阻断</td><td>' + stats.contraindications + '</td></tr>';
  html += '<tr><td style="padding:4px 8px;font-weight:700">疾病入口</td><td>' + stats.diseaseEntries + '</td></tr>';
  html += '<tr><td style="padding:4px 8px;font-weight:700">规则绑定</td><td>' + stats.rulesWithBinding + ' / ' + stats.totalNodes + '</td></tr>';
  html += '<tr><td style="padding:4px 8px;font-weight:700">连线规则</td><td>' + stats.connRules + ' / ' + stats.totalConns + '</td></tr>';
  html += '<tr><td style="padding:4px 8px;font-weight:700">准入规则</td><td>' + stats.entryRules + ' / ' + stats.diseaseEntries + '</td></tr>';
  html += '<tr><td style="padding:4px 8px;font-weight:700">推荐来源</td><td>' + stats.recSources + ' / ' + stats.totalNodes + '</td></tr>';
  html += '</table>';

  html += '<div style="margin-top:12px;font-size:12px;font-weight:700">节点类型分布</div>';
  html += '<table style="width:100%;font-size:11px;border-collapse:collapse;margin-top:4px">';
  Object.keys(stats.nodeTypes).sort(function(a,b){return stats.nodeTypes[b]-stats.nodeTypes[a];}).forEach(function(k) {
    html += '<tr><td style="padding:2px 8px;border-bottom:1px solid var(--rule)">' + k + '</td><td style="padding:2px 8px;border-bottom:1px solid var(--rule)">' + stats.nodeTypes[k] + '</td></tr>';
  });
  html += '</table>';

  html += '<div style="margin-top:12px;font-size:12px;font-weight:700">事件类型分布</div>';
  html += '<table style="width:100%;font-size:11px;border-collapse:collapse;margin-top:4px">';
  Object.keys(stats.eventTypes).sort(function(a,b){return stats.eventTypes[b]-stats.eventTypes[a];}).forEach(function(k) {
    html += '<tr><td style="padding:2px 8px;border-bottom:1px solid var(--rule)">' + k + '</td><td style="padding:2px 8px;border-bottom:1px solid var(--rule)">' + stats.eventTypes[k] + '</td></tr>';
  });
  html += '</table>';

  html += '</div>';

  var overlay = document.createElement('div');
  overlay.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.3);z-index:9998';
  overlay.onclick = function() { overlay.remove(); };
  overlay.innerHTML = html;
  document.body.appendChild(overlay);
}

/* ============================
   KEYBOARD SHORTCUTS HELP
   ============================ */
function showShortcuts() {
  var overlay = document.createElement('div');
  overlay.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.3);z-index:9998';
  overlay.onclick = function() { overlay.remove(); };

  var panel = document.createElement('div');
  panel.style.cssText = 'position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:var(--bg1);border:1px solid var(--rule);border-radius:12px;padding:20px;z-index:9999;box-shadow:0 8px 32px rgba(0,0,0,.2);min-width:350px';
  panel.onclick = function(e) { e.stopPropagation(); };

  var header = '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">';
  header += '<span style="font-size:16px;font-weight:700">键盘快捷键</span>';
  header += '<button onclick="this.closest(\'div[style*=fixed]\').parentElement.remove()" style="background:none;border:none;cursor:pointer;font-size:18px;color:var(--muted)">&times;</button></div>';

  var shortcuts = [
    ['Ctrl+Z', '撤销'],
    ['Ctrl+Shift+Z', '重做'],
    ['Ctrl+C', '复制节点'],
    ['Ctrl+V', '粘贴节点'],
    ['Shift+点击', '多选节点'],
    ['Delete', '删除选中'],
    ['Escape', '取消选择'],
    ['拖拽空白处', '平移画布'],
    ['滚轮', '上下左右平移'],
    ['Ctrl+滚轮', '缩放画布'],
    ['Space+拖拽', '平移画布(备选)']
  ];
  var table = '<table style="width:100%;font-size:12px;border-collapse:collapse">';
  shortcuts.forEach(function(s) {
    table += '<tr><td style="padding:4px 8px;border-bottom:1px solid var(--rule)"><code style="background:var(--bg2);padding:2px 6px;border-radius:4px;font-size:11px">' + s[0] + '</code></td>';
    table += '<td style="padding:4px 8px;border-bottom:1px solid var(--rule);color:var(--ink)">' + s[1] + '</td></tr>';
  });
  table += '</table>';

  panel.innerHTML = header + table;
  overlay.appendChild(panel);
  document.body.appendChild(overlay);
}

init();
