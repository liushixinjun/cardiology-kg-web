.prop-label {

  text-transform: uppercase; letter-spacing: .06em; margin-bottom: 4px;
}
.prop-input {
  width: 100%; padding: 7px 10px; border: 1px solid var(--rule);
  border-radius: 5px; background: var(--bg3); color: var(--ink);
  font-size: 12px; outline: none; font-family: inherit;
}
.prop-input:focus { border-color: var(--accent); }
textarea.prop-input { min-height: 60px; resize: vertical; }
select.prop-input { cursor: pointer; }
.prop-btn {
  width: 100%; padding: 8px; border: none; border-radius: 5px;
  background: var(--accent); color: #fff; font-size: 12px; font-weight: 600;
  cursor: pointer; transition: opacity .15s;
}
.prop-btn:hover { opacity: .9; }
.prop-empty { text-align: center; padding: 40px 16px; color: var(--muted); font-size: 13px; }
.prop-empty-icon { font-size: 32px; margin-bottom: 10px; opacity: .5; }
.prop-info { font-size: 11px; color: var(--muted); line-height: 1.8; }

/* ===== Context Menu ===== */
.context-menu {
  display: none; position: fixed; z-index: 9999;
  background: var(--bg2); border: 1px solid var(--rule);
  border-radius: 8px; box-shadow: 0 8px 32px rgba(0,0,0,.5);
  padding: 4px; min-width: 150px;
}
.context-menu.show { display: block; }
.context-menu-item {
  display: flex; align-items: center; gap: 8px;
  padding: 7px 12px; border-radius: 5px;
  font-size: 12px; font-weight: 600; color: var(--ink);
  cursor: pointer; transition: background .1s;
}
.context-menu-item:hover { background: var(--bg3); }
.context-menu-item.danger { color: var(--accent2); }
.context-menu-sep { height: 1px; background: var(--rule); margin: 4px 8px; }

/* ===== Validation Panel ===== */
.validation-panel {
  position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%);
  width: 600px; max-height: 250px; background: var(--bg1);
  border: 1px solid var(--rule); border-radius: 10px;
  box-shadow: 0 4px 16px rgba(0,0,0,.15); z-index: 200;
  overflow: hidden; transition: all .2s;
}
.validation-panel.collapsed { display: none; }
.validation-header {
  display: flex; justify-content: space-between; align-items: center;
  padding: 8px 12px; background: var(--bg2); border-bottom: 1px solid var(--rule);
  font-size: 13px; font-weight: 700;
}
.validation-body {
  padding: 8px 12px; overflow-y: auto; max-height: 200px;
  font-size: 12px;
}
.validation-item {
  padding: 4px 0; border-bottom: 1px solid var(--rule);
  display: flex; align-items: center; gap: 8px;
}
.validation-item:last-child { border-bottom: none; }
.validation-pass { color: #52c41a; }
.validation-fail { color: #ff4d4f; }

/* ===== Path Overview ===== */
.path-overview {
  position: absolute; top: 8px; left: 50%; transform: translateX(-50%);
  background: rgba(255,255,255,.92); border: 1px solid var(--rule);
  border-radius: 8px; padding: 3px 10px; z-index: 50;
  box-shadow: 0 2px 8px rgba(0,0,0,.06);
  display: flex; align-items: center; gap: 8px;
  font-size: 11px; max-width: calc(100% - 100px);
  pointer-events: none;
}
.path-overview-title { font-weight: 700; font-size: 14px; color: var(--ink); }
.path-overview-meta { color: var(--muted); display: flex; gap: 8px; }
.path-overview-meta span { background: var(--bg2); padding: 2px 8px; border-radius: 4px; }

/* ===== Toast ===== */
.toast {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
  padding: 10px 24px; border-radius: 8px;
  background: var(--bg3); border: 1px solid var(--accent);
  color: var(--ink); font-size: 13px; font-weight: 600;
  z-index: 9999; opacity: 0; transition: opacity .3s;
  pointer-events: none;
}
.toast.show { opacity: 1; }

/* ===== Drag Preview ===== */
.drag-preview {
  position: fixed; pointer-events: none; z-index: 9999;
  opacity: .7; transform: translate(-50%, -50%);
}

/* ===== Event Legend ===== */
.event-legend {
  position: absolute; bottom: 12px; left: 12px;
  background: rgba(255,255,255,.95); border: 1px solid var(--rule);
  border-radius: 8px; padding: 8px 12px; z-index: 100;
  font-size: 10px; box-shadow: 0 2px 8px rgba(0,0,0,.08);
  max-height: 280px; overflow: hidden;
  transition: max-height .2s ease, padding .2s ease;
}
.event-legend.collapsed { max-height: 0; padding-top: 0; padding-bottom: 0; overflow: hidden; }
.event-legend-header { display: flex; align-items: center; justify-content: space-between; cursor: pointer; }
.event-legend-toggle { font-size: 14px; color: var(--muted); }
.event-legend-title { font-weight: 700; margin-bottom: 4px; }
.event-legend-item { display: flex; align-items: center; gap: 6px; margin-bottom: 2px; }
.event-legend-color { width: 20px; height: 3px; border-radius: 2px; }

/* ===== Auto Save Badge ===== */
.auto-save-badge {
  font-size: 10px; color: var(--muted);
}

/* ===== Canvas Layers ===== */
.canvas-layer {
  position: absolute; left: 0; right: 0;
  border-bottom: 1px dashed var(--rule);
  transition: height .3s ease;
  overflow: hidden;
}
.canvas-layer-header {
  position: absolute; top: 0; left: 0; right: 0;
  height: 28px; background: rgba(15,23,42,.9);
  display: flex; align-items: center; padding: 0 12px;
  font-size: 11px; font-weight: 700; color: var(--muted);
  z-index: 5; border-bottom: 1px solid var(--rule);
  backdrop-filter: blur(8px);
}
.canvas-layer-toggle {
  cursor: pointer; margin-left: auto; font-size: 14px;
  transition: transform .2s;
}
.canvas-layer-toggle.collapsed { transform: rotate(-90deg); }
.canvas-layer-1 { top: 0; }
.canvas-layer-2 { top: 0; }
.canvas-layer-3 { top: 0; }
.canvas-layer.collapsed { height: 28px !important; }
.canvas-layer-badge {
  display: inline-block; padding: 1px 6px; border-radius: 4px;
  font-size: 9px; font-weight: 700; margin-left: 6px;
}
.canvas-layer-badge.main { background: rgba(79,140,255,.2); color: #4f8cff; }
.canvas-layer-badge.channel { background: rgba(255,77,79,.15); color: #ff4d4f; }
.canvas-layer-badge.branch { background: rgba(204,93,232,.15); color: #cc5de8; }

/* ===== Bottom Global Config Bar ===== */
.bottom-config-bar { box-shadow: 0 -4px 12px rgba(0,0,0,.15); }
.bottom-config-bar .prop-input { padding: 3px 8px; height: 26px; }
</style>

function toggleLayer(layerKey) {
  CANVAS_LAYERS[layerKey].visible = !CANVAS_LAYERS[layerKey].visible;
  var btn = document.getElementById('layerBtn-' + layerKey);
  if (btn) {
    btn.style.opacity = CANVAS_LAYERS[layerKey].visible ? '1' : '0.4';
  }
  // 重新渲染画布上的节点
  applyLayerVisibility();
}

function applyLayerVisibility() {
  nodes.forEach(function(n) {
    var info = NODE_TYPE_MAP[n.type];
    if (!info) return;
    var layer = null;
    for (var key in CANVAS_LAYERS) {
      if (CANVAS_LAYERS[key].nodeTypes.indexOf(n.type) !== -1) {
        layer = key;
        break;
      }
    }
    if (layer && !CANVAS_LAYERS[layer].visible) {
      var el = document.getElementById('node-' + n.id);
      if (el) el.style.display = 'none';
    } else {
      var el2 = document.getElementById('node-' + n.id);
      if (el2) el2.style.display = '';
    }
  });
  // 同时隐藏/显示相关连线
  connections.forEach(function(c) {
    var srcNode = findNode(c.sourceId);
    var tgtNode = findNode(c.targetId);
    var hidden = false;
    if (srcNode) {
      var srcInfo = NODE_TYPE_MAP[srcNode.type];
      for (var key in CANVAS_LAYERS) {
        if (!CANVAS_LAYERS[key].visible && srcInfo && CANVAS_LAYERS[key].nodeTypes.indexOf(srcNode.type) !== -1) {
          hidden = true; break;
        }
      }
    }
    if (!hidden && tgtNode) {
      var tgtInfo = NODE_TYPE_MAP[tgtNode.type];
      for (var key2 in CANVAS_LAYERS) {
        if (!CANVAS_LAYERS[key2].visible && tgtInfo && CANVAS_LAYERS[key2].nodeTypes.indexOf(tgtNode.type) !== -1) {
          hidden = true; break;
        }
      }
    }
    var pathEl = document.getElementById('conn-' + c.id);
    if (pathEl) pathEl.style.display = hidden ? 'none' : '';
  });
}

var autoSaveTimer = null;

function startAutoSave() {
  if (autoSaveTimer) clearInterval(autoSaveTimer);
  autoSaveTimer = setInterval(function() {
    if (nodes.length === 0) return;
    try {
      var data = buildFlowData();
      localStorage.setItem('kg_engine_autosave', JSON.stringify(data));
      var now = new Date();
      var timeStr = now.getHours() + ':' + ('0' + now.getMinutes()).slice(-2) + ':' + ('0' + now.getSeconds()).slice(-2);
      var badge = document.getElementById('autoSaveBadge');
      if (badge) badge.textContent = '自动保存 ' + timeStr;
    } catch(e) {}
  }, 30000);
}

   PATHWAY VERSION HISTORY
   ============================ */
var pathwayHistory = [];

function saveToHistory() {
  if (nodes.length === 0) return;
  var snapshot = {
    timestamp: new Date().toISOString(),
    name: flowName,
    nodeCount: nodes.length,
    connCount: connections.length,
    data: buildFlowData()
  };
  pathwayHistory.push(snapshot);
  if (pathwayHistory.length > 20) pathwayHistory.shift();
  try {
    localStorage.setItem('kg_engine_history', JSON.stringify(pathwayHistory));
  } catch(e) {}
}

function loadHistory() {
  try {
    var saved = localStorage.getItem('kg_engine_history');
    if (saved) pathwayHistory = JSON.parse(saved);
  } catch(e) {}
}

  html += '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">';
  html += '<span style="font-size:16px;font-weight:700">版本历史</span>';
  html += '<button onclick="this.closest(\'div[style]\').remove()" style="background:none;border:none;cursor:pointer;font-size:18px;color:var(--muted)">&times;</button></div>';

  if (pathwayHistory.length === 0) {
    html += '<div style="color:var(--muted);text-align:center;padding:20px">暂无版本历史</div>';
  } else {
    html += '<table style="width:100%;font-size:12px;border-collapse:collapse">';
    pathwayHistory.slice().reverse().forEach(function(s, i) {
      var idx = pathwayHistory.length - 1 - i;
      html += '<tr style="border-bottom:1px solid var(--rule)">';
      html += '<td style="padding:6px 8px">' + new Date(s.timestamp).toLocaleString('zh-CN') + '</td>';
      html += '<td style="padding:6px 8px">' + escapeHtml(s.name) + '</td>';
      html += '<td style="padding:6px 8px">' + s.nodeCount + '节点/' + s.connCount + '连线</td>';
      html += '<td style="padding:6px 8px"><button onclick="restoreVersion(' + idx + ')" style="font-size:11px;padding:2px 8px;border:1px solid var(--rule);border-radius:4px;background:var(--bg2);cursor:pointer">恢复</button></td>';
      html += '</tr>';
    });
    html += '</table>';
  }
  html += '</div>';

  var overlay = document.createElement('div');
  overlay.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.3);z-index:9998';
  overlay.onclick = function() { overlay.remove(); };
  overlay.innerHTML = html;
  document.body.appendChild(overlay);
}

function restoreVersion(idx) {
  var snapshot = pathwayHistory[idx];
  if (!snapshot || !snapshot.data) return;
  loadFlowData(snapshot.data);
  if (snapshot.data.meta) pathwayMeta = snapshot.data.meta;
  updatePathOverview();
  showToast('已恢复版本: ' + new Date(snapshot.timestamp).toLocaleString('zh-CN'));
  /* 关闭历史弹窗 */
  var overlays = document.querySelectorAll('div[style*="position:fixed"][style*="z-index:9998"]');
  for (var i = 0; i < overlays.length; i++) {
    overlays[i].remove();
  }
}

/* ============================
   INIT
   ============================ */
function init() {
  canvasEl = document.getElementById('canvas');
  canvasContainer = document.getElementById('canvasContainer');
  connectionsSvg = document.getElementById('connectionsSvg');

  renderPalette();
  renderTemplateList();
  refreshSavedPaths();
  setupCanvasEvents();
  setupKeyboardEvents();
  setupGlobalMouse();
  loadHistory();
  startAutoSave();

  // 检查URL参数，自动加载路径
  var urlParams = new URLSearchParams(window.location.search);

    setTimeout(function() { loadPathwayFromAPI(disease.toLowerCase()); }, 500);
  } else {

    setTimeout(function() { loadAMIExample(); }, 300);
  }
}

/* ============================
   PALETTE
   ============================ */
function renderPalette() {
  var pal = document.getElementById('nodePalette');
  var html = '';

  // 只显示 visible: true 的节点类型
  var visibleTypes = NODE_TYPES.filter(function(t) { return t.visible !== false; });

  // 按组件类型分组：A → BIZ
  var grouped = {};
  visibleTypes.forEach(function(t) {
    var ct = t.componentType || 'A';
    if (!grouped[ct]) grouped[ct] = [];
    grouped[ct].push(t);
  });

  var order = ['A', 'BIZ'];
  order.forEach(function(ct) {
    if (!grouped[ct]) return;
    var ctInfo = COMPONENT_TYPES[ct] || { name: ct, icon: '', color: '#4f8cff', desc: '' };
    var items = grouped[ct];

    // 分类标题（可折叠）
    html += '<div class="palette-category-header" onclick="togglePaletteCategory(this)" style="cursor:pointer;display:flex;align-items:center;gap:6px;padding:6px 8px;margin:6px 0 4px;background:var(--bg3);border-radius:6px;font-size:11px;font-weight:700;color:var(--ink);user-select:none">';
    html += '<span style="font-size:14px">' + ctInfo.icon + '</span>';
    html += '<span>' + ctInfo.name + '</span>';
    html += '<span style="margin-left:auto;font-size:10px;color:var(--muted)">' + items.length + '项</span>';
    html += '<span class="toggle-icon" style="font-size:10px;color:var(--muted)">▼</span>';
    html += '</div>';

    // 分类内容
    html += '<div class="palette-category-body" style="display:flex;flex-direction:column;gap:5px">';
    items.forEach(function(t) {
      html += '<div class="node-palette-item" data-type="' + t.type + '">'
        + '<div class="node-palette-icon" style="background:' + t.color + '22;color:' + t.color + '">' + t.icon + '</div>'
        + '<div><div class="node-palette-label">' + t.name + '</div>'
        + '<div class="node-palette-desc">' + t.desc + '</div></div></div>';
    });
    html += '</div>';
  });

  // 标准主干模板快捷入口
  html += '<div style="height:1px;background:var(--rule);margin:8px 0"></div>';
  html += '<div style="font-size:10px;font-weight:700;color:var(--muted);margin-bottom:4px;text-transform:uppercase;letter-spacing:0.06em">标准主干模板</div>';
  html += '<div class="node-palette-item" onclick="loadGenericTrunk()" style="cursor:pointer;border-color:rgba(114,46,209,0.3)">'
    + '<div class="node-palette-icon" style="background:rgba(114,46,209,0.12);color:#722ed1">📋</div>'
    + '<div><div class="node-palette-label">标准主干模板</div>'
    + '<div class="palette-desc">N1→N2→N3→…→N13标准链路</div></div></div>';
  html += '<div class="node-palette-item" onclick="loadAMIExample()" style="cursor:pointer;border-color:rgba(79,140,255,0.3)">'
    + '<div class="node-palette-icon" style="background:rgba(79,140,255,0.12);color:#4f8cff">🏥</div>'
    + '<div><div class="node-palette-label">AMI急性心梗路径</div>'
    + '<div class="palette-desc">急性心肌梗死专病诊疗路径</div></div></div>';

  pal.innerHTML = html;

  /* Attach mousedown for drag-to-canvas */
  var items = pal.querySelectorAll('.node-palette-item[data-type]');
  for (var i = 0; i < items.length; i++) {
    items[i].addEventListener('mousedown', onPaletteMouseDown);
  }
}

function togglePaletteCategory(header) {
  var body = header.nextElementSibling;
  var icon = header.querySelector('.toggle-icon');
  if (body.style.display === 'none') {
    body.style.display = 'flex';
    icon.textContent = '▼';
  } else {
    body.style.display = 'none';
    icon.textContent = '▶';
  }
}

function filterPalette(keyword) {
  var items = document.querySelectorAll('.node-palette-item');
  var kw = keyword.toLowerCase();
  items.forEach(function(item) {
    var label = item.querySelector('.node-palette-label');
    var desc = item.querySelector('.node-palette-desc');
    var text = (label ? label.textContent : '') + ' ' + (desc ? desc.textContent : '');
    item.style.display = text.toLowerCase().indexOf(kw) > -1 ? '' : 'none';
  });
}

function onPaletteMouseDown(e) {
  e.preventDefault();
  var type = this.getAttribute('data-type');
  var info = NODE_TYPE_MAP[type];

  dragState = { type: 'new-node', nodeType: type };
  didDrag = false;

  /* Create preview element */
  dragPreviewEl = document.createElement('div');
  dragPreviewEl.className = 'drag-preview';
  dragPreviewEl.innerHTML = '<div style="width:180px;padding:8px 12px;background:#fff;border:2px solid ' + info.color + ';border-radius:8px;display:flex;align-items:center;gap:8px;box-shadow:0 4px 12px rgba(0,0,0,.15)">'
    + '<span style="font-size:14px">' + info.icon + '</span>'
    + '<span style="font-size:12px;font-weight:600;color:#333">' + info.name + '</span></div>';
  dragPreviewEl.style.left = e.clientX + 'px';
  dragPreviewEl.style.top = e.clientY + 'px';
  document.body.appendChild(dragPreviewEl);
}

/* ============================
   GLOBAL MOUSE (handles all drag operations)
   ============================ */
function setupGlobalMouse() {
  document.addEventListener('mousemove', function(e) {
    /* --- Palette drag: new node --- */
    if (dragState && dragState.type === 'new-node' && dragPreviewEl) {
      didDrag = true;
      dragPreviewEl.style.left = e.clientX + 'px';
      dragPreviewEl.style.top = e.clientY + 'px';
      return;
    }

    /* --- Move node on canvas --- */
    if (dragState && dragState.type === 'move-node') {
      didDrag = true;
      var node = findNode(dragState.nodeId);
      if (!node) return;
      var dx = (e.clientX - dragState.startMouseX) / canvasScale;
      var dy = (e.clientY - dragState.startMouseY) / canvasScale;
      var newX = dragState.origX + dx;
      var newY = dragState.origY + dy;
      node.x = newX;
      node.y = newY;
      updateNodeDOM(node);

      /* 多选节点一起移动 */
      if (selectedNodeIds.length > 1 && dragState.origPositions) {
        var ddx = newX - dragState.origX;
        var ddy = newY - dragState.origY;
        selectedNodeIds.forEach(function(sid) {
          if (sid === dragState.nodeId) return;
          var other = findNode(sid);
          if (!other || !dragState.origPositions[sid]) return;
          other.x = dragState.origPositions[sid].x + ddx;
          other.y = dragState.origPositions[sid].y + ddy;
          updateNodeDOM(other);
        });
      }

      /* 对齐参考线 */
      var alignThreshold = 5;
      var alignX = null, alignY = null;
      nodes.forEach(function(other) {
        if (other.id === node.id) return;
        if (selectedNodeIds.indexOf(other.id) !== -1) return;
        if (Math.abs(newX - other.x) < alignThreshold) alignX = other.x;
        if (Math.abs(newY - other.y) < alignThreshold) alignY = other.y;
        if (Math.abs(newX - (other.x + 180)) < alignThreshold) alignX = other.x + 180;
        if (Math.abs(newY - (other.y + 60)) < alignThreshold) alignY = other.y + 60;
      });
      removeAlignLines();
      if (alignX !== null) {
        var vline = document.createElement('div');
        vline.className = 'align-line-v';
        vline.style.cssText = 'position:absolute;left:' + alignX + 'px;top:0;width:1px;height:100%;background:rgba(79,140,255,.3);z-index:5;pointer-events:none';
        canvasEl.appendChild(vline);
      }
      if (alignY !== null) {
        var hline = document.createElement('div');
        hline.className = 'align-line-h';
        hline.style.cssText = 'position:absolute;top:' + alignY + 'px;left:0;height:1px;width:100%;background:rgba(79,140,255,.3);z-index:5;pointer-events:none';
        canvasEl.appendChild(hline);
      }

      updateAllConnections();
      return;
    }

    /* --- Draw connection --- */
    if (drawState && drawState.tempPath) {
      var rect = canvasContainer.getBoundingClientRect();
      var mx = (e.clientX - rect.left - canvasOffsetX) / canvasScale;
      var my = (e.clientY - rect.top - canvasOffsetY) / canvasScale;
      var pathD = makeConnPath(drawState.startX, drawState.startY, drawState.sourcePort, mx, my, 'left');
      drawState.tempPath.setAttribute('d', pathD);
    }

    /* --- Canvas panning --- */
    if (isPanning) {
      canvasOffsetX = e.clientX - panStartX;
      canvasOffsetY = e.clientY - panStartY;
      updateCanvasTransform();
    }
  });

  document.addEventListener('mouseup', function(e) {
    /* --- Palette drag end: create node --- */
    if (dragState && dragState.type === 'new-node') {
      if (dragPreviewEl) {
        dragPreviewEl.remove();
        dragPreviewEl = null;
      }
      var rect = canvasContainer.getBoundingClientRect();
      if (e.clientX >= rect.left && e.clientX <= rect.right && e.clientY >= rect.top && e.clientY <= rect.bottom) {
        var cx = (e.clientX - rect.left - canvasOffsetX) / canvasScale;
        var cy = (e.clientY - rect.top - canvasOffsetY) / canvasScale;
        saveUndoState();
        var node = addNode(dragState.nodeType, cx - 90, cy - 30);
        selectNode(node.id);
      }
      dragState = null;
      return;
    }

    /* --- Move node end --- */
    if (dragState && dragState.type === 'move-node') {
      var movedNode = findNode(dragState.nodeId);
      if (movedNode) {
        movedNode.x = snapToGrid(movedNode.x);
        movedNode.y = snapToGrid(movedNode.y);
        updateNodeDOM(movedNode);
      }
      /* 多选节点也snap */
      if (selectedNodeIds.length > 1) {
        selectedNodeIds.forEach(function(sid) {
          if (sid === dragState.nodeId) return;
          var sn = findNode(sid);
          if (sn) {
            sn.x = snapToGrid(sn.x);
            sn.y = snapToGrid(sn.y);
            updateNodeDOM(sn);
          }
        });
      }
      updateAllConnections();
      removeAlignLines();
      dragState = null;
      return;
    }

    /* --- Draw connection end --- */
    if (drawState) {
      /* Check if mouse is over a port */
      var target = document.elementFromPoint(e.clientX, e.clientY);
      if (target && target.classList.contains('port')) {
        var targetNodeId = target.getAttribute('data-node');
        var targetPort = target.getAttribute('data-port');
        if (targetNodeId && targetNodeId !== drawState.sourceNodeId) {
          saveUndoState();
          addConnection(drawState.sourceNodeId, targetNodeId, drawState.sourcePort, targetPort, '', '无条件');
        }
      }
      /* Clean up temp path */
      if (drawState.tempPath) {
        drawState.tempPath.remove();
      }
      drawState = null;
      return;
    }

    /* --- Panning end --- */
    if (isPanning) {
      isPanning = false;
      canvasContainer.classList.remove('panning');
    }
  });
}

/* ============================
   NODE MANAGEMENT
   ============================ */
function addNode(type, x, y, cfg) {
  var info = NODE_TYPE_MAP[type];
  var defaults = cfg || {};
  var node = {
    id: 'n' + (nextNodeId++),
    type: type,
    label: defaults.label || info.name,
    x: snapToGrid(Math.round(x)),
    y: snapToGrid(Math.round(y)),
    description: defaults.description || '',
    config: defaults.config || {}
  };
  nodes.push(node);
  renderNode(node);
  return node;
}

function renderNode(node) {
  var info = NODE_TYPE_MAP[node.type];
  var el = document.createElement('div');
  
  // 根据节点类型添加不同的CSS类
  var nodeClass = 'flow-node';
  if (node.type === 'start') {
    nodeClass += ' node-start';
  } else if (node.type === 'end') {
    nodeClass += ' node-end';
  } else if (node.type === 'decision') {
    nodeClass += ' node-decision';
  } else if (node.type === 'global_var') {
    nodeClass += ' node-global-var';
  } else if (node.type === 'gateway') {
    nodeClass += ' node-gateway';
  } else if (node.type.indexOf('n1_') === 0 || node.type.indexOf('n2_') === 0 || node.type.indexOf('n3_') === 0 || node.type.indexOf('n5_') === 0 || node.type.indexOf('n6_') === 0 || node.type.indexOf('n7_') === 0 || node.type.indexOf('n8_') === 0 || node.type.indexOf('n9_') === 0 || node.type.indexOf('n10_') === 0 || node.type.indexOf('n11_') === 0 || node.type.indexOf('n12_') === 0 || node.type.indexOf('n13_') === 0) {
    nodeClass += ' node-biz';
  } else {
    nodeClass += ' node-general';
  }
  
  el.className = nodeClass;
  el.id = 'node-' + node.id;
  el.setAttribute('data-id', node.id);
  el.style.left = node.x + 'px';
  el.style.top = node.y + 'px';

  var descHtml = node.description ? '<div class="node-desc">' + escapeHtml(node.description) + '</div>' : '';

  // 根据节点类型生成不同的HTML
  if (node.type === 'start' || node.type === 'end') {
    // 开始和结束节点 - 显示图标+标签
    el.innerHTML = '<div class="node-body">'
      + '<div class="node-icon">' + info.icon + '</div>'
      + '<div class="node-label" id="label-' + node.id + '">' + escapeHtml(node.label) + '</div>'
      + '</div>';
  } else if (node.type === 'decision') {
    // 决策节点 - SVG菱形 + 标签
    el.innerHTML = '<svg class="diamond-svg" viewBox="0 0 140 100" preserveAspectRatio="none">'
      + '<polygon points="70,4 136,50 70,96 4,50"/>'
      + '</svg>'
      + '<div class="node-body">'
      + '<div class="node-label" id="label-' + node.id + '">' + escapeHtml(node.label) + '</div>'
      + '</div>';
  } else if (node.type === 'gateway') {
    // 网关节点 - SVG菱形 + 标签
    el.innerHTML = '<svg class="diamond-svg" viewBox="0 0 120 90" preserveAspectRatio="none">'
      + '<polygon points="60,3 117,45 60,87 3,45"/>'
      + '</svg>'
      + '<div class="node-body">'
      + '<div class="node-label" id="label-' + node.id + '">' + escapeHtml(node.label) + '</div>'
      + '</div>';
  } else {
    // 能力节点和通用节点 - 显示完整头部+内容
    el.innerHTML = '<div class="node-header" style="background:' + info.color + '">'
      + '<span class="node-icon">' + info.icon + '</span>'
      + '<span class="node-type-name">' + info.name + '</span>'
      + '</div>'
      + '<div class="node-body">'
      + '<div class="node-label" id="label-' + node.id + '">' + escapeHtml(node.label) + '</div>'
      + descHtml
      + '</div>';
  }
  
  // 添加连接点
  el.innerHTML += '<div class="port port-top" data-node="' + node.id + '" data-port="top"></div>'
    + '<div class="port port-bottom" data-node="' + node.id + '" data-port="bottom"></div>'
    + '<div class="port port-left" data-node="' + node.id + '" data-port="left"></div>'
    + '<div class="port port-right" data-node="' + node.id + '" data-port="right"></div>';

  // 添加事件徽章（如果有配置事件）
  var boundEvents = (node.config && node.config.events) ? node.config.events : ((node.config && node.config.event) ? [node.config.event] : []);
  if (boundEvents.length > 0) {
    var eventBadge = document.createElement('div');
    eventBadge.className = 'node-event-badge';
    eventBadge.title = boundEvents.join(', ');
    eventBadge.textContent = '📡' + boundEvents.length;
    el.appendChild(eventBadge);
  }

  // 添加规则徽章（双规则引擎）
  var boundRules = (node.config && node.config.rules) ? node.config.rules : [];
  if (boundRules.length > 0) {
    var hasGraph = boundRules.some(function(r){return r.type==='graph'});
    var hasDrools = boundRules.some(function(r){return r.type==='drools'});
    var ruleBadge = document.createElement('div');
    ruleBadge.className = 'node-rule-badge';
    ruleBadge.style.cssText = 'position:absolute;bottom:-8px;left:4px;display:flex;gap:2px';
    var ruleTitle = boundRules.map(function(r){return r.type==='graph' ? r.ruleCode : (r.rulePackage+'::'+r.ruleName)}).join(', ');
    ruleBadge.title = ruleTitle;
    if (hasGraph) {
      ruleBadge.innerHTML += '<span style="font-size:10px;padding:1px 4px;border-radius:3px;background:rgba(79,140,255,.2);color:#4f8cff">🧠</span>';
    }
    if (hasDrools) {
      ruleBadge.innerHTML += '<span style="font-size:10px;padding:1px 4px;border-radius:3px;background:rgba(255,107,107,.2);color:#ff6b6b">📜</span>';
    }
    el.appendChild(ruleBadge);
  }

  // 添加状态徽章（能力节点状态机）
  if (node.type && node.type.indexOf('ability_') === 0) {
    var nodeState = (node.config && node.config.state) || 'PENDING';
    var stateInfo = NODE_STATE_MAP[nodeState] || NODE_STATE_MAP['PENDING'];
    var stateBadge = document.createElement('div');
    stateBadge.className = 'node-state-badge';
    stateBadge.style.cssText = 'position:absolute;top:-8px;right:-4px;font-size:9px;padding:2px 5px;border-radius:3px;background:' + stateInfo.bg + ';color:' + stateInfo.color + ';font-weight:700;border:1px solid ' + stateInfo.color + '33';
    stateBadge.title = nodeState + ' - ' + stateInfo.label;
    stateBadge.textContent = stateInfo.label;
    el.appendChild(stateBadge);

    // 配置不完整标识
    var configComplete = boundEvents.length > 0 && boundRules.length > 0 && (node.config.output_type || node.config.output_desc);
    if (!configComplete) {
      el.style.borderStyle = 'dashed';
      el.style.borderColor = 'rgba(255,107,107,.4)';
    }
  }

  // CDSS特殊徽章
  if (node.type === 'disease_entry' && node.config && node.config.disease_name) {
    var diseaseBadge = document.createElement('div');
    diseaseBadge.className = 'node-disease-badge';
    diseaseBadge.title = node.config.disease_name;
    diseaseBadge.textContent = node.config.disease_name.substring(0, 8);
    el.appendChild(diseaseBadge);
  }
  if (node.type === 'recommendation' && node.config && node.config.recommendation_class) {
    var recBadge = document.createElement('div');
    recBadge.className = 'node-rec-badge';
    recBadge.title = '推荐等级: ' + node.config.recommendation_class;
    recBadge.textContent = node.config.recommendation_class;
    el.appendChild(recBadge);
  }
  if (node.type === 'contraindication') {
    el.classList.add('node-contraindication-border');
  }

  // 配置完整性指示器
  if (info && (info.category === 'ability' || info.category === 'cdss')) {
    var configComplete = node.config && node.config.rule && node.config.event;
    if (node.type === 'disease_entry') configComplete = node.config && node.config.disease_code;
    if (node.type === 'recommendation') configComplete = node.config && node.config.recommendation_class;
    if (node.type === 'evidence_node') configComplete = node.config && (node.config.evidence_id || node.config.source_guideline);
    if (node.type === 'contraindication') configComplete = node.config && node.config.contraindication_conditions;
    if (node.type === 'pathway_stage') configComplete = node.config && node.config.stage_type;
    if (node.type === 'guideline_ref') configComplete = node.config && node.config.guideline_code;
    var dotColor = configComplete ? '#52c41a' : '#ff4d4f';
    el.innerHTML += '<div class="node-config-dot" style="position:absolute;bottom:-4px;right:-4px;width:10px;height:10px;border-radius:50%;background:' + dotColor + ';border:2px solid #fff;z-index:15" title="' + (configComplete ? '配置完整' : '配置不完整') + '"></div>';
  }

  canvasEl.appendChild(el);
  setTimeout(updateMinimap, 50);
  setTimeout(updatePathOverview, 50);

  /* Node mousedown: start move drag + select */
  el.addEventListener('mousedown', function(e) {
    if (e.target.classList.contains('port')) return;
    if (e.button !== 0) return;
    e.stopPropagation();
    didDrag = false;
    saveUndoState();
    selectNode(node.id, e.shiftKey);
    /* 保存多选节点原始位置 */
    var origPositions = {};
    if (selectedNodeIds.length > 1) {
      selectedNodeIds.forEach(function(sid) {
        var sn = findNode(sid);
        if (sn) origPositions[sid] = { x: sn.x, y: sn.y };
      });
    }
    dragState = {
      type: 'move-node',
      nodeId: node.id,
      startMouseX: e.clientX,
      startMouseY: e.clientY,
      origX: node.x,
      origY: node.y,
      origPositions: origPositions
    };
  });

  /* Node click: select (suppress if dragged) */
  el.addEventListener('click', function(e) {
    if (didDrag) return;
    if (e.target.classList.contains('port')) return;
    e.stopPropagation();
    selectNode(node.id, e.shiftKey);
  });

  /* Right-click context menu */
  el.addEventListener('contextmenu', function(e) {
    e.preventDefault();
    e.stopPropagation();
    selectNode(node.id);
    showContextMenu(e.clientX, e.clientY);
  });

  /* Port events */
  var ports = el.querySelectorAll('.port');
  for (var i = 0; i < ports.length; i++) {
    (function(port) {
      port.addEventListener('mousedown', function(e) {
        e.preventDefault();
        e.stopPropagation();
        var portName = port.getAttribute('data-port');
        startConnectionDraw(e, node.id, portName);
      });
    })(ports[i]);
  }
}

function updateNodeDOM(node) {
  var el = document.getElementById('node-' + node.id);
  if (!el) return;
  el.style.left = node.x + 'px';
  el.style.top = node.y + 'px';
  var labelEl = document.getElementById('label-' + node.id);
  if (labelEl) labelEl.textContent = node.label;
  setTimeout(updateMinimap, 50);
}

function removeNodeFromDOM(nodeId) {
  var el = document.getElementById('node-' + nodeId);
  if (el) el.remove();
}

/* ============================
   CONNECTION DRAWING
   ============================ */
function startConnectionDraw(e, sourceNodeId, sourcePort) {
  e.preventDefault();
  var pos = getPortPosition(sourceNodeId, sourcePort);
  drawState = {
    sourceNodeId: sourceNodeId,
    sourcePort: sourcePort,
    startX: pos.x,
    startY: pos.y,
    tempPath: null
  };

  /* Create temp SVG path */
  var pathEl = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  pathEl.classList.add('temp-path');
  pathEl.setAttribute('fill', 'none');
  pathEl.setAttribute('stroke', 'rgba(79,140,255,0.5)');
  pathEl.setAttribute('stroke-width', '2');
  pathEl.setAttribute('stroke-dasharray', '6,4');
  connectionsSvg.appendChild(pathEl);
  drawState.tempPath = pathEl;
}

/* ============================
   CONNECTION MANAGEMENT
   ============================ */
function addConnection(sourceId, targetId, sourcePort, targetPort, label, eventType) {
  /* Prevent duplicates */
  for (var i = 0; i < connections.length; i++) {
    if (connections[i].sourceId === sourceId && connections[i].targetId === targetId) return null;
  }
  /* Prevent self-connection */
  if (sourceId === targetId) return null;

  var conn = {
    id: 'c' + (nextConnId++),
    sourceId: sourceId,
    targetId: targetId,
    sourcePort: sourcePort,
    targetPort: targetPort,
    label: label || '',
    eventType: eventType || '无条件',
    condition: ''
  };
  connections.push(conn);
  renderConnection(conn);
  return conn;
}

function renderConnection(conn) {
  var srcPos = getPortPosition(conn.sourceId, conn.sourcePort);
  var tgtPos = getPortPosition(conn.targetId, conn.targetPort);
  if (!srcPos || !tgtPos) return;

  /* SVG path */
  var pathD = makeConnPath(srcPos.x, srcPos.y, conn.sourcePort, tgtPos.x, tgtPos.y, conn.targetPort);
  var pathEl = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  pathEl.classList.add('conn-path');
  pathEl.setAttribute('id', 'conn-' + conn.id);
  pathEl.setAttribute('d', pathD);
  pathEl.setAttribute('fill', 'none');
  var connColor = EVENT_COLORS[conn.eventType] || 'rgba(0,0,0,0.2)';
  pathEl.setAttribute('stroke', connColor);
  pathEl.setAttribute('stroke-width', '1.5');
  pathEl.setAttribute('marker-end', 'url(#arrowhead)');
  pathEl.setAttribute('data-conn', conn.id);
  connectionsSvg.appendChild(pathEl);

  /* Click to select connection */
  pathEl.addEventListener('mousedown', function(e) {
    e.stopPropagation();
    selectConnection(conn.id);
  });

  /* Label */
  if (conn.label) {
    renderConnectionLabel(conn);
  }
  setTimeout(updateMinimap, 50);
}

function renderConnectionLabel(conn) {
  var srcPos = getPortPosition(conn.sourceId, conn.sourcePort);
  var tgtPos = getPortPosition(conn.targetId, conn.targetPort);
  if (!srcPos || !tgtPos) return;

  var mx = (srcPos.x + tgtPos.x) / 2;
  var my = (srcPos.y + tgtPos.y) / 2;

  var lbl = document.createElement('div');
  lbl.className = 'conn-label';
  lbl.id = 'conn-label-' + conn.id;
  lbl.textContent = conn.label;
  lbl.style.left = mx + 'px';
  lbl.style.top = my + 'px';
  lbl.setAttribute('data-conn', conn.id);
  
  // 添加事件类型属性，用于区分显示
  if (conn.eventType && conn.eventType !== '无条件') {
    lbl.setAttribute('data-event-type', conn.eventType);
    lbl.title = '触发事件: ' + conn.eventType;
  }

  lbl.addEventListener('mousedown', function(e) {
    e.stopPropagation();
    selectConnection(conn.id);
  });
  lbl.addEventListener('click', function(e) {
    e.stopPropagation();
  });

  // 双击内联编辑连接标签
  lbl.addEventListener('dblclick', function(e) {
    e.stopPropagation();
    var currentLabel = conn.label;
    var input = document.createElement('input');
    input.type = 'text';
    input.value = currentLabel;
    input.style.cssText = 'position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:10px;font-weight:700;padding:2px 6px;border:1px solid var(--accent);border-radius:4px;width:100px;text-align:center;z-index:100';
    input.className = 'conn-label-edit';
    lbl.innerHTML = '';
    lbl.appendChild(input);
    input.focus();
    input.select();

    function finishEdit() {
      conn.label = input.value;
      lbl.textContent = conn.label || '\u2192';
      lbl.className = 'conn-label' + (selectedConnId === conn.id ? ' selected' : '');
    }

    input.addEventListener('blur', finishEdit);
    input.addEventListener('keydown', function(ev) {
      if (ev.key === 'Enter') { finishEdit(); }
      if (ev.key === 'Escape') { lbl.textContent = conn.label || '\u2192'; lbl.className = 'conn-label' + (selectedConnId === conn.id ? ' selected' : ''); }
    });
  });

  canvasEl.appendChild(lbl);
}

function updateConnectionDOM(conn) {
  var srcPos = getPortPosition(conn.sourceId, conn.sourcePort);
  var tgtPos = getPortPosition(conn.targetId, conn.targetPort);
  if (!srcPos || !tgtPos) return;

  var pathEl = document.getElementById('conn-' + conn.id);
  if (pathEl) {
    pathEl.setAttribute('d', makeConnPath(srcPos.x, srcPos.y, conn.sourcePort, tgtPos.x, tgtPos.y, conn.targetPort));
  }

  /* Update label position */
  var lblEl = document.getElementById('conn-label-' + conn.id);
  if (lblEl) {
    lblEl.style.left = ((srcPos.x + tgtPos.x) / 2) + 'px';
    lblEl.style.top = ((srcPos.y + tgtPos.y) / 2) + 'px';
  }
}

function removeConnectionDOM(connId) {
  var pathEl = document.getElementById('conn-' + connId);
  if (pathEl) pathEl.remove();
  var lblEl = document.getElementById('conn-label-' + connId);
  if (lblEl) lblEl.remove();
}

function updateAllConnections() {
  for (var i = 0; i < connections.length; i++) {
    updateConnectionDOM(connections[i]);
  }
  setTimeout(updateMinimap, 50);
}

/* ============================
   SELECTION
   ============================ */
function selectNode(id, addToSelection) {
  if (addToSelection && selectedNodeId) {
    /* 多选模式 */
    if (selectedNodeIds.indexOf(id) === -1) {
      selectedNodeIds.push(id);
    }
    selectedNodeIds.forEach(function(sid) {
      var el = document.getElementById('node-' + sid);
      if (el) el.classList.add('selected');
    });
    return;
  }
  /* 单选模式 */
  clearNodeSelection();
  deselectConnHighlight();
  selectedConnId = null;
  selectedNodeId = id;
  selectedNodeIds = id ? [id] : [];

  if (id) {
    var el = document.getElementById('node-' + id);
    if (el) el.classList.add('selected');
    renderNodeProperties(id);
  } else {
    renderPropertiesEmpty();
  }
}

function clearNodeSelection() {
  selectedNodeIds.forEach(function(id) {
    var el = document.getElementById('node-' + id);
    if (el) el.classList.remove('selected');
  });
  if (selectedNodeId) {
    var prev = document.getElementById('node-' + selectedNodeId);
    if (prev) prev.classList.remove('selected');
  }
  selectedNodeIds = [];
  selectedNodeId = null;
}

function selectConnection(connId) {
  /* Deselect all nodes */
  clearNodeSelection();
  deselectConnHighlight();

  selectedConnId = connId;
  highlightConn(connId);

  var conn = findConnection(connId);
  if (conn) renderConnectionProperties(conn);
}

function deselectAll() {
  clearNodeSelection();
  deselectConnHighlight();
  selectedConnId = null;
  renderPropertiesEmpty();
  hideContextMenu();
}

function highlightConn(connId) {
  var pathEl = document.getElementById('conn-' + connId);
  if (pathEl) {
    pathEl.setAttribute('stroke', '#4f8cff');
    pathEl.setAttribute('stroke-width', '2');
    pathEl.setAttribute('marker-end', 'url(#arrowhead-active)');
  }
  var lblEl = document.getElementById('conn-label-' + connId);
  if (lblEl) lblEl.classList.add('selected');
}

function deselectConnHighlight() {
  if (selectedConnId) {
    var prevPath = document.getElementById('conn-' + selectedConnId);
    if (prevPath) {
      var conn = findConnection(selectedConnId);
      var restoreColor = (conn && EVENT_COLORS[conn.eventType]) || 'rgba(0,0,0,0.2)';
      prevPath.setAttribute('stroke', restoreColor);
      prevPath.setAttribute('stroke-width', '1.5');
      prevPath.setAttribute('marker-end', 'url(#arrowhead)');
    }
    var prevLbl = document.getElementById('conn-label-' + selectedConnId);
    if (prevLbl) prevLbl.classList.remove('selected');
  }
}

/* ============================
   PROPERTIES PANEL
   ============================ */
function toggleRightPanel(show) {
  var panel = document.getElementById('rightPanel');
  if (show === undefined) {
    panel.classList.toggle('collapsed');
  } else if (show) {
    panel.classList.remove('collapsed');
  } else {
    panel.classList.add('collapsed');
  }
}

function togglePinPanel() {
  panelPinned = !panelPinned;
  var btn = document.getElementById('pinBtn');
  if (panelPinned) {
    btn.classList.add('active');
    btn.title = '固定面板：开启时点击空白不会收起';
    // 确保面板展开
    document.getElementById('rightPanel').classList.remove('collapsed');
  } else {
    btn.classList.remove('active');
    btn.title = '固定面板：已关闭，点击空白将收起面板';
  }
  showToast(panelPinned ? '面板已固定' : '面板已解锁');
}

function toggleLeftPanel() {
  var panel = document.getElementById('leftPanel');
  var toggle = document.getElementById('leftPanelToggle');
  panel.classList.toggle('collapsed');
  toggle.classList.toggle('collapsed');
  toggle.textContent = panel.classList.contains('collapsed') ? '▶' : '◀';
}

function toggleMinimap() {
  var mm = document.getElementById('minimap');
  mm.classList.toggle('hidden');
}

function toggleEventLegend() {
  var legend = document.getElementById('eventLegend');
  var toggle = document.getElementById('eventLegendToggle');
  var body = document.getElementById('eventLegendBody');
  legend.classList.toggle('collapsed');
  toggle.textContent = legend.classList.contains('collapsed') ? '▶' : '▼';
}

function switchRightTab(tab) {
  var tabs = ['prop', 'interpret', 'validate'];
  var bodies = { prop: 'rightPanelBody', interpret: 'rightPanelInterpret', validate: 'rightPanelValidate' };
  tabs.forEach(function(t) {
    var tabBtn = document.getElementById('tab-' + t);
    var body = document.getElementById(bodies[t]);
    if (t === tab) {
      tabBtn.style.background = 'var(--bg2)';
      tabBtn.style.color = 'var(--accent)';
      body.style.display = '';
    } else {
      tabBtn.style.background = 'var(--bg3)';
      tabBtn.style.color = 'var(--muted)';
      body.style.display = 'none';
    }
  });
  
  // If switching to interpret tab, render the pathway interpretation
  if (tab === 'interpret') {
    document.getElementById('rightPanelInterpret').innerHTML = interpretPathway();
  }
  // If switching to validate tab, run validation
  if (tab === 'validate') {
    var errors = validateFlow();
    var h = '';
    if (errors.length === 0) {
      h = '<div style="text-align:center;padding:20px"><div style="font-size:32px">✅</div><div style="font-size:14px;color:var(--green);font-weight:600;margin-top:8px">校验通过</div><div style="font-size:12px;color:var(--muted);margin-top:4px">所有节点配置完整，可以导出</div></div>';
    } else {
      h = '<div style="font-size:13px;color:var(--accent2);font-weight:600;margin-bottom:10px">发现 ' + errors.length + ' 个问题：</div>';
      errors.forEach(function(e) { h += '<div style="font-size:12px;color:var(--muted);padding:4px 0;border-bottom:1px solid var(--rule)">⚠ ' + escapeHtml(e) + '</div>'; });
    }
    // Also show compile result
    var compileResult = compilePathway();
    if (compileResult.valid) {
      h += '<div style="margin-top:16px;padding:10px;background:rgba(81,207,102,.06);border-radius:6px">';
      h += '<div style="font-size:12px;font-weight:600;color:var(--green)">编译成功 (L2 ExecutionPlan)</div>';
      h += '<div style="font-size:11px;color:var(--muted);margin-top:4px">DAG节点: ' + Object.keys(compileResult.plan.dag).length + '</div>';
      h += '<div style="font-size:11px;color:var(--muted)">编译规则: ' + Object.keys(compileResult.plan.compiledRules).length + '个节点</div>';
      h += '<div style="font-size:11px;color:var(--muted)">事件订阅: ' + Object.keys(compileResult.plan.eventSubscriptions).length + '种事件</div>';
      h += '</div>';
    }
    document.getElementById('rightPanelValidate').innerHTML = h;
  }
}

function renderPropertiesEmpty() {
  document.getElementById('rightPanelBody').innerHTML =
    '<div class="prop-empty"><div class="prop-empty-icon">🖱</div><div>选择节点或连线查看配置</div></div>';
  // 面板未固定时才收起
  if (!panelPinned) {
    toggleRightPanel(false);
  }
}

function renderNodeProperties(nodeId) {

  var info = NODE_TYPE_MAP[node.type];
  // 选中节点时展开属性面板

    + '<textarea class="prop-input" id="prop-desc" oninput="onNodePropChange(\'description\',this.value)">' + escapeHtml(node.description) + '</textarea></div>';

    + '<input class="prop-input" value="' + info.name + '" readonly style="opacity:.6;cursor:not-allowed"></div>';

  /* 已移除 */

  }

  if (node.type === 'decision') {

    h += '<textarea class="prop-input" oninput="onNodeConfigChange(\'condition\',this.value)" placeholder="描述判断逻辑，如：STEMI/NSTEMI分型鉴别">' + escapeHtml(node.config.condition || '') + '</textarea></div>';

    h += '<div style="font-size:11px;color:var(--muted);margin-bottom:12px;line-height:1.5">开始节点下游第一个，加载就诊渠道、科室、急诊数据，供所有规则读取。<br>⚠️ 固定位置，不可拖拽移位。</div>';
    h += '</div>';
    h += '<div class="prop-group">';
    h += '<div class="prop-label">节点名称</div>';
    h += '<input class="prop-input" value="' + escapeHtml(node.label) + '" oninput="onNodePropChange(\'label\',this.value)">';
    h += '</div>';
    h += '<div class="prop-group">';
    h += '<div class="prop-label">全局准入渠道</div>';
    h += '<div style="font-size:10px;color:var(--muted);margin-bottom:6px">不符合准入渠道的就诊将直接终止流程</div>';

      var checked = gChannels.indexOf(ch.id) >= 0;
      h += '<label style="display:flex;align-items:center;gap:6px;padding:4px 0;font-size:12px;cursor:pointer">';
      h += '<input type="checkbox"' + (checked ? ' checked' : '') + ' onchange="toggleGlobalChannel(\'' + node.id + '\',\'' + ch.id + '\',this.checked)">';
      h += '<span>' + ch.label + '</span></label>';
    });
    h += '</div>';

    });
    h += '</div>';

function toggleGlobalChannel(nodeId, channelId, checked) {
  var node = findNode(nodeId);
  if (!node) return;
  if (!node.config) node.config = {};
  if (!node.config.global_channels) node.config.global_channels = ['emergency', 'outpatient', 'inpatient'];
  if (checked) {
    if (node.config.global_channels.indexOf(channelId) < 0) node.config.global_channels.push(channelId);
  } else {
    node.config.global_channels = node.config.global_channels.filter(function(c) { return c !== channelId; });
  }
  saveUndoState();
  updateNodeDOM(node);
}

function switchAbilityTab(tabName) {
  var panels = ['basic', 'order', 'dify'];
  panels.forEach(function(p) {

    var btn = document.getElementById('atab-' + p);
    if (panel) panel.style.display = (p === tabName) ? '' : 'none';

        btn.style.color = '#fff';

function toggleConnPostAction(connId, actionId, checked) {
  var conn = findConnection(connId);
  if (!conn) return;
  if (!conn.post_actions) conn.post_actions = [];
  if (checked) {
    if (conn.post_actions.indexOf(actionId) < 0) conn.post_actions.push(actionId);
  } else {
    conn.post_actions = conn.post_actions.filter(function(a) { return a !== actionId; });
  }
  saveUndoState();
}

function onNodePropChange(field, value) {
  if (!selectedNodeId) return;
  var node = findNode(selectedNodeId);
  if (!node) return;
  if (field === 'label') {
    node.label = value;
    var lblEl = document.getElementById('label-' + node.id);
    if (lblEl) lblEl.textContent = value;
  } else if (field === 'description') {
    node.description = value;
    /* Update desc in DOM */
    var el = document.getElementById('node-' + node.id);
    if (el) {
      var bodyEl = el.querySelector('.node-body');
      var descEl = el.querySelector('.node-desc');
      if (value) {
        if (descEl) { descEl.textContent = value; }
        else {
          var d = document.createElement('div');
          d.className = 'node-desc';
          d.textContent = value;
          bodyEl.appendChild(d);
        }
      } else {
        if (descEl) descEl.remove();
      }
    }
  }
}

function onNodeConfigChange(field, value) {
  if (!selectedNodeId) return;
  var node = findNode(selectedNodeId);
  if (!node) return;
  node.config[field] = value;
  
  // 如果是事件字段改变，更新节点上的事件徽章
  if (field === 'event') {
    var el = document.getElementById('node-' + node.id);
    if (el) {
      // 移除旧的事件徽章
      var oldBadge = el.querySelector('.node-event-badge');
      if (oldBadge) oldBadge.remove();
      
      // 如果有新事件，添加新的徽章
      if (value && value !== '') {
        var eventBadge = document.createElement('div');
        eventBadge.className = 'node-event-badge';
        eventBadge.title = value;
        eventBadge.textContent = value.replace('EVT_', '').substring(0, 8);
        el.appendChild(eventBadge);
      }
    }
  }
  
  // 状态改变时更新视觉
  if (field === 'state') {
    renderNodes();
  }

  // ICD-10 编码文本转数组（已废弃，保留兼容）
  if (field === 'icd10_codes_text') {
    node.config.icd10_codes = value.split('\n').map(function(s) { return s.trim(); }).filter(function(s) { return s.length > 0; });
  }
}

/* 添加准入规则（仅Drools） */
function addEntryRule() {
  if (!selectedNodeId) return;
  var node = findNode(selectedNodeId);
  if (!node) return;
  var nameEl = document.getElementById('newRuleName');
  if (!nameEl || !nameEl.value.trim()) { showToast('请输入规则编码'); return; }
  if (!node.config.entry_rules) node.config.entry_rules = [];
  node.config.entry_rules.push({ type: 'drools', name: nameEl.value.trim() });
  nameEl.value = '';
  renderNodeProperties(selectedNodeId);
  showToast('已添加准入规则');
}

/* 移除准入规则 */
function removeEntryRule(idx) {
  if (!selectedNodeId) return;
  var node = findNode(selectedNodeId);
  if (!node || !node.config.entry_rules) return;
  node.config.entry_rules.splice(idx, 1);
  renderNodeProperties(selectedNodeId);
  showToast('已移除准入规则');
}

/* 添加连线规则（仅Drools） */
function addConnRule(connId) {
  var connId = connId || selectedConnId;
  if (!connId) return;
  var conn = findConnection(connId);
  if (!conn) return;
  var nameEl = document.getElementById('newConnRuleName');
  if (!nameEl || !nameEl.value.trim()) { showToast('请输入规则编码'); return; }
  if (!conn.rules) conn.rules = [];
  conn.rules.push({ type: 'drools', name: nameEl.value.trim() });
  nameEl.value = '';
  renderConnectionProperties(conn);
  showToast('已添加连线规则');
}

/* 移除连线规则 */
function removeConnRule(connId, idx) {
  var connId = connId || selectedConnId;
  if (!connId) return;
  var conn = findConnection(connId);
  if (!conn || !conn.rules) return;
  conn.rules.splice(idx, 1);
  renderConnectionProperties(conn);
  showToast('已移除连线规则');
}

/* 自动动作绑定切换 */
function toggleAutoAction(nodeId, actionId) {
  var node = findNode(nodeId);
  if (!node) return;
  if (!node.config.auto_actions) node.config.auto_actions = [];
  var idx = node.config.auto_actions.indexOf(actionId);
  if (idx === -1) {
    node.config.auto_actions.push(actionId);
  } else {
    node.config.auto_actions.splice(idx, 1);
  }
  /* 重新渲染属性面板 */
  renderNodeProperties(nodeId);
  showToast(actionId + (idx === -1 ? ' 已启用' : ' 已禁用'));
}

function openRulePicker(nodeId, ruleType) {
  var node = findNode(nodeId);
  if (!node) return;
  if (!node.config.rules) node.config.rules = [];

  var library = ruleType === 'graph' ? GRAPH_RULE_LIBRARY : DROOLS_RULE_LIBRARY;
  var rt = RULE_TYPES.find(function(r){return r.type === ruleType}) || {icon:'❓',name:ruleType,color:'#4f8cff'};

  overlay.onclick = function(e) { if (e.target === overlay) overlay.remove(); };

  var modal = document.createElement('div');
  modal.style.cssText = 'position:relative;background:var(--bg1);border:1px solid var(--rule);border-radius:12px;padding:0;z-index:9999;box-shadow:0 8px 32px rgba(0,0,0,.3);width:520px;max-width:90vw;max-height:80vh;display:flex;flex-direction:column';

  var header = '<div style="display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--rule)">';
  header += '<div style="display:flex;align-items:center;gap:8px">';
  header += '<span style="font-size:18px">' + rt.icon + '</span>';
  header += '<span style="font-size:14px;font-weight:700;color:var(--ink)">' + rt.name + '选择</span>';
  header += '</div>';
  header += '<button onclick="this.closest(\'div[style*=fixed]\').remove()" style="background:none;border:none;color:var(--muted);cursor:pointer;font-size:18px">&times;</button>';
  header += '</div>';

  // 搜索框
  var searchBox = '<div style="padding:10px 16px;border-bottom:1px solid var(--rule)">';
  searchBox += '<input id="rulePickerSearch" placeholder="搜索规则名称/编码/描述..." oninput="filterRulePicker(this.value)" style="width:100%;padding:7px 10px;border:1px solid var(--rule);border-radius:6px;background:var(--bg3);color:var(--ink);font-size:12px;outline:none;box-sizing:border-box">';
  searchBox += '</div>';

  // 规则列表
  var listHtml = '<div id="rulePickerList" style="flex:1;overflow-y:auto;padding:8px">';
  library.forEach(function(rule, idx) {
    listHtml += buildRulePickerItem(rule, idx, ruleType, nodeId);
  });
  listHtml += '</div>';

  modal.innerHTML = header + searchBox + listHtml;
  overlay.appendChild(modal);
  document.body.appendChild(overlay);

  // 存储当前选择上下文
  window._rulePickerContext = { nodeId: nodeId, ruleType: ruleType, library: library };
}

function buildRulePickerItem(rule, idx, ruleType, nodeId) {
  var rt = RULE_TYPES.find(function(r){return r.type === ruleType}) || {icon:'❓',color:'#4f8cff'};
  var name = rule.name || rule.ruleCode || rule.ruleName;
  var code, sub;
  if (ruleType === 'graph') {
    code = rule.ruleCode;
    sub = (rule.disease || '') + ' · ' + (rule.desc || '');
  } else {
    code = rule.rulePackage + '::' + rule.ruleName;
    sub = 'v' + (rule.ruleVersion || '1.0') + ' · ' + (rule.desc || '');
  }
  var html = '<div class="rule-picker-item" data-search="' + escapeAttr(name + ' ' + code + ' ' + sub) + '" onclick="pickRule(' + idx + ')" style="display:flex;align-items:center;gap:8px;padding:8px 10px;margin-bottom:4px;background:var(--bg3);border-radius:6px;border:1px solid var(--rule);cursor:pointer;transition:border-color .15s" onmouseover="this.style.borderColor=\'var(--accent)\'" onmouseout="this.style.borderColor=\'var(--rule)\'">';
  html += '<span style="font-size:16px">' + rt.icon + '</span>';
  html += '<div style="flex:1;min-width:0">';
  html += '<div style="font-size:12px;font-weight:600;color:var(--ink)">' + escapeHtml(name) + '</div>';
  html += '<div style="font-size:10px;color:var(--muted);font-family:monospace">' + escapeHtml(code) + '</div>';
  html += '<div style="font-size:10px;color:var(--muted)">' + escapeHtml(sub) + '</div>';
  html += '</div>';
  html += '<span style="font-size:14px;color:var(--accent)">+</span>';
  html += '</div>';
  return html;
}

function filterRulePicker(keyword) {
  var kw = keyword.toLowerCase();
  var items = document.querySelectorAll('.rule-picker-item');
  items.forEach(function(item) {
    var searchText = (item.getAttribute('data-search') || '').toLowerCase();
    item.style.display = searchText.indexOf(kw) > -1 ? '' : 'none';
  });
}

function pickRule(idx) {
  var ctx = window._rulePickerContext;
  if (!ctx) return;
  var node = findNode(ctx.nodeId);
  if (!node) return;
  if (!node.config.rules) node.config.rules = [];
  var rule = ctx.library[idx];

  // 检查是否已绑定
  var alreadyBound = node.config.rules.some(function(r) {
    if (r.type !== ctx.ruleType) return false;
    if (ctx.ruleType === 'graph') return r.ruleCode === rule.ruleCode;
    return r.ruleName === rule.ruleName && r.rulePackage === rule.rulePackage;
  });
  if (alreadyBound) {
    showToast('该规则已绑定');
    return;
  }

  if (ctx.ruleType === 'graph') {
    node.config.rules.push({
      type: 'graph',
      ruleCode: rule.ruleCode,
      stageCode: '',
      diseaseCode: ''
    });
  } else {
    node.config.rules.push({
      type: 'drools',
      rulePackage: rule.rulePackage,
      ruleName: rule.ruleName,
      ruleVersion: rule.ruleVersion || '1.0'
    });
  }

  // 关闭弹窗
  var overlay = document.querySelector('div[style*="z-index:9998"]');
  if (overlay) overlay.remove();
  window._rulePickerContext = null;

  renderNodeProperties(ctx.nodeId);
  updateNodeDOM(node);
  showToast('规则已绑定: ' + (rule.name || rule.ruleCode || rule.ruleName));
}

function removeNodeRule(nodeId, ruleIndex) {
  var node = findNode(nodeId);
  if (!node || !node.config.rules) return;
  node.config.rules.splice(ruleIndex, 1);
  renderNodeProperties(nodeId);
  updateNodeDOM(node);
}

function onConnPropChange(field, value) {
  if (!selectedConnId) return;

  if (field === 'label') {

  if (field === 'eventType') {

        lbl.setAttribute('data-event-type', value);

      } else {
        lbl.removeAttribute('data-event-type');

      }
    }
    // 更新连接线颜色

      var newColor = EVENT_COLORS[value] || 'rgba(0,0,0,0.2)';
      pathEl.setAttribute('stroke', newColor);

  // 动作类型改变：更新连线样式

        pathEl2.setAttribute('stroke-width', '3');
        pathEl2.setAttribute('stroke-dasharray', 'none');
      }
    }
  }
}

/* ============================
   CANVAS EVENTS
   ============================ */
function setupCanvasEvents() {
  /* Click on canvas background to deselect or pan */
  canvasContainer.addEventListener('mousedown', function(e) {
    if (e.target === canvasContainer || e.target === canvasEl || e.target.classList.contains('connections-svg') || e.target.tagName === 'svg') {
      /* Pan with middle button, space+left, or plain left click on background */
      if (e.button === 1 || (e.button === 0 && spaceHeld) || e.button === 0) {
        e.preventDefault();
        if (e.button === 0 && !spaceHeld) {
          /* Left click on background: deselect + start panning */
          deselectAll();
        }
        isPanning = true;
        panStartX = e.clientX - canvasOffsetX;
        panStartY = e.clientY - canvasOffsetY;
        canvasContainer.classList.add('panning');
        return;
      }
    }
  });

  /* Wheel: scroll to pan, Ctrl+scroll to zoom */
  canvasContainer.addEventListener('wheel', function(e) {
    e.preventDefault();
    if (e.ctrlKey) {
      /* Ctrl+scroll = zoom */
      var rect = canvasContainer.getBoundingClientRect();
      var mx = e.clientX - rect.left;
      var my = e.clientY - rect.top;
      var oldScale = canvasScale;
      var delta = e.deltaY > 0 ? 0.9 : 1.1;
      canvasScale = Math.max(0.2, Math.min(3, canvasScale * delta));
      canvasOffsetX = mx - (mx - canvasOffsetX) * (canvasScale / oldScale);
      canvasOffsetY = my - (my - canvasOffsetY) * (canvasScale / oldScale);
    } else {
      /* Plain scroll = pan */
      canvasOffsetX -= e.deltaX;
      canvasOffsetY -= e.deltaY;
    }
    updateCanvasTransform();
  }, { passive: false });

  /* Hide context menu on canvas click */
  canvasContainer.addEventListener('click', hideContextMenu);

  /* Right-click on canvas blank area */
  canvasContainer.addEventListener('contextmenu', function(e) {
    if (e.target === canvasContainer || e.target === canvasEl || e.target.classList.contains('connections-svg') || e.target.tagName === 'svg') {
      e.preventDefault();
      showCanvasContextMenu(e.clientX, e.clientY);
    }
  });
}

function updateCanvasTransform() {
  canvasEl.style.transform = 'translate(' + canvasOffsetX + 'px, ' + canvasOffsetY + 'px) scale(' + canvasScale + ')';
  document.getElementById('zoomDisplay').textContent = Math.round(canvasScale * 100) + '%';
}

/* ============================
   KEYBOARD EVENTS
   ============================ */
function setupKeyboardEvents() {
  document.addEventListener('keydown', function(e) {
    if (e.key === ' ') {
      e.preventDefault();
      spaceHeld = true;
      canvasContainer.classList.add('panning');
    }
    if (e.key === 'Delete' || e.key === 'Backspace') {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'SELECT') return;
      deleteSelected();
    }
    if (e.key === 'Escape') {
      deselectAll();
      if (drawState && drawState.tempPath) {
        drawState.tempPath.remove();
        drawState = null;
      }
    }
    if (e.ctrlKey && e.key === 'z') {
      e.preventDefault();
      if (e.shiftKey) {
        doRedo();
      } else {
        doUndo();
      }
    }
    if (e.ctrlKey && e.key === 'c') {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'SELECT') return;
      copySelected();
      e.preventDefault();
    }
    if (e.ctrlKey && e.key === 'v') {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'SELECT') return;
      pasteClipboard();
      e.preventDefault();
    }
  });
  document.addEventListener('keyup', function(e) {
    if (e.key === ' ') {
      spaceHeld = false;
      if (!isPanning) canvasContainer.classList.remove('panning');
    }
  });
}

/* ============================
   DELETE
   ============================ */
function deleteSelected() {
  hideContextMenu();
  if (selectedNodeId) {
    saveUndoState();
    /* Remove connected connections */
    var toRemove = [];
    for (var i = 0; i < connections.length; i++) {
      if (connections[i].sourceId === selectedNodeId || connections[i].targetId === selectedNodeId) {
        toRemove.push(connections[i].id);
      }
    }
    for (var j = 0; j < toRemove.length; j++) {
      removeConnectionById(toRemove[j]);
    }
    /* Remove node */
    removeNodeById(selectedNodeId);
  } else if (selectedConnId) {
    saveUndoState();
    removeConnectionById(selectedConnId);
    selectedConnId = null;
    renderPropertiesEmpty();
  }
}

function removeNodeById(id) {
  nodes = nodes.filter(function(n) { return n.id !== id; });
  removeNodeFromDOM(id);
  if (selectedNodeId === id) {
    selectedNodeId = null;
    renderPropertiesEmpty();
  }
}

function removeConnectionById(id) {
  connections = connections.filter(function(c) { return c.id !== id; });
  removeConnectionDOM(id);
  if (selectedConnId === id) {
    selectedConnId = null;
    deselectConnHighlight();
    renderPropertiesEmpty();
  }
}

function duplicateSelected() {

  var orig = findNode(selectedNodeId);

/* Context Menu Actions */
function selectConnectedNodes() {
  if (!selectedNodeId) return;
  var connected = [];
  connections.forEach(function(c) {
    if (c.sourceId === selectedNodeId && connected.indexOf(c.targetId) === -1) connected.push(c.targetId);
    if (c.targetId === selectedNodeId && connected.indexOf(c.sourceId) === -1) connected.push(c.sourceId);
  });
  clearNodeSelection();
  connected.forEach(function(id) { selectNode(id, true); });
  showToast('已选择 ' + connected.length + ' 个关联节点');
}

function centerOnNode() {
  if (!selectedNodeId) return;
  var node = findNode(selectedNodeId);
  if (!node) return;
  canvasOffsetX = -node.x * canvasScale + (canvasContainer ? canvasContainer.clientWidth / 2 : 400);
  canvasOffsetY = -node.y * canvasScale + (canvasContainer ? canvasContainer.clientHeight / 2 : 300);
  updateCanvasTransform();
  updateAllConnections();
}

function saveFlow() {
  var errors = validateFlow();
  if (errors.length > 0) {
    showToast('校验未通过（' + errors.length + '项）：\n' + errors.slice(0, 3).join('\n') + (errors.length > 3 ? '\n...' : ''));
    return;
  }
  saveToHistory();
  var data = buildFlowData();
  try {
    var saved = JSON.parse(localStorage.getItem('kg_engine_flows') || '{}');
    saved[flowName] = data;
    localStorage.setItem('kg_engine_flows', JSON.stringify(saved));
    refreshSavedPaths();

function generateDroolsDRL() {
  var lines = [];
  lines.push('package com.zoesoft.cdss.rules;');
  lines.push('');
  lines.push('import com.zoesoft.cdss.model.*;');
  lines.push('');
  lines.push('// 自动生成自路径编辑器: ' + flowName);
  lines.push('// 疾病: ' + (pathwayMeta.disease_name || 'N/A'));
  lines.push('// 生成时间: ' + new Date().toISOString());
  lines.push('');

  // 1. 疾病准入规则
  var entryNodes = nodes.filter(function(n) { return n.type === 'disease_entry'; });
  entryNodes.forEach(function(n) {
    var entryRules = (n.config && n.config.entry_rules) || [];
    if (entryRules.length === 0) return;
    lines.push('// ===== 疾病准入规则: ' + n.label + ' =====');
    entryRules.forEach(function(r) {
      lines.push('rule "' + r.name + '"');
      lines.push('    salience 200');
      lines.push('    when');
      lines.push('        $ctx: ClinicalContext(diagnosis != null)');
      lines.push('    then');
      lines.push('        // 准入规则: 判断诊断是否属于' + n.label);
      lines.push('        // 通过→' + (n.config.entry_match_action || 'enter_pathway'));
      lines.push('        // 不通过→' + (n.config.entry_nomatch_action || 'exclude'));
      lines.push('        insert(new EntryDecision("' + n.id + '", "' + n.label + '"));');
      lines.push('end');
      lines.push('');
    });
  });

  // 2. 业务组件规则
  nodes.forEach(function(n) {
    if (n.type.indexOf('ability_') !== 0) return;
    var boundRules = (n.config && n.config.rules) || (n.config && n.config.rule ? [{type:'graph',ruleCode:n.config.rule}] : []);
    var boundEvents = (n.config && n.config.events) || (n.config && n.config.event ? [n.config.event] : []);
    if (boundRules.length === 0) return;

    boundRules.forEach(function(r) {
      if (r.type === 'drools') {
        var ruleName = r.ruleName || r.name || 'RULE_' + n.id;
        lines.push('rule "' + ruleName + '"');
        lines.push('    salience 100');
        lines.push('    when');
        if (boundEvents.length > 0 && boundEvents[0] !== '无条件') {
          lines.push('        $ctx: ClinicalContext(eventType == "' + boundEvents[0] + '")');
        } else {
          lines.push('        $ctx: ClinicalContext()');
        }
        lines.push('    then');
        lines.push('        // 节点: ' + n.label + ' (' + n.id + ')');
        var info = NODE_TYPE_MAP[n.type];
        lines.push('        // 类型: ' + (info ? info.name : n.type));
        if (n.config.output_type) {
          lines.push('        // 输出: ' + n.config.output_type);
        }
        lines.push('        insert(new CDSSRecommendation("' + n.id + '", "' + n.label + '"));');
        lines.push('end');
        lines.push('');
      }
    });

    // 推荐来源 - 医嘱类别规则
    var rs = n.config && n.config.rec_sources;
    if (rs && rs.order_categories && rs.order_categories.length > 0) {
      lines.push('// 推荐来源-医嘱类别: ' + n.label);
      rs.order_categories.forEach(function(cat) {
        var ruleCode = rs['order_rule_' + cat] || ('RULE-ORDER-' + cat.toUpperCase() + '-' + n.id);
        lines.push('rule "' + ruleCode + '"');
        lines.push('    salience 80');
        lines.push('    when');
        lines.push('        $ctx: ClinicalContext(activeNode == "' + n.id + '")');
        lines.push('    then');
        lines.push('        // 推荐医嘱类别: ' + cat);
        lines.push('        insert(new OrderRecommendation("' + n.id + '", "' + cat + '"));');
        lines.push('end');
        lines.push('');
      });
    }
  });

  // 3. 连线判断规则
  connections.forEach(function(c) {
    if (!c.rules || c.rules.length === 0) return;
    var src = findNode(c.sourceId);
    var tgt = findNode(c.targetId);
    c.rules.forEach(function(r) {
      var ruleName = r.name || 'RULE_CONN_' + c.id;
      lines.push('rule "' + ruleName + '"');
      lines.push('    salience 150');
      lines.push('    when');
      lines.push('        $ctx: ClinicalContext(activeNode == "' + c.sourceId + '")');
      lines.push('    then');
      lines.push('        // 连线判断: ' + (src ? src.label : c.sourceId) + ' → ' + (tgt ? tgt.label : c.targetId));
      lines.push('        // 规则结果' + (c.rule_result === 'false' ? 'FALSE' : 'TRUE') + '时走此连线');
      lines.push('        // 标签: ' + (c.label || ''));
      lines.push('        insert(new PathwayDecision("' + c.id + '", "' + c.rule_result + '"));');
      lines.push('end');
      lines.push('');
    });
  });

  return lines.join('\n');
}

function runSimulation() {
  var eventType = document.getElementById('sim-event').value;
  var patientData = {};
  try { patientData = JSON.parse(document.getElementById('sim-patient').value); } catch(e) { showToast('患者数据JSON格式错误'); return; }

  var result = [];
  result.push('📋 模拟事件: ' + eventType);
  result.push('👤 患者数据: ' + JSON.stringify(patientData));
  result.push('');

  // 1. 检查疾病准入
  var entryNode = nodes.find(function(n) { return n.type === 'disease_entry'; });
  if (entryNode) {
    var entryRules = (entryNode.config && entryNode.config.entry_rules) || [];
    result.push('🏥 疾病准入检查: ' + entryNode.label);
    if (entryRules.length > 0) {
      entryRules.forEach(function(r) {
        result.push('   规则: ' + r.name + ' → 模拟结果: TRUE（假设准入通过）');
      });
    } else {
      result.push('   ⚠ 未绑定准入规则');
    }
    result.push('');
  }

  // 2. 找到匹配事件的节点
  var triggeredNodes = [];
  nodes.forEach(function(n) {
    var boundEvents = (n.config && n.config.events) || (n.config && n.config.event ? [n.config.event] : []);
    if (boundEvents.indexOf(eventType) !== -1 || boundEvents.indexOf('无条件') !== -1) {
      if (n.type.indexOf('ability_') === 0) triggeredNodes.push(n);
    }
  });

  if (triggeredNodes.length === 0) {
    result.push('⚠ 没有业务组件匹配事件 "' + eventType + '"');
  } else {
    result.push('✅ 触发 ' + triggeredNodes.length + ' 个业务组件:');
    triggeredNodes.forEach(function(n) {
      var info = NODE_TYPE_MAP[n.type];
      result.push('');
      result.push('  ' + (info ? info.icon : '') + ' ' + n.label + ' [' + n.id + ']');

      // 规则执行
      var boundRules = (n.config && n.config.rules) || (n.config && n.config.rule ? [{type:'graph',ruleCode:n.config.rule}] : []);
      if (boundRules.length > 0) {
        result.push('    📜 规则执行:');
        boundRules.forEach(function(r) {
          var ruleLabel = r.type === 'drools' ? (r.ruleName || r.name) : r.ruleCode;
          result.push('      ' + (r.type === 'drools' ? '📜' : '🧠') + ' ' + ruleLabel + ' → TRUE');
        });
      }

      // 推荐来源
      var rs = n.config && n.config.rec_sources;
      if (rs) {
        var recParts = [];
        if (rs.order_categories && rs.order_categories.length > 0) {
          recParts.push('医嘱[' + rs.order_categories.join('/') + ']');
        }
        if (rs.dify_enabled) recParts.push('Dify智能体[' + (rs.dify_agent_desc || rs.dify_agent_id || '已配置') + ']');
        if (rs.graph_enabled) recParts.push('图谱[' + (rs.graph_rule_code || '已配置') + ']');
        if (recParts.length > 0) {
          result.push('    🎯 推荐来源: ' + recParts.join(' + '));
        }
      }

      // 输出
      if (n.config.output_type) {
        result.push('    📤 输出: ' + n.config.output_type + (n.config.output_desc ? ' - ' + n.config.output_desc : ''));
      }
    });
  }

  // 3. 模拟路径流转（沿连线前进）
  result.push('');
  result.push('🔗 路径流转模拟:');
  var startNode = nodes.find(function(n) { return n.type === 'start'; });
  var currentNode = startNode || entryNode;
  var visited = {};
  var stepCount = 0;
  while (currentNode && stepCount < 20) {
    if (visited[currentNode.id]) { result.push('  ⚠ 检测到循环: ' + currentNode.label); break; }
    visited[currentNode.id] = true;
    stepCount++;

    var outConns = connections.filter(function(c) { return c.sourceId === currentNode.id; });
    if (outConns.length === 0) {
      result.push('  ' + stepCount + '. [' + currentNode.label + '] → 终止（无出向连线）');
      break;
    }

    // 模拟连线规则判断
    var nextConn = null;
    for (var i = 0; i < outConns.length; i++) {
      var c = outConns[i];
      if (c.rules && c.rules.length > 0) {
        // 有规则绑定的连线，模拟规则结果
        var simulatedResult = c.rule_result !== 'false'; // 默认TRUE
        if (simulatedResult) { nextConn = c; break; }
      } else {
        // 无规则连线，默认走第一条
        if (!nextConn) nextConn = c;
      }
    }
    if (!nextConn) nextConn = outConns[0];

    var nextNode = findNode(nextConn.targetId);
    var ruleInfo = nextConn.rules && nextConn.rules.length > 0
      ? ' [规则' + nextConn.rules[0].name + '→' + (nextConn.rule_result === 'false' ? 'FALSE' : 'TRUE') + ']'
      : '';
    result.push('  ' + stepCount + '. [' + currentNode.label + '] →' + ruleInfo + '→ [' + (nextNode ? nextNode.label : '?') + ']');

    currentNode = nextNode;
    if (currentNode && currentNode.type === 'end') {
      result.push('  ✓ 到达结束节点');
      break;
    }
  }
  if (stepCount >= 20) result.push('  ⚠ 路径过长（超过20步），可能存在循环');

  document.getElementById('sim-result').innerHTML = result.join('<br>');
}

function doAutoLayout() {
  if (nodes.length === 0) return;
  saveUndoState();

  /* ====== 1. 分类节点 ====== */
  var stageNodes = nodes.filter(function(n) { return n.type === 'pathway_stage'; });
  var flowNodes  = nodes.filter(function(n) { return n.type !== 'pathway_stage'; });

  /* ====== 2. 构建邻接表 ====== */
  var outgoing = {}, incoming = {};
  flowNodes.forEach(function(n) { outgoing[n.id] = []; incoming[n.id] = []; });
  connections.forEach(function(c) {
    if (outgoing[c.sourceId]) outgoing[c.sourceId].push(c.targetId);
    if (incoming[c.targetId]) incoming[c.targetId].push(c.sourceId);
  });

  /* ====== 3. 从 start 节点 BFS（只从真正的起点出发） ====== */
  var startNode = flowNodes.filter(function(n) { return n.type === 'start'; })[0] || flowNodes[0];
  var levels = {}, visited = {}, queue = [];
  if (startNode) {
    levels[startNode.id] = 0;
    visited[startNode.id] = true;
    queue.push(startNode);
  }
  while (queue.length > 0) {
    var cur = queue.shift();
    var lv = levels[cur.id];
    (outgoing[cur.id] || []).forEach(function(tid) {
      if (!visited[tid]) {
        visited[tid] = true;
        levels[tid] = lv + 1;
        var tn = findNode(tid);
        if (tn) queue.push(tn);
      }
    });
  }

  /* ====== 4. 未访问节点：辅助节点（有出边但无入边）放到目标节点旁边 ====== */
  var orphanNodes = [];   // 辅助节点（推荐陈述等）
  var unvisitedNodes = []; // 其他未访问节点
  flowNodes.forEach(function(n) {
    if (visited[n.id]) return;
    var outs = outgoing[n.id] || [];
    if (outs.length > 0 && (incoming[n.id] || []).length === 0) {
      orphanNodes.push(n);  // 有出边但无入边 = 辅助节点
    } else {
      unvisitedNodes.push(n);
    }
  });

  var maxLv = 0;
  flowNodes.forEach(function(n) { if (levels[n.id] !== undefined && levels[n.id] > maxLv) maxLv = levels[n.id]; });

  // 未访问的非辅助节点追加到末尾
  unvisitedNodes.forEach(function(n) { maxLv++; levels[n.id] = maxLv; });

  /* ====== 5. 按层分组 ====== */
  var groups = {};
  flowNodes.forEach(function(n) {
    if (levels[n.id] === undefined) return;
    var lv = levels[n.id];
    if (!groups[lv]) groups[lv] = [];
    groups[lv].push(n);
  });

  /* ====== 6. 布局主流程 ====== */
  var BASE_Y = 360;
  var gapX = 260;
  var gapY = 140;
  var nodeY = {};
  var MAX_Y_OFFSET = gapY * 3;  // 任何节点最多偏离主线 ±420px

  for (var lv = 0; lv <= maxLv; lv++) {
    var grp = groups[lv] || [];
    if (grp.length === 0) continue;
    grp.forEach(function(n, j) {
      n.x = 200 + lv * gapX;
      var parentIds = (incoming[n.id] || []).filter(function(pid) { return nodeY[pid] != null; });
      if (parentIds.length > 0) {
        var avgParentY = parentIds.reduce(function(s, pid) { return s + nodeY[pid]; }, 0) / parentIds.length;
        var pFirst = parentIds[0];
        var parentChildren = (outgoing[pFirst] || []).filter(function(tid) { return visited[tid]; });
        var idxInParent = parentChildren.indexOf(n.id);
        var rawY;
        if (parentChildren.length > 1 && idxInParent >= 0) {
          var mid = (parentChildren.length - 1) / 2;
          rawY = avgParentY + (idxInParent - mid) * gapY;
        } else {
          rawY = avgParentY;
        }
        // 约束：不超过 MAX_Y_OFFSET
        nodeY[n.id] = Math.max(BASE_Y - MAX_Y_OFFSET, Math.min(BASE_Y + MAX_Y_OFFSET, rawY));
      } else {
        nodeY[n.id] = BASE_Y;
      }
      n.y = nodeY[n.id];
      updateNodeDOM(n);
    });
  }

  /* ====== 7. 辅助节点：放在目标节点正上方 ====== */
  orphanNodes.forEach(function(n) {
    var targetId = (outgoing[n.id] || [])[0];
    var target = findNode(targetId);
    if (target) {
      n.x = target.x;
      n.y = target.y - 180;
    } else {
      n.x = 200;
      n.y = BASE_Y - 200;
    }
    nodeY[n.id] = n.y;
    updateNodeDOM(n);
  });

  /* ====== 8. 阶段节点：均匀放在主流程上方 ====== */
  if (stageNodes.length > 0) {
    var stageOrder = { '急诊': 0, 'ICU': 1, '住院': 2, '随访': 3 };
    stageNodes.sort(function(a, b) {
      var ai = stageOrder[a.config && a.config.stage_type] != null ? stageOrder[a.config && a.config.stage_type] : 99;
      var bi = stageOrder[b.config && b.config.stage_type] != null ? stageOrder[b.config && b.config.stage_type] : 99;
      return ai - bi;
    });
    var minX = Infinity, maxX = -Infinity;
    flowNodes.forEach(function(n) { if (n.x < minX) minX = n.x; if (n.x > maxX) maxX = n.x; });
    var sGap = stageNodes.length > 1 ? (maxX - minX) / (stageNodes.length - 1) : 0;
    var stageY = BASE_Y - 300;
    stageNodes.forEach(function(sn, idx) {
      sn.x = minX + idx * sGap;
      sn.y = stageY;
      updateNodeDOM(sn);
    });
  }

  updateAllConnections();
  showToast('自动排版完成');

    nodes.forEach(function(n) {
      var info = NODE_TYPE_MAP[n.type];
      if (!info || (info.category !== 'ability' && info.category !== 'cdss')) return;
      totalAbility++;
      var ok = false;
      if (n.type === 'disease_entry') ok = n.config && n.config.disease_code;
      else if (n.type === 'recommendation') ok = n.config && n.config.recommendation_class;
      else if (n.type === 'evidence_node') ok = n.config && (n.config.evidence_id || n.config.source_guideline);
      else if (n.type === 'contraindication') ok = n.config && n.config.contraindication_conditions;
      else if (n.type === 'pathway_stage') ok = n.config && n.config.stage_type;
      else if (n.type === 'guideline_ref') ok = n.config && n.config.guideline_code;
      else ok = n.config && n.config.rule && n.config.event;
      if (ok) configOk++;
    });
    if (totalAbility > 0) {
      var pct = Math.round(configOk / totalAbility * 100);
      var color = pct >= 80 ? '#52c41a' : pct >= 50 ? '#ffd43b' : '#ff4d4f';
      h += '<span style="color:' + color + '">&#9881; ' + configOk + '/' + totalAbility + ' 配置完整</span>';
    }
