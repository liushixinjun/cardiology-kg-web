<script>
/* ===================================================================
   专病诊疗路径流程引擎编辑器 — 真正可交互版
   Pure HTML/CSS/JS - No external dependencies
   =================================================================== */

/* ---- Navigation ---- */
(function() {
  var navHtml = '<a class="nav-brand" href="index.html">专科知识图谱 · 心血管内科</a><div class="nav-links">';
  var pages = [
    {id:'index',label:'数据总览',icon:'📊'},{id:'explore',label:'图谱探索',icon:'🧭'},
    {id:'engine',label:'路径编辑',icon:'🔗'},{id:'diagnosis',label:'临床诊断模拟',icon:'🔍'}
  ];
  pages.forEach(function(p) {
    navHtml += '<a class="nav-link' + (p.id === 'engine' ? ' active' : '') + '" href="' + p.id + '.html">' + p.icon + ' ' + p.label + '</a>';
  });
  navHtml += '</div><div class="nav-right"><a class="nav-config-btn" href="config.html" title="系统配置">⚙</a></div>';
  document.getElementById('mainNav').innerHTML = navHtml;
})();

/* ============================
   NODE TYPE DEFINITIONS
   ============================ */
var NODE_TYPES = [
  { type: 'start',      name: '开始',     icon: '🟢', color: '#52c41a', desc: '流程起点' },
  { type: 'task',       name: '业务任务', icon: '📋', color: '#4f8cff', desc: 'CDSS业务处理' },
  { type: 'decision',   name: '决策节点', icon: '◆',  color: '#cc5de8', desc: '条件分支判断' },
  { type: 'gateway',    name: '并行网关', icon: '◇',  color: '#ff922b', desc: '并行/汇聚' },
  { type: 'subprocess', name: '子流程',   icon: '🔄', color: '#22b8cf', desc: '嵌套子流程' },
  { type: 'end',        name: '结束',     icon: '🔴', color: '#ff4d4f', desc: '流程终点' }
];
var NODE_TYPE_MAP = {};
NODE_TYPES.forEach(function(t) { NODE_TYPE_MAP[t.type] = t; });

var TASK_TYPES = ['入组筛查','疾病推荐','鉴别推荐','医嘱推荐','方案推荐','评估','预警','质控','随访'];
var EVENT_TYPES = ['无条件','EVT_PATIENT_CONTEXT_READY','EVT_EMR_SAVE','EVT_DIAGNOSIS_SAVE','EVT_ORDER_SAVE_PRE','EVT_REPORT_BACK','EVT_DISCHARGE_SAVE','EVT_TIMER_SCAN'];

/* ============================
   STATE
   ============================ */
var nodes = [];
var connections = [];
var selectedNodeId = null;
var selectedConnId = null;
var undoStack = [];
var nextNodeId = 1;
var nextConnId = 1;
var flowName = '未命名路径';

/* Canvas transform */
var canvasOffsetX = 0, canvasOffsetY = 0, canvasScale = 1;
var isPanning = false, panStartX = 0, panStartY = 0;
var spaceHeld = false;

/* Drag from palette */
var dragState = null; // {type:'new-node', nodeType:xxx}
var dragPreviewEl = null;

/* Move node on canvas */
// dragState reused: {type:'move-node', nodeId, startMouseX, startMouseY, origX, origY}

/* Draw connection */
var drawState = null; // {sourceNodeId, sourcePort, startX, startY, tempPath}
var didDrag = false;

/* ============================
   DOM REFERENCES
   ============================ */
var canvasEl, canvasContainer, connectionsSvg;

/* ============================
   INIT
   ============================ */
function init() {
  canvasEl = document.getElementById('canvas');
  canvasContainer = document.getElementById('canvasContainer');
  connectionsSvg = document.getElementById('connectionsSvg');

  renderPalette();
  refreshSavedPaths();
  setupCanvasEvents();
  setupKeyboardEvents();
  setupGlobalMouse();
}

/* ============================
   PALETTE
   ============================ */
function renderPalette() {
  var pal = document.getElementById('nodePalette');
  var html = '';
  NODE_TYPES.forEach(function(t) {
    html += '<div class="node-palette-item" data-type="' + t.type + '">'
      + '<div class="node-palette-icon" style="background:' + t.color + '22;color:' + t.color + '">' + t.icon + '</div>'
      + '<div><div class="node-palette-label">' + t.name + '</div>'
      + '<div class="node-palette-desc">' + t.desc + '</div></div></div>';
  });
  pal.innerHTML = html;

  /* Attach mousedown for drag-to-canvas */
  var items = pal.querySelectorAll('.node-palette-item');
  for (var i = 0; i < items.length; i++) {
    items[i].addEventListener('mousedown', onPaletteMouseDown);
  }
}

function onPaletteMouseDown(e) {
  e.preventDefault();
  var type = this.getAttribute('data-type');
  var info = NODE_TYPE_MAP[type];

  dragState = { type: 'new-node', nodeType: type };
  didDrag = false;

  /* Create preview element */
  dragPreviewEl = document.createElement('div');
  dragPreviewEl.className = 'drag-preview';
  dragPreviewEl.innerHTML = '<div style="width:180px;padding:8px 12px;background:#fff;border:2px solid ' + info.color + ';border-radius:8px;display:flex;align-items:center;gap:8px;box-shadow:0 4px 12px rgba(0,0,0,.15)">'
    + '<span style="font-size:14px">' + info.icon + '</span>'
    + '<span style="font-size:12px;font-weight:600;color:#333">' + info.name + '</span></div>';
  dragPreviewEl.style.left = e.clientX + 'px';
  dragPreviewEl.style.top = e.clientY + 'px';
  document.body.appendChild(dragPreviewEl);
}

/* ============================
   GLOBAL MOUSE (handles all drag operations)
   ============================ */
function setupGlobalMouse() {
  document.addEventListener('mousemove', function(e) {
    /* --- Palette drag: new node --- */
    if (dragState && dragState.type === 'new-node' && dragPreviewEl) {
      didDrag = true;
      dragPreviewEl.style.left = e.clientX + 'px';
      dragPreviewEl.style.top = e.clientY + 'px';
      return;
    }

    /* --- Move node on canvas --- */
    if (dragState && dragState.type === 'move-node') {
      didDrag = true;
      var node = findNode(dragState.nodeId);
      if (!node) return;
      var dx = (e.clientX - dragState.startMouseX) / canvasScale;
      var dy = (e.clientY - dragState.startMouseY) / canvasScale;
      node.x = dragState.origX + dx;
      node.y = dragState.origY + dy;
      updateNodeDOM(node);
      updateAllConnections();
      return;
    }

    /* --- Draw connection --- */
    if (drawState && drawState.tempPath) {
      var rect = canvasContainer.getBoundingClientRect();
      var mx = (e.clientX - rect.left - canvasOffsetX) / canvasScale;
      var my = (e.clientY - rect.top - canvasOffsetY) / canvasScale;
      var pathD = makeConnPath(drawState.startX, drawState.startY, drawState.sourcePort, mx, my, 'left');
      drawState.tempPath.setAttribute('d', pathD);
    }

    /* --- Canvas panning --- */
    if (isPanning) {
      canvasOffsetX = e.clientX - panStartX;
      canvasOffsetY = e.clientY - panStartY;
      updateCanvasTransform();
    }
  });

  document.addEventListener('mouseup', function(e) {
    /* --- Palette drag end: create node --- */
    if (dragState && dragState.type === 'new-node') {
      if (dragPreviewEl) {
        dragPreviewEl.remove();
        dragPreviewEl = null;
      }
      var rect = canvasContainer.getBoundingClientRect();
      if (e.clientX >= rect.left && e.clientX <= rect.right && e.clientY >= rect.top && e.clientY <= rect.bottom) {
        var cx = (e.clientX - rect.left - canvasOffsetX) / canvasScale;
        var cy = (e.clientY - rect.top - canvasOffsetY) / canvasScale;
        saveUndoState();
        var node = addNode(dragState.nodeType, cx - 90, cy - 30);
        selectNode(node.id);
      }
      dragState = null;
      return;
    }

    /* --- Move node end --- */
    if (dragState && dragState.type === 'move-node') {
      dragState = null;
      return;
    }

    /* --- Draw connection end --- */
    if (drawState) {
      /* Check if mouse is over a port */
      var target = document.elementFromPoint(e.clientX, e.clientY);
      if (target && target.classList.contains('port')) {
        var targetNodeId = target.getAttribute('data-node');
        var targetPort = target.getAttribute('data-port');
        if (targetNodeId && targetNodeId !== drawState.sourceNodeId) {
          saveUndoState();
          addConnection(drawState.sourceNodeId, targetNodeId, drawState.sourcePort, targetPort, '', '无条件');
        }
      }
      /* Clean up temp path */
      if (drawState.tempPath) {
        drawState.tempPath.remove();
      }
      drawState = null;
      return;
    }

    /* --- Panning end --- */
    if (isPanning) {
      isPanning = false;
      canvasContainer.classList.remove('panning');
    }
  });
}

/* ============================
   NODE MANAGEMENT
   ============================ */
function addNode(type, x, y, cfg) {
  var info = NODE_TYPE_MAP[type];
  var defaults = cfg || {};
  var node = {
    id: 'n' + (nextNodeId++),
    type: type,
    label: defaults.label || info.name,
    x: Math.round(x),
    y: Math.round(y),
    description: defaults.description || '',
    config: defaults.config || {}
  };
  nodes.push(node);
  renderNode(node);
  return node;
}

function renderNode(node) {
  var info = NODE_TYPE_MAP[node.type];
  var el = document.createElement('div');
  el.className = 'flow-node';
  el.id = 'node-' + node.id;
  el.setAttribute('data-id', node.id);
  el.style.left = node.x + 'px';
  el.style.top = node.y + 'px';

  var descHtml = node.description ? '<div class="node-desc">' + escapeHtml(node.description) + '</div>' : '';

  el.innerHTML = '<div class="node-header" style="background:' + info.color + '">'
    + '<span class="node-icon">' + info.icon + '</span>'
    + '<span class="node-type-name">' + info.name + '</span>'
    + '</div>'
    + '<div class="node-body">'
    + '<div class="node-label" id="label-' + node.id + '">' + escapeHtml(node.label) + '</div>'
    + descHtml
    + '</div>'
    + '<div class="port port-top" data-node="' + node.id + '" data-port="top"></div>'
    + '<div class="port port-bottom" data-node="' + node.id + '" data-port="bottom"></div>'
    + '<div class="port port-left" data-node="' + node.id + '" data-port="left"></div>'
    + '<div class="port port-right" data-node="' + node.id + '" data-port="right"></div>';

  canvasEl.appendChild(el);

  /* Node mousedown: start move drag + select */
  el.addEventListener('mousedown', function(e) {
    if (e.target.classList.contains('port')) return;
    if (e.button !== 0) return;
    e.stopPropagation();
    didDrag = false;
    saveUndoState();
    selectNode(node.id);
    dragState = {
      type: 'move-node',
      nodeId: node.id,
      startMouseX: e.clientX,
      startMouseY: e.clientY,
      origX: node.x,
      origY: node.y
    };
  });

  /* Node click: select (suppress if dragged) */
  el.addEventListener('click', function(e) {
    if (didDrag) return;
    if (e.target.classList.contains('port')) return;
    e.stopPropagation();
    selectNode(node.id);
  });

  /* Right-click context menu */
  el.addEventListener('contextmenu', function(e) {
    e.preventDefault();
    e.stopPropagation();
    selectNode(node.id);
    showContextMenu(e.clientX, e.clientY);
  });

  /* Port events */
  var ports = el.querySelectorAll('.port');
  for (var i = 0; i < ports.length; i++) {
    (function(port) {
      port.addEventListener('mousedown', function(e) {
        e.preventDefault();
        e.stopPropagation();
        var portName = port.getAttribute('data-port');
        startConnectionDraw(e, node.id, portName);
      });
    })(ports[i]);
  }
}

function updateNodeDOM(node) {
  var el = document.getElementById('node-' + node.id);
  if (!el) return;
  el.style.left = node.x + 'px';
  el.style.top = node.y + 'px';
  var labelEl = document.getElementById('label-' + node.id);
  if (labelEl) labelEl.textContent = node.label;
}

function removeNodeFromDOM(nodeId) {
  var el = document.getElementById('node-' + nodeId);
  if (el) el.remove();
}

/* ============================
   CONNECTION DRAWING
   ============================ */
function startConnectionDraw(e, sourceNodeId, sourcePort) {
  e.preventDefault();
  var pos = getPortPosition(sourceNodeId, sourcePort);
  drawState = {
    sourceNodeId: sourceNodeId,
    sourcePort: sourcePort,
    startX: pos.x,
    startY: pos.y,
    tempPath: null
  };

  /* Create temp SVG path */
  var pathEl = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  pathEl.classList.add('temp-path');
  pathEl.setAttribute('fill', 'none');
  pathEl.setAttribute('stroke', 'rgba(79,140,255,0.5)');
  pathEl.setAttribute('stroke-width', '2');
  pathEl.setAttribute('stroke-dasharray', '6,4');
  connectionsSvg.appendChild(pathEl);
  drawState.tempPath = pathEl;
}

/* ============================
   CONNECTION MANAGEMENT
   ============================ */
function addConnection(sourceId, targetId, sourcePort, targetPort, label, eventType) {
  /* Prevent duplicates */
  for (var i = 0; i < connections.length; i++) {
    if (connections[i].sourceId === sourceId && connections[i].targetId === targetId) return null;
  }
  /* Prevent self-connection */
  if (sourceId === targetId) return null;

  var conn = {
    id: 'c' + (nextConnId++),
    sourceId: sourceId,
    targetId: targetId,
    sourcePort: sourcePort,
    targetPort: targetPort,
    label: label || '',
    eventType: eventType || '无条件',
    condition: ''
  };
  connections.push(conn);
  renderConnection(conn);
  return conn;
}

function renderConnection(conn) {
  var srcPos = getPortPosition(conn.sourceId, conn.sourcePort);
  var tgtPos = getPortPosition(conn.targetId, conn.targetPort);
  if (!srcPos || !tgtPos) return;

  /* SVG path */
  var pathD = makeConnPath(srcPos.x, srcPos.y, conn.sourcePort, tgtPos.x, tgtPos.y, conn.targetPort);
  var pathEl = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  pathEl.classList.add('conn-path');
  pathEl.setAttribute('id', 'conn-' + conn.id);
  pathEl.setAttribute('d', pathD);
  pathEl.setAttribute('fill', 'none');
  pathEl.setAttribute('stroke', 'rgba(0,0,0,0.2)');
  pathEl.setAttribute('stroke-width', '1.5');
  pathEl.setAttribute('marker-end', 'url(#arrowhead)');
  pathEl.setAttribute('data-conn', conn.id);
  connectionsSvg.appendChild(pathEl);

  /* Click to select connection */
  pathEl.addEventListener('mousedown', function(e) {
    e.stopPropagation();
    selectConnection(conn.id);
  });

  /* Label */
  if (conn.label) {
    renderConnectionLabel(conn);
  }
}

function renderConnectionLabel(conn) {
  var srcPos = getPortPosition(conn.sourceId, conn.sourcePort);
  var tgtPos = getPortPosition(conn.targetId, conn.targetPort);
  if (!srcPos || !tgtPos) return;

  var mx = (srcPos.x + tgtPos.x) / 2;
  var my = (srcPos.y + tgtPos.y) / 2;

  var lbl = document.createElement('div');
  lbl.className = 'conn-label';
  lbl.id = 'conn-label-' + conn.id;
  lbl.textContent = conn.label;
  lbl.style.left = mx + 'px';
  lbl.style.top = my + 'px';
  lbl.setAttribute('data-conn', conn.id);

  lbl.addEventListener('mousedown', function(e) {
    e.stopPropagation();
    selectConnection(conn.id);
  });
  lbl.addEventListener('click', function(e) {
    e.stopPropagation();
  });

  canvasEl.appendChild(lbl);
}

function updateConnectionDOM(conn) {
  var srcPos = getPortPosition(conn.sourceId, conn.sourcePort);
  var tgtPos = getPortPosition(conn.targetId, conn.targetPort);
  if (!srcPos || !tgtPos) return;

  var pathEl = document.getElementById('conn-' + conn.id);
  if (pathEl) {
    pathEl.setAttribute('d', makeConnPath(srcPos.x, srcPos.y, conn.sourcePort, tgtPos.x, tgtPos.y, conn.targetPort));
  }

  /* Update label position */
  var lblEl = document.getElementById('conn-label-' + conn.id);
  if (lblEl) {
    lblEl.style.left = ((srcPos.x + tgtPos.x) / 2) + 'px';
    lblEl.style.top = ((srcPos.y + tgtPos.y) / 2) + 'px';
  }
}

function removeConnectionDOM(connId) {
  var pathEl = document.getElementById('conn-' + connId);
  if (pathEl) pathEl.remove();
  var lblEl = document.getElementById('conn-label-' + connId);
  if (lblEl) lblEl.remove();
}

function updateAllConnections() {
  for (var i = 0; i < connections.length; i++) {
    updateConnectionDOM(connections[i]);
  }
}

/* ============================
   SELECTION
   ============================ */
function selectNode(id) {
  /* Deselect previous node */
  if (selectedNodeId) {
    var prev = document.getElementById('node-' + selectedNodeId);
    if (prev) prev.classList.remove('selected');
  }
  /* Deselect previous connection */
  deselectConnHighlight();

  selectedConnId = null;
  selectedNodeId = id;

  if (id) {
    var el = document.getElementById('node-' + id);
    if (el) el.classList.add('selected');
    renderNodeProperties(id);
  } else {
    renderPropertiesEmpty();
  }
}

function selectConnection(connId) {
  /* Deselect previous node */
  if (selectedNodeId) {
    var prev = document.getElementById('node-' + selectedNodeId);
    if (prev) prev.classList.remove('selected');
    selectedNodeId = null;
  }
  deselectConnHighlight();

  selectedConnId = connId;
  highlightConn(connId);

  var conn = findConnection(connId);
  if (conn) renderConnectionProperties(conn);
}

function deselectAll() {
  if (selectedNodeId) {
    var prev = document.getElementById('node-' + selectedNodeId);
    if (prev) prev.classList.remove('selected');
    selectedNodeId = null;
  }
  deselectConnHighlight();
  selectedConnId = null;
  renderPropertiesEmpty();
  hideContextMenu();
}

function highlightConn(connId) {
  var pathEl = document.getElementById('conn-' + connId);
  if (pathEl) {
    pathEl.setAttribute('stroke', '#4f8cff');
    pathEl.setAttribute('stroke-width', '2');
    pathEl.setAttribute('marker-end', 'url(#arrowhead-active)');
  }
  var lblEl = document.getElementById('conn-label-' + connId);
  if (lblEl) lblEl.classList.add('selected');
}

function deselectConnHighlight() {
  if (selectedConnId) {
    var prevPath = document.getElementById('conn-' + selectedConnId);
    if (prevPath) {
      prevPath.setAttribute('stroke', 'rgba(0,0,0,0.2)');
      prevPath.setAttribute('stroke-width', '1.5');
      prevPath.setAttribute('marker-end', 'url(#arrowhead)');
    }
    var prevLbl = document.getElementById('conn-label-' + selectedConnId);
    if (prevLbl) prevLbl.classList.remove('selected');
  }
}

/* ============================
   PROPERTIES PANEL
   ============================ */
function renderPropertiesEmpty() {
  document.getElementById('rightPanelTitle').textContent = '属性配置';
  document.getElementById('rightPanelBody').innerHTML =
    '<div class="prop-empty"><div class="prop-empty-icon">🖱</div><div>选择节点或连线查看配置</div></div>';
}

function renderNodeProperties(nodeId) {
  var node = findNode(nodeId);
  if (!node) { renderPropertiesEmpty(); return; }
  var info = NODE_TYPE_MAP[node.type];

  document.getElementById('rightPanelTitle').textContent = info.icon + ' ' + info.name + ' 属性';

  var h = '';
  h += '<div class="prop-group"><div class="prop-label">节点名称</div>'
    + '<input class="prop-input" id="prop-label" value="' + escapeAttr(node.label) + '" oninput="onNodePropChange(\'label\',this.value)"></div>';

  h += '<div class="prop-group"><div class="prop-label">节点描述</div>'
    + '<textarea class="prop-input" id="prop-desc" oninput="onNodePropChange(\'description\',this.value)">' + escapeHtml(node.description) + '</textarea></div>';

  h += '<div class="prop-group"><div class="prop-label">节点类型</div>'
    + '<input class="prop-input" value="' + info.name + '" readonly style="opacity:.6;cursor:not-allowed"></div>';

  /* Task-specific fields */
  if (node.type === 'task') {
    var taskTypes = TASK_TYPES;
    h += '<div class="prop-group"><div class="prop-label">任务类型</div>'
      + '<select class="prop-input" id="prop-taskType" onchange="onNodeConfigChange(\'taskType\',this.value)">';
    h += '<option value="">-- 请选择 --</option>';
    taskTypes.forEach(function(tt) {
      h += '<option value="' + tt + '"' + (node.config.taskType === tt ? ' selected' : '') + '>' + tt + '</option>';
    });
    h += '</select></div>';
  }

  /* Decision-specific */
  if (node.type === 'decision') {
    h += '<div class="prop-group"><div class="prop-label">判断条件</div>'
      + '<textarea class="prop-input" oninput="onNodeConfigChange(\'condition\',this.value)">' + escapeHtml(node.config.condition || '') + '</textarea></div>';
  }

  /* Node info */
  h += '<div class="prop-group" style="margin-top:16px;padding-top:12px;border-top:1px solid var(--rule)">'
    + '<div class="prop-label">节点信息</div>'
    + '<div class="prop-info">'
    + 'ID: ' + node.id + '<br>'
    + '类型: ' + info.type + '<br>'
    + '位置: (' + Math.round(node.x) + ', ' + Math.round(node.y) + ')'
    + '</div></div>';

  document.getElementById('rightPanelBody').innerHTML = h;
}

function renderConnectionProperties(conn) {
  document.getElementById('rightPanelTitle').textContent = '连线 / 事件配置';

  var srcNode = findNode(conn.sourceId);
  var tgtNode = findNode(conn.targetId);

  var h = '';
  h += '<div class="prop-group"><div class="prop-label">显示名称</div>'
    + '<input class="prop-input" id="prop-connLabel" value="' + escapeAttr(conn.label) + '" oninput="onConnPropChange(\'label\',this.value)"></div>';

  h += '<div class="prop-group"><div class="prop-label">触发事件</div>'
    + '<select class="prop-input" id="prop-connEvent" onchange="onConnPropChange(\'eventType\',this.value)">';
  EVENT_TYPES.forEach(function(et) {
    h += '<option value="' + et + '"' + (conn.eventType === et ? ' selected' : '') + '>' + et + '</option>';
  });
  h += '</select></div>';

  h += '<div class="prop-group"><div class="prop-label">条件表达式</div>'
    + '<input class="prop-input" id="prop-connCond" value="' + escapeAttr(conn.condition || '') + '" oninput="onConnPropChange(\'condition\',this.value)" placeholder="如: 肌钙蛋白>0.1"></div>';

  h += '<div class="prop-group" style="margin-top:12px"><button class="prop-btn" onclick="saveConnConfig()">保存连线配置</button></div>';

  h += '<div class="prop-group" style="margin-top:16px;padding-top:12px;border-top:1px solid var(--rule)">'
    + '<div class="prop-label">连线信息</div>'
    + '<div class="prop-info">'
    + 'ID: ' + conn.id + '<br>'
    + '起点: ' + (srcNode ? srcNode.label : conn.sourceId) + '<br>'
    + '终点: ' + (tgtNode ? tgtNode.label : conn.targetId) + '<br>'
    + '端口: ' + conn.sourcePort + ' → ' + conn.targetPort
    + '</div></div>';

  h += '<div class="prop-group" style="margin-top:12px"><button class="prop-btn" style="background:var(--accent2)" onclick="deleteSelected()">删除此连线</button></div>';

  document.getElementById('rightPanelBody').innerHTML = h;
}

function onNodePropChange(field, value) {
  if (!selectedNodeId) return;
  var node = findNode(selectedNodeId);
  if (!node) return;
  if (field === 'label') {
    node.label = value;
    var lblEl = document.getElementById('label-' + node.id);
    if (lblEl) lblEl.textContent = value;
  } else if (field === 'description') {
    node.description = value;
    /* Update desc in DOM */
    var el = document.getElementById('node-' + node.id);
    if (el) {
      var bodyEl = el.querySelector('.node-body');
      var descEl = el.querySelector('.node-desc');
      if (value) {
        if (descEl) { descEl.textContent = value; }
        else {
          var d = document.createElement('div');
          d.className = 'node-desc';
          d.textContent = value;
          bodyEl.appendChild(d);
        }
      } else {
        if (descEl) descEl.remove();
      }
    }
  }
}

function onNodeConfigChange(field, value) {
  if (!selectedNodeId) return;
  var node = findNode(selectedNodeId);
  if (!node) return;
  node.config[field] = value;
}

function onConnPropChange(field, value) {
  if (!selectedConnId) return;
  var conn = findConnection(selectedConnId);
  if (!conn) return;
  conn[field] = value;

  if (field === 'label') {
    /* Update label DOM */
    var oldLbl = document.getElementById('conn-label-' + conn.id);
    if (oldLbl) oldLbl.remove();
    if (conn.label) renderConnectionLabel(conn);
  }
}

function saveConnConfig() {
  showToast('连线配置已保存');
}

/* ============================
   CANVAS EVENTS
   ============================ */
function setupCanvasEvents() {
  /* Click on canvas background to deselect */
  canvasContainer.addEventListener('mousedown', function(e) {
    if (e.target === canvasContainer || e.target === canvasEl || e.target.classList.contains('connections-svg')) {
      /* Pan with middle button or space+left */
      if (e.button === 1 || (e.button === 0 && spaceHeld)) {
        e.preventDefault();
        isPanning = true;
        panStartX = e.clientX - canvasOffsetX;
        panStartY = e.clientY - canvasOffsetY;
        canvasContainer.classList.add('panning');
        return;
      }
      /* Deselect on left click */
      if (e.button === 0) {
        deselectAll();
      }
    }
  });

  /* Ctrl+Scroll zoom */
  canvasContainer.addEventListener('wheel', function(e) {
    if (!e.ctrlKey) return;
    e.preventDefault();
    var rect = canvasContainer.getBoundingClientRect();
    var mx = e.clientX - rect.left;
    var my = e.clientY - rect.top;
    var oldScale = canvasScale;
    var delta = e.deltaY > 0 ? 0.9 : 1.1;
    canvasScale = Math.max(0.15, Math.min(3, canvasScale * delta));
    canvasOffsetX = mx - (mx - canvasOffsetX) * (canvasScale / oldScale);
    canvasOffsetY = my - (my - canvasOffsetY) * (canvasScale / oldScale);
    updateCanvasTransform();
  }, { passive: false });

  /* Hide context menu on canvas click */
  canvasContainer.addEventListener('click', hideContextMenu);
}

function updateCanvasTransform() {
  canvasEl.style.transform = 'translate(' + canvasOffsetX + 'px, ' + canvasOffsetY + 'px) scale(' + canvasScale + ')';
  document.getElementById('zoomDisplay').textContent = Math.round(canvasScale * 100) + '%';
}

/* ============================
   KEYBOARD EVENTS
   ============================ */
function setupKeyboardEvents() {
  document.addEventListener('keydown', function(e) {
    if (e.key === ' ') {
      e.preventDefault();
      spaceHeld = true;
      canvasContainer.classList.add('panning');
    }
    if (e.key === 'Delete' || e.key === 'Backspace') {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'SELECT') return;
      deleteSelected();
    }
    if (e.key === 'Escape') {
      deselectAll();
      if (drawState && drawState.tempPath) {
        drawState.tempPath.remove();
        drawState = null;
      }
    }
    if (e.ctrlKey && e.key === 'z') {
      e.preventDefault();
      doUndo();
    }
  });
  document.addEventListener('keyup', function(e) {
    if (e.key === ' ') {
      spaceHeld = false;
      if (!isPanning) canvasContainer.classList.remove('panning');
    }
  });
}

/* ============================
   DELETE
   ============================ */
function deleteSelected() {
  hideContextMenu();
  if (selectedNodeId) {
    saveUndoState();
    /* Remove connected connections */
    var toRemove = [];
    for (var i = 0; i < connections.length; i++) {
      if (connections[i].sourceId === selectedNodeId || connections[i].targetId === selectedNodeId) {
        toRemove.push(connections[i].id);
      }
    }
    for (var j = 0; j < toRemove.length; j++) {
      removeConnectionById(toRemove[j]);
    }
    /* Remove node */
    removeNodeById(selectedNodeId);
  } else if (selectedConnId) {
    saveUndoState();
    removeConnectionById(selectedConnId);
    selectedConnId = null;
    renderPropertiesEmpty();
  }
}

function removeNodeById(id) {
  nodes = nodes.filter(function(n) { return n.id !== id; });
  removeNodeFromDOM(id);
  if (selectedNodeId === id) {
    selectedNodeId = null;
    renderPropertiesEmpty();
  }
}

function removeConnectionById(id) {
  connections = connections.filter(function(c) { return c.id !== id; });
  removeConnectionDOM(id);
  if (selectedConnId === id) {
    selectedConnId = null;
    deselectConnHighlight();
    renderPropertiesEmpty();
  }
}

/* ============================
   DUPLICATE
   ============================ */
function duplicateSelected() {
  hideContextMenu();
  if (!selectedNodeId) return;
  var orig = findNode(selectedNodeId);
  if (!orig) return;
  saveUndoState();
  var node = addNode(orig.type, orig.x + 40, orig.y + 40, {
    label: orig.label + ' (副本)',
    description: orig.description,
    config: JSON.parse(JSON.stringify(orig.config))
  });
  selectNode(node.id);
}

/* ============================
   CONTEXT MENU
   ============================ */
function showContextMenu(x, y) {
  var menu = document.getElementById('contextMenu');
  menu.style.left = x + 'px';
  menu.style.top = y + 'px';
  menu.classList.add('show');
}
function hideContextMenu() {
  document.getElementById('contextMenu').classList.remove('show');
}
document.addEventListener('click', hideContextMenu);

/* ============================
   TOOLBAR ACTIONS
   ============================ */
function newFlow() {
  if (nodes.length > 0 && !confirm('确定新建？当前内容将被清空。')) return;
  saveUndoState();
  nodes = [];
  connections = [];
  selectedNodeId = null;
  selectedConnId = null;
  nextNodeId = 1;
  nextConnId = 1;
  flowName = '未命名路径';
  canvasEl.innerHTML = '';
  /* Re-add SVG defs */
  var svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('class', 'connections-svg');
  svg.setAttribute('id', 'connectionsSvg');
  svg.innerHTML = '<defs>'
    + '<marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M 0 0 L 8 3 L 0 6 L 2 3 Z" fill="rgba(0,0,0,0.25)"/></marker>'
    + '<marker id="arrowhead-active" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M 0 0 L 8 3 L 0 6 L 2 3 Z" fill="#4f8cff"/></marker>'
    + '</defs>';
  canvasEl.appendChild(svg);
  connectionsSvg = svg;
  renderPropertiesEmpty();
  showToast('已新建空白路径');
}

function saveFlow() {
  var data = buildFlowData();
  try {
    var saved = JSON.parse(localStorage.getItem('kg_engine_flows') || '{}');
    saved[flowName] = data;
    localStorage.setItem('kg_engine_flows', JSON.stringify(saved));
    refreshSavedPaths();
    showToast('已保存: ' + flowName);
  } catch(e) {
    showToast('保存失败: ' + e.message);
  }
}

function loadFlow() {
  var saved = JSON.parse(localStorage.getItem('kg_engine_flows') || '{}');
  var names = Object.keys(saved);
  if (names.length === 0) { showToast('没有已保存的路径'); return; }
  var name = prompt('请输入要加载的路径名称:\n\n已保存: ' + names.join(', '));
  if (!name || !saved[name]) return;
  loadFlowData(saved[name]);
  showToast('已加载: ' + name);
}

function exportJSON() {
  var data = buildFlowData();
  var json = JSON.stringify(data, null, 2);
  var blob = new Blob([json], { type: 'application/json' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = (flowName || 'flow') + '.json';
  a.click();
  URL.revokeObjectURL(url);
  showToast('已导出JSON文件');
}

function doAutoLayout() {
  if (nodes.length === 0) return;
  saveUndoState();

  /* Build adjacency */
  var outgoing = {};
  var incoming = {};
  nodes.forEach(function(n) { outgoing[n.id] = []; incoming[n.id] = []; });
  connections.forEach(function(c) {
    if (outgoing[c.sourceId]) outgoing[c.sourceId].push(c.targetId);
    if (incoming[c.targetId]) incoming[c.targetId].push(c.sourceId);
  });

  /* Find roots (no incoming) */
  var roots = nodes.filter(function(n) { return incoming[n.id].length === 0; });
  if (roots.length === 0) roots = [nodes[0]];

  /* BFS to assign levels */
  var levels = {};
  var visited = {};
  var queue = [];
  roots.forEach(function(n) {
    levels[n.id] = 0;
    visited[n.id] = true;
    queue.push(n);
  });
  while (queue.length > 0) {
    var cur = queue.shift();
    var lv = levels[cur.id];
    var outs = outgoing[cur.id] || [];
    for (var i = 0; i < outs.length; i++) {
      if (!visited[outs[i]]) {
        visited[outs[i]] = true;
        levels[outs[i]] = lv + 1;
        var tn = findNode(outs[i]);
        if (tn) queue.push(tn);
      }
    }
  }

  /* Assign levels for unvisited nodes */
  var maxLv = 0;
  nodes.forEach(function(n) {
    if (levels[n.id] === undefined) { maxLv++; levels[n.id] = maxLv; }
    if (levels[n.id] > maxLv) maxLv = levels[n.id];
  });

  /* Group by level */
  var groups = {};
  nodes.forEach(function(n) {
    var lv = levels[n.id] || 0;
    if (!groups[lv]) groups[lv] = [];
    groups[lv].push(n);
  });

  /* Position */
  var startX = 100, startY = 100, gapX = 250, gapY = 100;
  for (var lv = 0; lv <= maxLv; lv++) {
    var grp = groups[lv] || [];
    for (var j = 0; j < grp.length; j++) {
      grp[j].x = startX + lv * gapX;
      grp[j].y = startY + j * gapY;
      updateNodeDOM(grp[j]);
    }
  }
  updateAllConnections();
  showToast('自动排版完成');
}

function zoomIn() {

  updateCanvasTransform();
}
function zoomOut() {
  canvasScale = Math.max(0.15, canvasScale / 1.2);

/* ============================
   UNDO
   ============================ */
function saveUndoState() {
  undoStack.push(JSON.stringify({
    nodes: nodes.map(function(n) {
      return { id: n.id, type: n.type, label: n.label, x: n.x, y: n.y, description: n.description, config: JSON.parse(JSON.stringify(n.config || {})) };
    }),
    connections: connections.map(function(c) {
      return { id: c.id, sourceId: c.sourceId, targetId: c.targetId, sourcePort: c.sourcePort, targetPort: c.targetPort, label: c.label, eventType: c.eventType, condition: c.condition };
    }),
    nextNodeId: nextNodeId,
    nextConnId: nextConnId,
    flowName: flowName
  }));
  if (undoStack.length > 50) undoStack.shift();
}

function doUndo() {
  if (undoStack.length === 0) { showToast('没有可撤销的操作'); return; }
  var state = JSON.parse(undoStack.pop());
  loadFlowData(state);
  showToast('已撤销');
}

/* ============================
   SAVED PATHS LIST
   ============================ */
function refreshSavedPaths() {
  var container = document.getElementById('savedPaths');
  var saved = JSON.parse(localStorage.getItem('kg_engine_flows') || '{}');
  var names = Object.keys(saved);
  if (names.length === 0) {
    container.innerHTML = '<div style="text-align:center;padding:16px;font-size:11px;color:var(--muted)">暂无保存的路径</div>';
    return;
  }
  var html = '';
  names.forEach(function(name) {
    var flow = saved[name];
    var nc = (flow.nodes || []).length;
    var cc = (flow.connections || []).length;
    html += '<div class="saved-item" onclick="loadSavedPath(\'' + escapeAttr(name) + '\')">'
      + '<span style="font-size:12px">📄</span>'
      + '<span class="saved-item-name">' + escapeHtml(name) + '</span>'
      + '<span class="saved-item-count">' + nc + '节点/' + cc + '连线</span>'
      + '</div>';
  });
  container.innerHTML = html;
}

function loadSavedPath(name) {
  var saved = JSON.parse(localStorage.getItem('kg_engine_flows') || '{}');
  if (!saved[name]) { showToast('路径不存在'); return; }
  loadFlowData(saved[name]);
  showToast('已加载: ' + name);
}

/* ============================
   FLOW DATA I/O
   ============================ */
function buildFlowData() {
  return {
    name: flowName,
    nodes: nodes.map(function(n) {
      return { id: n.id, type: n.type, label: n.label, x: Math.round(n.x), y: Math.round(n.y), description: n.description, config: JSON.parse(JSON.stringify(n.config || {})) };
    }),
    connections: connections.map(function(c) {
      return { id: c.id, sourceId: c.sourceId, targetId: c.targetId, sourcePort: c.sourcePort, targetPort: c.targetPort, label: c.label, eventType: c.eventType, condition: c.condition || '' };
    })
  };
}

function loadFlowData(data) {
  nodes = [];
  connections = [];
  selectedNodeId = null;
  selectedConnId = null;
  canvasEl.innerHTML = '';

  /* Re-create SVG */
  var svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('class', 'connections-svg');
  svg.setAttribute('id', 'connectionsSvg');
  svg.innerHTML = '<defs>'
    + '<marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M 0 0 L 8 3 L 0 6 L 2 3 Z" fill="rgba(0,0,0,0.25)"/></marker>'
    + '<marker id="arrowhead-active" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M 0 0 L 8 3 L 0 6 L 2 3 Z" fill="#4f8cff"/></marker>'
    + '</defs>';
  canvasEl.appendChild(svg);
  connectionsSvg = svg;

  flowName = data.name || '未命名路径';

  var maxN = 0, maxC = 0;

  /* Render nodes */
  (data.nodes || []).forEach(function(nd) {
    var numId = parseInt(nd.id.replace('n', ''));
    if (numId > maxN) maxN = numId;
    var node = {
      id: nd.id, type: nd.type, label: nd.label,
      x: nd.x, y: nd.y,
      description: nd.description || '',
      config: nd.config || {}
    };
    nodes.push(node);
    renderNode(node);
  });
  nextNodeId = maxN + 1;

  /* Render connections after nodes are in DOM */
  setTimeout(function() {
    (data.connections || []).forEach(function(cd) {
      var numId = parseInt(cd.id.replace('c', ''));
      if (numId > maxC) maxC = numId;

      /* Auto-detect ports if not specified */
      var sp = cd.sourcePort, tp = cd.targetPort;
      if (!sp || !tp) {
        var best = getBestPorts(cd.sourceId, cd.targetId);
        sp = best.sourcePort;
        tp = best.targetPort;
      }

      var conn = {
        id: cd.id, sourceId: cd.sourceId, targetId: cd.targetId,
        sourcePort: sp, targetPort: tp,
        label: cd.label || '',
        eventType: cd.eventType || '无条件',
        condition: cd.condition || ''
      };
      connections.push(conn);
      renderConnection(conn);
    });
    nextConnId = maxC + 1;
  }, 30);
}

/* ============================
   UTILITIES
   ============================ */
function findNode(id) {
  for (var i = 0; i < nodes.length; i++) {
    if (nodes[i].id === id) return nodes[i];
  }
  return null;
}

function findConnection(id) {
  for (var i = 0; i < connections.length; i++) {
    if (connections[i].id === id) return connections[i];
  }
  return null;
}

function escapeHtml(str) {
  if (!str) return '';
  return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function escapeAttr(str) {
  if (!str) return '';
  return str.replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function showToast(msg) {
  var toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(toast._timer);
  toast._timer = setTimeout(function() { toast.classList.remove('show'); }, 2500);
}

function getPortPosition(nodeId, portName) {
  var el = document.getElementById('node-' + nodeId);
  if (!el) return null;
  var x = parseInt(el.style.left);
  var y = parseInt(el.style.top);
  var w = el.offsetWidth;
  var h = el.offsetHeight;
  switch (portName) {
    case 'top':    return { x: x + w / 2, y: y };
    case 'bottom': return { x: x + w / 2, y: y + h };
    case 'left':   return { x: x, y: y + h / 2 };
    case 'right':  return { x: x + w, y: y + h / 2 };
  }
  return { x: x + w / 2, y: y + h / 2 };
}

function makeConnPath(x1, y1, port1, x2, y2, port2) {
  var dirs = {
    top:    { dx: 0, dy: -1 },
    bottom: { dx: 0, dy: 1 },
    left:   { dx: -1, dy: 0 },
    right:  { dx: 1, dy: 0 }
  };
  var d1 = dirs[port1] || { dx: 0, dy: 1 };
  var d2 = dirs[port2] || { dx: 0, dy: -1 };
  var dist = Math.sqrt(Math.pow(x2 - x1, 2) + Math.pow(y2 - y1, 2));
  var offset = Math.max(50, dist * 0.3);
  var cx1 = x1 + d1.dx * offset;
  var cy1 = y1 + d1.dy * offset;
  var cx2 = x2 + d2.dx * offset;
  var cy2 = y2 + d2.dy * offset;
  return 'M ' + x1 + ' ' + y1 + ' C ' + cx1 + ' ' + cy1 + ', ' + cx2 + ' ' + cy2 + ', ' + x2 + ' ' + y2;
}

function getBestPorts(sourceId, targetId) {
  var sEl = document.getElementById('node-' + sourceId);
  var tEl = document.getElementById('node-' + targetId);
  if (!sEl || !tEl) return { sourcePort: 'right', targetPort: 'left' };

  var sx = parseInt(sEl.style.left), sy = parseInt(sEl.style.top);
  var sw = sEl.offsetWidth, sh = sEl.offsetHeight;
  var tx = parseInt(tEl.style.left), ty = parseInt(tEl.style.top);
  var tw = tEl.offsetWidth, th = tEl.offsetHeight;

  var scx = sx + sw / 2, scy = sy + sh / 2;
  var tcx = tx + tw / 2, tcy = ty + th / 2;
  var dx = tcx - scx, dy = tcy - scy;

  if (Math.abs(dx) > Math.abs(dy)) {
    return dx > 0 ?
      { sourcePort: 'right', targetPort: 'left' } :
      { sourcePort: 'left', targetPort: 'right' };
  } else {
    return dy > 0 ?
      { sourcePort: 'bottom', targetPort: 'top' } :
      { sourcePort: 'top', targetPort: 'bottom' };
  }
}
