<script>
/* ===================================================================
   专病诊疗路径可视化流程引擎编辑器
   Pure HTML/CSS/JS - No external dependencies
   =================================================================== */

/* ---- Render navigation ---- */
(function() {
  var navPages = [
    {id:'index', label:'数据总览', icon:'📊'},
    {id:'explore', label:'图谱探索', icon:'🧭'},
    {id:'engine', label:'路径编辑', icon:'🔗'},
    {id:'diagnosis', label:'临床诊断模拟', icon:'🔍'}
  ];
  var html = '';
  navPages.forEach(function(p) {
    html += '<a class="nav-link' + (p.id === 'engine' ? ' active' : '') + '" href="' + p.id + '.html">' + p.icon + ' ' + p.label + '</a>';
  });
  document.getElementById('nav-links').innerHTML = html;
})();

/* ---- Node type definitions ---- */
var NODE_TYPES = [
  { type: 'trigger',  name: '事件触发', icon: '⚡', color: '#ff922b', desc: '临床事件入口' },
  { type: 'state',    name: '状态节点', icon: '📌', color: '#4f8cff', desc: '路径状态' },
  { type: 'decision', name: '决策节点', icon: '◆',  color: '#cc5de8', desc: '分支判断' },
  { type: 'action',   name: '动作节点', icon: '⚙',  color: '#51cf66', desc: '系统动作' },
  { type: 'gateway',  name: '并行网关', icon: '◇',  color: '#8b90a0', desc: '并行/汇聚' },
  { type: 'end',      name: '结束节点', icon: '⏹', color: '#ff6b6b', desc: '流程终止' }
];
var NODE_TYPE_MAP = {};
NODE_TYPES.forEach(function(t) { NODE_TYPE_MAP[t.type] = t; });

/* ---- State ---- */
var nodes = [];        // [{id, type, label, x, y, config:{}, description:''}]
var connections = [];  // [{id, source, target, label:''}]
var selectedNodeId = null;
var selectedConnId = null;
var nextNodeId = 1;
var nextConnId = 1;
var flowName = '未命名路径';
var flowVersion = '1.0';

/* ---- Canvas state ---- */
var canvasOffsetX = 0;
var canvasOffsetY = 0;
var canvasScale = 1;
var isPanning = false;
var panStartX = 0, panStartY = 0;
var spaceHeld = false;

/* ---- Drag from palette ---- */
var dragNodeType = null;
var dragPreview = null;

/* ---- Drag node on canvas ---- */
var dragNode = null;
var dragNodeStartX = 0, dragNodeStartY = 0;
var dragMouseStartX = 0, dragMouseStartY = 0;

/* ---- Connection drawing ---- */
var drawingConn = false;
var drawConnSourceId = null;
var drawConnStartX = 0, drawConnStartY = 0;
var drawConnEndX = 0, drawConnEndY = 0;
var tempConnPath = null;

/* ---- DOM refs ---- */
var canvasEl = document.getElementById('canvas');
var svgLayer = document.getElementById('svgLayer');
var canvasWrapper = document.getElementById('canvasWrapper');

/* ============================
   INIT
   ============================ */
function init() {
  renderPalette();
  refreshSavedPaths();
  setupCanvasEvents();
  setupKeyboardEvents();
  setupContextMenu();
  updateCanvasTransform();
}

/* ---- Render palette ---- */
function renderPalette() {
  var palette = document.getElementById('nodePalette');
  var html = '';
  NODE_TYPES.forEach(function(t) {
    html += '<div class="node-palette-item" draggable="true" data-type="' + t.type + '">'
      + '<div class="node-palette-icon" style="background:' + t.color + '22;color:' + t.color + '">' + t.icon + '</div>'
      + '<div><div class="node-palette-label">' + t.name + '</div>'
      + '<div class="node-palette-desc">' + t.desc + '</div></div></div>';
  });
  palette.innerHTML = html;

  // Attach drag events
  var items = palette.querySelectorAll('.node-palette-item');
  items.forEach(function(item) {
    item.addEventListener('mousedown', onPaletteDragStart);
  });
}

/* ============================
   PALETTE DRAG
   ============================ */
function onPaletteDragStart(e) {
  e.preventDefault();
  var type = this.getAttribute('data-type');
  dragNodeType = type;
  var info = NODE_TYPE_MAP[type];

  // Create preview
  dragPreview = document.createElement('div');
  dragPreview.className = 'drag-preview';
  dragPreview.innerHTML = '<div style="width:180px;padding:10px 14px;background:var(--bg2);border:2px solid ' + info.color + ';border-radius:10px;display:flex;align-items:center;gap:8px">'
    + '<span style="font-size:18px">' + info.icon + '</span>'
    + '<span style="font-size:12px;font-weight:600;color:var(--ink)">' + info.name + '</span></div>';
  dragPreview.style.left = e.clientX + 'px';
  dragPreview.style.top = e.clientY + 'px';
  document.body.appendChild(dragPreview);

  document.addEventListener('mousemove', onPaletteDragMove);
  document.addEventListener('mouseup', onPaletteDragEnd);
}

function onPaletteDragMove(e) {
  if (!dragPreview) return;
  dragPreview.style.left = e.clientX + 'px';
  dragPreview.style.top = e.clientY + 'px';
}

function onPaletteDragEnd(e) {
  document.removeEventListener('mousemove', onPaletteDragMove);
  document.removeEventListener('mouseup', onPaletteDragEnd);
  if (dragPreview) {
    document.body.removeChild(dragPreview);
    dragPreview = null;
  }
  if (!dragNodeType) return;

  // Check if dropped on canvas
  var rect = canvasWrapper.getBoundingClientRect();
  if (e.clientX >= rect.left && e.clientX <= rect.right && e.clientY >= rect.top && e.clientY <= rect.bottom) {
    var cx = (e.clientX - rect.left - canvasOffsetX) / canvasScale;
    var cy = (e.clientY - rect.top - canvasOffsetY) / canvasScale;
    addNode(dragNodeType, cx, cy);
  }
  dragNodeType = null;
}

/* ============================
   NODE MANAGEMENT
   ============================ */
function addNode(type, x, y, cfg) {
  var info = NODE_TYPE_MAP[type];
  var defaults = cfg || {};
  var node = {
    id: 'n' + (nextNodeId++),
    type: type,
    label: defaults.label || info.name,
    x: x - 90, // center
    y: y - 30,
    config: defaults.config || {},
    description: defaults.description || ''
  };
  nodes.push(node);
  renderNode(node);
  selectNode(node.id);
  return node;
}

function renderNode(node) {
  var info = NODE_TYPE_MAP[node.type];
  var el = document.createElement('div');
  el.className = 'flow-node';
  el.id = 'node-' + node.id;
  el.setAttribute('data-id', node.id);
  el.style.left = node.x + 'px';
  el.style.top = node.y + 'px';

  el.innerHTML = '<div class="flow-node-type-bar" style="background:' + info.color + '"></div>'
    + '<div class="flow-node-body">'
    + '<span class="flow-node-icon" style="color:' + info.color + '">' + info.icon + '</span>'
    + '<span class="flow-node-label" id="label-' + node.id + '">' + escapeHtml(node.label) + '</span>'
    + '</div>'
    + '<div class="node-port port-in" data-port="in" data-node="' + node.id + '" style="background:' + info.color + ';border-color:' + info.color + '"></div>'
    + '<div class="node-port port-out" data-port="out" data-node="' + node.id + '" style="background:' + info.color + ';border-color:' + info.color + '"></div>';

  canvasEl.appendChild(el);

  // Events
  el.addEventListener('mousedown', function(e) {
    if (e.target.classList.contains('node-port')) return;
    if (e.button !== 0) return;
    e.stopPropagation();
    selectNode(node.id);
    startNodeDrag(e, node);
  });

  el.addEventListener('contextmenu', function(e) {
    e.preventDefault();
    e.stopPropagation();
    selectNode(node.id);
    showContextMenu(e.clientX, e.clientY);
  });

  // Port events
  var ports = el.querySelectorAll('.node-port');
  ports.forEach(function(port) {
    port.addEventListener('mousedown', function(e) {
      e.stopPropagation();
      var portType = port.getAttribute('data-port');
      if (portType === 'out') {
        startConnectionDraw(e, node.id);
      }
    });
    port.addEventListener('mouseup', function(e) {
      e.stopPropagation();
      var portType = port.getAttribute('data-port');
      if (portType === 'in' && drawingConn && drawConnSourceId !== node.id) {
        finishConnectionDraw(node.id);
      }
    });
  });
}

function updateNodeDOM(node) {
  var el = document.getElementById('node-' + node.id);
  if (!el) return;
  el.style.left = node.x + 'px';
  el.style.top = node.y + 'px';
  var labelEl = document.getElementById('label-' + node.id);
  if (labelEl) labelEl.textContent = node.label;
}

function selectNode(id) {
  // Deselect previous
  if (selectedNodeId) {
    var prev = document.getElementById('node-' + selectedNodeId);
    if (prev) prev.classList.remove('selected');
  }
  selectedConnId = null;
  selectedNodeId = id;
  if (id) {
    var el = document.getElementById('node-' + id);
    if (el) el.classList.add('selected');
    renderProperties(id);
  } else {
    renderPropertiesEmpty();
  }
}

function deleteNode(id) {
  // Remove connections involving this node
  connections = connections.filter(function(c) {
    if (c.source === id || c.target === id) {
      removeConnectionDOM(c.id);
      return false;
    }
    return true;
  });
  // Remove node
  nodes = nodes.filter(function(n) { return n.id !== id; });
  var el = document.getElementById('node-' + id);
  if (el) el.remove();
  if (selectedNodeId === id) {
    selectedNodeId = null;
    renderPropertiesEmpty();
  }
}

function duplicateNode() {
  hideContextMenu();
  if (!selectedNodeId) return;
  var orig = findNode(selectedNodeId);
  if (!orig) return;
  addNode(orig.type, orig.x + 120, orig.y + 60, {
    label: orig.label + ' (副本)',
    config: JSON.parse(JSON.stringify(orig.config)),
    description: orig.description
  });
}

/* ---- Node Drag ---- */
function startNodeDrag(e, node) {
  dragNode = node;
  dragMouseStartX = e.clientX;
  dragMouseStartY = e.clientY;
  dragNodeStartX = node.x;
  dragNodeStartY = node.y;
  document.addEventListener('mousemove', onNodeDragMove);
  document.addEventListener('mouseup', onNodeDragEnd);
}

function onNodeDragMove(e) {
  if (!dragNode) return;
  var dx = (e.clientX - dragMouseStartX) / canvasScale;
  var dy = (e.clientY - dragMouseStartY) / canvasScale;
  dragNode.x = dragNodeStartX + dx;
  dragNode.y = dragNodeStartY + dy;
  updateNodeDOM(dragNode);
  updateAllConnections();
}

function onNodeDragEnd(e) {
  dragNode = null;
  document.removeEventListener('mousemove', onNodeDragMove);
  document.removeEventListener('mouseup', onNodeDragEnd);
}

/* ============================
   CONNECTIONS
   ============================ */
function addConnection(sourceId, targetId, label) {
  // Check for duplicates
  for (var i = 0; i < connections.length; i++) {
    if (connections[i].source === sourceId && connections[i].target === targetId) return null;
  }
  var conn = {
    id: 'c' + (nextConnId++),
    source: sourceId,
    target: targetId,
    label: label || ''
  };
  connections.push(conn);
  renderConnection(conn);
  return conn;
}

function renderConnection(conn) {
  var srcNode = findNode(conn.source);
  var tgtNode = findNode(conn.target);
  if (!srcNode || !tgtNode) return;

  var srcInfo = NODE_TYPE_MAP[srcNode.type];
  var path = createBezierPath(srcNode, tgtNode);

  // Create SVG path
  var pathEl = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  pathEl.setAttribute('id', 'conn-' + conn.id);
  pathEl.setAttribute('d', path);
  pathEl.setAttribute('fill', 'none');
  pathEl.setAttribute('stroke', 'rgba(255,255,255,0.2)');
  pathEl.setAttribute('stroke-width', '1.5');
  pathEl.setAttribute('marker-end', 'url(#arrowhead)');
  pathEl.style.pointerEvents = 'stroke';
  pathEl.style.cursor = 'pointer';
  pathEl.setAttribute('data-conn', conn.id);
  svgLayer.appendChild(pathEl);

  // Click to select connection
  pathEl.addEventListener('mousedown', function(e) {
    e.stopPropagation();
    selectConnection(conn.id);
  });

  // Label
  if (conn.label) {
    renderConnectionLabel(conn);
  }
}

function renderConnectionLabel(conn) {
  var srcNode = findNode(conn.source);
  var tgtNode = findNode(conn.target);
  if (!srcNode || !tgtNode) return;

  var mx = (srcNode.x + 90 + tgtNode.x + 90) / 2;
  var my = (srcNode.y + 35 + tgtNode.y + 35) / 2;

  var lbl = document.createElement('div');
  lbl.className = 'conn-label';
  lbl.id = 'conn-label-' + conn.id;
  lbl.textContent = conn.label;
  lbl.style.left = mx + 'px';
  lbl.style.top = my + 'px';
  canvasEl.appendChild(lbl);
}

function removeConnectionDOM(connId) {
  var pathEl = document.getElementById('conn-' + connId);
  if (pathEl) pathEl.remove();
  var lblEl = document.getElementById('conn-label-' + connId);
  if (lblEl) lblEl.remove();
}

function selectConnection(connId) {
  // Deselect node
  if (selectedNodeId) {
    var prev = document.getElementById('node-' + selectedNodeId);
    if (prev) prev.classList.remove('selected');
    selectedNodeId = null;
  }
  // Deselect prev conn
  if (selectedConnId) {
    var prevPath = document.getElementById('conn-' + selectedConnId);
    if (prevPath) prevPath.setAttribute('stroke', 'rgba(255,255,255,0.2)');
  }
  selectedConnId = connId;
  var pathEl = document.getElementById('conn-' + connId);
  if (pathEl) pathEl.setAttribute('stroke', '#4f8cff');

  // Show connection properties
  var conn = findConnection(connId);
  if (conn) renderConnectionProperties(conn);
}

function deleteConnection(connId) {
  connections = connections.filter(function(c) { return c.id !== connId; });
  removeConnectionDOM(connId);
  if (selectedConnId === connId) {
    selectedConnId = null;
    renderPropertiesEmpty();
  }
}

function createBezierPath(srcNode, tgtNode) {
  var x1 = srcNode.x + 90;
  var y1 = srcNode.y + 65; // bottom of node
  var x2 = tgtNode.x + 90;
  var y2 = tgtNode.y;      // top of node

  var dy = Math.abs(y2 - y1);
  var cp = Math.max(50, dy * 0.4);

  return 'M ' + x1 + ' ' + y1 + ' C ' + x1 + ' ' + (y1 + cp) + ', ' + x2 + ' ' + (y2 - cp) + ', ' + x2 + ' ' + y2;
}

function updateAllConnections() {
  connections.forEach(function(conn) {
    var pathEl = document.getElementById('conn-' + conn.id);
    if (!pathEl) return;
    var srcNode = findNode(conn.source);
    var tgtNode = findNode(conn.target);
    if (!srcNode || !tgtNode) return;
    pathEl.setAttribute('d', createBezierPath(srcNode, tgtNode));

    // Update label position
    if (conn.label) {
      var lblEl = document.getElementById('conn-label-' + conn.id);
      if (lblEl) {
        lblEl.style.left = ((srcNode.x + 90 + tgtNode.x + 90) / 2) + 'px';
        lblEl.style.top = ((srcNode.y + 35 + tgtNode.y + 35) / 2) + 'px';
      }
    }
  });
}

/* ---- Connection drawing ---- */
function startConnectionDraw(e, sourceId) {
  e.preventDefault();
  drawingConn = true;
  drawConnSourceId = sourceId;
  var srcNode = findNode(sourceId);
  drawConnStartX = srcNode.x + 90;
  drawConnStartY = srcNode.y + 65;

  // Create temp SVG path
  tempConnPath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  tempConnPath.setAttribute('fill', 'none');
  tempConnPath.setAttribute('stroke', 'rgba(79,140,255,0.5)');
  tempConnPath.setAttribute('stroke-width', '2');
  tempConnPath.setAttribute('stroke-dasharray', '6,4');
  svgLayer.appendChild(tempConnPath);

  document.addEventListener('mousemove', onConnectionDrawMove);
  document.addEventListener('mouseup', onConnectionDrawEnd);
}

function onConnectionDrawMove(e) {
  if (!drawingConn || !tempConnPath) return;
  var rect = canvasWrapper.getBoundingClientRect();
  drawConnEndX = (e.clientX - rect.left - canvasOffsetX) / canvasScale;
  drawConnEndY = (e.clientY - rect.top - canvasOffsetY) / canvasScale;

  var dy = Math.abs(drawConnEndY - drawConnStartY);
  var cp = Math.max(50, dy * 0.4);
  var d = 'M ' + drawConnStartX + ' ' + drawConnStartY
    + ' C ' + drawConnStartX + ' ' + (drawConnStartY + cp) + ', '
    + drawConnEndX + ' ' + (drawConnEndY - cp) + ', '
    + drawConnEndX + ' ' + drawConnEndY;
  tempConnPath.setAttribute('d', d);
}

function onConnectionDrawEnd(e) {
  document.removeEventListener('mousemove', onConnectionDrawMove);
  document.removeEventListener('mouseup', onConnectionDrawEnd);
  if (tempConnPath) {
    tempConnPath.remove();
    tempConnPath = null;
  }
  drawingConn = false;
  drawConnSourceId = null;
}

function finishConnectionDraw(targetId) {
  if (!drawConnSourceId || drawConnSourceId === targetId) return;
  addConnection(drawConnSourceId, targetId);
}

/* ============================
   CANVAS EVENTS
   ============================ */
function setupCanvasEvents() {
  // Click on canvas to deselect
  canvasWrapper.addEventListener('mousedown', function(e) {
    if (e.target === canvasWrapper || e.target.classList.contains('canvas-grid')) {
      // Pan with middle button or space held
      if (e.button === 1 || (e.button === 0 && spaceHeld)) {
        e.preventDefault();
        isPanning = true;
        panStartX = e.clientX - canvasOffsetX;
        panStartY = e.clientY - canvasOffsetY;
        canvasWrapper.classList.add('panning');
        return;
      }
      // Deselect
      if (e.button === 0) {
        selectNode(null);
        selectedConnId = null;
        renderPropertiesEmpty();
        hideContextMenu();
      }
    }
  });

  document.addEventListener('mousemove', function(e) {
    if (isPanning) {
      canvasOffsetX = e.clientX - panStartX;
      canvasOffsetY = e.clientY - panStartY;
      updateCanvasTransform();
    }
  });

  document.addEventListener('mouseup', function(e) {
    if (isPanning) {
      isPanning = false;
      canvasWrapper.classList.remove('panning');
    }
  });

  // Zoom with Ctrl+scroll
  canvasWrapper.addEventListener('wheel', function(e) {
    if (!e.ctrlKey) return;
    e.preventDefault();
    var rect = canvasWrapper.getBoundingClientRect();
    var mx = e.clientX - rect.left;
    var my = e.clientY - rect.top;

    var oldScale = canvasScale;
    var delta = e.deltaY > 0 ? 0.9 : 1.1;
    canvasScale = Math.max(0.2, Math.min(3, canvasScale * delta));

    // Zoom towards mouse
    canvasOffsetX = mx - (mx - canvasOffsetX) * (canvasScale / oldScale);
    canvasOffsetY = my - (my - canvasOffsetY) * (canvasScale / oldScale);

    updateCanvasTransform();
  }, { passive: false });

  // Click to hide context menu
  canvasWrapper.addEventListener('click', hideContextMenu);
}

function updateCanvasTransform() {
  canvasEl.style.transform = 'translate(' + canvasOffsetX + 'px, ' + canvasOffsetY + 'px) scale(' + canvasScale + ')';
  svgLayer.style.transform = 'translate(' + canvasOffsetX + 'px, ' + canvasOffsetY + 'px) scale(' + canvasScale + ')';
  document.getElementById('zoomDisplay').textContent = Math.round(canvasScale * 100) + '%';
}

/* ============================
   KEYBOARD EVENTS
   ============================ */
function setupKeyboardEvents() {
  document.addEventListener('keydown', function(e) {
    if (e.key === ' ') {
      e.preventDefault();
      spaceHeld = true;
      canvasWrapper.classList.add('panning');
    }
    if (e.key === 'Delete' || e.key === 'Backspace') {
      // Don't delete if editing text
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'SELECT') return;
      deleteSelected();
    }
    if (e.key === 'Escape') {
      selectNode(null);
      selectedConnId = null;
      renderPropertiesEmpty();
      hideContextMenu();
    }
  });

  document.addEventListener('keyup', function(e) {
    if (e.key === ' ') {
      spaceHeld = false;
      if (!isPanning) canvasWrapper.classList.remove('panning');
    }
  });
}

function deleteSelected() {
  hideContextMenu();
  if (selectedNodeId) {
    deleteNode(selectedNodeId);
  } else if (selectedConnId) {
    deleteConnection(selectedConnId);
  }
}

/* ============================
   TOOLBAR ACTIONS
   ============================ */
function newFlow() {
  if (nodes.length > 0 && !confirm('确定新建？当前内容将被清空。')) return;
  nodes = [];
  connections = [];
  selectedNodeId = null;
  selectedConnId = null;
  nextNodeId = 1;
  nextConnId = 1;
  flowName = '未命名路径';
  canvasEl.innerHTML = '';
  svgLayer.innerHTML = '';
  renderPropertiesEmpty();
  showToast('已新建空白路径');
}

function saveFlow() {
  var data = {
    name: flowName,
    version: flowVersion,
    nodes: nodes.map(function(n) {
      return { id: n.id, type: n.type, label: n.label, x: Math.round(n.x), y: Math.round(n.y), config: n.config, description: n.description };
    }),
    connections: connections.map(function(c) {
      return { id: c.id, source: c.source, target: c.target, label: c.label };
    })
  };

  try {
    // Get existing saved flows
    var saved = JSON.parse(localStorage.getItem('kg_engine_flows') || '{}');
    saved[flowName] = data;
    localStorage.setItem('kg_engine_flows', JSON.stringify(saved));
    refreshSavedPaths();
    showToast('已保存: ' + flowName);
  } catch(e) {
    showToast('保存失败: ' + e.message);
  }
}

function loadFlow() {
  var saved = JSON.parse(localStorage.getItem('kg_engine_flows') || '{}');
  var names = Object.keys(saved);
  if (names.length === 0) {
    showToast('没有已保存的路径');
    return;
  }
  // Show first saved or prompt
  var name = prompt('请输入要加载的路径名称:\n\n已保存: ' + names.join(', '));
  if (!name || !saved[name]) return;
  loadFlowData(saved[name]);
  showToast('已加载: ' + name);
}

function loadFlowData(data) {
  nodes = [];
  connections = [];
  selectedNodeId = null;
  selectedConnId = null;
  canvasEl.innerHTML = '';
  svgLayer.innerHTML = '';

  flowName = data.name || '未命名路径';
  flowVersion = data.version || '1.0';

  // Find max IDs
  var maxN = 0, maxC = 0;

  // Render nodes
  (data.nodes || []).forEach(function(nd) {
    var numId = parseInt(nd.id.replace('n', ''));
    if (numId > maxN) maxN = numId;
    var node = {
      id: nd.id,
      type: nd.type,
      label: nd.label,
      x: nd.x,
      y: nd.y,
      config: nd.config || {},
      description: nd.description || ''
    };
    nodes.push(node);
    renderNode(node);
  });
  nextNodeId = maxN + 1;

  // Render connections (after nodes)
  setTimeout(function() {
    (data.connections || []).forEach(function(cd) {
      var numId = parseInt(cd.id.replace('c', ''));
      if (numId > maxC) maxC = numId;
      var conn = {
        id: cd.id,
        source: cd.source,
        target: cd.target,
        label: cd.label || ''
      };
      connections.push(conn);
      renderConnection(conn);
    });
    nextConnId = maxC + 1;
  }, 50);
}

function exportJSON() {
  var data = {
    name: flowName,
    version: flowVersion,
    nodes: nodes.map(function(n) {
      return { id: n.id, type: n.type, label: n.label, x: Math.round(n.x), y: Math.round(n.y), config: n.config, description: n.description };
    }),
    connections: connections.map(function(c) {
      return { id: c.id, source: c.source, target: c.target, label: c.label };
    })
  };

  var json = JSON.stringify(data, null, 2);
  var blob = new Blob([json], { type: 'application/json' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = (flowName || 'flow') + '.json';
  a.click();
  URL.revokeObjectURL(url);
  showToast('已导出JSON文件');
}

/* ---- Zoom controls ---- */
function zoomIn() {
  canvasScale = Math.min(3, canvasScale * 1.2);
  updateCanvasTransform();
}
function zoomOut() {
  canvasScale = Math.max(0.2, canvasScale / 1.2);
  updateCanvasTransform();
}
function resetZoom() {
  canvasScale = 1;
  canvasOffsetX = 0;
  canvasOffsetY = 0;
  updateCanvasTransform();
}

/* ============================
   SAVED PATHS LIST
   ============================ */
function refreshSavedPaths() {
  var container = document.getElementById('savedPaths');
  var saved = JSON.parse(localStorage.getItem('kg_engine_flows') || '{}');
  var names = Object.keys(saved);

  if (names.length === 0) {
    container.innerHTML = '<div style="text-align:center;padding:20px;font-size:12px;color:var(--muted)">暂无保存的路径</div>';
    return;
  }

  var html = '';
  names.forEach(function(name) {
    var flow = saved[name];
    var nodeCount = (flow.nodes || []).length;
    var connCount = (flow.connections || []).length;
    html += '<div class="saved-path-item" onclick="loadSavedPath(\'' + escapeAttr(name) + '\')">'
      + '<span style="font-size:14px">📄</span>'
      + '<span class="saved-path-name">' + escapeHtml(name) + '</span>'
      + '<span class="saved-path-count">' + nodeCount + '节点/' + connCount + '连线</span>'
      + '</div>';
  });
  container.innerHTML = html;
}

function loadSavedPath(name) {
  var saved = JSON.parse(localStorage.getItem('kg_engine_flows') || '{}');
  if (!saved[name]) { showToast('路径不存在'); return; }
  loadFlowData(saved[name]);
  showToast('已加载: ' + name);
}

/* ============================
   AMI EXAMPLE
   ============================ */

/* ============================
   UTILITIES
   ============================ */
function findNode(id) {
  for (var i = 0; i < nodes.length; i++) {
    if (nodes[i].id === id) return nodes[i];
  }
  return null;
}

function findConnection(id) {
  for (var i = 0; i < connections.length; i++) {
    if (connections[i].id === id) return connections[i];
  }
  return null;
}

function escapeHtml(str) {
  if (!str) return '';
  return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function escapeAttr(str) {
  if (!str) return '';
  return str.replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function showToast(msg) {
  var toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(toast._timer);
  toast._timer = setTimeout(function() { toast.classList.remove('show'); }, 2500);
}
