<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>专科知识图谱 · 心血管内科 - 临床指南库</title>
<link rel="stylesheet" href="./_shared/css/style.css">
<style>
.g-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 16px; }
.g-search { display: flex; gap: 12px; margin-bottom: 14px; }
.g-search input { flex: 1; padding: 8px 14px; border: 1px solid var(--rule); border-radius: 8px; background: var(--bg2); color: var(--ink); font-size: 13px; outline: none; transition: border-color .2s; }
.g-search input:focus { border-color: var(--accent); }
.g-search input::placeholder { color: var(--muted); }
.g-group-title { font-size: 12px; font-weight: 700; color: var(--muted); margin: 14px 0 8px; padding-bottom: 4px; border-bottom: 1px solid var(--rule); }
.g-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 8px; }
.g-card { background: var(--bg2); border: 1px solid var(--rule); border-radius: 8px; padding: 10px 12px; transition: border-color .2s, transform .15s; }
.g-card:hover { border-color: var(--accent); transform: translateY(-1px); }
.g-card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 6px; }
.g-card-title { font-size: 13px; font-weight: 700; color: var(--ink); line-height: 1.3; flex: 1; }
.g-card-year { font-size: 10px; color: var(--accent); background: rgba(79,140,255,.1); padding: 1px 7px; border-radius: 10px; font-weight: 600; white-space: nowrap; margin-left: 8px; }
.g-card-org { font-size: 11px; color: var(--muted); margin-bottom: 4px; line-height: 1.3; }
.g-card-level { display: inline-block; font-size: 10px; padding: 1px 7px; border-radius: 4px; background: var(--bg3); color: var(--muted); margin-bottom: 6px; }
.g-card-diseases { display: flex; flex-wrap: wrap; gap: 4px; }
.g-card-tag { font-size: 10px; padding: 2px 7px; border-radius: 4px; background: rgba(79,140,255,.1); color: var(--accent); cursor: pointer; transition: background .15s; }
.g-card-tag:hover { background: rgba(79,140,255,.2); }
.g-empty { text-align: center; padding: 40px 20px; color: var(--muted); font-size: 14px; }
.g-group-wrapper { margin-bottom: 4px; }
@media(max-width:768px){ .g-stats { grid-template-columns: repeat(2, 1fr); } .g-list { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="nav"></div>
<div class="page">
  <div class="page-header">
    <h1>📘 临床指南库</h1>
    <div class="subtitle">心血管内科专科知识图谱 — 疾病关联临床实践指南一览</div>
  </div>
  <div class="g-stats" id="gStats"></div>
  <div class="g-search">
    <input type="text" id="gSearch" placeholder="搜索指南名称、发布机构、年份、疾病名称..." oninput="filterGuidelines()">
  </div>
  <div id="gContent"></div>
</div>
<script src="./_shared/js/app.js?v=20260903"></script>
<script>
renderNav('guideline');
var ALL_GUIDELINES = [];
function loadGuidelines() {
  fetch('/api/kg/guidelines')
    .then(function(r){return r.json()})
    .then(function(data){
      ALL_GUIDELINES = data.guidelines || [];
      renderStats();
      renderList();
    })
    .catch(function(e){
      console.error('加载指南失败:', e);
      document.getElementById('gContent').innerHTML = '<div class="g-empty">加载失败，请检查服务器连接</div>';
    });
}
function renderStats() {
  var total = ALL_GUIDELINES.length;
  var diseaseSet = new Set();
  var yearSet = new Set();
  ALL_GUIDELINES.forEach(function(g){
    (g.diseases || []).forEach(function(d){ diseaseSet.add(d.name); });
    if(g.year) yearSet.add(g.year);
  });
  var latestYear = yearSet.size > 0 ? Math.max.apply(null, Array.from(yearSet).map(Number)) : '-';
  var html = '<div class="stat-card"><div class="stat-num">' + total + '</div><div class="stat-label">指南总数</div></div>';
  html += '<div class="stat-card"><div class="stat-num">' + diseaseSet.size + '</div><div class="stat-label">涉及疾病</div></div>';
  html += '<div class="stat-card"><div class="stat-num">' + yearSet.size + '</div><div class="stat-label">发布年份</div></div>';
  html += '<div class="stat-card"><div class="stat-num">' + latestYear + '</div><div class="stat-label">最新年份</div></div>';
  document.getElementById('gStats').innerHTML = html;
}
function renderList() {
  var container = document.getElementById('gContent');
  if(ALL_GUIDELINES.length === 0){
    container.innerHTML = '<div class="g-empty">暂无指南数据</div>';
    return;
  }
  var groups = {};
  ALL_GUIDELINES.forEach(function(g){
    var y = g.year || '未知年份';
    if(!groups[y]) groups[y] = [];
    groups[y].push(g);
  });
  var years = Object.keys(groups).sort(function(a,b){ return (parseInt(b)||0) - (parseInt(a)||0); });
  var html = '';
  years.forEach(function(year){
    html += '<div class="g-group-title">' + year + '年 <span style="font-weight:400;color:var(--muted)">(' + groups[year].length + ')</span></div>';
    html += '<div class="g-list">';
    groups[year].forEach(function(g){ html += renderCard(g); });
    html += '</div>';
  });
  container.innerHTML = html;
}
function renderCard(g) {
  var searchStr = (g.name + ' ' + g.organization + ' ' + g.year + ' ' + (g.diseases||[]).map(function(d){return d.name;}).join(' ')).toLowerCase();
  var h = '<div class="g-card" data-search="' + searchStr + '">';
  h += '<div class="g-card-header">';
  h += '<span class="g-card-title">' + (g.name || '未命名指南') + '</span>';
  if(g.year) h += '<span class="g-card-year">' + g.year + '</span>';
  h += '</div>';
  var orgLine = '';
  if(g.organization) orgLine += '📋 ' + g.organization;
  if(g.version) orgLine += (orgLine ? ' · ' : '') + g.version;
  if(g.level) orgLine += (orgLine ? ' · ' : '') + '推荐等级: ' + g.level;
  if(orgLine) h += '<div class="g-card-org">' + orgLine + '</div>';
  if(g.diseases && g.diseases.length > 0){
    h += '<div class="g-card-diseases">';
    g.diseases.forEach(function(d){
      h += '<span class="g-card-tag" onclick="event.stopPropagation();location.href=\'explore.html?disease=' + encodeURIComponent(d.code) + '\'">' + d.name + '</span>';
    });
    h += '</div>';
  }
  h += '</div>';
  return h;
}
function filterGuidelines() {
  var q = document.getElementById('gSearch').value.toLowerCase().trim();
  var cards = document.querySelectorAll('.g-card');
  var groups = document.querySelectorAll('.g-group-title');
  cards.forEach(function(card){
    var s = card.getAttribute('data-search') || '';
    card.style.display = (!q || s.indexOf(q) !== -1) ? '' : 'none';
  });
  groups.forEach(function(title){
    var list = title.nextElementSibling;
    if(list){
      var visible = list.querySelectorAll('.g-card:not([style*="display: none"])');
      title.style.display = visible.length > 0 ? '' : 'none';
      list.style.display = visible.length > 0 ? '' : 'none';
    }
  });
}
loadGuidelines();
</script>
</body>
</html>
