<script>
renderNav('guideline');
var ALL = [];            // 全部指南（/api/kg/guidelines）
var TREE = null;         // 疾病树（/api/kg/disease-tree）
var CAT_COUNT = {};      // cat.code -> 指南数
var DIS_COUNT = {};      // dis.code -> 指南数
var SEL = { type: 'all' };  // 当前树选中：all | cat | dis
var TREE_OPEN = {};      // 树展开状态

function esc(s) {
  return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/* ---------- 数据加载 ---------- */
function loadGuidelines() {
  Promise.all([
    fetch('/api/kg/guidelines').then(function(r){return r.json()}),
    fetch('/api/kg/disease-tree').then(function(r){return r.json()})
  ]).then(function(arr){
    ALL = arr[0].guidelines || [];
    TREE = Array.isArray(arr[1]) ? arr[1] : [];
    buildCounts();
    renderStats();
    renderTree();
    renderYearSelect();
    applyFilter();
  }).catch(function(e){
    console.error('加载指南失败:', e);
    document.getElementById('glTree').innerHTML = '';
    document.getElementById('glTbody').innerHTML = '<tr><td colspan="7"><div class="g-empty">加载失败，请检查服务器连接</div></td></tr>';
  });
}

function buildCounts() {
  CAT_COUNT = {}; DIS_COUNT = {};
  ALL.forEach(function(g){
    (g.categories || []).forEach(function(c){ CAT_COUNT[c.code] = (CAT_COUNT[c.code]||0) + 1; });
    (g.diseases || []).forEach(function(d){ DIS_COUNT[d.code] = (DIS_COUNT[d.code]||0) + 1; });
  });
}

function renderStats() {
  var disSet = new Set(), years = new Set(), withFile = 0, evTotal = 0;
  ALL.forEach(function(g){
    (g.diseases||[]).forEach(function(d){ disSet.add(d.code); });
    if (g.year) years.add(g.year);
    if (g.has_file) withFile++;
    evTotal += (g.evidence_count||0);
  });
  var ys = Array.from(years).sort();
  var yearSpan = ys.length ? ys[0] + ' - ' + ys[ys.length-1] : '-';
  var html = '<div class="stat-card"><div class="stat-num">' + ALL.length + '</div><div class="stat-label">指南总数</div></div>';
  html += '<div class="stat-card"><div class="stat-num">' + disSet.size + '</div><div class="stat-label">关联疾病数</div></div>';
  html += '<div class="stat-card"><div class="stat-num">' + evTotal.toLocaleString() + '</div><div class="stat-label">证据条目总数</div></div>';
  html += '<div class="stat-card"><div class="stat-num">' + withFile + '</div><div class="stat-label">可预览原文 / 发布年份 ' + yearSpan + '</div></div>';
  document.getElementById('gStats').innerHTML = html;
}

function renderYearSelect() {
  var years = new Set();
  ALL.forEach(function(g){ if (g.year) years.add(g.year); });
  var sel = document.getElementById('gsYear');
  var cur = sel.value;
  var opts = Array.from(years).sort(function(a,b){ return parseInt(b)||0 - (parseInt(a)||0); });
  var html = '<option value="">全部</option>';
  opts.forEach(function(y){ html += '<option value="' + esc(y) + '">' + esc(y) + '</option>'; });
  sel.innerHTML = html;
  if (cur) sel.value = cur;
}

/* ---------- 左侧树 ---------- */
function renderTree() {
  var catN = TREE.length;
  var disN = 0;
  TREE.forEach(function(cat){ (cat.children||[]).forEach(function(d){ disN++; disN += (d.children||[]).length; }); });
  document.getElementById('glTreeSub').textContent = catN + ' 类 / ' + disN + ' 病';
  var h = '';
  h += '<div class="tn' + (SEL.type==='all' ? ' active' : '') + '" onclick="selectNode(\'all\',\'\')">'
     + '<span class="tn-arrow"></span><span class="tn-label">📖 全部指南</span><span class="tn-count">' + ALL.length + '</span></div>';
  var rootOpen = TREE_OPEN['SP-ROOT'] !== false;  // 专科默认展开
  h += '<div class="tn' + (rootOpen ? ' open' : '') + '" onclick="toggleTreeNode(\'SP-ROOT\')">'
     + '<span class="tn-arrow">▶</span><span class="tn-label">🏥 心血管内科</span><span class="tn-count">' + ALL.length + '</span></div>';
  h += '<div class="tn-children' + (rootOpen ? ' show' : '') + '" id="tn-SP-ROOT">';
  TREE.forEach(function(cat){
    var cc = CAT_COUNT[cat.code] || 0;
    var open = !!TREE_OPEN[cat.code];
    var active = SEL.type==='cat' && SEL.code===cat.code;
    h += '<div class="tn-child"><div class="tn' + (open?' open':'') + (active?' active':'') + '" onclick="event.stopPropagation();toggleTreeNode(\'' + cat.code + '\')" ondblclick="event.stopPropagation();selectNode(\'cat\',\'' + cat.code + '\')">'
       + '<span class="tn-arrow">▶</span><span class="tn-label" title="' + esc(cat.name) + '">' + esc(cat.name) + '</span><span class="tn-count">' + cc + '</span></div>';
    h += '<div class="tn-children' + (open?' show':'') + '" id="tn-' + cat.code + '">';
    (cat.children||[]).forEach(function(dis){
      var dc = DIS_COUNT[dis.code] || 0;
      var dActive = SEL.type==='dis' && SEL.code===dis.code;
      var dOpen = !!TREE_OPEN[dis.code];
      if ((dis.children||[]).length) {
        h += '<div class="tn-grandchild"><div class="tn' + (dOpen?' open':'') + (dActive?' active':'') + '" onclick="event.stopPropagation();toggleTreeNode(\'' + dis.code + '\')">'
           + '<span class="tn-arrow">▶</span><span class="tn-label" title="' + esc(dis.name) + '">' + esc(dis.name) + '</span><span class="tn-count">' + dc + '</span></div>';
        h += '<div class="tn-children' + (dOpen?' show':'') + '" id="tn-' + dis.code + '">';
        (dis.children||[]).forEach(function(sub){
          var sc = DIS_COUNT[sub.code] || 0;
          var sActive = SEL.type==='dis' && SEL.code===sub.code;
          h += '<div class="tn" onclick="event.stopPropagation();selectNode(\'dis\',\'' + sub.code + '\')">'
             + '<span class="tn-arrow"></span><span class="tn-label" title="' + esc(sub.name) + '">' + esc(sub.name) + '</span><span class="tn-count">' + sc + '</span></div>';
        });
        h += '</div></div>';
      } else {
        h += '<div class="tn-grandchild"><div class="tn' + (dActive?' active':'') + '" onclick="event.stopPropagation();selectNode(\'dis\',\'' + dis.code + '\')">'
           + '<span class="tn-arrow"></span><span class="tn-label" title="' + esc(dis.name) + '">' + esc(dis.name) + '</span><span class="tn-count">' + dc + '</span></div></div>';
      }
    });
    h += '</div></div>';
  });
  h += '</div>';
  document.getElementById('glTree').innerHTML = h;
}
function toggleTreeNode(code) { TREE_OPEN[code] = !TREE_OPEN[code]; renderTree(); }
function selectNode(type, code) { SEL = {type:type, code:code}; renderTree(); applyFilter(); }

/* ---------- 右侧列表（多条件过滤） ---------- */
function applyFilter() {
  var qName = (document.getElementById('gsName').value || '').toLowerCase().trim();
  var qYear = document.getElementById('gsYear').value || '';
  var qAuthor = (document.getElementById('gsAuthor').value || '').toLowerCase().trim();
  var qDis = (document.getElementById('gsDisease').value || '').toLowerCase().trim();
  var list = ALL.filter(function(g){
    if (SEL.type === 'cat') {
      var hit = (g.categories||[]).some(function(c){ return c.code === SEL.code; });
      if (!hit) return false;
    } else if (SEL.type === 'dis') {
      var hit2 = (g.diseases||[]).some(function(d){ return d.code === SEL.code; });
      if (!hit2) return false;
    }
    if (qName && ((g.name||'') + ' ' + (g.pref||'')).toLowerCase().indexOf(qName) === -1) return false;
    if (qYear && (g.year||'') !== qYear) return false;
    if (qAuthor) {
      // 库内无独立作者字段：机构 issuing_body 为主，指南名常含机构词（中华医学会/欧洲心脏病学会…），一并匹配
      var aStr = ((g.organization||'') + ' ' + (g.name||'')).toLowerCase();
      if (aStr.indexOf(qAuthor) === -1) return false;
    }
    if (qDis) {
      var dStr = ((g.diseases||[]).map(function(d){return d.name;}).join(' ') + ' ' + (g.categories||[]).map(function(c){return c.name;}).join(' ')).toLowerCase();
      if (dStr.indexOf(qDis) === -1) return false;
    }
    return true;
  });
  renderTable(list);
  var selLabel = SEL.type==='cat' ? ' · 分类「' + catName(SEL.code) + '」' : (SEL.type==='dis' ? ' · 病种「' + disName(SEL.code) + '」' : '');
  document.getElementById('glResultInfo').innerHTML = '共 <b style="color:var(--accent)">' + list.length + '</b> / ' + ALL.length + ' 份指南' + selLabel;
}
function catName(code) { for (var i=0;i<TREE.length;i++) if (TREE[i].code===code) return TREE[i].name; return code; }
function disName(code) {
  var name = '';
  TREE.forEach(function(cat){ (cat.children||[]).forEach(function(d){
    if (d.code===code) name = d.name;
    (d.children||[]).forEach(function(s){ if (s.code===code) name = s.name; });
  });});
  return name || code;
}
function resetFilter() {
  document.getElementById('gsName').value = '';
  document.getElementById('gsYear').value = '';
  document.getElementById('gsAuthor').value = '';
  document.getElementById('gsDisease').value = '';
  SEL = { type: 'all' };
  renderTree();
  applyFilter();
}

var CUR_LIST = [];      // 当前渲染的过滤结果（操作列按索引传参，避免文件名转义问题）
function renderTable(list) {
  CUR_LIST = list;
  var tb = document.getElementById('glTbody');
  if (!list.length) {
    tb.innerHTML = '<tr><td colspan="7"><div class="g-empty">没有符合条件的指南</div></td></tr>';
    return;
  }
  var h = '';
  list.forEach(function(g, i){
    var ev = g.evidence_count||0, rc = g.rec_count||0, dc = g.disease_count||0;
    h += '<tr>';
    // 名称：可预览时点击打开 PDF，否则点开解析数据
    if (g.has_file) {
      h += '<td class="gl-name"><span class="gl-name-inner clickable" title="点击预览 PDF 原文" onclick="openPdf(' + i + ')">'
         + '<span class="gl-pdf-ico">📄</span><span>' + esc(g.name || '未命名指南') + '</span></span></td>';
    } else {
      h += '<td class="gl-name"><span class="gl-name-inner plain" title="原文文件未上传，点击名称查看解析数据" onclick="showDetail(' + i + ')">'
         + '<span>' + esc(g.name || '未命名指南') + '</span></span></td>';
    }
    h += '<td>' + (g.year ? '<span class="tag tag-blue" style="font-size:11px;padding:2px 8px">' + esc(g.year) + '</span>' : '<span style="color:var(--muted)">—</span>') + '</td>';
    h += '<td class="gl-org" title="' + esc(g.organization || '') + '">' + (g.organization ? esc(g.organization) : '—') + '</td>';
    // 关联病种
    h += '<td><div class="gl-dtags">';
    if (dc === 0) {
      h += '<span style="color:var(--muted);font-size:11px">未挂靠</span>';
    } else {
      (g.diseases||[]).slice(0,2).forEach(function(d){
        h += '<span class="gl-dtag" title="查看疾病图谱" onclick="location.href=\'explore.html?code=' + encodeURIComponent(d.code) + '\'">' + esc(d.name) + '</span>';
      });
      if (dc > 2) h += '<span class="gl-dmore" title="' + esc((g.diseases||[]).map(function(d){return d.name;}).join('、')) + '">+' + (dc-2) + '</span>';
    }
    h += '</div></td>';
    h += '<td><span class="gl-num' + (ev?'':' zero') + '">' + ev + '</span></td>';
    h += '<td><span class="gl-num' + (rc?'':' zero') + '">' + rc + '</span></td>';
    h += '<td><div class="gl-act">'
       + '<button class="gl-act-btn" onclick="showDetail(' + i + ')">解析数据</button>'
       + (g.has_file
          ? '<button class="gl-act-btn green" onclick="openPdf(' + i + ')">预览PDF</button>'
          : '<button class="gl-act-btn disabled" title="原文文件未上传到服务器">无原文</button>')
       + '</div></td>';
    h += '</tr>';
  });
  tb.innerHTML = h;
}

/* ---------- 操作：PDF 预览 / 解析数据弹窗 ---------- */
function openPdf(i) {
  var g = CUR_LIST[i];
  if (!g || !g.has_file) return;
  window.open('/api/kg/guideline/file?name=' + encodeURIComponent(g.file_name), '_blank');
}
function showDetail(i) {
  var g = CUR_LIST[i];
  if (!g) return;
  var code = g.code;
  document.getElementById('gdModal').classList.add('show');
  document.getElementById('gdTitle').textContent = '指南解析数据';
  document.getElementById('gdCode').textContent = code;
  document.getElementById('gdBody').innerHTML = '<div style="padding:30px;text-align:center;color:var(--muted)">加载中…</div>';
  fetch('/api/kg/guideline/detail?code=' + encodeURIComponent(code))
    .then(function(r){return r.json()})
    .then(function(d){
      if (d.error) throw new Error(d.error);
      renderDetail(d);
    })
    .catch(function(e){
      document.getElementById('gdBody').innerHTML = '<div class="g-empty">加载失败：' + esc(e.message) + '</div>';
    });
}
function renderDetail(d) {
  document.getElementById('gdTitle').textContent = d.name || '指南解析数据';
  document.getElementById('gdCode').textContent = d.code;
  var h = '';
  h += '<div class="gd-grid">';
  h += '<div class="gd-stat"><div class="n">' + (d.diseases||[]).length + '</div><div class="l">关联疾病</div></div>';
  h += '<div class="gd-stat"><div class="n">' + (d.evidence_count||0) + '</div><div class="l">证据条目</div></div>';
  h += '<div class="gd-stat"><div class="n">' + (d.rec_count||0) + '</div><div class="l">推荐语句</div></div>';
  h += '</div>';
  h += '<div class="gd-kv"><span class="k">发布年份</span><span class="v">' + esc(d.year || '—') + '</span></div>';
  h += '<div class="gd-kv"><span class="k">发布机构</span><span class="v">' + esc(d.organization || '—') + '</span></div>';
  if (d.version) h += '<div class="gd-kv"><span class="k">版本</span><span class="v">' + esc(d.version) + '</span></div>';
  h += '<div class="gd-kv"><span class="k">页数</span><span class="v">' + (d.page_count || '—') + '</span></div>';
  if (d.batch_id) h += '<div class="gd-kv"><span class="k">解析批次</span><span class="v" style="font-family:monospace">' + esc(d.batch_id) + '</span></div>';
  h += '<div class="gd-kv"><span class="k">原文文件</span><span class="v">' + (d.has_file
      ? '<a href="/api/kg/guideline/file?name=' + encodeURIComponent(d.file_name) + '" target="_blank" style="color:var(--accent)">📄 ' + esc(d.file_name) + '</a>'
      : (d.file_name ? esc(d.file_name) + '（未上传）' : '—')) + '</span></div>';
  h += '<div class="gd-sec-title">按疾病解析明细</div>';
  if (!(d.diseases||[]).length) {
    h += '<div style="font-size:12px;color:var(--muted);padding:6px 0">该指南尚未挂靠任何疾病（无 based_on_guideline 关系）</div>';
  } else {
    (d.diseases||[]).forEach(function(x){
      h += '<div class="gd-dis-row">'
         + '<span class="gd-dis-name" onclick="location.href=\'explore.html?code=' + encodeURIComponent(x.code) + '\">' + esc(x.name) + '</span>'
         + '<span class="gd-dis-ev">证据 ' + (x.evidence_count||0) + ' 条</span>'
         + '</div>';
    });
  }
  document.getElementById('gdBody').innerHTML = h;
}
function closeGdModal() { document.getElementById('gdModal').classList.remove('show'); }
document.getElementById('gdModal').addEventListener('click', function(e){ if (e.target === this) closeGdModal(); });

loadGuidelines();

/* v1.5.11h: 支持 ?tab=anchor 直达挂靠确认（review.html 缺口指引跳转用） */
try {
  if (new URLSearchParams(location.search).get('tab') === 'anchor') switchGTab('anchor');
} catch(e) {}

/* =====================================================================
   挂靠映射确认（v1.5.5 批次三决策工具）
   11 个无直接指南的疾病 × 库内候选文献；用户点"确认挂靠"写 based_on_guideline
   （走既有 /api/kg/relation/add，落审计日志）；确认后可一键生成交给 Codex 的解析任务
   ===================================================================== */
var ANCHOR_DATA = null;
var AM_OPEN = {};

function switchGTab(tab) {
  document.getElementById('tab-library').classList.toggle('active', tab === 'library');
  document.getElementById('tab-anchor').classList.toggle('active', tab === 'anchor');
  document.getElementById('tab-content-library').style.display = tab === 'library' ? '' : 'none';
  document.getElementById('tab-content-anchor').style.display = tab === 'anchor' ? '' : 'none';
  if (tab === 'anchor' && !ANCHOR_DATA) loadAnchorMapping();
}

function loadAnchorMapping() {
  document.getElementById('amContent').innerHTML = '<div class="g-empty">加载挂靠映射数据中…</div>';
  fetch('/api/kg/anchor-mapping?v=' + Date.now())
    .then(function(r){return r.json()})
    .then(function(data){
      if (data.error) throw new Error(data.error);
      ANCHOR_DATA = data;
      renderAnchorView();
    })
    .catch(function(e){
      document.getElementById('amContent').innerHTML = '<div class="g-empty">加载失败：' + e.message + '</div>';
    });
}

function renderAnchorView() {
  var items = ANCHOR_DATA.items || [];
  var doneN = items.filter(function(x){return x.linked_count > 0}).length;
  var b = document.getElementById('anchor-badge');
  if (b) { b.textContent = doneN + '/' + items.length; b.className = doneN === items.length ? 'g-tab-badge ok' : 'g-tab-badge'; }
  document.getElementById('amNote').innerHTML =
    '<b>这是什么？</b> 以下 ' + items.length + ' 个疾病在库内没有直接关联的指南，但可以从已有文献"挂靠"解决——确认后 Codex 即可按对应文献解析建图，不必新找资料。' +
    '点疾病展开候选文献，逐条点<b>"确认挂靠"</b>（写入图谱关系，记入审计日志）。全部确认后，把生成任务清单发给 Codex。';
  var h = '';
  items.forEach(function(it){
    var open = !!AM_OPEN[it.disease_code];
    var done = it.linked_count > 0;
    h += '<div class="am-disease' + (open ? ' open' : '') + (done ? ' done' : '') + '">';
    h += '<div class="am-d-head" onclick="toggleAMDisease(\'' + it.disease_code + '\')">';
    h += '<span class="am-d-arrow">▶</span>';
    h += '<span class="am-d-name">' + it.disease_name + '</span>';
    h += '<span class="am-d-code">' + it.disease_code + '</span>';
    h += '<span class="am-d-count">' + (done ? '✅ 已挂靠 ' + it.linked_count + ' 份' : '⏳ 待确认 · 候选 ' + it.candidates.length + ' 份') + '</span>';
    h += '</div>';
    h += '<div class="am-d-body">';
    if (!it.candidates.length) {
      h += '<div style="font-size:12px;color:var(--muted);padding:8px 0">⚠ 库内未命中候选文献，需补资料（归入待补清单）</div>';
    } else {
      it.candidates.forEach(function(doc){
        h += '<div class="am-doc-row">';
        h += '<span class="am-doc-name">' + doc.name + (doc.year ? '（' + doc.year + '）' : '') + '</span>';
        h += '<span class="am-doc-meta">已被 ' + doc.used_by + ' 病使用</span>';
        if (doc.linked) {
          h += '<button class="am-link-btn linked">已挂靠 ✓</button>';
        } else {
          h += '<button class="am-link-btn" onclick="confirmAnchorLink(\'' + it.disease_code + '\',\'' + it.disease_name + '\',\'' + doc.code + '\',this)">确认挂靠</button>';
        }
        h += '</div>';
      });
      h += '<div class="am-cdss-note">确认挂靠后，Codex 将以上述文献为依据为「' + it.disease_name + '」解析建图（诊疗路径 + 维度实例 + 待审核推荐 + 证据链）。</div>';
    }
    h += '</div></div>';
  });
  if (doneN === items.length && items.length) {
    h += '<div style="margin-top:16px"><button class="am-cdss-btn" onclick="exportAnchorTasks()">📋 生成交给 Codex 的解析任务清单</button></div>';
  }
  document.getElementById('amContent').innerHTML = h;
}

function toggleAMDisease(code) {
  AM_OPEN[code] = !AM_OPEN[code];
  renderAnchorView();
}

function confirmAnchorLink(dc, dn, gc, btn) {
  if (!confirm('确认将「' + dn + '」挂靠到该文献？\n（写入图谱 based_on_guideline 关系，记入审计日志）')) return;
  btn.disabled = true;
  btn.textContent = '写入中…';
  fetch('/api/kg/relation/add', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ from_code: dc, to_code: gc, rel_type: 'based_on_guideline', operator: 'anchor-confirm' })
  })
    .then(function(r){return r.json()})
    .then(function(res){
      if (res.error) { alert('写入失败：' + res.error); btn.disabled = false; btn.textContent = '确认挂靠'; return; }
      loadAnchorMapping();
    })
    .catch(function(e){
      alert('请求失败：' + e.message);
      btn.disabled = false;
      btn.textContent = '确认挂靠';
    });
}

function exportAnchorTasks() {
  var items = (ANCHOR_DATA && ANCHOR_DATA.items) || [];
  var lines = ['# 挂靠疾病解析任务（挂靠映射确认页生成）', '',
               '以下疾病已人工确认挂靠文献，请按《AI自动化工具-文献指南解析.md》(V5.1) 规范解析建图：', ''];
  items.forEach(function(it){
    var linked = (it.candidates || []).filter(function(c){return c.linked});
    if (!linked.length) return;
    lines.push('- **' + it.disease_name + '**（' + it.disease_code + '）');
    linked.forEach(function(c){ lines.push('  - ' + c.name + (c.year ? '（' + c.year + '）' : '')); });
  });
  lines.push('');
  lines.push('产出要求：诊疗路径 + 维度实例 + 待审核推荐 + 证据链，与在库 76 病同构；');
  lines.push('formal_cdss_ready 不得置真；完成后出每病简报等人工确认。');
  var blob = new Blob([lines.join('\n')], {type: 'text/plain;charset=utf-8'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'Codex任务-挂靠病解析清单.txt';
  a.click();
  URL.revokeObjectURL(a.href);
}
</script>
