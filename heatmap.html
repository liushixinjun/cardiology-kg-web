<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>专科知识图谱 · 心血管内科 - 数据建设进度</title>
<link rel="stylesheet" href="./_shared/css/style.css?v=2026100901">
<style>
.cov-page{padding:24px}
.cov-section{background:var(--bg2);border:1px solid var(--rule);border-radius:12px;padding:20px;margin-bottom:20px}
.cov-section-title{font-size:16px;font-weight:700;color:var(--ink);margin-bottom:4px;display:flex;align-items:center;gap:8px}
.cov-section-desc{font-size:12px;color:var(--muted);margin-bottom:16px;line-height:1.5}
.cov-table{width:100%;border-collapse:collapse;font-size:12px}
.cov-table th{padding:8px 10px;text-align:left;font-size:11px;font-weight:700;color:var(--muted);border-bottom:2px solid var(--rule);white-space:nowrap}
.cov-table td{padding:6px 10px;border-bottom:1px solid var(--rule);vertical-align:middle}
.cov-table tr.cov-row{cursor:pointer;transition:background .1s}
.cov-table tr.cov-row:hover{background:rgba(79,140,255,.06)}
.cov-table tr.cov-row.expanded{background:rgba(79,140,255,.04)}
.cov-table .disease-name{font-weight:600;color:var(--ink)}
.cov-badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:700;white-space:nowrap}
.cov-badge.ready{background:var(--green-bg);color:var(--green-text,#2f9e44)}
.cov-badge.reviewed{background:#d0ebff;color:#1971c2}
.cov-badge.partial{background:var(--warn-bg);color:var(--warn-ink)}
.cov-badge.struct{background:var(--neutral-bg);color:var(--muted)}
.cov-badge.none{background:var(--bg3);color:var(--muted)}
.cov-num{font-weight:700;color:var(--accent);min-width:20px;display:inline-block;text-align:center}
.cov-num.zero{color:var(--muted);opacity:.5}
.cov-filter{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;align-items:center}
.cov-filter label{font-size:12px;color:var(--muted)}
.cov-filter select,.cov-filter input{font-size:12px;padding:4px 8px;border:1px solid var(--rule);border-radius:6px;background:var(--bg3);color:var(--ink);outline:none}
.cov-filter select:focus,.cov-filter input:focus{border-color:var(--accent)}
.cov-empty{text-align:center;padding:40px;color:var(--muted);font-size:14px}

/* 建设漏斗 */
.cov-funnel{display:flex;align-items:stretch;gap:0;flex-wrap:wrap}
.fn-step{flex:1;min-width:150px;background:var(--bg3);border:1px solid var(--rule);border-radius:10px;padding:16px 12px;text-align:center;position:relative}
.fn-step.hot{border-color:var(--green,#2f9e44)}
.fn-num{font-size:30px;font-weight:800;line-height:1.1}
.fn-label{font-size:12px;font-weight:700;color:var(--ink);margin-top:6px}
.fn-pct{font-size:10px;color:var(--muted);margin-top:4px}
.fn-arrow{display:flex;align-items:center;padding:0 6px;font-size:18px;color:var(--muted);font-weight:700}
.fn-note{font-size:11px;color:var(--muted);margin-top:12px;line-height:1.6}

/* 建设进度圆点 */
.pdot{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;font-size:10px;font-weight:800;margin-right:3px;background:var(--bg3);color:var(--muted);border:1px solid var(--rule)}
.pdot.on{background:var(--green-bg);color:var(--green-text,#2f9e44);border-color:var(--green,#2f9e44)}
.pdot-num{font-size:10px;color:var(--muted);margin-left:4px;white-space:nowrap}

/* 瓶颈分析 */
.cov-bottleneck{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.cov-bn-card{background:var(--bg3);border:1px solid var(--rule);border-radius:10px;padding:16px;position:relative;overflow:hidden}
.cov-bn-card.critical{border-color:var(--accent2)}
.cov-bn-card.good{border-color:var(--green,#2f9e44)}
.cov-bn-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.cov-bn-title{font-size:13px;font-weight:700;color:var(--ink)}
.cov-bn-count{font-size:20px;font-weight:800}
.cov-bn-bar{height:4px;background:var(--bg2);border-radius:2px;margin-top:8px;overflow:hidden}
.cov-bn-bar-fill{height:100%;border-radius:2px;transition:width .3s}
.cov-bn-desc{font-size:11px;color:var(--muted);margin-top:6px}

/* 展开行 */
.cov-expand-row td{padding:0!important;border-bottom:1px solid var(--rule)}
.cov-expand{padding:16px 24px;background:var(--bg3);animation:covSlideIn .2s ease}
@keyframes covSlideIn{from{opacity:0;max-height:0}to{opacity:1;max-height:2000px}}
.cov-expand-loading{padding:20px;text-align:center;color:var(--muted);font-size:12px}
.cov-pw{margin-bottom:16px}
.cov-pw-head{font-size:13px;font-weight:700;color:var(--ink);margin-bottom:10px;display:flex;align-items:center;gap:6px}
.cov-pw-head .cov-lvl{font-size:10px;font-weight:600;color:var(--muted);background:var(--bg2);padding:1px 6px;border-radius:4px}
.cov-stage{margin-left:16px;margin-bottom:10px}
.cov-stage-head{font-size:12px;font-weight:600;color:var(--ink);margin-bottom:6px;display:flex;align-items:center;gap:6px}
.cov-stage-head .cov-lvl{font-size:10px;font-weight:600;color:var(--muted);background:var(--bg2);padding:1px 6px;border-radius:4px}
.cov-rule{margin-left:16px;margin-bottom:8px;padding-bottom:8px;border-bottom:1px solid var(--rule)}
.cov-rule:last-child{border-bottom:none}
.cov-rule-head{font-size:11px;color:var(--muted);margin-bottom:6px;display:flex;align-items:center;gap:6px}
.cov-rule-head .cov-lvl{font-size:10px;font-weight:600;color:var(--muted);background:var(--bg2);padding:1px 6px;border-radius:4px}
.cov-rec-card{background:var(--bg2);border:1px solid var(--rule);border-radius:6px;padding:8px 12px;margin-bottom:6px;cursor:pointer;transition:all .15s}
.cov-rec-card:hover{border-color:var(--accent);box-shadow:0 2px 8px var(--accent-bg)}
.cov-rec-head{display:flex;align-items:center;gap:6px;margin-bottom:4px;flex-wrap:wrap}
.cov-rec-lvl{font-size:10px;font-weight:700;padding:1px 6px;border-radius:4px}
.cov-rec-lvl.yes{background:var(--green-bg);color:var(--green-text,#2f9e44)}
.cov-rec-lvl.no{background:var(--bg3);color:var(--muted)}
.cov-rec-text{font-size:12px;color:var(--ink);line-height:1.6}
.cov-rec-meta{font-size:10px;color:var(--muted);margin-top:4px;display:flex;gap:8px;flex-wrap:wrap}
@media (max-width:900px){.fn-arrow{display:none}.fn-step{margin-bottom:8px}}
</style>
</head>
<body>
<div class="nav"></div>
<div class="cov-page">
  <div class="page-header">
    <h1>📈 数据建设进度</h1>
    <div class="subtitle">一眼看懂每个疾病的诊疗知识建设到哪一步：建立路径 → 写好推荐 → 审核通过 → 可正式使用，四步递进。点开任意疾病可查看完整内容。</div>
  </div>

  <!-- 建设进度总览（漏斗） -->
  <div class="cov-section">
    <div class="cov-section-title">🏥 建设进度总览</div>
    <div class="cov-section-desc">全库疾病的诊疗知识建设进度，从左到右层层递进，数字表示达到该步骤的疾病数。</div>
    <div class="cov-funnel" id="cov-funnel"></div>
    <div class="fn-note" id="cov-funnel-note"></div>
  </div>

  <!-- 缺口分析 -->
  <div class="cov-section">
    <div class="cov-section-title">🎯 下一步补什么</div>
    <div class="cov-section-desc">每个环节有多少疾病还缺数据。<b style="color:var(--accent2)">红色</b> = 缺口最大、最该优先补的环节；<b style="color:var(--green,#2f9e44)">绿色</b> = 覆盖良好。</div>
    <div class="cov-bottleneck" id="cov-bottleneck"></div>
  </div>

  <!-- 疾病明细 -->
  <div class="cov-section">
    <div class="cov-section-title">📋 各疾病建设明细</div>
    <div class="cov-section-desc">点击任意行展开该疾病的完整内容（路径 → 阶段 → 规则 → 推荐意见），点击推荐卡片可跳到图谱探索查看详情。</div>
    <div class="cov-filter">
      <label>筛选：</label>
      <select id="cov-status-filter" onchange="renderCoverageTable()">
        <option value="">全部状态</option>
        <option value="usable">✅ 可正式使用</option>
        <option value="reviewed">✅ 审核通过·待发布</option>
        <option value="instance">🟡 有推荐·待审核</option>
        <option value="structure">⚪ 只有路径骨架</option>
        <option value="none">🔴 尚无建设</option>
      </select>
      <select id="cov-category-filter" onchange="renderCoverageTable()">
        <option value="">全部大类</option>
      </select>
      <input id="cov-search" placeholder="搜索疾病名称..." oninput="renderCoverageTable()" style="width:180px">
    </div>
    <div id="cov-table-container"></div>
  </div>
</div>
<script src="./_shared/js/theme.js"></script>
<script src="./_shared/js/app.js?v=2026100901"></script>
<script>
renderNav('heatmap');
var COV_DATA = [];
var GLOBAL_STATS = {};
var DISEASE_DIMS = {};  // code -> {dimCount, pct}
var CATEGORIES = {};
var EXPANDED_ROW = null;
var CHAIN_CACHE = {};

/* 并行加载：CDSS覆盖数据 + 全局统计 + 疾病维度数据 + 指南列表（与首页一致） */
Promise.all([
  fetch('/api/kg/cdss/coverage?v=' + Date.now()).then(function(r){return r.json()}),
  fetch('/api/kg/stats?v=' + Date.now()).then(function(r){return r.json()}),
  fetch('/api/kg/diseases?v=' + Date.now()).then(function(r){return r.json()}),
  fetch('/api/kg/guidelines?v=' + Date.now()).then(function(r){return r.json()})
]).then(function(results){
  COV_DATA = results[0];
  GLOBAL_STATS = results[1] || {};
  var diseaseList = results[2] || [];
  var guidelineData = results[3] || {};
  GLOBAL_STATS._guideline_count = (guidelineData.guidelines || []).length;

  /* 计算每个疾病的20维度覆盖（与首页 dashboard.js getCoverage 逻辑一致） */
  diseaseList.forEach(function(d){
    var f = 0;
    if (d.dim_counts) {
      CORE_DIM_KEYS.forEach(function(k) { if (d.dim_counts[k] && d.dim_counts[k] > 0) f++; });
    }
    DISEASE_DIMS[d.code] = { dimCount: f, pct: Math.round(f / CORE_DIM_KEYS.length * 100) };
  });

  COV_DATA.forEach(function(d){
    var g = parseParentCode(d.parent_code).group;
    if (!CATEGORIES[g]) CATEGORIES[g] = 0;
    CATEGORIES[g]++;
    var dimInfo = DISEASE_DIMS[d.disease_code] || {dimCount: 0, pct: 0};
    d.dim_count = dimInfo.dimCount;
    d.dim_pct = dimInfo.pct;
  });
  renderFunnel();
  renderBottleneck();
  renderCategoryFilter();
  renderCoverageTable();
})
.catch(function(e){
  document.getElementById('cov-table-container').innerHTML = '<div class="cov-empty">加载失败: ' + e.message + '</div>';
});

/* ============ 建设进度漏斗 ============ */
function renderFunnel(){
  var globalDiseases = GLOBAL_STATS.disease_count || 0;
  var steps = [
    {key:'structure_ready', icon:'🗺️', label:'建了路径', cls:''},
    {key:'instance_ready',  icon:'📄', label:'有推荐意见', cls:''},
    {key:'review_ready',    icon:'✅', label:'审核通过', cls:''},
    {key:'usable_ready',    icon:'🚀', label:'可正式使用', cls:'hot'}
  ];
  var h = '';
  steps.forEach(function(s, i){
    if (i > 0) h += '<div class="fn-arrow">→</div>';
    var n = COV_DATA.filter(function(d){return d[s.key]}).length;
    var pct = globalDiseases > 0 ? Math.round(n / globalDiseases * 100) : 0;
    h += '<div class="fn-step' + (s.cls ? ' ' + s.cls : '') + '">';
    h += '<div class="fn-num">' + s.icon + ' ' + n + '</div>';
    h += '<div class="fn-label">第' + (i+1) + '步 · ' + s.label + '</div>';
    h += '<div class="fn-pct">占全库疾病 ' + pct + '%</div>';
    h += '</div>';
  });
  h += '<div class="fn-arrow">＋</div>';
  /* 20维度平均覆盖 */
  var dimSum = 0;
  COV_DATA.forEach(function(d){ dimSum += (d.dim_pct || 0); });
  var avgDimPct = COV_DATA.length > 0 ? Math.round(dimSum / COV_DATA.length) : 0;
  h += '<div class="fn-step"><div class="fn-num">📊 ' + avgDimPct + '%</div><div class="fn-label">知识维度平均覆盖</div><div class="fn-pct">20个知识维度（与首页一致）</div></div>';
  document.getElementById('cov-funnel').innerHTML = h;

  var usableN = COV_DATA.filter(function(d){return d.usable_ready}).length;
  document.getElementById('cov-funnel-note').innerHTML =
    '全库共 <b>' + globalDiseases + '</b> 个疾病，其中 <b>' + COV_DATA.length + '</b> 个已建立诊疗路径；目前 <b>' + usableN + '</b> 个疾病的知识已审核通过并正式发布，可供临床使用。';
}

/* ============ 缺口分析 ============ */
function renderBottleneck(){
  var layers = [
    {key:'dim_count', label:'知识维度', icon:'📊', desc:'20个知识维度有数据', isDim:true},
    {key:'pathway_count', label:'诊疗路径', icon:'🗺️', desc:'已建立诊疗路径'},
    {key:'stage_count', label:'路径阶段', icon:'📋', desc:'路径划分了就诊阶段'},
    {key:'rule_count', label:'临床规则', icon:'⚙️', desc:'定义了适用规则'},
    {key:'rec_count', label:'推荐意见', icon:'📄', desc:'写出了推荐意见'},
    {key:'action_count', label:'具体措施', icon:'💊', desc:'推荐落到具体医嘱/操作'},
    {key:'evidence_count', label:'证据支撑', icon:'📖', desc:'推荐有文献证据支撑'},
    {key:'guideline_count', label:'指南来源', icon:'📚', desc:'推荐标注了指南出处'}
  ];
  var total = COV_DATA.length;
  var h = '';
  layers.forEach(function(layer){
    var has;
    if (layer.isDim) {
      has = COV_DATA.filter(function(d){return (d.dim_count || 0) > 0}).length;
    } else {
      has = COV_DATA.filter(function(d){return d[layer.key] > 0}).length;
    }
    var missing = total - has;
    var pct = Math.round(has / total * 100);
    var isCritical = missing > total * 0.3;
    var isGood = missing <= total * 0.1;
    var cls = isCritical ? 'critical' : (isGood ? 'good' : '');
    var barColor = isCritical ? cssVar('--accent2','#ff6b6b') : (isGood ? cssVar('--green','#51cf66') : cssVar('--yellow','#ffd43b'));
    h += '<div class="cov-bn-card ' + cls + '">';
    h += '<div class="cov-bn-header">';
    h += '<span class="cov-bn-title">' + layer.icon + ' ' + layer.label + '</span>';
    h += '<span class="cov-bn-count" style="color:' + barColor + '">' + missing + '</span>';
    h += '</div>';
    h += '<div style="font-size:11px;color:var(--muted)">' + layer.desc + '</div>';
    h += '<div class="cov-bn-bar"><div class="cov-bn-bar-fill" style="width:' + pct + '%;background:' + barColor + '"></div></div>';
    h += '<div class="cov-bn-desc">' + has + '/' + total + ' 疾病已覆盖（' + pct + '%）</div>';
    h += '</div>';
  });
  document.getElementById('cov-bottleneck').innerHTML = h;
}

function renderCategoryFilter(){
  var sel = document.getElementById('cov-category-filter');
  var cats = Object.keys(CATEGORIES).sort();
  cats.forEach(function(c){
    var opt = document.createElement('option');
    opt.value = c; opt.textContent = c + ' (' + CATEGORIES[c] + ')';
    sel.appendChild(opt);
  });
}

/* ============ 疾病明细表（7列） ============ */
function renderCoverageTable(){
  var status = document.getElementById('cov-status-filter').value;
  var cat = document.getElementById('cov-category-filter').value;
  var q = document.getElementById('cov-search').value.toLowerCase();
  var rows = COV_DATA.filter(function(d){
    if (status && d.status !== status) return false;
    if (cat) { var g = parseParentCode(d.parent_code).group; if (g !== cat) return false; }
    if (q && d.disease_name.toLowerCase().indexOf(q) === -1 && d.disease_code.toLowerCase().indexOf(q) === -1) return false;
    return true;
  });

  var h = '<table class="cov-table">';
  h += '<thead><tr>';
  h += '<th></th><th>疾病</th><th>大类</th>';
  h += '<th title="20个核心知识维度中有数据的维度数，与首页一致">知识维度</th>';
  h += '<th title="推荐意见条数（悬停看审核通过/受阻明细）">推荐意见</th>';
  h += '<th title="1建路径 2有推荐 3审核通过 4可正式使用，实心=已完成">建设进度</th>';
  h += '<th>当前状态</th>';
  h += '</tr></thead><tbody>';
  var STATUS_CLS = { usable: 'ready', reviewed: 'reviewed', instance: 'partial', structure: 'struct', none: 'none' };
  var STATUS_ICON = { usable: '🚀', reviewed: '✅', instance: '🟡', structure: '⚪', none: '🔴' };
  rows.forEach(function(d, i){
    var g = parseParentCode(d.parent_code).group;
    var st = d.status || 'none';
    var badge = '<span class="cov-badge ' + (STATUS_CLS[st] || 'none') + '">' + (STATUS_ICON[st] || '') + ' ' + escHtml(d.status_label || st) + '</span>';
    var expanded = EXPANDED_ROW === d.disease_code;
    var dimCount = d.dim_count || 0;
    var dimPct = d.dim_pct || 0;
    var dimCls = dimPct >= 80 ? 'cov-badge ready' : dimPct >= 50 ? 'cov-badge partial' : 'cov-badge none';
    h += '<tr class="cov-row' + (expanded ? ' expanded' : '') + '" onclick="toggleRow(\'' + d.disease_code + '\')">';
    h += '<td style="width:20px;font-size:10px;color:var(--muted)">' + (expanded ? '▼' : '▶') + '</td>';
    h += '<td><a class="disease-name" style="color:var(--accent);text-decoration:none;cursor:pointer" title="在图谱探索中查看 ' + escHtml(d.disease_name) + '" onclick="event.stopPropagation();location.href=\'explore.html?code=' + d.disease_code + '\'">' + escHtml(d.disease_name) + '</a></td>';
    h += '<td style="color:var(--muted);font-size:11px">' + escHtml(g) + '</td>';
    h += '<td><span class="' + dimCls + '" title="' + dimCount + '/' + CORE_DIM_KEYS.length + ' 个知识维度">' + dimCount + '/' + CORE_DIM_KEYS.length + '</span></td>';
    h += '<td><span class="cov-num' + (d.rec_count === 0 ? ' zero' : '') + '" title="共 ' + (d.rec_count||0) + ' 条 · 审核通过 ' + (d.reviewed_count||0) + ' 条 · 受阻 ' + (d.blocked_rec_count||0) + ' 条">' + (d.rec_count || 0) + '</span></td>';
    h += '<td>' + progressDots(d) + '</td>';
    h += '<td>' + badge + '</td>';
    h += '</tr>';
    if (expanded) {
      h += '<tr class="cov-expand-row"><td colspan="7"><div class="cov-expand" id="expand-' + d.disease_code + '">';
      if (CHAIN_CACHE[d.disease_code]) {
        h += renderChainHTML(CHAIN_CACHE[d.disease_code]);
      } else {
        h += '<div class="cov-expand-loading">加载中...</div>';
      }
      h += '</div></td></tr>';
    }
  });
  h += '</tbody></table>';
  if (rows.length === 0) h = '<div class="cov-empty">没有符合条件的疾病</div>';
  document.getElementById('cov-table-container').innerHTML = h;
  if (EXPANDED_ROW && !CHAIN_CACHE[EXPANDED_ROW]) {
    loadChain(EXPANDED_ROW);
  }
}

/* 建设进度 4 步圆点 */
function progressDots(d){
  var steps = [d.structure_ready, d.instance_ready, d.review_ready, d.usable_ready];
  var tips = ['建立路径', '有推荐意见', '审核通过', '可正式使用'];
  var n = 0;
  var h = '';
  for (var i = 0; i < 4; i++) {
    if (steps[i]) n++;
    h += '<span class="pdot' + (steps[i] ? ' on' : '') + '" title="第' + (i+1) + '步 ' + tips[i] + (steps[i] ? '：已完成' : '：未达到') + '">' + (i+1) + '</span>';
  }
  h += '<span class="pdot-num">' + n + '/4</span>';
  return h;
}

function toggleRow(code){
  EXPANDED_ROW = EXPANDED_ROW === code ? null : code;
  renderCoverageTable();
}

function loadChain(code){
  var el = document.getElementById('expand-' + code);
  if (!el) return;
  fetch('/api/kg/cdss/pathway?diseaseCode=' + encodeURIComponent(code))
    .then(function(r){return r.json()})
    .then(function(data){
      CHAIN_CACHE[code] = data;
      if (EXPANDED_ROW === code) {
        el.innerHTML = renderChainHTML(data);
      }
    })
    .catch(function(e){
      el.innerHTML = '<div class="cov-expand-loading">加载失败: ' + e.message + '</div>';
    });
}

/* 展开行：完整链路（路径 → 阶段 → 规则 → 推荐意见） */
function renderChainHTML(data){
  if (!data.pathways || data.pathways.length === 0) {
    return '<div class="cov-expand-loading">该疾病暂无诊疗框架数据</div>';
  }
  var diseaseCode = data.disease ? data.disease.code : '';
  var h = '';
  data.pathways.forEach(function(pw){
    var totalRecs = 0;
    (pw.stages||[]).forEach(function(s){
      (s.rules||[]).forEach(function(r){ totalRecs += (r.recommendations||[]).length; });
    });
    if (totalRecs === 0) return;

    h += '<div class="cov-pw">';
    h += '<div class="cov-pw-head"><span class="cov-lvl">诊疗路径</span> 🗺️ ' + escHtml(pw.name || pw.code) + '</div>';

    (pw.stages||[]).forEach(function(stage){
      h += '<div class="cov-stage">';
      h += '<div class="cov-stage-head"><span class="cov-lvl">就诊阶段</span> 📋 ' + escHtml(stage.name || stage.code) + '</div>';

      (stage.rules||[]).forEach(function(rule){
        h += '<div class="cov-rule">';
        h += '<div class="cov-rule-head"><span class="cov-lvl">适用规则</span> ⚙️ ' + escHtml(rule.name || rule.code) + '</div>';

        (rule.recommendations||[]).forEach(function(rec){
          var cls = rec.recommendation_class || '';
          var lvl = rec.evidence_level || '';
          var hasGrade = cls && cls.indexOf('未') === -1;
          h += '<div class="cov-rec-card" onclick="event.stopPropagation();location.href=\'explore.html?code=' + diseaseCode + '&view=cdss\'">';
          h += '<div class="cov-rec-head">';
          h += '<span class="cov-rec-lvl ' + (hasGrade ? 'yes' : 'no') + '">推荐意见</span>';
          if (cls) h += '<span style="font-size:10px;color:var(--accent);font-weight:700">等级 ' + escHtml(cls) + '</span>';
          if (lvl) h += '<span style="font-size:10px;color:var(--muted)">证据 ' + escHtml(lvl) + '</span>';
          h += '<span style="font-size:10px;color:var(--muted)">点击查看详情 →</span>';
          h += '</div>';
          h += '<div class="cov-rec-text">' + escHtml(rec.statement_text || rec.code) + '</div>';
          var metas = [];
          if (rec.actions && rec.actions.length > 0) {
            var actNames = rec.actions.slice(0,3).map(function(a){return a.name||a.code});
            metas.push('💊 ' + actNames.join('、'));
          }
          if (rec.primary_source_name) {
            var src = rec.primary_source_name;
            if (rec.primary_source_page) src += ' p.' + rec.primary_source_page;
            metas.push('📖 ' + src);
          }
          if (metas.length > 0) {
            h += '<div class="cov-rec-meta">' + metas.map(function(m){return '<span>'+m+'</span>'}).join('') + '</div>';
          }
          h += '</div>';
        });

        h += '</div>';
      });

      h += '</div>';
    });

    h += '</div>';
  });
  return h;
}

function escHtml(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
</script>
